<script>
/* ===== p-tongquan.js ===== */
/* Trang Tổng quan (dashboard) */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;

  function phanTram(moi, cu) {
    if (!cu) return '';
    var p = Math.round((moi - cu) / cu * 1000) / 10;
    if (!p) return '<span>= tháng trước</span>';
    return '<span class="' + (p > 0 ? 'tang' : 'giam') + '">' + (p > 0 ? '▲ ' : '▼ ') + App.so(Math.abs(p)) + '%</span> so với tháng trước';
  }

  function ve(noi) {
    var db = App.db, y = App.ky.y, m = App.ky.m;
    var bl = TL.tinhBangLuong(db, y, m), t = bl.tong;
    var tr = new Date(y, m - 2, 1), blTruoc = TL.tinhBangLuong(db, tr.getFullYear(), tr.getMonth() + 1);
    var html = '';

    if (db.laMau) {
      html += '<div class="goi-y khong-in" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="gian" style="flex:1;min-width:240px">' +
        '<b>Bạn đang xem dữ liệu mẫu.</b> Hãy thử chấm công, sửa lương, xuất Excel… Khi sẵn sàng dùng thật, bấm nút bên phải để xoá dữ liệu mẫu ' +
        '(giữ lại cài đặt, ký hiệu, phụ cấp, ngày lễ).</div><button class="nut chinh" id="xoa-mau">Xoá dữ liệu mẫu, bắt đầu nhập thật</button></div>';
    } else {
      var ls = db.lanSaoLuu ? new Date(db.lanSaoLuu) : null;
      if (db.nhanVien.length && (!ls || (Date.now() - ls) > 7 * 864e5)) {
        html += '<div class="canh-bao khong-in" style="margin-bottom:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:240px">' +
          (ls ? 'Lần sao lưu gần nhất: ' + ls.toLocaleDateString('vi-VN') + '. ' : 'Bạn chưa sao lưu dữ liệu lần nào. ') +
          'Dữ liệu đang nằm trong trình duyệt của máy này – nên sao lưu ra file mỗi tuần.</div><a class="nut" href="#caidat">Sao lưu ngay</a></div>';
      }
    }

    var moi = 0, nghi = 0, dau = TL.batDauKy(db, y, m), cuoi = TL.ketThucKy(db, y, m);
    db.nhanVien.forEach(function (nv) {
      if (nv.ngayVao && nv.ngayVao >= dau && nv.ngayVao <= cuoi) moi++;
      if (nv.ngayNghi && nv.ngayNghi >= dau && nv.ngayNghi <= cuoi) nghi++;
    });
    var soThue = bl.rows.filter(function (r) { return r.thue > 0; }).length;
    var bq = t.soNV ? Math.round(t.cong.congHL / t.soNV * 10) / 10 : 0;
    html += '<div class="kpis">' +
      kpi('Nhân viên trong kỳ', App.tien(t.soNV), (moi ? '+' + moi + ' mới vào' : '') + (moi && nghi ? ' · ' : '') + (nghi ? nghi + ' nghỉ việc' : '') || 'Không có biến động') +
      kpi('Ngày công hưởng lương', App.so(t.cong.congHL), 'Bình quân ' + App.so(bq) + ' / ' + App.so(bl.congChuan) + ' công chuẩn') +
      kpi('Tổng thu nhập (gross)', App.tien(t.tongThuNhap), phanTram(t.tongThuNhap, blTruoc.tong.tongThuNhap) || 'Lương + làm thêm + phụ cấp + thưởng') +
      kpi('Lãnh kỳ II (net)', App.tien(t.thucLinh), 'Đã tạm ứng kỳ I: ' + App.tien(t.tamUng)) +
      kpi('Bảo hiểm (NLĐ + DN)', App.tien(t.tongBH + t.dn.tong), 'NLĐ ' + App.tien(t.tongBH) + ' · DN ' + App.tien(t.dn.tong)) +
      kpi('Thuế TNCN khấu trừ', App.tien(t.thue), soThue + ' người phải nộp') +
      '</div>';

    html += '<div class="cot-2-1">' +
      '<div class="the"><h3>Quỹ lương 12 tháng<span class="phai">Tổng thu nhập · bấm vào cột để xem tháng đó</span></h3><div id="bd-12"></div></div>' +
      '<div class="the"><h3>Cơ cấu chi phí lương tháng ' + m + '</h3><div class="kpi" style="border:0;padding:0;margin-bottom:10px"><div class="nhan">Tổng chi phí của doanh nghiệp</div><div class="gt">' + App.tien(t.chiPhiDN) + '</div></div><div id="bd-cc"></div></div>' +
      '</div>';

    html += '<div class="cot3">' +
      '<div class="the"><h3>Quỹ lương theo phòng / đội</h3><div id="bd-pb"></div></div>' +
      '<div class="the"><h3>Tình hình công kỳ tháng ' + m + '</h3><div id="bd-cong"></div></div>' +
      '<div class="the"><h3>Cần chú ý</h3><ul class="ds-gon" id="chu-y"></ul></div>' +
      '</div>';

    var hn = new Date(), hnIso0 = App.homNay();
    if (hnIso0 >= dau && hnIso0 <= cuoi) html += '<div class="the"><h3>Hôm nay ' + TL.TEN_THU_DAY[hn.getDay()].toLowerCase() + ', ' + hn.toLocaleDateString('vi-VN') + '</h3><div id="hom-nay"></div></div>';

    noi.innerHTML = html;

    var nut = App.$('#xoa-mau');
    if (nut) nut.onclick = function () {
      App.xacNhan('Xoá toàn bộ nhân viên, chấm công, bảng lương mẫu? Cài đặt, danh mục ký hiệu, phụ cấp và ngày lễ được giữ lại.', { nut: 'Xoá dữ liệu mẫu', nguy: true }).then(function (ok) {
        if (!ok) return;
        var cu = App.db, moiDb = TL.duLieuMoi();
        moiDb.caiDat = cu.caiDat; moiDb.kyHieu = cu.kyHieu; moiDb.phuCap = cu.phuCap; moiDb.ngayLe = cu.ngayLe;
        moiDb.phongBan = cu.phongBan;
        App.db = moiDb; App.luuNgay();
        App.bao('Đã xoá dữ liệu mẫu. Hãy nhập thông tin công ty và danh sách nhân viên.', 'tot');
        location.hash = '#caidat';
        App.veLai();
      });
    };

    // Biểu đồ 12 tháng
    var du = [];
    for (var i = 11; i >= 0; i--) {
      var d = new Date(y, m - 1 - i, 1), yy = d.getFullYear(), mm = d.getMonth() + 1;
      var b = (i === 0) ? bl : TL.tinhBangLuong(db, yy, mm);
      du.push({
        nhan: 'T' + mm, tieuDe: App.tenKy(yy, mm), gt: b.tong.tongThuNhap, noiBat: i === 0, y: yy, m: mm,
        tip: [['Số nhân viên', App.tien(b.tong.soNV)], ['Tổng thu nhập', App.tien(b.tong.tongThuNhap)], ['Thực lĩnh', App.tien(b.tong.thucLinh)], ['Chi phí doanh nghiệp', App.tien(b.tong.chiPhiDN)]]
      });
    }
    App.bieuDoCot(App.$('#bd-12'), du, { nhan: 'Tổng thu nhập', noiBat: true, bam: function (d) { App.datKy(d.y, d.m); } });

    App.thanhCoCau(App.$('#bd-cc'), [
      { nhan: 'NLĐ thực nhận (gồm tạm ứng)', gt: t.thucLinh + t.tamUng + t.khauTru + t.phatMuon, mau: 'var(--s1)' },
      { nhan: 'BH người lao động đóng', gt: t.tongBH + t.doanPhi, mau: 'var(--s2)' },
      { nhan: 'Thuế TNCN', gt: t.thue, mau: 'var(--s3)' },
      { nhan: 'BH + KPCĐ doanh nghiệp đóng', gt: t.dn.tong, mau: 'var(--s4)' }
    ]);

    // Theo phòng / đội
    var pb = {};
    bl.rows.forEach(function (r) {
      var k = r.tenPhongBan || '(Chưa phân phòng / đội)';
      if (!pb[k]) pb[k] = { gt: 0, n: 0, net: 0 };
      pb[k].gt += r.tongThuNhap; pb[k].n++; pb[k].net += r.thucLinh;
    });
    App.bieuDoNgang(App.$('#bd-pb'), Object.keys(pb).map(function (k) {
      return { nhan: k, phu: pb[k].n + ' NV', gt: pb[k].gt, tip: [['Số nhân viên', pb[k].n], ['Tổng thu nhập', App.tien(pb[k].gt)], ['Thực lĩnh', App.tien(pb[k].net)]] };
    }).sort(function (a, b) { return b.gt - a.gt; }));

    // Tình hình công
    var nhom = { lamTG: 0, sp: 0, phep: 0, le: 0, huong: 0, ngung: 0, bhxh: 0, khong: 0, kp: 0 };
    bl.rows.forEach(function (r) {
      var c = r.cong;
      nhom.lamTG += c.lamTG || 0; nhom.sp += c.sp || 0; nhom.phep += c.phep; nhom.le += c.le; nhom.huong += c.huongKhac; nhom.ngung += c.ngung || 0;
      nhom.bhxh += c.bhxh; nhom.khong += c.khong; nhom.kp += c.kp;
    });
    var tenNhom = Object.assign({}, TL.NHOM_KY_HIEU, { lamTG: 'Đi làm (lương thời gian)', sp: 'Đi làm (lương sản phẩm)' });
    App.bieuDoNgang(App.$('#bd-cong'), Object.keys(nhom).filter(function (k) { return nhom[k] || k === 'lamTG'; }).map(function (k) {
      return { nhan: tenNhom[k], gt: Math.round(nhom[k] * 10) / 10, tip: [['Số ngày công', App.so(nhom[k])]] };
    }), { dinhDang: function (v) { return App.so(v) + ' ngày'; } });

    // Cần chú ý
    var cy = [];
    var hnIso = App.homNay();
    var le = TL.bangNgayLe(db), ngayK = TL.ngayKy(db, y, m);
    var thieu = 0, thieuNV = 0;
    TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
      if (nv.hinhThuc === 'gio') return;
      var n = 0;
      ngayK.forEach(function (x) {
        if (x.iso > hnIso || !TL.nvLamNgay(nv, x.y, x.m, x.d)) return;
        if (TL.loaiNgay(db, x.y, x.m, x.d, le, nv) === 'nghi') return;
        if (!TL.oNgay(db, 'cc', nv.id, x.y, x.m, x.d)) n++;
      });
      if (n) { thieu += n; thieuNV++; }
    });
    if (thieuNV) cy.push(['<a href="#chamcong">' + thieuNV + ' nhân viên còn ô chưa chấm công</a>', '<span class="the-tt cam">' + thieu + ' ô</span>']);
    var canh = bl.rows.filter(function (r) { return r.canhBao && r.canhBao.length; });
    if (canh.length) cy.push(['<a href="#bangluong">' + canh.length + ' nhân viên có lưu ý khi tính lương</a>', '<span class="the-tt cam">Xem</span>']);
    var choDuyet = (db.donNghi || []).filter(function (d) { return d.trangThai === 'cho'; }).length;
    if (choDuyet) cy.push(['<a href="#nghiphep">' + choDuyet + ' đơn nghỉ phép chờ duyệt</a>', '<span class="the-tt cam">Duyệt</span>']);
    var chuaHD = 0;
    db.nhanVien.forEach(function (nv) {
      if (nv.trangThai === 'nghi_viec') return;
      if (nv.ngaySinh && +nv.ngaySinh.slice(5, 7) === m) cy.push(['🎂 Sinh nhật <span class="lk" data-hs="' + nv.id + '">' + h(nv.hoTen) + '</span>', '<span class="the-tt lam">' + nv.ngaySinh.slice(8, 10) + '/' + TL.pad(m) + '</span>']);
      var hd = App.hdHieuLuc ? App.hdHieuLuc(nv) : null, het = hd ? hd.denNgay : nv.ngayHetHD;
      if (App.hdHieuLuc && !hd) chuaHD++;
      if (het) {
        var con = Math.round((new Date(het) - new Date(hnIso)) / 864e5);
        if (con >= -30 && con <= 30) cy.push([(nv.trangThai === 'thu_viec' ? 'Hết thử việc: ' : 'Hết hạn hợp đồng: ') + '<span class="lk" data-hs="' + nv.id + '">' + h(nv.hoTen) + '</span>', '<span class="the-tt ' + (con <= 7 ? 'do' : 'cam') + '">' + (con < 0 ? 'đã hết ' + (-con) + ' ngày' : 'còn ' + con + ' ngày') + '</span>']);
      }
      var nh = TL.ngayNghiHuu(nv.gioiTinh, nv.ngaySinh);
      if (nh) { var cn = Math.round((new Date(nh) - new Date(hnIso)) / 864e5); if (cn >= 0 && cn <= 180) cy.push(['Đến tuổi nghỉ hưu: <span class="lk" data-hs="' + nv.id + '">' + h(nv.hoTen) + '</span>', '<span class="the-tt lam">' + TL.hienNgay(nh) + '</span>']); }
    });
    if (chuaHD) cy.push(['<a href="#hopdong">' + chuaHD + ' nhân viên chưa có hợp đồng lao động</a>', '<span class="the-tt cam">Bổ sung</span>']);
    bl.rows.filter(function (r) { return r.cong.muonLan >= 3; }).sort(function (a, b) { return b.cong.muonPhut - a.cong.muonPhut; }).slice(0, 3).forEach(function (r) {
      cy.push(['Đi muộn / về sớm: ' + h(r.hoTen), '<span class="the-tt do">' + r.cong.muonLan + ' lần · ' + r.cong.muonPhut + ' phút</span>']);
    });
    App.$('#chu-y').innerHTML = cy.length ? cy.map(function (c) { return '<li><span>' + c[0] + '</span>' + c[1] + '</li>'; }).join('') : '<li class="mo">Không có gì cần chú ý.</li>';
    App.$('#chu-y').onclick = function (e) { var a = e.target.closest('[data-hs]'); if (a) App.moHoSo(a.dataset.hs, 'canhan'); };

    // Hôm nay
    var hnEl = App.$('#hom-nay');
    if (hnEl) {
      var hy = hn.getFullYear(), hm = hn.getMonth() + 1, dd = hn.getDate(), kh = TL.bangKyHieu(db), dem = {}, chua = [], nghiTuan = 0;
      TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
        if (!TL.nvLamNgay(nv, hy, hm, dd)) return;
        var c = TL.oNgay(db, 'cc', nv.id, hy, hm, dd);
        var k = c && kh[String(c).toUpperCase()];
        if (k) dem[k.nhom] = (dem[k.nhom] || 0) + 1;
        else if (TL.loaiNgay(db, hy, hm, dd, le, nv) === 'nghi') nghiTuan++;
        else chua.push(nv.hoTen);
      });
      var loaiHn = (!Object.keys(dem).length && !chua.length) ? 'nghi' : '';
      hnEl.innerHTML = loaiHn === 'nghi' ? '<p class="mo">Hôm nay là ngày nghỉ hằng tuần.</p>' :
        '<div class="hang" style="gap:10px">' + Object.keys(TL.NHOM_KY_HIEU).filter(function (k) { return dem[k]; }).map(function (k) {
          return '<span class="the-tt lam" style="font-size:13px;padding:4px 12px">' + TL.NHOM_KY_HIEU[k] + ': <b>' + dem[k] + '</b></span>';
        }).join('') + (chua.length ? '<span class="the-tt cam" style="font-size:13px;padding:4px 12px" title="' + h(chua.join(', ')) + '">Chưa chấm: <b>' + chua.length + '</b></span>' : '') +
        (nghiTuan ? '<span class="the-tt" style="font-size:13px;padding:4px 12px">Nghỉ hằng tuần: <b>' + nghiTuan + '</b></span>' : '') +
        ' <a class="nut nho" href="#chamcong">Mở bảng chấm công</a></div>';
    }
  }

  function kpi(nhan, gt, phu) {
    return '<div class="kpi"><div class="nhan">' + nhan + '</div><div class="gt">' + gt + '</div><div class="phu">' + (phu || '&nbsp;') + '</div></div>';
  }

  App.trang.dashboard = { ve: ve };
})();

</script>
<script>
/* ===== p-donvi.js ===== */
/* Phòng, đội (đơn vị): danh mục thêm / sửa / xoá, chuyển nhân viên qua lại giữa các phòng, đội.
   - Mỗi đơn vị có loại (Phòng, Đội, Ban, Tổ, Xí nghiệp).
   - Xoá đơn vị còn nhân viên: bắt buộc chuyển hết nhân viên sang đơn vị khác rồi mới xoá.
   - Đơn vị còn trong lịch sử (quyết định cũ, người đã nghỉ việc, bảng lương đã chốt) thì chỉ "giải thể" (ẩn), không xoá hẳn.
   - Chuyển có lập quyết định điều chuyển: các kỳ trước ngày hiệu lực vẫn tính ở đơn vị cũ. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;

  App.LOAI_DV = TL.LOAI_DV;

  /** Danh sách đơn vị đang hoạt động (kèm đơn vị `chon` nếu đã giải thể, hoặc tất cả nếu o.ngung) */
  App.dsDonVi = function (o) {
    o = o || {};
    App.db.phongBan.forEach(function (p) { if (!TL.LOAI_DV[p.loai]) p.loai = TL.loaiDonVi(p); });
    var chi = o.chi === undefined ? App.dvChamCong() : o.chi;
    return App.db.phongBan.filter(function (p) { return (!p.ngung || o.ngung || p.ma === o.chon) && p.ma !== o.bo && (!chi || chi.indexOf(p.ma) >= 0); });
  };

  /** <option> các đơn vị, nhóm theo loại (Phòng, Đội…) khi có nhiều loại */
  App.optDonVi = function (chon, o) {
    o = o || {};
    var ds = App.dsDonVi({ ngung: o.ngung, chon: chon, bo: o.bo }), s = '';
    if (o.tatCa != null) s += '<option value="">' + h(o.tatCa) + '</option>';
    var opt = function (p) { return '<option value="' + h(p.ma) + '"' + (p.ma === chon ? ' selected' : '') + '>' + h(p.ten) + (p.ngung ? ' (đã giải thể)' : '') + '</option>'; };
    var loai = {}; ds.forEach(function (p) { loai[p.loai || 'phong'] = 1; });
    if (Object.keys(loai).length < 2) return s + ds.map(opt).join('');
    Object.keys(TL.LOAI_DV).forEach(function (l) {
      var nhom = ds.filter(function (p) { return (p.loai || 'phong') === l; });
      if (nhom.length) s += '<optgroup label="' + h(TL.LOAI_DV[l]) + '">' + nhom.map(opt).join('') + '</optgroup>';

  };

  function dangLam(ma) { return App.db.nhanVien.filter(function (nv) { return nv.phongBan === ma && nv.trangThai !== 'nghi_viec'; }); }

  /** Các chỗ còn nhắc tới đơn vị (để quyết định xoá hẳn hay chỉ giải thể) */
  function thamChieu(ma) {
    var db = App.db, kq = { nghiViec: 0, qd: 0, chot: 0 };
    db.nhanVien.forEach(function (nv) {
      if (nv.phongBan === ma && nv.trangThai === 'nghi_viec') kq.nghiViec++;
      (nv.quyetDinh || []).forEach(function (q) { if (q.phongBanCu === ma || q.phongBanMoi === ma) kq.qd++; });
    });
    Object.keys(db.thang).forEach(function (k) { var c = db.thang[k].chot; if (c && c.rows && c.rows.some(function (r) { return r.phongBan === ma; })) kq.chot++; });
    kq.co = kq.nghiViec + kq.qd + kq.chot > 0;
    return kq;
  }

  /** Chuyển danh sách nhân viên sang đơn vị khác. o: { phongBanMoi, lapQD, hieuLuc, so, ngay, chucVuMoi, noiDung }.

    var kq = { chuyen: [], boQua: [] }, ten = TL.tenPhongBan(App.db, o.phongBanMoi);

      if (nv.phongBan === o.phongBanMoi && !(o.chucVuMoi && o.chucVuMoi !== nv.chucVu)) { kq.boQua.push({ nv: nv, lyDo: 'đã ở ' + ten }); return; }
      if (o.lapQD) {
        nv.quyetDinh = nv.quyetDinh || [];
        var sau = nv.quyetDinh.filter(function (q) { return (q.loai === 'dieu_chuyen' || q.loai === 'bo_nhiem') && q.hieuLuc > o.hieuLuc; })[0];

        nv.quyetDinh.push({
          id: App.uid(), loai: 'dieu_chuyen', so: o.so || '', ngay: o.ngay || o.hieuLuc, hieuLuc: o.hieuLuc,
          phongBanCu: nv.phongBan || '', phongBanMoi: o.phongBanMoi, chucVuCu: nv.chucVu || '', chucVuMoi: o.chucVuMoi || nv.chucVu || '',
          noiDung: o.noiDung || 'Điều chuyển đến ' + ten
        });
      }
      nv.phongBan = o.phongBanMoi;
      if (o.chucVuMoi) nv.chucVu = o.chucVuMoi;
      if (App.dongBoHoSo) App.dongBoHoSo(nv);
      kq.chuyen.push(nv);

    return kq;
  };

      '</tbody></table></div>';
    App.hop({

        (mot ? F.o('Chức vụ mới', F.txt('chucVuMoi', dsNV[0].chucVu || ''), 'Để nguyên nếu không đổi') : '<span></span>') +

      'Chuyển nhân viên qua lại: bấm <b>Chuyển NV</b> ở dòng đơn vị, hoặc chọn nhiều người ở trang Nhân viên → <b>Chuyển phòng / đội</b>. ' +

      hd.map(function (p, i) {
        return '<tr data-ma="' + h(p.ma) + '"><td class="giua">' + (i + 1) + '</td><td>' + h(p.ma) + '</td><td>' + selLoai(p.loai, 'data-f="loai" style="width:130px"') + '</td>' +
          '<td><input class="o-nhap chu" data-f="ten" value="' + h(p.ten) + '" style="width:100%"></td>' +
          '<td><input class="o-nhap chu" data-f="khoi" list="ds-khoi" value="' + h(TL.khoiCuaDV(db, p.ma)) + '" style="width:190px"></td>' +
          '<td class="giua">' + (dem[p.ma] ? '<span class="lk" data-a="ds" title="Xem danh sách">' + dem[p.ma] + '</span>' : '<span class="mo">0</span>') + '</td>' +
          '<td style="white-space:nowrap"><button class="nut nho" data-a="len" title="Lên">▲</button> <button class="nut nho" data-a="xuong" title="Xuống">▼</button> ' +
          '<button class="nut nho" data-a="chuyen"' + (dem[p.ma] ? '' : ' disabled') + ' title="Chuyển nhân viên của đơn vị này sang đơn vị khác">Chuyển NV…</button> ' +
          '<button class="nut nho nguy" data-a="xoa" title="Xoá phòng / đội">' + App.icon('xoa') + '</button></td></tr>';
      }).join('') + (hd.length ? '' : '<tr><td colspan="7" class="trong">Chưa có phòng / đội.</td></tr>') +
      '</tbody></table></div><datalist id="ds-khoi">' + TL.dsKhoi(db).map(function (k) { return '<option value="' + h(k) + '">'; }).join('') + '</datalist>' +
      '<div class="hang" style="margin-top:12px">' + selLoai('phong', 'id="dv-loai"') + '<input id="dv-ma" placeholder="Mã (vd D1)" style="width:110px"><input id="dv-ten" placeholder="Tên (vd Đội Cấp nước số 3)" style="width:300px">' +
      '<button class="nut chinh" id="dv-them">' + App.icon('them') + 'Thêm phòng / đội</button></div>' +
      (chuaPhan.length ? '<div class="canh-bao" style="margin-top:12px">' + chuaPhan.length + ' nhân viên chưa thuộc phòng / đội nào: ' + chuaPhan.map(function (nv) { return h(nv.hoTen); }).join(', ') +
        ' <button class="nut nho" id="dv-phan">Phân vào phòng / đội…</button></div>' : '') + '</div>' +
      // khối bảng lương: tiêu đề, ngân hàng chi lương, số tài khoản công ty
      '<div class="the" id="dv-khoi"><h3>Bảng lương và ngân hàng chi lương<span class="phai">' + TL.dsKhoi(db).length + ' bảng lương</span></h3>' +
      '<p class="mo" style="margin-top:0">Mỗi bảng lương in riêng (vd <b>Văn phòng công ty</b> gồm Ban Giám đốc và các phòng; mỗi đội 1 bảng). Ngân hàng và số tài khoản công ty dùng cho ' +
      '<b>danh sách đề nghị chi lương kỳ I, kỳ II, làm thêm giờ</b> gửi ngân hàng (Bảng lương → Chi lương kỳ I, kỳ II…). Đổi tên ở đây thì mọi phòng / đội thuộc bảng đó đổi theo.</p>' +
      '<div class="cuon"><table class="bang"><thead><tr><th style="min-width:170px">Bảng lương</th><th style="min-width:280px">Tiêu đề in</th><th style="min-width:280px">Ngân hàng chi lương (Kính gửi)</th><th>Số TK công ty</th><th>Phòng / đội</th></tr></thead><tbody>' +

        gt.map(function (p) {

            '<td><button class="nut nho" data-a="khoiphuc">Khôi phục</button>' + (t.co ? '' : ' <button class="nut nho nguy" data-a="xoahan">Xoá hẳn</button>') + '</td></tr>';
        }).join('') + '</tbody></table></div></div>' : '');

    function tim(ma) { return db.phongBan.filter(function (p) { return p.ma === ma; })[0]; }
    function veLai() { App.dmDonVi(el); }
    function doiKhoi(ten, k, v) {
      db.khoiLuong = db.khoiLuong || {};
      if (k === 'ten') {
        if (!v) { veLai(); return; }
        if (v !== ten && TL.dsKhoi(db).indexOf(v) >= 0) { App.bao('Đã có bảng lương “' + v + '”. Muốn gộp thì đổi cột Bảng lương của từng phòng / đội.', 'loi'); veLai(); return; }
        db.phongBan.forEach(function (p) { if (TL.khoiCuaDV(db, p.ma) === ten) p.khoi = v; });
        if (db.khoiLuong[ten]) { db.khoiLuong[v] = db.khoiLuong[ten]; delete db.khoiLuong[ten]; }

      }
      var x = db.khoiLuong[ten] = db.khoiLuong[ten] || {};
      x[k] = k === 'tieuDe' ? v.toUpperCase() : k === 'soTK' ? v.replace(/\s+/g, '') : v;
      App.luu(); App.bao('Đã lưu');
    }

    el.onchange = function (e) {
      var ik = e.target.closest('[data-k]');
      if (ik && ik.closest('#dv-khoi')) { doiKhoi(ik.closest('tr').dataset.khoi, ik.dataset.k, ik.value.trim()); return; }

      if (i.dataset.f === 'ten') { if (!i.value.trim()) { App.bao('Tên không được để trống.', 'loi'); i.value = p.ten; return; } p.ten = i.value.trim(); }
      else p.loai = i.value;

    };
    el.onclick = function (e) {

      var b = e.target.closest('[data-a]'); if (!b) return;
      var ma = b.closest('tr').dataset.ma, p = tim(ma), a = b.dataset.a;

      if (a === 'chuyen') { App.hopChuyenDonVi(dangLam(ma), { tieuDe: 'Chuyển nhân viên của ' + p.ten, sauKhiChuyen: veLai }); return; }
      if (a === 'xoa') { xoa(p); return; }
      if (a === 'khoiphuc') { delete p.ngung; App.luu(); App.bao('Đã khôi phục ' + p.ten, 'tot'); veLai(); return; }
      if (a === 'xoahan') { App.xacNhan('Xoá hẳn <b>' + h(p.ten) + '</b>?', { nut: 'Xoá', nguy: true }).then(function (ok) { if (ok) { db.phongBan.splice(db.phongBan.indexOf(p), 1); App.luu(); veLai(); } }); }
    };

    function them() {
      var loai = App.$('#dv-loai').value, ma = App.$('#dv-ma').value.trim(), ten = App.$('#dv-ten').value.trim();
      if (!ten) { App.bao('Nhập tên phòng / đội.', 'loi'); App.$('#dv-ten').focus(); return; }
      var tenL = App.boDau(ten).toLowerCase();
      var trungTen = db.phongBan.filter(function (p) { return App.boDau(p.ten).toLowerCase() === tenL; })[0];
      if (trungTen) { App.bao(trungTen.ngung ? '“' + trungTen.ten + '” đã có trong danh sách đã giải thể – bấm Khôi phục.' : 'Đã có “' + trungTen.ten + '”.', 'loi'); return; }
      if (ma && db.phongBan.some(function (p) { return p.ma.toLowerCase() === ma.toLowerCase(); })) { App.bao('Mã ' + ma + ' đã dùng.', 'loi'); return; }
      if (!ma) {
        var goc = App.boDau(ten).replace(/^(phong|doi|ban|to)\s+/i, '').split(/[\s\-–]+/).map(function (w) { return /^\d+$/.test(w) ? w : w[0] || ''; }).join('').toUpperCase().replace(/[^A-Z0-9]/g, '');
        goc = ({ doi: 'D', to: 'T', ban: 'B', xn: 'XN' }[loai] || '') + (goc || 'DV');
        ma = goc; var n = 2;
        while (db.phongBan.some(function (p) { return p.ma.toLowerCase() === ma.toLowerCase(); })) ma = goc + n++;
      }
      db.phongBan.push({ ma: ma, ten: ten, loai: loai });
      App.luu(); App.bao('Đã thêm ' + ten + ' (mã ' + ma + ')', 'tot'); veLai();
    }

    function xoa(p) {
      var ds = dangLam(p.ma);
      var xong = function () {
        var t = thamChieu(p.ma);
        if (t.co) { p.ngung = true; App.bao('Đã xoá ' + p.ten + ' khỏi danh mục (giữ trong mục “Đã giải thể” vì còn trong lịch sử).', 'tot'); }
        else { db.phongBan.splice(db.phongBan.indexOf(p), 1); App.bao('Đã xoá ' + p.ten, 'tot'); }
        App.luu(); veLai();
      };
      if (ds.length) {
        App.hopChuyenDonVi(ds, {
          tieuDe: 'Xoá ' + p.ten, bo: p.ma, batBuoc: true, nut: 'Chuyển ' + ds.length + ' nhân viên và xoá',
          canhBao: '<b>Không xoá được ngay:</b> “' + h(p.ten) + '” còn <b>' + ds.length + ' nhân viên</b> đang làm việc. ' +
            'Phải chuyển các nhân viên này sang phòng / đội khác thì mới xoá được.',
          sauKhiChuyen: function () { if (dangLam(p.ma).length) veLai(); else xong(); }
        });
        return;
      }
      var t = thamChieu(p.ma);
      App.xacNhan('Xoá <b>' + h(p.ten) + '</b>?' + (t.co ? '<br><br><span class="mo">Đơn vị còn trong lịch sử (quyết định, người đã nghỉ việc hoặc bảng lương đã chốt) nên sẽ được chuyển vào mục “Đã giải thể” để giữ tên khi xem lại các kỳ cũ.</span>' : ''), { nut: 'Xoá', nguy: true })
        .then(function (ok) { if (ok) xong(); });
    }
  };

  /** Hộp xem danh sách nhân viên đang thuộc đơn vị */
  App.hopDsDonVi = function (p) {
    var ds = dangLam(p.ma).sort(function (a, b) { return String(a.ma).localeCompare(String(b.ma), 'vi', { numeric: true }); });
    App.hop({
      tieuDe: p.ten + ' – ' + ds.length + ' nhân viên', co: 'rong',
      than: '<div class="cuon"><table class="bang"><thead><tr><th>STT</th><th>Mã NV</th><th>Họ và tên</th><th>Chức vụ</th><th>Ngày vào</th></tr></thead><tbody>' +
        ds.map(function (nv, i) { return '<tr><td class="giua">' + (i + 1) + '</td><td>' + h(nv.ma) + '</td><td class="ten"><span class="lk" data-hs="' + nv.id + '">' + h(nv.hoTen) + '</span></td><td>' + h(nv.chucVu || '') + '</td><td class="giua">' + TL.hienNgay(nv.ngayVao) + '</td></tr>'; }).join('') +
        '</tbody></table></div>',
      moRa: function (el, dong) { el.onclick = function (e) { var s = e.target.closest('[data-hs]'); if (s) { dong(); App.moHoSo(s.dataset.hs, 'congviec'); } }; },
      nut: [{ ten: 'Chuyển nhân viên…', bam: function () { setTimeout(function () { App.hopChuyenDonVi(ds, { tieuDe: 'Chuyển nhân viên của ' + p.ten }); }, 0); } }, { ten: 'Đóng', loai: 'chinh' }]
    });
  };
})();

</script>
<script>
/* ===== p-nhanvien.js ===== */
/* Trang Nhân viên: danh sách, thêm / sửa / xoá, nhập – xuất Excel */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, XL = window.XL, h = App.h;

  App.HINH_THUC = { thang: 'Lương tháng', ngay: 'Lương ngày', gio: 'Lương giờ', khoan: 'Lương khoán' };
  App.DV_LUONG = { thang: 'đ/tháng', ngay: 'đ/ngày', gio: 'đ/giờ', khoan: 'đ/tháng' };
  App.TRANG_THAI = { dang_lam: 'Đang làm việc', thu_viec: 'Thử việc', tam_nghi: 'Tạm nghỉ', nghi_viec: 'Đã nghỉ việc' };
  App.CACH_THUE = { luy_tien: 'Lũy tiến từng phần', khau_tru: 'Khấu trừ 10%', khong: 'Không tính thuế' };
  App.LOAI_HD = ['Thử việc', 'Xác định thời hạn', 'Không xác định thời hạn', 'Thời vụ / khoán việc', 'Học việc'];
  App.moTaLoaiLD = function (l) {
    var nghi = (l.nghiTuan || []).slice().sort(function (a, b) { return (a || 7) - (b || 7); }).map(function (t) { return TL.TEN_THU[t]; }).join(', ');
    return (+l.congChuan > 0 ? App.so(l.congChuan) + ' công' : 'công theo lịch') + (nghi ? ', nghỉ ' + nghi : ', làm cả tuần');
  };
  App.NGAN_HANG = ['Công thương (VietinBank)', 'Nông nghiệp (Agribank)', 'Ngoại thương (Vietcombank)', 'Đầu tư và Phát triển (BIDV)', 'Sài Gòn Thương Tín (Sacombank)', 'Kỹ thương (Techcombank)', 'Quân đội (MB)', 'Á Châu (ACB)'];
  App.CACH_PC = { co_dinh: 'Cố định / tháng', theo_cong: 'Theo ngày công', theo_ngay: 'Đơn giá × ngày đi làm' };

  /** Chuẩn hoá ngày nhập (dd/mm/yyyy, yyyy-mm-dd, số Excel) -> 'yyyy-mm-dd' */
  App.chuanNgay = function (v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5);
      return TL.iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    var s = String(v).trim().split(/[ T]/)[0], m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) return TL.iso(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) { var y = +m[3]; if (y < 100) y += 2000; return TL.iso(y, +m[2], +m[1]); }
    if (/^\d{5}(\.\d+)?$/.test(s)) return App.chuanNgay(+s);
    return '';
  };

  var loc = { tim: '', pb: '', tt: 'dang' }, chon = {};

  function dsLoc() {
    return App.db.nhanVien.filter(function (nv) {
      if (loc.pb && nv.phongBan !== loc.pb) return false;
      if (loc.tt === 'dang' && nv.trangThai === 'nghi_viec') return false;
      if (loc.tt === 'nghi' && nv.trangThai !== 'nghi_viec') return false;
      if (loc.tim && !App.timKhop(nv.ma + ' ' + nv.hoTen + ' ' + (nv.chucVu || '') + ' ' + (nv.sdt || '') + ' ' + (nv.soTK || ''), loc.tim)) return false;
      return true;
    }).sort(function (a, b) { return String(a.ma).localeCompare(String(b.ma), 'vi', { numeric: true }); });
  }

  function ve(noi) {
    var db = App.db;
    noi.innerHTML =
      '<div class="the khong-in"><div class="hang">' +
      '<input type="search" id="nv-tim" placeholder="Tìm mã, tên, chức vụ, SĐT, số TK…" value="' + h(loc.tim) + '" style="width:260px">' +
      '<select id="nv-pb">' + App.optDonVi(loc.pb, { tatCa: 'Tất cả phòng / đội', ngung: true }) + '</select>' +
      '<select id="nv-tt"><option value="dang"' + (loc.tt === 'dang' ? ' selected' : '') + '>Đang làm việc</option><option value="nghi"' + (loc.tt === 'nghi' ? ' selected' : '') + '>Đã nghỉ việc</option><option value=""' + (loc.tt === '' ? ' selected' : '') + '>Tất cả</option></select>' +
      '<span class="gian"></span>' +
      '<button class="nut" id="nv-chuyen" disabled title="Đánh dấu nhân viên ở cột đầu rồi bấm để chuyển sang phòng / đội khác">' + App.icon('chuyen') + 'Chuyển phòng / đội</button>' +
      '<button class="nut" id="nv-nhap">' + App.icon('nhap') + 'Nhập từ Excel</button>' +
      '<button class="nut" id="nv-xuat">' + App.icon('tai') + 'Xuất Excel</button>' +
      '<button class="nut chinh" id="nv-them">' + App.icon('them') + 'Thêm nhân viên</button>' +
      '</div></div>' +
      App.dauIn('DANH SÁCH NHÂN VIÊN', 'Ngày ' + new Date().toLocaleDateString('vi-VN')) +
      '<div class="cuon cao"><table class="bang" id="nv-bang"></table></div>' +
      '<p class="mo nho khong-in">Bấm vào một dòng để mở hồ sơ (lý lịch, hợp đồng, quá trình công tác, nghỉ phép, lương các kỳ). Mức lương theo hình thức trả lương (tháng, ngày hoặc giờ). Công chuẩn theo loại lao động (Danh mục → Loại lao động), vd văn phòng 22 công, công nhân 26 công.</p>';
    veBang();
    App.$('#nv-tim').oninput = function () { loc.tim = this.value; veBang(); };
    App.$('#nv-pb').onchange = function () { loc.pb = this.value; veBang(); };
    App.$('#nv-tt').onchange = function () { loc.tt = this.value; veBang(); };
    App.$('#nv-them').onclick = function () { location.hash = '#hoso?id=moi'; };
    App.$('#nv-xuat').onclick = xuatExcel;
    App.$('#nv-nhap').onclick = nhapExcel;
    App.$('#nv-bang').onclick = function (e) {
      var tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      var nv = App.db.nhanVien.filter(function (x) { return x.id === tr.dataset.id; })[0];
      if (e.target.closest('.chon-nv')) return;
      if (e.target.closest('.xoa')) { xoaNV(nv); return; }
      App.moHoSo(nv.id, 'canhan');
    };
    App.$('#nv-bang').onchange = function (e) {
      var c = e.target;
      if (c.id === 'nv-chon-het') { dsLoc().forEach(function (nv) { if (nv.trangThai !== 'nghi_viec') { if (c.checked) chon[nv.id] = 1; else delete chon[nv.id]; } }); veBang(); return; }
      var tr = c.closest('tr[data-id]'); if (!tr || !c.classList.contains('chon-nv')) return;
      if (c.checked) chon[tr.dataset.id] = 1; else delete chon[tr.dataset.id];
      capNhatNutChuyen();
    };
    App.$('#nv-chuyen').onclick = function () {
      var ds = App.db.nhanVien.filter(function (nv) { return chon[nv.id]; });
      if (!ds.length) return;
      App.hopChuyenDonVi(ds, { sauKhiChuyen: function () { chon = {}; App.veLai(); } });
    };
    capNhatNutChuyen();
  }

  function capNhatNutChuyen() {
    var ids = Object.keys(chon).filter(function (id) { return App.timNV(id); }), b = App.$('#nv-chuyen');
    if (!b) return;
    b.disabled = !ids.length;
    b.lastChild.textContent = ids.length ? 'Chuyển phòng / đội (' + ids.length + ')' : 'Chuyển phòng / đội';
  }

  function veBang() {
    var ds = dsLoc(), db = App.db;
    var conLam = ds.filter(function (nv) { return nv.trangThai !== 'nghi_viec'; });
    var het = conLam.length && conLam.every(function (nv) { return chon[nv.id]; });
    var html = '<thead><tr><th class="khong-in" title="Chọn để chuyển phòng / đội"><input type="checkbox" id="nv-chon-het"' + (het ? ' checked' : '') + '></th><th>STT</th><th>Mã NV</th><th style="min-width:170px">Họ và tên</th><th>Phòng / đội</th><th>Chức vụ</th><th>Ngày vào</th><th>Loại HĐ</th>' +
      '<th>Loại LĐ</th><th>Công chuẩn</th><th>Hình thức</th><th class="so">Mức lương</th><th class="so">Lương đóng BH</th><th>Tài khoản ngân hàng</th><th>NPT</th><th>Hết hạn HĐ</th><th>Trạng thái</th><th class="khong-in"></th></tr></thead><tbody>';
    if (!ds.length) html += '<tr><td colspan="18" class="trong">' + (db.nhanVien.length ? 'Không có nhân viên phù hợp bộ lọc.' : 'Chưa có nhân viên. Bấm “Thêm nhân viên” hoặc “Nhập từ Excel”.') + '</td></tr>';
    ds.forEach(function (nv, i) {
      var tt = nv.trangThai || 'dang_lam';
      var lbh = nv.thamGiaBH ? (+nv.luongBH > 0 ? App.tien(nv.luongBH) : ((nv.hinhThuc || 'thang') === 'thang' || nv.hinhThuc === 'khoan' ? '<span class="mo" title="Lương CB + phụ cấp đóng BH">' + App.tien(luongBHMacDinh(nv)) + '</span>' : '<span class="the-tt cam">Chưa nhập</span>')) : '<span class="mo">Không tham gia</span>';
      html += '<tr data-id="' + nv.id + '" style="cursor:pointer"><td class="khong-in giua">' + (tt === 'nghi_viec' ? '' : '<input type="checkbox" class="chon-nv"' + (chon[nv.id] ? ' checked' : '') + '>') + '</td><td class="giua">' + (i + 1) + '</td><td>' + h(nv.ma) + '</td><td class="ten">' + h(nv.hoTen) + '</td>' +
        '<td>' + h(TL.tenPhongBan(db, nv.phongBan)) + '</td><td>' + h(nv.chucVu) + '</td><td class="giua">' + TL.hienNgay(nv.ngayVao) + '</td><td>' + h(nv.loaiHD || '') + '</td>' +
        '<td>' + h((TL.loaiLDNV(db, nv) || {}).ten || '') + '</td><td class="giua">' + App.so(TL.congChuan(db, App.ky.y, App.ky.m, nv)) + '</td><td>' + (App.HINH_THUC[nv.hinhThuc || 'thang']) + '</td><td class="so">' + App.tien(nv.luongCB) + (nv.tiLeHuong != null && +nv.tiLeHuong !== 100 ? ' <span class="the-tt cam">' + nv.tiLeHuong + '%</span>' : '') + '</td>' +
        '<td class="so">' + lbh + '</td><td style="white-space:nowrap">' + (nv.soTK ? h(nv.soTK) + (nv.nganHang ? '<div class="mo nho">' + h(nv.nganHang) + '</div>' : '') : (tt === 'nghi_viec' ? '' : '<span class="the-tt cam">Chưa có</span>')) + '</td>' +
        '<td class="giua">' + (TL.soNPTKy(nv, App.ky.y, App.ky.m) || '') + '</td>' +
        '<td class="giua">' + (nv.ngayHetHD ? TL.hienNgay(nv.ngayHetHD) + App.nhanHetHan(nv.ngayHetHD) : '') + '</td>' +
        '<td><span class="the-tt ' + ({ dang_lam: 'xanh', thu_viec: 'cam', tam_nghi: 'lam', nghi_viec: '' }[tt]) + '">' + App.TRANG_THAI[tt] + '</span></td>' +
        '<td class="khong-in"><button class="nut nho nguy xoa" title="Xoá">' + App.icon('xoa') + '</button></td></tr>';
    });
    html += '</tbody>';
    App.$('#nv-bang').innerHTML = html;
    capNhatNutChuyen();
  }

  function luongBHMacDinh(nv) {
    var s = +nv.luongCB || 0;
    App.db.phuCap.forEach(function (pc) { if (pc.dongBH) s += +(nv.phuCap || {})[pc.ma] || 0; });
    return s;
  }

  App.maMoi = maMoi;
  function maMoi() {
    var max = 0;
    App.db.nhanVien.forEach(function (nv) { var m = String(nv.ma).match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); });
    return 'NV' + String(max + 1).padStart(3, '0');
  }

  /** Ô nhập tiền: tự thêm dấu chấm ngăn cách hàng nghìn khi rời ô */
  function ganOTien(i) {
    i.addEventListener('blur', function () { var n = App.docSo(i.value); i.value = n ? App.tien(n) : (/^\s*0+\s*$/.test(i.value) ? '0' : ''); });
    i.addEventListener('focus', function () { setTimeout(function () { i.select(); }, 0); });
  }
  App.ganOTien = ganOTien;

  App.xoaNV = xoaNV;
  function xoaNV(nv, sauKhiXoa) {
    var coDL = Object.keys(App.db.thang).some(function (k) { var T = App.db.thang[k]; return (T.cc && T.cc[nv.id] && Object.keys(T.cc[nv.id]).length) || (T.chot && T.chot.rows.some(function (r) { return r.nvId === nv.id; })); });
    var msg = 'Xoá nhân viên <b>' + h(nv.hoTen) + '</b> (' + h(nv.ma) + ')?' + (coDL ? '<br><br><span style="color:var(--do)">Nhân viên này đã có dữ liệu chấm công / lương. Nếu đã nghỉ việc, nên sửa trạng thái thành “Đã nghỉ việc” và nhập ngày nghỉ để giữ lịch sử. Xoá sẽ mất dữ liệu chấm công của người này (bảng lương các tháng đã chốt vẫn giữ).</span>' : '');
    App.xacNhan(msg, { nut: 'Xoá', nguy: true }).then(function (ok) {
      if (!ok) return;
      App.db.nhanVien = App.db.nhanVien.filter(function (x) { return x !== nv; });
      Object.keys(App.db.thang).forEach(function (k) { var T = App.db.thang[k]; ['cc', 'ot', 'muon', 'vr', 'dc'].forEach(function (f) { if (T[f]) delete T[f][nv.id]; }); });
      App.db.donNghi = (App.db.donNghi || []).filter(function (d) { return d.nvId !== nv.id; });
      App.luu(); if (sauKhiXoa) sauKhiXoa(); else veBang(); App.bao('Đã xoá ' + nv.hoTen);
    });
  }

  /* ---------- Excel ---------- */
  function cotNV() {
    var c = [
      ['ma', 'Mã NV', 9], ['maChamCong', 'Mã chấm công', 9], ['hoTen', 'Họ và tên', 24], ['gioiTinh', 'Giới tính', 8], ['ngaySinh', 'Ngày sinh', 11, 'ngay'],
      ['noiSinh', 'Nơi sinh', 16], ['queQuan', 'Quê quán', 18], ['danToc', 'Dân tộc', 8], ['tonGiao', 'Tôn giáo', 9], ['quocTich', 'Quốc tịch', 10], ['honNhan', 'Hôn nhân', 11],
      ['cccd', 'Số CCCD', 14], ['ngayCapCCCD', 'Ngày cấp CCCD', 11, 'ngay'], ['noiCapCCCD', 'Nơi cấp CCCD', 18],
      ['sdt', 'Điện thoại', 12], ['email', 'Email', 18], ['thuongTru', 'Địa chỉ thường trú', 26], ['diaChi', 'Chỗ ở hiện nay', 24],
      ['trinhDoHV', 'Học vấn', 7], ['trinhDoCM', 'Trình độ chuyên môn', 14], ['chuyenNganh', 'Chuyên ngành', 16], ['truongDT', 'Trường đào tạo', 18], ['namTN', 'Năm tốt nghiệp', 8],
      ['ngoaiNgu', 'Ngoại ngữ', 10], ['dangVien', 'Đảng viên', 7, 'bool'], ['soSoBHXH', 'Số sổ BHXH', 13], ['maTheBHYT', 'Mã thẻ BHYT', 15], ['noiKCB', 'Nơi KCB ban đầu', 18],
      ['phongBan', 'Phòng / đội', 22, 'pb'], ['chucVu', 'Chức vụ', 18], ['loaiHD', 'Loại hợp đồng', 16], ['ngayVao', 'Ngày vào làm', 11, 'ngay'],
      ['ngayHetHD', 'Ngày hết hạn HĐ', 11, 'ngay'], ['trangThai', 'Trạng thái', 13, 'tt'], ['ngayNghi', 'Ngày nghỉ việc', 11, 'ngay'],
      ['loaiLD', 'Loại lao động', 16, 'lld'], ['congChuanRieng', 'Công chuẩn riêng', 8, 'so'],
      ['hinhThuc', 'Hình thức lương', 13, 'ht'], ['luongCB', 'Mức lương', 13, 'so'], ['tiLeHuong', '% hưởng lương', 8, 'so'],
      ['maSP', 'Sản phẩm chính', 16, 'spm'], ['donGiaSP', 'Đơn giá SP riêng', 9, 'so'],
      ['luongBH', 'Lương đóng BH', 13, 'so'], ['thamGiaBH', 'Tham gia BH', 8, 'bool'], ['doanVien', 'Đoàn viên CĐ', 8, 'bool'],
      ['cachTinhThue', 'Cách tính thuế', 16, 'thue'], ['mst', 'MST cá nhân', 13], ['soNPT', 'Số người phụ thuộc', 8, 'so'],
      ['soTK', 'Số tài khoản', 16], ['nganHang', 'Ngân hàng', 14], ['chiNhanhNH', 'Chi nhánh NH', 16], ['tamUngRieng', 'Tạm ứng kỳ I riêng', 10, 'so'], ['phepNam', 'Phép năm', 7, 'so'], ['phepTon', 'Phép tồn', 7, 'so']
    ];
    App.db.phuCap.forEach(function (p) { c.push(['pc:' + p.ma, 'PC ' + p.ten, 12, 'so']); });
    c.push(['ghiChu', 'Ghi chú', 20]);
    return c;
  }
  function giaTriXuat(nv, c) {
    var k = c[0], v = k.indexOf('pc:') === 0 ? (nv.phuCap || {})[k.slice(3)] : nv[k];
    switch (c[3]) {
      case 'ngay': return TL.hienNgay(v);
      case 'pb': return TL.tenPhongBan(App.db, v);
      case 'tt': return App.TRANG_THAI[v || 'dang_lam'];
      case 'ht': return App.HINH_THUC[v || 'thang'];
      case 'thue': return App.CACH_THUE[v || 'luy_tien'];
      case 'bool': return v ? 'x' : '';
      case 'lld': var l = TL.loaiLDNV(App.db, { loaiLD: v }); return l ? l.ten : '';
      case 'spm': var sp = (App.db.sanPham || []).filter(function (x) { return x.ma === v; })[0]; return sp ? sp.ten : '';
      case 'so': return v === '' || v == null ? '' : +v;
      default: return v == null ? '' : String(v);
    }
  }

  function xuatExcel() {
    var cot = cotNV();
    var ds = dsLoc();
    var sh = App.sheetBang({
      ten: 'Nhân viên', tieuDe: 'DANH SÁCH NHÂN VIÊN', phuDe: 'Ngày ' + new Date().toLocaleDateString('vi-VN') + ' – ' + ds.length + ' người', chuKy: false, coCot: 3,
      cot: [{ t: 'STT', w: 5, stt: true, kieu: 'giua' }].concat(cot.map(function (c) {
        return { t: c[1], w: c[2], kieu: c[3] === 'so' ? 'so' : (c[3] === 'ngay' || c[3] === 'bool' ? 'giua' : 'chu'), f: function (nv) { return giaTriXuat(nv, c); } };
      })),
      dong: ds
    });
    App.xuatExcel('Danh_sach_nhan_vien', [sh]);
  }

  function taiMau() {
    var cot = cotNV();
    var vd = [{
      ma: 'NV001', maChamCong: '1', hoTen: 'Nguyễn Văn A', gioiTinh: 'Nam', ngaySinh: '1990-05-20', phongBan: App.db.phongBan[0] ? App.db.phongBan[0].ma : 'Phòng Kế toán',
      chucVu: 'Nhân viên', loaiHD: 'Không xác định thời hạn', ngayVao: '2024-01-02', trangThai: 'dang_lam', hinhThuc: 'thang', luongCB: 10000000, tiLeHuong: 100,
      thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien', soNPT: 1, phuCap: { AN: 35000 }
    }];
    var dong = [cot.map(function (c) { return { v: c[1], s: App.KIEU.th }; })].concat(vd.map(function (nv) { return cot.map(function (c) { return giaTriXuat(nv, c); }); }));
    App.xuatExcel('Mau_nhap_nhan_vien', [{ ten: 'Nhân viên', dong: dong, cot: cot.map(function (c) { return c[2]; }), co: { r: 1 }, cao: { 0: 32 } }]);
  }

  function khop(a) { return App.boDau(a).toLowerCase().replace(/[^a-z0-9%]/g, ''); }
  function timTheoNhan(map, v) {
    var x = khop(v);
    var ks = Object.keys(map);
    for (var i = 0; i < ks.length; i++) if (khop(map[ks[i]]) === x || khop(ks[i]) === x) return ks[i];
    for (i = 0; i < ks.length; i++) if (x && khop(map[ks[i]]).indexOf(x) >= 0) return ks[i];
    return null;
  }

  function timDM(ds, v) {
    var x = khop(v);
    var t = (ds || []).filter(function (d) { return khop(d.ten) === x || khop(d.ma) === x; })[0];
    return t ? t.ma : null;
  }

  function nhapExcel() {
    App.hop({
      tieuDe: 'Nhập nhân viên từ Excel', co: '',
      than: '<p>Chọn file <b>.xlsx</b> hoặc <b>.csv</b> có dòng tiêu đề (Mã NV, Họ và tên, Phòng / đội, Lương cơ bản…). ' +
        'Nhân viên trùng <b>Mã NV</b> sẽ được cập nhật, mã mới sẽ được thêm. Phòng / đội chưa có sẽ được tự tạo.</p>' +
        '<div class="hang"><input type="file" id="f-nv" accept=".xlsx,.csv,.txt"><button class="nut" id="tai-mau">' + App.icon('tai') + 'Tải file mẫu</button></div>' +
        '<div id="kq-nv" style="margin-top:12px"></div>',
      moRa: function (el, dong) {
        App.$('#tai-mau', el).onclick = taiMau;
        App.$('#f-nv', el).onchange = function () {
          var f = this.files[0]; if (!f) return;
          XL.docFile(f).then(function (sheets) { xuLyNhap(sheets[0].dong, el, dong); }).catch(function (e) { App.bao(e.message, 'loi'); });
        };
      },
      nut: [{ ten: 'Đóng' }]
    });
  }

  function xuLyNhap(rows, el, dongHop) {
    var cot = cotNV();
    // tìm dòng tiêu đề
    var hd = -1;
    for (var i = 0; i < Math.min(rows.length, 15); i++) {
      var r = (rows[i] || []).map(khop);
      if (r.some(function (c) { return c.indexOf('hovaten') >= 0 || c === 'hoten'; })) { hd = i; break; }
    }
    if (hd < 0) { App.$('#kq-nv', el).innerHTML = '<div class="canh-bao">Không tìm thấy dòng tiêu đề có cột “Họ và tên”.</div>'; return; }
    var map = {};
    (rows[hd] || []).forEach(function (t, ci) {
      var k = khop(t);
      if (!k) return;
      cot.forEach(function (c) { if (khop(c[1]) === k || khop(c[0]) === k) map[ci] = c; });
      if (!map[ci]) {
        if (k === 'ma' || k === 'manhanvien') map[ci] = cot[0];
        else if (['phongban', 'bophan', 'donvi', 'doi', 'phong'].indexOf(k) >= 0) map[ci] = cot.filter(function (c) { return c[0] === 'phongBan'; })[0];
        else if (k === 'hoten') map[ci] = cot[2];
        else if (k.indexOf('phucap') === 0 || k.indexOf('pc') === 0) {
          var ten = k.replace(/^phucap|^pc/, '');
          App.db.phuCap.forEach(function (p) { if (khop(p.ten) === ten || khop(p.ma) === ten) map[ci] = ['pc:' + p.ma, 'PC ' + p.ten, 12, 'so']; });
        }
      }
    });
    var moi = [], capNhat = [], loi = [], pbMoi = {};
    rows.slice(hd + 1).forEach(function (r, ri) {
      if (!r || !r.some(function (x) { return x != null && String(x).trim() !== ''; })) return;
      var v = { phuCap: {} };
      Object.keys(map).forEach(function (ci) {
        var c = map[ci], raw = r[ci], k = c[0];
        if (raw == null || String(raw).trim() === '') return;
        var val;
        switch (c[3]) {
          case 'ngay': val = App.chuanNgay(raw); break;
          case 'so': val = App.docSo(raw); break;
          case 'bool': val = /^(x|có|co|1|true|yes|v)$/i.test(String(raw).trim()); break;
          case 'lld': val = timDM(App.db.caiDat.loaiLD, raw) || (/van phong|vp/i.test(App.boDau(raw)) ? 'VP' : /cong nhan|cn/i.test(App.boDau(raw)) ? 'CN' : ''); break;
          case 'spm': val = timDM(App.db.sanPham, raw) || ''; break;
          case 'tt': val = timTheoNhan(App.TRANG_THAI, raw) || 'dang_lam'; break;
          case 'ht': val = timTheoNhan(App.HINH_THUC, raw) || (/ngay|ngày/i.test(raw) ? 'ngay' : /gio|giờ/i.test(raw) ? 'gio' : 'thang'); break;
          case 'thue': val = /10|khau|khấu/i.test(raw) ? 'khau_tru' : /khong|không/i.test(raw) ? 'khong' : 'luy_tien'; break;
          case 'pb':
            var s = String(raw).trim(), pb = App.db.phongBan.filter(function (p) { return khop(p.ten) === khop(s) || khop(p.ma) === khop(s); })[0];
            if (!pb) { pb = pbMoi[khop(s)] || { ma: 'PB' + (App.db.phongBan.length + Object.keys(pbMoi).length + 1), ten: s, loai: TL.loaiDonVi({ ten: s }) }; pbMoi[khop(s)] = pb; }
            val = pb.ma; break;
          default: val = String(raw).trim();
        }
        if (k.indexOf('pc:') === 0) v.phuCap[k.slice(3)] = val; else v[k] = val;
      });
      if (!v.hoTen) { loi.push('Dòng ' + (hd + ri + 2) + ': thiếu họ tên'); return; }
      var cu = v.ma ? App.db.nhanVien.filter(function (x) { return String(x.ma).toLowerCase() === String(v.ma).toLowerCase(); })[0] : null;
      if (cu) capNhat.push([cu, v]); else moi.push(v);
    });
    App.$('#kq-nv', el).innerHTML = '<div class="goi-y">Đọc được <b>' + (moi.length + capNhat.length) + '</b> nhân viên: <b>' + moi.length + '</b> thêm mới, <b>' + capNhat.length + '</b> cập nhật' +
      (Object.keys(pbMoi).length ? ', tạo ' + Object.keys(pbMoi).length + ' phòng / đội mới' : '') + '.' +
      (loi.length ? '<br><span style="color:var(--do)">' + loi.slice(0, 5).map(h).join('<br>') + (loi.length > 5 ? '<br>…' : '') + '</span>' : '') +
      '</div><div class="hang" style="margin-top:10px"><span class="gian"></span><button class="nut chinh" id="xn-nhap"' + (moi.length + capNhat.length ? '' : ' disabled') + '>Nhập vào phần mềm</button></div>';
    var b = App.$('#xn-nhap', el);
    if (b) b.onclick = function () {
      Object.keys(pbMoi).forEach(function (k) { App.db.phongBan.push(pbMoi[k]); });
      capNhat.forEach(function (x) { var pcCu = x[0].phuCap || {}; Object.assign(x[0], x[1]); x[0].phuCap = Object.assign({}, pcCu, x[1].phuCap); });
      moi.forEach(function (v) {
        App.db.nhanVien.push(Object.assign({
          id: App.uid(), ma: v.ma || maMoi(), hinhThuc: 'thang', tiLeHuong: 100, thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien',
          soNPT: 0, trangThai: 'dang_lam', phuCap: {}
        }, v, { ma: v.ma || maMoi() }));
      });
      App.luu();
      App.bao('Đã nhập ' + (moi.length + capNhat.length) + ' nhân viên.', 'tot');
      dongHop();
      App.veLai();
    };
  }

  App.trang.nhanvien = { ve: ve, khongKy: true };
})();

</script>
<script>
/* ===== p-hoso.js ===== */
/* Trang Hồ sơ nhân viên: lý lịch, công việc & lương, bảo hiểm – thuế – người phụ thuộc, hợp đồng,
   quá trình công tác (quyết định), nghỉ phép, lương các kỳ. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;

  /* ---------- Ô nhập dùng chung (cả trang hồ sơ và các hộp thoại nhân sự) ---------- */
  var F = App.F = {
    o: function (nhan, input, gc, cls) { return '<label class="o ' + (cls || '') + '">' + nhan + input + (gc ? '<span class="gc">' + gc + '</span>' : '') + '</label>'; },
    txt: function (ten, v, attr) { return '<input name="' + ten + '" value="' + h(v == null ? '' : v) + '" ' + (attr || '') + '>'; },
    ngay: function (ten, v) { return '<input type="date" name="' + ten + '" value="' + h(v || '') + '">'; },
    tien: function (ten, v, ph) { if (typeof v === 'string' && v.trim() !== '') v = App.docSo(v); return '<input name="' + ten + '" class="so tien" inputmode="numeric" value="' + (v || v === 0 && v !== '' ? App.tien(v) : '') + '"' + (ph ? ' placeholder="' + h(ph) + '"' : '') + '>'; },
    sel: function (ten, v, opts) {
      return '<select name="' + ten + '">' + opts.map(function (x) {
        var k = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x;
        return '<option value="' + h(k) + '"' + (String(v == null ? '' : v) === String(k) ? ' selected' : '') + '>' + h(t) + '</option>';
      }).join('') + '</select>';
    },
    chk: function (ten, v, nhan) { return '<label class="chk"><input type="checkbox" name="' + ten + '"' + (v ? ' checked' : '') + '> ' + nhan + '</label>'; },
    vung: function (ten, v) { return '<textarea name="' + ten + '">' + h(v || '') + '</textarea>'; },
    cap: function (obj) { return Object.keys(obj).map(function (k) { return [k, obj[k]]; }); },
    /** Đọc giá trị các ô [name] trong el vào object */
    doc: function (el) {
      var v = {};
      App.$$('[name]', el).forEach(function (i) { v[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
      return v;
    }
  };
  App.TRINH_DO_CM = ['', 'Lao động phổ thông', 'Sơ cấp nghề', 'Trung cấp', 'Cao đẳng', 'Đại học', 'Thạc sĩ', 'Tiến sĩ'];
  App.HON_NHAN = ['', 'Độc thân', 'Đã kết hôn', 'Ly hôn', 'Góa'];
  App.QUAN_HE = ['Con', 'Vợ', 'Chồng', 'Cha', 'Mẹ', 'Cha vợ / chồng', 'Mẹ vợ / chồng', 'Anh, chị, em', 'Khác'];

  var TABS = [
    ['canhan', 'Thông tin cá nhân'], ['congviec', 'Công việc & lương'], ['bhthue', 'Bảo hiểm, thuế & người phụ thuộc'],
    ['hopdong', 'Hợp đồng lao động'], ['quatrinh', 'Quá trình công tác'], ['phep', 'Nghỉ phép'], ['luong', 'Lương các kỳ']
  ];
  var st = { id: null, tab: 'canhan', d: null, ban: false };

  App.timNV = function (id) { return App.db.nhanVien.filter(function (x) { return x.id === id; })[0]; };
  App.moHoSo = function (id, tab) { st.tab = tab || st.tab || 'canhan'; location.hash = '#hoso?id=' + encodeURIComponent(id); };

  function nvMoi() {
    var db = App.db;
    return {
      id: App.uid(), ma: App.maMoi(), hoTen: '', gioiTinh: 'Nam', danToc: 'Kinh', tonGiao: 'Không', quocTich: 'Việt Nam',
      phongBan: db.phongBan[0] ? db.phongBan[0].ma : '', hinhThuc: 'thang', luongCB: 0, tiLeHuong: 100, loaiLD: (db.caiDat.loaiLD[0] || {}).ma || '',
      thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien', soNPT: 0, trangThai: 'dang_lam', loaiHD: 'Không xác định thời hạn',
      ngayVao: App.homNay(), phuCap: {}, phepNam: '', hopDong: [], quyetDinh: [], nguoiPhuThuoc: [], moi: true
    };
  }

  function ve(noi) {
    var id = App.thamSo('id');
    if (id !== st.id) { st.id = id; st.ban = false; st.d = null; if (id === 'moi') st.tab = 'canhan'; }
    var nv = id === 'moi' ? null : App.timNV(id);
    if (!st.d) st.d = nv ? JSON.parse(JSON.stringify(nv)) : (id === 'moi' ? nvMoi() : null);
    if (!st.d) { noi.innerHTML = '<div class="the trong">Không tìm thấy nhân viên. <a href="#nhanvien">Về danh sách</a></div>'; return; }
    var d = st.d, moi = !!d.moi, db = App.db;
    if (moi && ['canhan', 'congviec', 'bhthue'].indexOf(st.tab) < 0) st.tab = 'canhan';
    App.$('#tieu-de').textContent = moi ? 'Thêm nhân viên' : 'Hồ sơ: ' + (nv ? nv.hoTen : '');

    var hn = App.homNay(), tt = d.trangThai || 'dang_lam';
    var tn = TL.thamNien(d.ngayVao, d.ngayNghi && d.ngayNghi < hn ? d.ngayNghi : hn);
    var pn = nv ? TL.phepNam(db, nv, App.ky.y) : null;
    var hdHL = App.hdHieuLuc(d);
    var nh = TL.ngayNghiHuu(d.gioiTinh, d.ngaySinh);
    var thongTin = [];
    if (d.ngayVao) thongTin.push('Thâm niên <b>' + (tn.nam ? tn.nam + ' năm ' : '') + tn.thang + ' tháng</b>');
    if (pn) thongTin.push('Phép năm ' + App.ky.y + ' còn <b>' + App.so(pn.conLai) + '</b> ngày');
    if (hdHL) thongTin.push('HĐ: ' + h(hdHL.loai) + (hdHL.denNgay ? ' đến ' + TL.hienNgay(hdHL.denNgay) + App.nhanHetHan(hdHL.denNgay) : ''));
    else if (!moi) thongTin.push('<span class="the-tt cam">Chưa có hợp đồng</span>');
    if (nh && tt !== 'nghi_viec') thongTin.push('Đủ tuổi nghỉ hưu: ' + TL.hienNgay(nh));

    noi.innerHTML =
      '<div class="the khong-in" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">' +
      '<div class="anh-nv">' + (d.anh ? '<img src="' + d.anh + '" alt="">' : '<span>' + h(chuDau(d.hoTen)) + '</span>') + '</div>' +
      '<div style="flex:1;min-width:240px"><div style="font-size:20px;font-weight:700">' + h(d.hoTen || 'Nhân viên mới') + ' <span class="the-tt ' + ({ dang_lam: 'xanh', thu_viec: 'cam', tam_nghi: 'lam', nghi_viec: '' }[tt]) + '">' + App.TRANG_THAI[tt] + '</span></div>' +
      '<div class="mo">' + h(d.ma) + (d.chucVu ? ' · ' + h(d.chucVu) : '') + (d.phongBan ? ' · ' + h(TL.tenPhongBan(db, d.phongBan)) : '') + '</div>' +
      '<div class="nho" style="margin-top:4px;display:flex;gap:4px 18px;flex-wrap:wrap">' + thongTin.map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div></div>' +
      '<div class="hang"><a class="nut" href="#nhanvien">← Danh sách</a>' +
      (moi ? '' : '<button class="nut" id="hs-in">' + App.icon('in') + 'In sơ yếu lý lịch</button><button class="nut nguy" id="hs-xoa">' + App.icon('xoa') + '</button>') +
      '<button class="nut chinh" id="hs-luu">' + (moi ? 'Thêm nhân viên' : 'Lưu hồ sơ') + '</button></div>' +
      (st.ban ? '<div class="nho" style="width:100%;color:var(--cam)">● Có thay đổi chưa lưu</div>' : '') + '</div>' +
      '<div class="tabs khong-in">' + TABS.map(function (t) {
        var tat = moi && ['canhan', 'congviec', 'bhthue'].indexOf(t[0]) < 0;
        return '<button data-t="' + t[0] + '"' + (st.tab === t[0] ? ' class="chon"' : '') + (tat ? ' disabled title="Lưu hồ sơ trước"' : '') + '>' + t[1] + demTab(t[0], d) + '</button>';
      }).join('') + '</div><div id="hs-noi"></div>';

    App.$('.tabs', noi).onclick = function (e) { var b = e.target.closest('[data-t]'); if (b && !b.disabled) { st.tab = b.dataset.t; App.veLai(); } };
    App.$('#hs-luu').onclick = function () { luu(true); };
    var bi = App.$('#hs-in'); if (bi) bi.onclick = function () { App.inSoYeu(App.timNV(st.id)); };
    var bx = App.$('#hs-xoa'); if (bx) bx.onclick = function () { App.xoaNV(App.timNV(st.id), function () { st.d = null; location.hash = '#nhanvien'; }); };
    var el = App.$('#hs-noi');
    ({ canhan: tabCaNhan, congviec: tabCongViec, bhthue: tabBHThue, hopdong: tabHopDong, quatrinh: tabQuaTrinh, phep: tabPhep, luong: tabLuong })[st.tab](el, d, nv);
    if (['canhan', 'congviec', 'bhthue'].indexOf(st.tab) >= 0) ganForm(el);
  }

  function demTab(t, d) {
    var n = t === 'hopdong' ? (d.hopDong || []).length : t === 'quatrinh' ? (d.quyetDinh || []).length : t === 'bhthue' ? (d.nguoiPhuThuoc || []).length : 0;
    return n ? ' <span class="the-tt">' + n + '</span>' : '';
  }
  function chuDau(t) { var p = String(t || '?').trim().split(/\s+/); return (p.length > 1 ? p[p.length - 2][0] : '') + (p[p.length - 1][0] || ''); }

  /** Gắn sự kiện: ô nhập trong tab ghi ngay vào bản nháp st.d */
  function ganForm(el) {
    App.$$('input.tien', el).forEach(App.ganOTien);
    el.addEventListener('change', function (e) {
      var i = e.target; if (!st.d || !i.name || i.name.indexOf('_') === 0) return;
      var v = i.type === 'checkbox' ? i.checked : i.value;
      if (i.name.indexOf('pc_') === 0) { st.d['_' + i.name] = v; }
      else st.d[i.name] = v;
      if (i.name === 'hinhThuc') { var dv = App.$('#dv-luong'); if (dv) dv.textContent = '(' + App.DV_LUONG[v] + ')'; }
      if (i.name === 'trangThai' && v === 'thu_viec') { st.d.tiLeHuong = 85; st.d.loaiHD = 'Thử việc'; App.veLai(); return; }
      if (i.name === 'ngayNghi' && v) { st.d.trangThai = 'nghi_viec'; }
      if (!st.ban) { st.ban = true; var b = App.$('#hs-luu'); if (b) b.textContent = (st.d.moi ? 'Thêm nhân viên' : 'Lưu hồ sơ') + ' ●'; }

  /* ---------- Lưu ---------- */
  function luu(baoThanhCong, khongVeLai) {
    var d = st.d, db = App.db, moi = !!d.moi;
    var v = Object.assign({}, d);
    v.ma = String(v.ma || '').trim(); v.hoTen = String(v.hoTen || '').trim();
    if (!v.ma || !v.hoTen) { App.bao('Cần nhập mã nhân viên và họ tên (tab Thông tin cá nhân).', 'loi'); return false; }
    var trung = db.nhanVien.filter(function (x) { return x.id !== d.id && String(x.ma).toLowerCase() === v.ma.toLowerCase(); })[0];
    if (trung) { App.bao('Mã ' + v.ma + ' đã dùng cho ' + trung.hoTen + '.', 'loi'); return false; }
    v.maChamCong = String(v.maChamCong || '').trim();
    if (v.maChamCong) {
      var t2 = db.nhanVien.filter(function (x) { return x.id !== d.id && x.maChamCong && String(x.maChamCong) === v.maChamCong; })[0];
      if (t2) { App.bao('Mã chấm công ' + v.maChamCong + ' đã dùng cho ' + t2.hoTen + '.', 'loi'); return false; }
    }
    ['luongCB', 'luongBH', 'donGiaSP'].forEach(function (k) { v[k] = App.docSo(v[k]); });
    v.tamUngRieng = v.tamUngRieng == null || String(v.tamUngRieng).trim() === '' ? '' : App.docSo(v.tamUngRieng);
    v.soTK = String(v.soTK || '').replace(/\s+/g, '');
    v.congChuanRieng = v.congChuanRieng === '' || v.congChuanRieng == null ? '' : +v.congChuanRieng;
    v.tiLeHuong = v.tiLeHuong === '' || v.tiLeHuong == null ? 100 : +v.tiLeHuong;
    v.soNPT = +v.soNPT || 0;
    ['phepNam', 'phepTon'].forEach(function (k) { v[k] = v[k] === '' || v[k] == null ? '' : +v[k]; });
    var pcv = Object.assign({}, d.phuCap || {});
    db.phuCap.forEach(function (p) {
      var k = '_pc_' + p.ma; if (!(k in v)) return;
      var raw = String(v[k] == null ? '' : v[k]).trim(), x = App.docSo(raw);
      if (raw !== '' && (x || p.mucChung)) pcv[p.ma] = x; else delete pcv[p.ma];
      delete v[k];
    });
    v.phuCap = pcv;
    if (v.trangThai === 'nghi_viec' && !v.ngayNghi) { App.bao('Nhân viên đã nghỉ việc: hãy nhập ngày nghỉ việc (tab Công việc & lương).', 'loi'); return false; }
    if (v.ngayNghi && v.trangThai !== 'nghi_viec') v.trangThai = 'nghi_viec';
    delete v.moi;
    if (moi) {
      db.nhanVien.push(v);
    } else {
      var nv = App.timNV(d.id);
      // giữ các danh sách đang được sửa trực tiếp (hợp đồng, quyết định, người phụ thuộc)
      ['hopDong', 'quyetDinh', 'nguoiPhuThuoc'].forEach(function (k) { v[k] = nv[k]; });
      Object.keys(nv).forEach(function (k) { if (!(k in v)) delete nv[k]; });
      Object.assign(nv, v);
    }
    App.luu();
    st.ban = false; st.d = null;
    if (baoThanhCong) App.bao(moi ? 'Đã thêm ' + v.hoTen + '. Có thể nhập tiếp hợp đồng, quá trình công tác.' : 'Đã lưu hồ sơ ' + v.hoTen, 'tot');
    if (khongVeLai) return true;
    if (moi) { st.id = null; location.hash = '#hoso?id=' + v.id; } else App.veLai();
    return true;
  }

  function thuNhoAnh(file, xong) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = 240, hh = 320, c = document.createElement('canvas'); c.width = w; c.height = hh;
        var tl = Math.max(w / img.width, hh / img.height), sw = w / tl, sh = hh / tl;
        c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, hh);
        xong(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function () { App.bao('Không đọc được ảnh.', 'loi'); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }

      pn.theoThang.map(function (v) { return '<td class="giua">' + App.soRong(v) + '</td>'; }).join('') + '</tr></tbody></table></div></div>' +

      (rows.length ? rows.map(function (o) {

          '<td class="so">' + App.tienRong(r.luongSP) + '</td><td class="so">' + App.tienRong(r.luongTG) + '</td><td class="so">' + App.tienRong(r.tongPhuCap) + '</td><td class="so">' + App.tienRong(r.thuong + (r.thuongQD || 0)) + '</td>' +

      location.hash = '#bangluong';

  App.trang.hoso = {
    ve: ve, khongKy: true, menu: 'nhanvien',

        else App.bao('Hồ sơ chưa lưu được – thay đổi đã bị bỏ.', 'loi');
      }
      st.d = null; st.ban = false; st.id = null;
    }
  };
})();

<script>
/* ===== p-nhansu.js ===== */
/* Phân hệ Nhân sự: hợp đồng lao động, quyết định (quá trình công tác, khen thưởng, kỷ luật), đơn nghỉ phép,
   báo cáo nhân sự; mẫu in hợp đồng và sơ yếu lý lịch. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  function F() { return App.F; }
  function hn() { return App.homNay(); }
  function soNgay(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function cong(iso, ngay) { var n = TL.docNgay(iso); return TL.congNgay(n.y, n.m, n.d, ngay); }
  function themThang(iso, th) { var n = TL.docNgay(iso), t = new Date(n.y, n.m - 1 + th, n.d - 1); return TL.iso(t.getFullYear(), t.getMonth() + 1, t.getDate()); }
  function chonNV(ten, v, chiDangLam) {
    return '<select name="' + ten + '">' + App.db.nhanVien.filter(function (n) { return !chiDangLam || n.trangThai !== 'nghi_viec'; })
      .sort(function (a, b) { return String(a.ma).localeCompare(String(b.ma), 'vi', { numeric: true }); })
      .map(function (n) { return '<option value="' + n.id + '"' + (n.id === v ? ' selected' : '') + '>' + h(n.ma + ' – ' + n.hoTen) + '</option>'; }).join('') + '</select>';
  }
  function luuVaVe(nv) { if (nv) App.dongBoHoSo(nv); App.luu(); App.veLai(); }

  /* ================= Hợp đồng ================= */

  /** Hợp đồng đang có hiệu lực hôm nay (hoặc hợp đồng mới nhất) */
  App.hdHieuLuc = function (nv) {
    var ds = (nv.hopDong || []).slice().sort(function (a, b) { return (b.tuNgay || '') < (a.tuNgay || '') ? -1 : 1; });
    var d = hn();
    return ds.filter(function (x) { return (!x.tuNgay || x.tuNgay <= d) && (!x.denNgay || x.denNgay >= d); })[0] || ds[0] || null;
  };
  App.nhanHetHan = function (iso) {
    if (!iso) return '';
    var con = soNgay(hn(), iso);
    if (con < 0) return ' <span class="the-tt">đã hết</span>';
    if (con <= 30) return ' <span class="the-tt ' + (con <= 7 ? 'do' : 'cam') + '">còn ' + con + ' ngày</span>';
    return '';
  };
  App.ttHopDong = function (x) {
    var d = hn();
    if (x.tuNgay && x.tuNgay > d) return '<span class="the-tt lam">Chưa hiệu lực</span>';
    if (x.denNgay && x.denNgay < d) return '<span class="the-tt">Đã hết hạn</span>';
    if (x.denNgay && soNgay(d, x.denNgay) <= 30) return '<span class="the-tt ' + (soNgay(d, x.denNgay) <= 7 ? 'do' : 'cam') + '">Sắp hết hạn (' + soNgay(d, x.denNgay) + ' ngày)</span>';
    return '<span class="the-tt xanh">Còn hiệu lực</span>';
  };
  function soHDMoi() {
    var y = new Date().getFullYear(), max = 0;
    App.db.nhanVien.forEach(function (nv) { (nv.hopDong || []).forEach(function (x) { var m = String(x.so || '').match(/^(\d+)\/(\d{4})/); if (m && +m[2] === y) max = Math.max(max, +m[1]); }); });
    return TL.pad(max + 1) + '/' + y + '/HĐLĐ';

  App.formHopDong = function (nv, i, sauKhiLuu) {

      so: soHDMoi(), loai: nv.trangThai === 'thu_viec' ? 'Thử việc' : 'Xác định thời hạn', ngayKy: hn(), tuNgay: hn(), chucDanh: nv.chucVu || '',
      luongCB: nv.luongCB, diaDiem: db.congTy.diaChi || '', congViec: ''
    } : JSON.parse(JSON.stringify(nv.hopDong[i]));

    var f = F();
    App.hop({
      tieuDe: (moi ? 'Thêm hợp đồng – ' : 'Sửa hợp đồng – ') + nv.hoTen, co: 'rong',
      than: '<form class="form ba" onsubmit="return false">' +
        f.o('Số hợp đồng', f.txt('so', x.so)) + f.o('Loại hợp đồng', f.sel('loai', x.loai, App.LOAI_HD)) + f.o('Ngày ký', f.ngay('ngayKy', x.ngayKy)) +
        f.o('Có hiệu lực từ ngày', f.ngay('tuNgay', x.tuNgay)) + f.o('Đến ngày', f.ngay('denNgay', x.denNgay), 'Để trống nếu không xác định thời hạn') +
        f.o('Chức danh chuyên môn', f.txt('chucDanh', x.chucDanh)) +
        f.o('Mức lương theo hợp đồng (đ)', f.tien('luongCB', x.luongCB)) + f.o('Phụ cấp, thưởng (ghi trong HĐ)', f.txt('phuCap', x.phuCap, 'placeholder="vd Cơm trưa 50.000 đ/ngày làm việc"'), '', '') +
        f.o('Địa điểm làm việc', f.txt('diaDiem', x.diaDiem)) +
        f.o('Công việc phải làm', f.vung('congViec', x.congViec), '', 'ca') + f.o('Ghi chú', f.txt('ghiChu', x.ghiChu), '', 'ca') +
        '<div class="ca" id="hd-cn">' +
        f.chk('capNhat', true, 'Cập nhật hồ sơ theo hợp đồng này (loại HĐ, ngày hết hạn, chức danh; hết thử việc thì chuyển “Đang làm việc”, hưởng 100% lương)') + '<br>' +
        '<span id="hd-luong">' + f.chk('apLuong', false, 'Áp dụng mức lương này từ ngày hiệu lực (tạo quyết định điều chỉnh lương; các kỳ trước giữ lương cũ ' + App.tien(nv.luongCB) + ' đ)') + '</span></div>' +
        '</form>',
      moRa: function (el) {
        App.$$('input.tien', el).forEach(App.ganOTien);
        var fm = App.$('form', el);
        function capNhat() {
          var l = App.docSo(fm.luongCB.value);
          App.$('#hd-luong', el).style.display = l && l !== +nv.luongCB ? '' : 'none';
          fm.denNgay.disabled = fm.loai.value === 'Không xác định thời hạn';
          if (fm.denNgay.disabled) fm.denNgay.value = '';
        }
        fm.loai.onchange = function () {
          if (this.value === 'Thử việc' && fm.tuNgay.value) fm.denNgay.value = themThang(fm.tuNgay.value, 2);
          else if (this.value === 'Xác định thời hạn' && fm.tuNgay.value) fm.denNgay.value = themThang(fm.tuNgay.value, 12);
          capNhat();
        };
        fm.luongCB.addEventListener('change', capNhat);
        fm.luongCB.addEventListener('blur', capNhat);
        capNhat();
        if (!moi) { var cn = App.$('[name=capNhat]', el); cn.checked = App.hdHieuLuc(nv) === nv.hopDong[i]; }
      },
      nut: [{ ten: 'Huỷ' }, {
        ten: 'Lưu hợp đồng', loai: 'chinh', bam: function (el) {
          var v = F().doc(el);
          if (!v.tuNgay) { App.bao('Nhập ngày hiệu lực.', 'loi'); return false; }
          if (v.denNgay && v.denNgay < v.tuNgay) { App.bao('Ngày kết thúc phải sau ngày hiệu lực.', 'loi'); return false; }

<script>
/* ===== p-thangluong.js ===== */
/* Thang, bảng lương: danh mục bảng lương → chức danh / nhóm công việc → bậc lương (mức tiền hoặc hệ số);
   xếp lương cho nhân viên; danh sách đến hạn nâng bậc và lập quyết định nâng bậc. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  var NF_HS = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
  var st = { tab: 'xep', pb: '', tim: '', chuaXep: false, han: '3' };

  App.soHS = function (v) { return NF_HS.format(+v || 0); };
  function docHS(s) { var n = parseFloat(String(s == null ? '' : s).trim().replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
  function opts(obj, chon) { return Object.keys(obj).map(function (k) { return '<option value="' + k + '"' + (k === chon ? ' selected' : '') + '>' + h(obj[k]) + '</option>'; }).join(''); }

  /** "Bậc 3 – hệ số 3,00 = 7.020.000 đ" */
  App.moTaBac = function (b, g, bac, ky) {
    var gt = TL.giaTriBac(App.db, b, g, bac, ky);
    if (!gt) return 'Bậc ' + bac;
    return 'Bậc ' + bac + ' – ' + (gt.heSo != null ? 'hệ số ' + App.soHS(gt.heSo) + ' = ' : '') + App.tien(gt.tien) + ' đ';
  };
  /** "Chuyên viên, bậc 3/8 (hệ số 3,00)" */
  App.moTaXepLuong = function (nv) {
    var xl = TL.xepLuongNV(App.db, nv);
    if (!xl) return '';
    return xl.ngach.ten + ', bậc ' + xl.bac + '/' + xl.soBac + (xl.heSo != null ? ' (hệ số ' + App.soHS(xl.heSo) + ')' : '');
  };

  function dsXep(maBang, maNgach, bac) {
    return App.db.nhanVien.filter(function (nv) {
      var x = nv.xepLuong;
      return nv.trangThai !== 'nghi_viec' && x && x.bang === maBang && (maNgach == null || x.ngach === maNgach) && (bac == null || +x.bac === bac);
    });
  }

  /** Áp lại mức lương theo bảng cho những người đang xếp (tất cả hoặc một bảng). Trả về số người đã đổi. */
  App.apDungBangLuong = function (maBang, imLang) {
    var doi = [];
    App.db.nhanVien.forEach(function (nv) {
      if (nv.trangThai === 'nghi_viec' || !nv.xepLuong || (maBang && nv.xepLuong.bang !== maBang)) return;
      var d = TL.apXepLuong(App.db, nv);
      if (Object.keys(d).length) { doi.push({ nv: nv, d: d }); if (App.dongBoHoSo) App.dongBoHoSo(nv); }
    });
    if (doi.length && !imLang) App.bao('Đã cập nhật lương theo bảng cho ' + doi.length + ' nhân viên: ' + doi.slice(0, 4).map(function (x) {
      var k = x.d.luongCB || x.d.luongBH; return x.nv.hoTen + ' ' + App.tien(k[0]) + ' → ' + App.tien(k[1]);
    }).join('; ') + (doi.length > 4 ? '…' : ''), 'tot');
    return doi.length;
  };

  /* ================= Danh mục thang, bảng lương ================= */

  App.dmThangLuong = function (el) {
    var db = App.db, ds = db.thangLuong;
    ds.forEach(TL.chuanBangLuong);
    el.innerHTML = '<div class="the"><h3>Thang, bảng lương<span class="phai">' + ds.length + ' bảng · lương cơ sở ' + App.tien(db.caiDat.luongCoSo) + ' đ</span></h3>' +
      '<p class="mo" style="margin:0">Mỗi bảng gồm các <b>chức danh / nhóm công việc</b>, mỗi chức danh có nhiều <b>bậc</b>. Giá trị bậc là <b>mức tiền</b> (đồng / tháng) hoặc <b>hệ số</b> × mức lương cơ sở. ' +
      '“Dùng cho” quyết định bậc lương được ghi vào <b>mức lương</b> (tính lương thời gian), <b>lương đóng bảo hiểm</b>, hay cả hai. ' +
      'Xếp bậc cho từng người ở trang <a href="#nangbac">Xếp lương, nâng bậc</a> hoặc trong hồ sơ nhân viên. ' +
      'Bảng lương thay đổi từ một tháng (bậc, lương cơ sở, tiền cơm, tạm ứng): dùng trang <a href="#mucluong">Mức lương theo kỳ</a> – các kỳ trước giữ mức cũ.</p>' +
      '<div style="margin-top:10px"><div class="mo nho" style="margin-bottom:4px">Giá trị các bậc bên dưới là của mức:</div>' + App.ML.thanh(false) + '</div></div>' +
      ds.map(theBang).join('') +
      '<div class="the"><h3>Thêm bảng lương</h3><div class="hang"><input id="tl-ten" placeholder="Tên bảng (vd Bảng lương chức vụ quản lý)" style="width:340px">' +
      '<select id="tl-kieu">' + opts(TL.KIEU_BL, 'tien') + '</select><select id="tl-apdung">' + opts(TL.AP_DUNG_BL, 'cb') + '</select>' +
      '<button class="nut chinh" id="tl-them">' + App.icon('them') + 'Thêm bảng lương</button></div></div>';

    function bang(t) { var c = t.closest('[data-b]'); return c ? ds[+c.dataset.b] : null; }
    function ngach(t, b) { var r = t.closest('[data-g]'); return r ? b.ngach[+r.dataset.g] : null; }
    function veLai() { App.dmThangLuong(el); }

    el.onchange = function (e) {
      var i = e.target, b = bang(i); if (!b) return;
      var f = i.dataset.f, g = ngach(i, b), apLai = false;
      if (i.dataset.bac != null) {
        var k = +i.dataset.bac, v = b.kieu === 'he_so' ? docHS(i.value) : App.docSo(i.value);
        if (!v && dsXep(b.ma, g.ma, k + 1).length) { App.bao('Bậc ' + (k + 1) + ' đang xếp cho ' + dsXep(b.ma, g.ma, k + 1).length + ' nhân viên – không để trống được.', 'loi'); veLai(); return; }
        App.ML.ghiBac(b, g, k, v || ''); apLai = true;
      } else if (f === 'ten') { if (!i.value.trim()) { veLai(); return; } b.ten = i.value.trim(); }
      else if (f === 'apDung') { b.apDung = i.value; apLai = true; }
      else if (f === 'mucCoSo') { App.ML.ghiMucCoSo(b, App.docSo(i.value) || ''); apLai = true; }
      else if (f === 'namNang') { b.namNang = docHS(i.value) || 3; }
      else if (f === 'gten') { if (!i.value.trim()) { veLai(); return; } g.ten = i.value.trim(); }
      else if (f === 'gnam') { g.namNang = docHS(i.value) || ''; }
      else if (f === 'kieu') {
        var n = dsXep(b.ma).length;
        if (n) { App.bao('Bảng đang xếp cho ' + n + ' nhân viên – không đổi kiểu được. Tạo bảng mới nếu cần.', 'loi'); veLai(); return; }
        var coGT = b.ngach.some(function (x) { return x.bac.some(function (v) { return +v > 0; }); }) || App.db.dotLuong.some(function (d) { return d.bang && d.bang[b.ma]; });
        var doiKieu = function () { b.kieu = i.value; b.ngach.forEach(function (x) { x.bac = x.bac.map(function () { return ''; }); }); App.ML.xoaGiaTri(b); App.luu(); veLai(); };

        else doiKieu();

    el.onclick = function (e) {

        App.luu(); veLai(); App.bao('Đã thêm ' + ten + '. Thêm chức danh và nhập giá trị từng bậc.', 'tot');
        return;
      }
      var a = e.target.closest('[data-a]'); if (!a) return;

        if (b.ngach.some(function (x) { return +x.bac[b.soBac - 1] > 0; })) App.xacNhan('Bớt cột bậc ' + b.soBac + ' (đang có giá trị)?', { nut: 'Bớt bậc', nguy: true }).then(function (ok) { if (ok) bo(); });
        else bo();
        return;
      }
      if (act === 'xoabang') {
        var n1 = dsXep(b.ma).length;
        if (n1) { App.bao('Bảng “' + b.ten + '” đang xếp cho ' + n1 + ' nhân viên. Hãy xếp họ sang bảng khác (trang Xếp lương, nâng bậc) rồi mới xoá.', 'loi'); return; }
        App.xacNhan('Xoá bảng lương <b>' + h(b.ten) + '</b>?', { nut: 'Xoá', nguy: true }).then(function (ok) { if (ok) { ds.splice(ds.indexOf(b), 1); App.ML.xoaBang(b); App.luu(); veLai(); } });
        return;
      }
      if (act === 'themngach') {
        var card = a.closest('[data-b]'), iMa = App.$('[data-f="mamoi"]', card), iTen = App.$('[data-f="tenmoi"]', card);
        var ten2 = iTen.value.trim(), ma2 = iMa.value.trim();
        if (!ten2) { App.bao('Nhập tên chức danh / nhóm công việc.', 'loi'); iTen.focus(); return; }
        if (!ma2) ma2 = App.boDau(ten2).split(/[\s,\-–]+/).map(function (w) { return w[0] || ''; }).join('').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5) || 'CD';
        var goc = ma2, k2 = 2; while (b.ngach.some(function (x) { return x.ma.toLowerCase() === ma2.toLowerCase(); })) ma2 = goc + k2++;
        b.ngach.push({ ma: ma2, ten: ten2, bac: Array.apply(null, Array(b.soBac)).map(function () { return ''; }), namNang: '' });
        App.luu(); veLai();
        return;
      }
      if (act === 'xoangach' && g) {
        var n2 = dsXep(b.ma, g.ma).length;
        if (n2) { App.bao('“' + g.ten + '” đang xếp cho ' + n2 + ' nhân viên – hãy xếp họ sang chức danh khác trước.', 'loi'); return; }
        App.xacNhan('Xoá chức danh <b>' + h(g.ten) + '</b> khỏi bảng?', { nut: 'Xoá', nguy: true }).then(function (ok) { if (ok) { b.ngach.splice(b.ngach.indexOf(g), 1); App.ML.xoaNgach(b, g); App.luu(); veLai(); } });
        return;
      }
      if (act === 'lenngach' && g) { var i0 = b.ngach.indexOf(g); if (i0 > 0) { b.ngach.splice(i0 - 1, 0, b.ngach.splice(i0, 1)[0]); App.luu(); veLai(); } }
    };
  };

  function theBang(b, bi) {

      (b.ngach.length ? b.ngach.map(function (g, gi) {

          '<td><input class="o-nhap so" data-f="gnam" value="' + (g.namNang ? App.so(g.namNang) : '') + '" placeholder="' + App.so(b.namNang) + '" style="width:46px"></td>' +
          g.bac.map(function (v0, k) {
            var v = App.ML.docBac(b, g, k), gt = TL.giaTriBac(db, b, g, k + 1, App.ML.ky()), nk = dsXep(b.ma, g.ma, k + 1).length;
            return '<td class="so"><input class="o-nhap so" data-bac="' + k + '" value="' + (+v > 0 ? (hs ? App.soHS(v) : App.tien(v)) : '') + '" style="width:100%">' +

      }).join('') : '<tr><td colspan="' + (b.soBac + 5) + '" class="trong">Chưa có chức danh. Thêm ở dưới.</td></tr>') +
      '</tbody></table></div>' +

      '<button class="nut" data-a="themngach">' + App.icon('them') + 'Thêm chức danh</button></div></div>';
