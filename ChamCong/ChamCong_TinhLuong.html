    });
    App.bieuDoNgang(App.$('#bd-pb'), Object.keys(pb).map(function (k) {
      return { nhan: k, phu: pb[k].n + ' NV', gt: pb[k].gt, tip: [['Số nhân viên', pb[k].n], ['Tổng thu nhập', App.tien(pb[k].gt)], ['Thực lĩnh', App.tien(pb[k].net)]] };
    }).sort(function (a, b) { return b.gt - a.gt; }));

    // Tình hình công
    var nhom = { lamTG: 0, sp: 0, phep: 0, le: 0, huong: 0, ngung: 0, bhxh: 0, khong: 0, kp: 0 };
    bl.rows.forEach(function (r) {
      var c = r.cong;
      nhom.lamTG += c.lamTG || 0; nhom.sp += c.sp || 0; nhom.phep += c.phep; nhom.le += c.le; nhom.huong += c.huongKhac; nhom.ngung += c.ngung || 0;
      nhom.bhxh += c.bhxh; nhom.khong += c.khong; nhom.kp += c.kp;
    });
    var tenNhom = Object.assign({}, TL.NHOM_KY_HIEU, { lamTG: 'Đi làm (lương thời gian)', sp: 'Đi làm (lương sản phẩm)' });
    App.bieuDoNgang(App.$('#bd-cong'), Object.keys(nhom).filter(function (k) { return nhom[k] || k === 'lamTG'; }).map(function (k) {
      return { nhan: tenNhom[k], gt: Math.round(nhom[k] * 10) / 10, tip: [['Số ngày công', App.so(nhom[k])]] };
    }), { dinhDang: function (v) { return App.so(v) + ' ngày'; } });

    // Cần chú ý
    var cy = [];
    var hnIso = App.homNay();
    var le = TL.bangNgayLe(db), ngayK = TL.ngayKy(db, y, m);
    var thieu = 0, thieuNV = 0;
    TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
      if (nv.hinhThuc === 'gio') return;
      var n = 0;
      ngayK.forEach(function (x) {
        if (x.iso > hnIso || !TL.nvLamNgay(nv, x.y, x.m, x.d)) return;
        if (TL.loaiNgay(db, x.y, x.m, x.d, le, nv) === 'nghi') return;
        if (!TL.oNgay(db, 'cc', nv.id, x.y, x.m, x.d)) n++;
      });
      if (n) { thieu += n; thieuNV++; }
    });
    if (thieuNV) cy.push(['<a href="#chamcong">' + thieuNV + ' nhân viên còn ô chưa chấm công</a>', '<span class="the-tt cam">' + thieu + ' ô</span>']);
    var canh = bl.rows.filter(function (r) { return r.canhBao && r.canhBao.length; });
    if (canh.length) cy.push(['<a href="#bangluong">' + canh.length + ' nhân viên có lưu ý khi tính lương</a>', '<span class="the-tt cam">Xem</span>']);
    db.nhanVien.forEach(function (nv) {
      if (nv.trangThai === 'nghi_viec') return;
      if (nv.ngaySinh && +nv.ngaySinh.slice(5, 7) === m) cy.push(['🎂 Sinh nhật ' + h(nv.hoTen), '<span class="the-tt lam">' + nv.ngaySinh.slice(8, 10) + '/' + TL.pad(m) + '</span>']);
      if (nv.ngayHetHD) {
        var con = Math.round((new Date(nv.ngayHetHD) - new Date(hnIso)) / 864e5);
        if (con >= 0 && con <= 30) cy.push([(nv.trangThai === 'thu_viec' ? 'Hết thử việc: ' : 'Hết hạn hợp đồng: ') + h(nv.hoTen), '<span class="the-tt ' + (con <= 7 ? 'do' : 'cam') + '">còn ' + con + ' ngày</span>']);
      }
    });
    bl.rows.filter(function (r) { return r.cong.muonLan >= 3; }).sort(function (a, b) { return b.cong.muonPhut - a.cong.muonPhut; }).slice(0, 3).forEach(function (r) {
      cy.push(['Đi muộn / về sớm: ' + h(r.hoTen), '<span class="the-tt do">' + r.cong.muonLan + ' lần · ' + r.cong.muonPhut + ' phút</span>']);
    });
    App.$('#chu-y').innerHTML = cy.length ? cy.map(function (c) { return '<li><span>' + c[0] + '</span>' + c[1] + '</li>'; }).join('') : '<li class="mo">Không có gì cần chú ý.</li>';

    // Hôm nay
    var hnEl = App.$('#hom-nay');
    if (hnEl) {
      var hy = hn.getFullYear(), hm = hn.getMonth() + 1, dd = hn.getDate(), kh = TL.bangKyHieu(db), dem = {}, chua = [], nghiTuan = 0;
      TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
        if (!TL.nvLamNgay(nv, hy, hm, dd)) return;
        var c = TL.oNgay(db, 'cc', nv.id, hy, hm, dd);
        var k = c && kh[String(c).toUpperCase()];
        if (k) dem[k.nhom] = (dem[k.nhom] || 0) + 1;
        else if (TL.loaiNgay(db, hy, hm, dd, le, nv) === 'nghi') nghiTuan++;
        else chua.push(nv.hoTen);
      });
      var loaiHn = (!Object.keys(dem).length && !chua.length) ? 'nghi' : '';
      hnEl.innerHTML = loaiHn === 'nghi' ? '<p class="mo">Hôm nay là ngày nghỉ hằng tuần.</p>' :
        '<div class="hang" style="gap:10px">' + Object.keys(TL.NHOM_KY_HIEU).filter(function (k) { return dem[k]; }).map(function (k) {
          return '<span class="the-tt lam" style="font-size:13px;padding:4px 12px">' + TL.NHOM_KY_HIEU[k] + ': <b>' + dem[k] + '</b></span>';
        }).join('') + (chua.length ? '<span class="the-tt cam" style="font-size:13px;padding:4px 12px" title="' + h(chua.join(', ')) + '">Chưa chấm: <b>' + chua.length + '</b></span>' : '') +
        (nghiTuan ? '<span class="the-tt" style="font-size:13px;padding:4px 12px">Nghỉ hằng tuần: <b>' + nghiTuan + '</b></span>' : '') +
        ' <a class="nut nho" href="#chamcong">Mở bảng chấm công</a></div>';
    }
  }

  function kpi(nhan, gt, phu) {
    return '<div class="kpi"><div class="nhan">' + nhan + '</div><div class="gt">' + gt + '</div><div class="phu">' + (phu || '&nbsp;') + '</div></div>';
  }

  App.trang.dashboard = { ve: ve };
})();

</script>
<script>
/* ===== p-nhanvien.js ===== */
/* Trang Nhân viên: danh sách, thêm / sửa / xoá, nhập – xuất Excel */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, XL = window.XL, h = App.h;

  App.HINH_THUC = { thang: 'Lương tháng', ngay: 'Lương ngày', gio: 'Lương giờ', khoan: 'Lương khoán' };
  App.DV_LUONG = { thang: 'đ/tháng', ngay: 'đ/ngày', gio: 'đ/giờ', khoan: 'đ/tháng' };
  App.TRANG_THAI = { dang_lam: 'Đang làm việc', thu_viec: 'Thử việc', tam_nghi: 'Tạm nghỉ', nghi_viec: 'Đã nghỉ việc' };
  App.CACH_THUE = { luy_tien: 'Lũy tiến từng phần', khau_tru: 'Khấu trừ 10%', khong: 'Không tính thuế' };
  App.LOAI_HD = ['Thử việc', 'Xác định thời hạn', 'Không xác định thời hạn', 'Thời vụ / khoán việc', 'Học việc'];
  App.CACH_PC = { co_dinh: 'Cố định / tháng', theo_cong: 'Theo ngày công', theo_ngay: 'Đơn giá × ngày đi làm' };

  /** Chuẩn hoá ngày nhập (dd/mm/yyyy, yyyy-mm-dd, số Excel) -> 'yyyy-mm-dd' */
  App.chuanNgay = function (v) {
    if (v == null || v === '') return '';
    if (typeof v === 'number') {
      var d = new Date(Date.UTC(1899, 11, 30) + Math.floor(v) * 864e5);
      return TL.iso(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
    }
    var s = String(v).trim().split(/[ T]/)[0], m;
    if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/))) return TL.iso(+m[1], +m[2], +m[3]);
    if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/))) { var y = +m[3]; if (y < 100) y += 2000; return TL.iso(y, +m[2], +m[1]); }
    if (/^\d{5}(\.\d+)?$/.test(s)) return App.chuanNgay(+s);
    return '';
  };

  var loc = { tim: '', pb: '', tt: 'dang' };

  function dsLoc() {
    return App.db.nhanVien.filter(function (nv) {
      if (loc.pb && nv.phongBan !== loc.pb) return false;
      if (loc.tt === 'dang' && nv.trangThai === 'nghi_viec') return false;
      if (loc.tt === 'nghi' && nv.trangThai !== 'nghi_viec') return false;
      if (loc.tim && !App.timKhop(nv.ma + ' ' + nv.hoTen + ' ' + (nv.chucVu || '') + ' ' + (nv.sdt || ''), loc.tim)) return false;
      return true;
    }).sort(function (a, b) { return String(a.ma).localeCompare(String(b.ma), 'vi', { numeric: true }); });
  }

  function ve(noi) {
    var db = App.db;
    noi.innerHTML =
      '<div class="the khong-in"><div class="hang">' +
      '<input type="search" id="nv-tim" placeholder="Tìm mã, tên, chức vụ, SĐT…" value="' + h(loc.tim) + '" style="width:260px">' +
      '<select id="nv-pb"><option value="">Tất cả phòng ban</option>' + db.phongBan.map(function (p) { return '<option value="' + h(p.ma) + '"' + (loc.pb === p.ma ? ' selected' : '') + '>' + h(p.ten) + '</option>'; }).join('') + '</select>' +
      '<select id="nv-tt"><option value="dang"' + (loc.tt === 'dang' ? ' selected' : '') + '>Đang làm việc</option><option value="nghi"' + (loc.tt === 'nghi' ? ' selected' : '') + '>Đã nghỉ việc</option><option value=""' + (loc.tt === '' ? ' selected' : '') + '>Tất cả</option></select>' +
      '<span class="gian"></span>' +
      '<button class="nut" id="nv-nhap">' + App.icon('nhap') + 'Nhập từ Excel</button>' +
      '<button class="nut" id="nv-xuat">' + App.icon('tai') + 'Xuất Excel</button>' +
      '<button class="nut chinh" id="nv-them">' + App.icon('them') + 'Thêm nhân viên</button>' +
      '</div></div>' +
      App.dauIn('DANH SÁCH NHÂN VIÊN', 'Ngày ' + new Date().toLocaleDateString('vi-VN')) +
      '<div class="cuon cao"><table class="bang" id="nv-bang"></table></div>' +
      '<p class="mo nho khong-in">Bấm vào một dòng để xem / sửa. Mức lương theo hình thức trả lương (tháng, ngày hoặc giờ). “Lịch làm” quyết định công chuẩn: T2-T6 ≈ 22 công, T2-T7 ≈ 26 công.</p>';
    veBang();
    App.$('#nv-tim').oninput = function () { loc.tim = this.value; veBang(); };
    App.$('#nv-pb').onchange = function () { loc.pb = this.value; veBang(); };
    App.$('#nv-tt').onchange = function () { loc.tt = this.value; veBang(); };
    App.$('#nv-them').onclick = function () { moForm(null); };
    App.$('#nv-xuat').onclick = xuatExcel;
    App.$('#nv-nhap').onclick = nhapExcel;
    App.$('#nv-bang').onclick = function (e) {
      var tr = e.target.closest('tr[data-id]');
      if (!tr) return;
      var nv = App.db.nhanVien.filter(function (x) { return x.id === tr.dataset.id; })[0];
      if (e.target.closest('.xoa')) { xoaNV(nv); return; }
      moForm(nv);
    };
  }

  function veBang() {
    var ds = dsLoc(), db = App.db;
    var html = '<thead><tr><th>STT</th><th>Mã NV</th><th style="min-width:170px">Họ và tên</th><th>Phòng ban</th><th>Chức vụ</th><th>Ngày vào</th><th>Loại HĐ</th>' +
      '<th>Lịch làm</th><th>Hình thức</th><th class="so">Mức lương</th><th class="so">Lương đóng BH</th><th>NPT</th><th>Trạng thái</th><th class="khong-in"></th></tr></thead><tbody>';
    if (!ds.length) html += '<tr><td colspan="14" class="trong">' + (db.nhanVien.length ? 'Không có nhân viên phù hợp bộ lọc.' : 'Chưa có nhân viên. Bấm “Thêm nhân viên” hoặc “Nhập từ Excel”.') + '</td></tr>';
    ds.forEach(function (nv, i) {
      var tt = nv.trangThai || 'dang_lam';
      var lbh = nv.thamGiaBH ? (+nv.luongBH > 0 ? App.tien(nv.luongBH) : ((nv.hinhThuc || 'thang') === 'thang' || nv.hinhThuc === 'khoan' ? '<span class="mo" title="Lương CB + phụ cấp đóng BH">' + App.tien(luongBHMacDinh(nv)) + '</span>' : '<span class="the-tt cam">Chưa nhập</span>')) : '<span class="mo">Không tham gia</span>';
      html += '<tr data-id="' + nv.id + '" style="cursor:pointer"><td class="giua">' + (i + 1) + '</td><td>' + h(nv.ma) + '</td><td class="ten">' + h(nv.hoTen) + '</td>' +
        '<td>' + h(TL.tenPhongBan(db, nv.phongBan)) + '</td><td>' + h(nv.chucVu) + '</td><td class="giua">' + TL.hienNgay(nv.ngayVao) + '</td><td>' + h(nv.loaiHD || '') + '</td>' +
        '<td class="giua">' + (nv.congChuanRieng ? nv.congChuanRieng + ' công' : (nv.lichLam || '<span class="mo">chung</span>')) + '</td><td>' + (App.HINH_THUC[nv.hinhThuc || 'thang']) + '</td><td class="so">' + App.tien(nv.luongCB) + (nv.tiLeHuong != null && +nv.tiLeHuong !== 100 ? ' <span class="the-tt cam">' + nv.tiLeHuong + '%</span>' : '') + '</td>' +
        '<td class="so">' + lbh + '</td><td class="giua">' + (nv.soNPT || '') + '</td>' +
        '<td><span class="the-tt ' + ({ dang_lam: 'xanh', thu_viec: 'cam', tam_nghi: 'lam', nghi_viec: '' }[tt]) + '">' + App.TRANG_THAI[tt] + '</span></td>' +
        '<td class="khong-in"><button class="nut nho nguy xoa" title="Xoá">' + App.icon('xoa') + '</button></td></tr>';
    });
    html += '</tbody>';
    App.$('#nv-bang').innerHTML = html;
  }

  function luongBHMacDinh(nv) {
    var s = +nv.luongCB || 0;
    App.db.phuCap.forEach(function (pc) { if (pc.dongBH) s += +(nv.phuCap || {})[pc.ma] || 0; });
    return s;
  }

  function maMoi() {
    var max = 0;
    App.db.nhanVien.forEach(function (nv) { var m = String(nv.ma).match(/(\d+)$/); if (m) max = Math.max(max, +m[1]); });
    return 'NV' + String(max + 1).padStart(3, '0');
  }

  /* ---------- Form thêm / sửa ---------- */
  function o(nhan, input, gc, cls) { return '<label class="o ' + (cls || '') + '">' + nhan + input + (gc ? '<span class="gc">' + gc + '</span>' : '') + '</label>'; }
  function txt(ten, v, attr) { return '<input name="' + ten + '" value="' + h(v == null ? '' : v) + '" ' + (attr || '') + '>'; }
  function tien(ten, v) { return '<input name="' + ten + '" class="so tien" inputmode="numeric" value="' + (v ? App.tien(v) : '') + '">'; }
  function sel(ten, v, opts) {
    return '<select name="' + ten + '">' + opts.map(function (x) { var k = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : x; return '<option value="' + h(k) + '"' + (String(v) === String(k) ? ' selected' : '') + '>' + h(t) + '</option>'; }).join('') + '</select>';
  }
  function cap(obj) { return Object.keys(obj).map(function (k) { return [k, obj[k]]; }); }

  function moForm(nv) {
    var db = App.db, moi = !nv;
    var d = nv ? JSON.parse(JSON.stringify(nv)) : {
      id: App.uid(), ma: maMoi(), hoTen: '', gioiTinh: 'Nam', phongBan: db.phongBan[0] ? db.phongBan[0].ma : '', hinhThuc: 'thang', luongCB: 0, tiLeHuong: 100,
      thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien', soNPT: 0, trangThai: 'dang_lam', loaiHD: 'Không xác định thời hạn', ngayVao: App.homNay(), phuCap: {}, phepNam: ''
    };
    var chucVu = {};
    db.nhanVien.forEach(function (x) { if (x.chucVu) chucVu[x.chucVu] = 1; });
    var pc = db.phuCap.map(function (p) {
      return o('Phụ cấp ' + h(p.ten.toLowerCase()), tien('pc_' + p.ma, (d.phuCap || {})[p.ma]), App.CACH_PC[p.cachTinh] + (p.cachTinh === 'theo_ngay' ? ' (nhập đơn giá 1 ngày)' : '') + (p.chiuThue ? '' : ' · không chịu thuế') + (p.dongBH ? ' · tính vào lương đóng BH' : ''));
    }).join('');
    var than = '<form class="form" autocomplete="off" onsubmit="return false">' +
      '<h4>Thông tin chung</h4>' +
      o('Mã nhân viên *', txt('ma', d.ma, 'required')) + o('Mã chấm công (ID trên máy chấm công)', txt('maChamCong', d.maChamCong), 'Dùng để ghép dữ liệu vân tay / thẻ') +
      o('Họ và tên *', txt('hoTen', d.hoTen, 'required'), '', 'ca') +
      o('Giới tính', sel('gioiTinh', d.gioiTinh, ['Nam', 'Nữ', 'Khác'])) + o('Ngày sinh', txt('ngaySinh', d.ngaySinh, 'type="date"')) +
      o('Số CCCD', txt('cccd', d.cccd)) + o('Điện thoại', txt('sdt', d.sdt, 'type="tel"')) +
      o('Email', txt('email', d.email, 'type="email"')) + o('Địa chỉ', txt('diaChi', d.diaChi)) +
      '<h4>Công việc</h4>' +
      o('Phòng ban', sel('phongBan', d.phongBan, [['', '(Chưa chọn)']].concat(db.phongBan.map(function (p) { return [p.ma, p.ten]; }))), '<a href="#danhmuc" data-dong>Thêm phòng ban…</a>') +
      o('Chức vụ', txt('chucVu', d.chucVu, 'list="ds-chucvu"') + '<datalist id="ds-chucvu">' + Object.keys(chucVu).map(function (c) { return '<option value="' + h(c) + '">'; }).join('') + '</datalist>') +
      o('Loại hợp đồng', sel('loaiHD', d.loaiHD, App.LOAI_HD)) + o('Trạng thái', sel('trangThai', d.trangThai, cap(App.TRANG_THAI))) +
      o('Ngày vào làm', txt('ngayVao', d.ngayVao, 'type="date"')) + o('Ngày hết hạn HĐ / thử việc', txt('ngayHetHD', d.ngayHetHD, 'type="date"')) +
      o('Ngày nghỉ việc', txt('ngayNghi', d.ngayNghi, 'type="date"'), 'Ngày làm việc cuối cùng. Sau ngày này không chấm công, không tính lương.') +
      o('Lịch làm việc', sel('lichLam', d.lichLam || '', [['', 'Theo cài đặt chung'], ['T2-T6', 'Thứ 2 – Thứ 6 (nghỉ T7, CN)'], ['T2-T7', 'Thứ 2 – Thứ 7 (nghỉ CN)'], ['T2-CN', 'Cả tuần (trực, bảo vệ…)']]), 'Quyết định công chuẩn: vd T2–T6 thường 22 công, T2–T7 thường 26 công') +
      '<h4>Lương &amp; phụ cấp</h4>' +
      o('Hình thức trả lương', sel('hinhThuc', d.hinhThuc || 'thang', cap(App.HINH_THUC))) +
      o('Mức lương / HĐ <span id="dv-luong">(' + App.DV_LUONG[d.hinhThuc || 'thang'] + ')</span>', tien('luongCB', d.luongCB)) +
      o('Tỷ lệ hưởng lương (%)', txt('tiLeHuong', d.tiLeHuong == null ? 100 : d.tiLeHuong, 'type="number" min="0" max="200" step="1"'), 'Thử việc thường 85%') +
      o('Công chuẩn riêng (ngày)', txt('congChuanRieng', d.congChuanRieng || '', 'type="number" min="0" step="0.5" placeholder="Tự tính theo lịch làm việc"'), 'Chỉ nhập khi người này có công chuẩn cố định, vd 26') +
      o('Đơn giá lương sản phẩm (đ)', tien('donGiaSP', d.donGiaSP), 'Để trống = đơn giá chung ' + App.tien(db.caiDat.donGiaSP) + ' đ / ' + h((db.caiDat.tenSP || 'sản phẩm').toLowerCase())) + '<span></span>' +
      pc +
      '<h4>Bảo hiểm &amp; thuế TNCN</h4>' +
      '<label class="chk"><input type="checkbox" name="thamGiaBH"' + (d.thamGiaBH ? ' checked' : '') + '> Tham gia BHXH, BHYT, BHTN</label>' +
      '<label class="chk"><input type="checkbox" name="doanVien"' + (d.doanVien ? ' checked' : '') + '> Đoàn viên công đoàn (trừ đoàn phí)</label>' +
      o('Lương đóng bảo hiểm', tien('luongBH', d.luongBH), 'Để trống = lương cơ bản + phụ cấp tính đóng BH. Lương ngày/giờ bắt buộc nhập.') +
      o('Cách tính thuế TNCN', sel('cachTinhThue', d.cachTinhThue || 'luy_tien', cap(App.CACH_THUE)), 'HĐ từ 3 tháng: lũy tiến. HĐ dưới 3 tháng / cộng tác viên: khấu trừ 10%.') +
      o('Mã số thuế cá nhân', txt('mst', d.mst)) + o('Số người phụ thuộc', txt('soNPT', d.soNPT || 0, 'type="number" min="0" step="1"')) +
      '<h4>Ngân hàng &amp; phép năm</h4>' +
      o('Ngân hàng', txt('nganHang', d.nganHang)) + o('Số tài khoản', txt('soTK', d.soTK)) +
      o('Số ngày phép năm', txt('phepNam', d.phepNam, 'type="number" min="0" step="0.5" placeholder="' + db.caiDat.phepNam + '"'), 'Để trống = mặc định ' + db.caiDat.phepNam + ' ngày') +
      o('Phép tồn năm trước chuyển sang', txt('phepTon', d.phepTon, 'type="number" min="0" step="0.5"')) +
      o('Ghi chú', '<textarea name="ghiChu">' + h(d.ghiChu || '') + '</textarea>', '', 'ca') +
      '</form>';
    App.hop({
      tieuDe: moi ? 'Thêm nhân viên' : 'Sửa nhân viên: ' + nv.hoTen, co: 'rong', than: than, giu: true,
      moRa: function (el, dong) {
        App.$$('input.tien', el).forEach(ganOTien);
        App.$('[name=hinhThuc]', el).onchange = function () { App.$('#dv-luong', el).textContent = '(' + App.DV_LUONG[this.value] + ')'; };
        App.$('[name=trangThai]', el).onchange = function () {
          if (this.value === 'thu_viec') { App.$('[name=tiLeHuong]', el).value = 85; App.$('[name=loaiHD]', el).value = 'Thử việc'; }
        };
        App.$('[name=ngayNghi]', el).onchange = function () { if (this.value) App.$('[name=trangThai]', el).value = 'nghi_viec'; };
        var a = App.$('[data-dong]', el); if (a) a.onclick = dong;
      },
      nut: [
        { ten: 'Huỷ' },
        {
          ten: moi ? 'Thêm nhân viên' : 'Lưu thay đổi', loai: 'chinh', bam: function (el) {
            var f = App.$('form', el), v = {};
            App.$$('[name]', f).forEach(function (i) { v[i.name] = i.type === 'checkbox' ? i.checked : i.value; });
            v.ma = String(v.ma || '').trim(); v.hoTen = String(v.hoTen || '').trim();
            if (!v.ma || !v.hoTen) { App.bao('Cần nhập mã nhân viên và họ tên.', 'loi'); return false; }
            var trung = App.db.nhanVien.filter(function (x) { return x.id !== d.id && String(x.ma).toLowerCase() === v.ma.toLowerCase(); })[0];
            if (trung) { App.bao('Mã ' + v.ma + ' đã dùng cho ' + trung.hoTen + '.', 'loi'); return false; }
            if (v.maChamCong) {
              var t2 = App.db.nhanVien.filter(function (x) { return x.id !== d.id && x.maChamCong && String(x.maChamCong) === String(v.maChamCong).trim(); })[0];
              if (t2) { App.bao('Mã chấm công ' + v.maChamCong + ' đã dùng cho ' + t2.hoTen + '.', 'loi'); return false; }
            }
            ['luongCB', 'luongBH', 'donGiaSP'].forEach(function (k) { v[k] = App.docSo(v[k]); });
            v.congChuanRieng = v.congChuanRieng === '' ? '' : +v.congChuanRieng;
            v.tiLeHuong = v.tiLeHuong === '' ? 100 : +v.tiLeHuong;
            v.soNPT = +v.soNPT || 0;
            v.phepNam = v.phepNam === '' ? '' : +v.phepNam;
            v.phepTon = v.phepTon === '' ? '' : +v.phepTon;
            v.maChamCong = String(v.maChamCong || '').trim();
            var pcv = {};
            App.db.phuCap.forEach(function (p) { var x = App.docSo(v['pc_' + p.ma]); if (x) pcv[p.ma] = x; delete v['pc_' + p.ma]; });
            v.phuCap = pcv;
            if (v.trangThai === 'nghi_viec' && !v.ngayNghi) { App.bao('Nhân viên đã nghỉ việc: hãy nhập ngày nghỉ việc.', 'loi'); return false; }
            if (v.ngayNghi && v.trangThai !== 'nghi_viec') v.trangThai = 'nghi_viec';
            Object.assign(d, v);
            if (moi) App.db.nhanVien.push(d);
            else Object.assign(nv, d);
            App.luu();
            App.bao(moi ? 'Đã thêm ' + d.hoTen : 'Đã lưu ' + d.hoTen, 'tot');
            veBang();
          }
        }
      ]
    });
  }

  /** Ô nhập tiền: tự thêm dấu chấm ngăn cách hàng nghìn khi rời ô */
  function ganOTien(i) {
    i.addEventListener('blur', function () { var n = App.docSo(i.value); i.value = n ? App.tien(n) : ''; });
    i.addEventListener('focus', function () { setTimeout(function () { i.select(); }, 0); });
  }
  App.ganOTien = ganOTien;

  function xoaNV(nv) {
    var coDL = Object.keys(App.db.thang).some(function (k) { var T = App.db.thang[k]; return (T.cc && T.cc[nv.id] && Object.keys(T.cc[nv.id]).length) || (T.chot && T.chot.rows.some(function (r) { return r.nvId === nv.id; })); });
    var msg = 'Xoá nhân viên <b>' + h(nv.hoTen) + '</b> (' + h(nv.ma) + ')?' + (coDL ? '<br><br><span style="color:var(--do)">Nhân viên này đã có dữ liệu chấm công / lương. Nếu đã nghỉ việc, nên sửa trạng thái thành “Đã nghỉ việc” và nhập ngày nghỉ để giữ lịch sử. Xoá sẽ mất dữ liệu chấm công của người này (bảng lương các tháng đã chốt vẫn giữ).</span>' : '');
    App.xacNhan(msg, { nut: 'Xoá', nguy: true }).then(function (ok) {
      if (!ok) return;
      App.db.nhanVien = App.db.nhanVien.filter(function (x) { return x !== nv; });
      Object.keys(App.db.thang).forEach(function (k) { var T = App.db.thang[k]; ['cc', 'ot', 'muon', 'vr', 'dc'].forEach(function (f) { if (T[f]) delete T[f][nv.id]; }); });
      App.luu(); veBang(); App.bao('Đã xoá ' + nv.hoTen);
    });
  }

  /* ---------- Excel ---------- */
  function cotNV() {
    var c = [
      ['ma', 'Mã NV', 9], ['maChamCong', 'Mã chấm công', 9], ['hoTen', 'Họ và tên', 24], ['gioiTinh', 'Giới tính', 8], ['ngaySinh', 'Ngày sinh', 11, 'ngay'],
      ['cccd', 'Số CCCD', 14], ['sdt', 'Điện thoại', 12], ['email', 'Email', 18], ['diaChi', 'Địa chỉ', 24],
      ['phongBan', 'Phòng ban', 22, 'pb'], ['chucVu', 'Chức vụ', 18], ['loaiHD', 'Loại hợp đồng', 16], ['ngayVao', 'Ngày vào làm', 11, 'ngay'],
      ['ngayHetHD', 'Ngày hết hạn HĐ', 11, 'ngay'], ['trangThai', 'Trạng thái', 13, 'tt'], ['ngayNghi', 'Ngày nghỉ việc', 11, 'ngay'],
      ['lichLam', 'Lịch làm việc', 10, 'lich'], ['congChuanRieng', 'Công chuẩn riêng', 8, 'so'],
      ['hinhThuc', 'Hình thức lương', 13, 'ht'], ['luongCB', 'Mức lương', 13, 'so'], ['tiLeHuong', '% hưởng lương', 8, 'so'], ['donGiaSP', 'Đơn giá SP', 9, 'so'],
      ['luongBH', 'Lương đóng BH', 13, 'so'], ['thamGiaBH', 'Tham gia BH', 8, 'bool'], ['doanVien', 'Đoàn viên CĐ', 8, 'bool'],
      ['cachTinhThue', 'Cách tính thuế', 16, 'thue'], ['mst', 'MST cá nhân', 13], ['soNPT', 'Số người phụ thuộc', 8, 'so'],
      ['nganHang', 'Ngân hàng', 14], ['soTK', 'Số tài khoản', 16], ['phepNam', 'Phép năm', 7, 'so'], ['phepTon', 'Phép tồn', 7, 'so']
    ];
    App.db.phuCap.forEach(function (p) { c.push(['pc:' + p.ma, 'PC ' + p.ten, 12, 'so']); });
    c.push(['ghiChu', 'Ghi chú', 20]);
    return c;
  }
  function giaTriXuat(nv, c) {
    var k = c[0], v = k.indexOf('pc:') === 0 ? (nv.phuCap || {})[k.slice(3)] : nv[k];
    switch (c[3]) {
      case 'ngay': return TL.hienNgay(v);
      case 'pb': return TL.tenPhongBan(App.db, v);
      case 'tt': return App.TRANG_THAI[v || 'dang_lam'];
      case 'ht': return App.HINH_THUC[v || 'thang'];
      case 'thue': return App.CACH_THUE[v || 'luy_tien'];
      case 'bool': return v ? 'x' : '';
      case 'lich': return v || '';
      case 'so': return v === '' || v == null ? '' : +v;
      default: return v == null ? '' : String(v);
    }
  }

  function xuatExcel() {
    var cot = cotNV();
    var ds = dsLoc();
    var sh = App.sheetBang({
      ten: 'Nhân viên', tieuDe: 'DANH SÁCH NHÂN VIÊN', phuDe: 'Ngày ' + new Date().toLocaleDateString('vi-VN') + ' – ' + ds.length + ' người', chuKy: false, coCot: 3,
      cot: [{ t: 'STT', w: 5, stt: true, kieu: 'giua' }].concat(cot.map(function (c) {
        return { t: c[1], w: c[2], kieu: c[3] === 'so' ? 'so' : (c[3] === 'ngay' || c[3] === 'bool' ? 'giua' : 'chu'), f: function (nv) { return giaTriXuat(nv, c); } };
      })),
      dong: ds
    });
    App.xuatExcel('Danh_sach_nhan_vien', [sh]);
  }

  function taiMau() {
    var cot = cotNV();
    var vd = [{
      ma: 'NV001', maChamCong: '1', hoTen: 'Nguyễn Văn A', gioiTinh: 'Nam', ngaySinh: '1990-05-20', phongBan: App.db.phongBan[0] ? App.db.phongBan[0].ma : 'Phòng Kế toán',
      chucVu: 'Nhân viên', loaiHD: 'Không xác định thời hạn', ngayVao: '2024-01-02', trangThai: 'dang_lam', hinhThuc: 'thang', luongCB: 10000000, tiLeHuong: 100,
      thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien', soNPT: 1, phuCap: { AN: 35000 }
    }];
    var dong = [cot.map(function (c) { return { v: c[1], s: App.KIEU.th }; })].concat(vd.map(function (nv) { return cot.map(function (c) { return giaTriXuat(nv, c); }); }));
    App.xuatExcel('Mau_nhap_nhan_vien', [{ ten: 'Nhân viên', dong: dong, cot: cot.map(function (c) { return c[2]; }), co: { r: 1 }, cao: { 0: 32 } }]);
  }

  function khop(a) { return App.boDau(a).toLowerCase().replace(/[^a-z0-9%]/g, ''); }
  function timTheoNhan(map, v) {
    var x = khop(v);
    var ks = Object.keys(map);
    for (var i = 0; i < ks.length; i++) if (khop(map[ks[i]]) === x || khop(ks[i]) === x) return ks[i];
    for (i = 0; i < ks.length; i++) if (x && khop(map[ks[i]]).indexOf(x) >= 0) return ks[i];
    return null;
  }

  function nhapExcel() {
    App.hop({
      tieuDe: 'Nhập nhân viên từ Excel', co: '',
      than: '<p>Chọn file <b>.xlsx</b> hoặc <b>.csv</b> có dòng tiêu đề (Mã NV, Họ và tên, Phòng ban, Lương cơ bản…). ' +
        'Nhân viên trùng <b>Mã NV</b> sẽ được cập nhật, mã mới sẽ được thêm. Phòng ban chưa có sẽ được tự tạo.</p>' +
        '<div class="hang"><input type="file" id="f-nv" accept=".xlsx,.csv,.txt"><button class="nut" id="tai-mau">' + App.icon('tai') + 'Tải file mẫu</button></div>' +
        '<div id="kq-nv" style="margin-top:12px"></div>',
      moRa: function (el, dong) {
        App.$('#tai-mau', el).onclick = taiMau;
        App.$('#f-nv', el).onchange = function () {
          var f = this.files[0]; if (!f) return;
          XL.docFile(f).then(function (sheets) { xuLyNhap(sheets[0].dong, el, dong); }).catch(function (e) { App.bao(e.message, 'loi'); });
        };
      },
      nut: [{ ten: 'Đóng' }]
    });
  }

  function xuLyNhap(rows, el, dongHop) {
    var cot = cotNV();
    // tìm dòng tiêu đề
    var hd = -1;
    for (var i = 0; i < Math.min(rows.length, 15); i++) {
      var r = (rows[i] || []).map(khop);
      if (r.some(function (c) { return c.indexOf('hovaten') >= 0 || c === 'hoten'; })) { hd = i; break; }
    }
    if (hd < 0) { App.$('#kq-nv', el).innerHTML = '<div class="canh-bao">Không tìm thấy dòng tiêu đề có cột “Họ và tên”.</div>'; return; }
    var map = {};
    (rows[hd] || []).forEach(function (t, ci) {
      var k = khop(t);
      if (!k) return;
      cot.forEach(function (c) { if (khop(c[1]) === k || khop(c[0]) === k) map[ci] = c; });
      if (!map[ci]) {
        if (k === 'ma' || k === 'manhanvien') map[ci] = cot[0];
        else if (k === 'hoten') map[ci] = cot[2];
        else if (k.indexOf('phucap') === 0 || k.indexOf('pc') === 0) {
          var ten = k.replace(/^phucap|^pc/, '');
          App.db.phuCap.forEach(function (p) { if (khop(p.ten) === ten || khop(p.ma) === ten) map[ci] = ['pc:' + p.ma, 'PC ' + p.ten, 12, 'so']; });
        }
      }
    });
    var moi = [], capNhat = [], loi = [], pbMoi = {};
    rows.slice(hd + 1).forEach(function (r, ri) {
      if (!r || !r.some(function (x) { return x != null && String(x).trim() !== ''; })) return;
      var v = { phuCap: {} };
      Object.keys(map).forEach(function (ci) {
        var c = map[ci], raw = r[ci], k = c[0];
        if (raw == null || String(raw).trim() === '') return;
        var val;
        switch (c[3]) {
          case 'ngay': val = App.chuanNgay(raw); break;
          case 'so': val = App.docSo(raw); break;
          case 'bool': val = /^(x|có|co|1|true|yes|v)$/i.test(String(raw).trim()); break;
          case 'lich': val = /t2\s*-\s*t6|thu 2.*thu 6|5 ngay/i.test(App.boDau(raw)) ? 'T2-T6' : /t2\s*-\s*t7|thu 2.*thu 7|6 ngay/i.test(App.boDau(raw)) ? 'T2-T7' : /cn|ca tuan/i.test(App.boDau(raw)) ? 'T2-CN' : ''; break;
          case 'tt': val = timTheoNhan(App.TRANG_THAI, raw) || 'dang_lam'; break;
          case 'ht': val = timTheoNhan(App.HINH_THUC, raw) || (/ngay|ngày/i.test(raw) ? 'ngay' : /gio|giờ/i.test(raw) ? 'gio' : 'thang'); break;
          case 'thue': val = /10|khau|khấu/i.test(raw) ? 'khau_tru' : /khong|không/i.test(raw) ? 'khong' : 'luy_tien'; break;
          case 'pb':
            var s = String(raw).trim(), pb = App.db.phongBan.filter(function (p) { return khop(p.ten) === khop(s) || khop(p.ma) === khop(s); })[0];
            if (!pb) { pb = pbMoi[khop(s)] || { ma: 'PB' + (App.db.phongBan.length + Object.keys(pbMoi).length + 1), ten: s }; pbMoi[khop(s)] = pb; }
            val = pb.ma; break;
          default: val = String(raw).trim();
        }
        if (k.indexOf('pc:') === 0) { if (val) v.phuCap[k.slice(3)] = val; } else v[k] = val;
      });
      if (!v.hoTen) { loi.push('Dòng ' + (hd + ri + 2) + ': thiếu họ tên'); return; }
      var cu = v.ma ? App.db.nhanVien.filter(function (x) { return String(x.ma).toLowerCase() === String(v.ma).toLowerCase(); })[0] : null;
      if (cu) capNhat.push([cu, v]); else moi.push(v);
    });
    App.$('#kq-nv', el).innerHTML = '<div class="goi-y">Đọc được <b>' + (moi.length + capNhat.length) + '</b> nhân viên: <b>' + moi.length + '</b> thêm mới, <b>' + capNhat.length + '</b> cập nhật' +
      (Object.keys(pbMoi).length ? ', tạo ' + Object.keys(pbMoi).length + ' phòng ban mới' : '') + '.' +
      (loi.length ? '<br><span style="color:var(--do)">' + loi.slice(0, 5).map(h).join('<br>') + (loi.length > 5 ? '<br>…' : '') + '</span>' : '') +
      '</div><div class="hang" style="margin-top:10px"><span class="gian"></span><button class="nut chinh" id="xn-nhap"' + (moi.length + capNhat.length ? '' : ' disabled') + '>Nhập vào phần mềm</button></div>';
    var b = App.$('#xn-nhap', el);
    if (b) b.onclick = function () {
      Object.keys(pbMoi).forEach(function (k) { App.db.phongBan.push(pbMoi[k]); });
      capNhat.forEach(function (x) { var pcCu = x[0].phuCap || {}; Object.assign(x[0], x[1]); x[0].phuCap = Object.assign({}, pcCu, x[1].phuCap); });
      moi.forEach(function (v) {
        App.db.nhanVien.push(Object.assign({
          id: App.uid(), ma: v.ma || maMoi(), hinhThuc: 'thang', tiLeHuong: 100, thamGiaBH: true, doanVien: false, cachTinhThue: 'luy_tien',
          soNPT: 0, trangThai: 'dang_lam', phuCap: {}
        }, v, { ma: v.ma || maMoi() }));
      });
      App.luu();
      App.bao('Đã nhập ' + (moi.length + capNhat.length) + ' nhân viên.', 'tot');
      dongHop();
      App.veLai();
    };
  }

  App.trang.nhanvien = { ve: ve, khongKy: true };
})();

</script>
<script>
/* ===== p-chamcong.js ===== */
/* Trang Bảng chấm công: lưới nhân viên × ngày của kỳ công, chấm bằng chuột / bàn phím, dán từ Excel,
   xuất Excel theo mẫu 01a-LĐTL. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;

  var CHE = {
    kh: { ten: 'Ký hiệu công', kho: 'cc' },
    ot: { ten: 'Làm thêm (giờ)', kho: 'ot' },
    muon: { ten: 'Đi muộn / về sớm (phút)', kho: 'muon' }
  };
  var st = { che: 'kh', pb: '', tim: '', anc: null, act: null, sel: null, keo: false, undo: [], kyUndo: '' };
  var C = null; // ngữ cảnh đang hiển thị
  var oSua = null;

  /** Các cột tổng hợp ("quy ra công") theo chế độ xem */
  function cotTong(che, coSP) {
    if (che === 'ot') return [['otThuong', 'Ngày thường'], ['otNghi', 'Ngày nghỉ'], ['otLe', 'Ngày lễ'], ['otTong', 'Tổng giờ', 1]];
    if (che === 'muon') return [['muonLan', 'Số lần'], ['muonPhut', 'Số phút', 1]];
    var c = [['congChuan', 'Công chuẩn']];
    if (coSP) c.push(['sp', 'Công lương SP']);
    c.push(['congTG', 'Công lương thời gian', 1], ['ngayLamThucTe', 'Ngày làm (cơm)'], ['ngung', 'Nghỉ hưởng 100% lương'], ['khongHL', 'Nghỉ không lương'], ['bhxh', 'Hưởng BHXH']);
    return c;
  }
  function giaTriTong(th, k) { return k === 'khongHL' ? Math.round((th.khong + th.kp) * 100) / 100 : th[k]; }

  function ve(noi) {
    var db = App.db, y = App.ky.y, m = App.ky.m, key = TL.khoaKy(y, m);
    if (st.kyUndo !== key) { st.undo = []; st.kyUndo = key; st.sel = st.act = st.anc = null; }
    var khoa = App.thangKhoa();
    var ngay = TL.ngayKy(db, y, m), le = TL.bangNgayLe(db);
    var rows = TL.dsNhanVienKy(db, y, m).filter(function (nv) {
      if (st.pb && nv.phongBan !== st.pb) return false;
      if (st.tim && !App.timKhop(nv.ma + ' ' + nv.hoTen, st.tim)) return false;
      return true;
    });
    C = {
      y: y, m: m, ngay: ngay, n: ngay.length, le: le, rows: rows, kh: TL.bangKyHieu(db), khoa: khoa, hn: App.homNay(),
      cc: TL.congChuan(db, y, m), coSP: db.kyHieu.some(function (k) { return k.sp; }),
      loaiChung: ngay.map(function (x) { return TL.loaiNgay(db, x.y, x.m, x.d, le); })
    };
    var cd = db.caiDat;

    var kyHieuNut = db.kyHieu.map(function (k) {
      return '<button data-k="' + h(k.ma) + '" title="' + h(k.ten) + '" style="background:var(--k-' + k.nhom + ')"' + (k.nhom === 'kp' ? ' class="n-kp"' : '') + '>' + h(k.ma) + '</button>';
    }).join('') + '<button class="xoa" data-k="" title="Xoá ô đang chọn (phím Delete)">Xoá</button>';

    noi.innerHTML =
      (khoa ? '<div class="canh-bao khong-in" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1">Kỳ lương tháng ' + m + '/' + y + ' đã <b>chốt</b> nên không sửa được chấm công.</span><button class="nut" id="cc-mokhoa">' + App.icon('mo') + 'Mở khoá để sửa</button></div>' : '') +
      '<div class="the khong-in" style="padding:12px 14px"><div class="cc-cong">' +
      '<div class="nut-nhom" id="cc-che">' + Object.keys(CHE).map(function (k) { return '<button class="nut' + (st.che === k ? ' chon' : '') + '" data-che="' + k + '">' + CHE[k].ten + '</button>'; }).join('') + '</div>' +
      '<select id="cc-pb"><option value="">Tất cả bộ phận</option>' + db.phongBan.map(function (p) { return '<option value="' + h(p.ma) + '"' + (st.pb === p.ma ? ' selected' : '') + '>' + h(p.ten) + '</option>'; }).join('') + '</select>' +
      '<input type="search" id="cc-tim" placeholder="Tìm nhân viên…" value="' + h(st.tim) + '" style="width:170px">' +
      '<span class="gian"></span>' +
      '<button class="nut" id="cc-du"' + (khoa ? ' disabled' : '') + '>' + App.icon('dien') + 'Chấm đủ công…</button>' +
      '<button class="nut" id="cc-undo" title="Hoàn tác (Ctrl+Z)"' + (st.undo.length ? '' : ' disabled') + '>' + App.icon('hoantac') + 'Hoàn tác</button>' +
      '<button class="nut" id="cc-xuat">' + App.icon('tai') + 'Xuất Excel (mẫu 01a)</button>' +
      '<button class="nut" id="cc-in">' + App.icon('in') + 'In</button>' +
      '</div>' +
      (st.che === 'kh' ? '<div class="bang-mau" id="cc-mau">' + kyHieuNut + '</div>' : '') +
      '<div class="mo nho" style="margin-top:8px">Kỳ công: <b>' + TL.hienNgay(ngay[0].iso) + ' – ' + TL.hienNgay(ngay[ngay.length - 1].iso) + '</b>. ' + (st.che === 'kh'
        ? 'Chọn ô (kéo chuột để chọn nhiều ô, nhiều người) rồi bấm ký hiệu ở trên. Hoặc gõ ký hiệu trên bàn phím (vd <b>+</b> hoặc <b>x</b>, <b>sp</b>, <b>p</b>, <b>o</b> = Ô) rồi Enter. Dán được vùng ký hiệu từ Excel (Ctrl+V).'
        : 'Chọn ô rồi gõ số ' + (st.che === 'ot' ? 'giờ làm thêm (vd 2 hoặc 1,5). Hệ số theo loại ngày: thường ' + cd.heSoOT.thuong + '%, nghỉ tuần ' + cd.heSoOT.nghi + '%, lễ ' + cd.heSoOT.le + '%.' : 'phút đi muộn / về sớm của ngày đó.') + ' Enter để xuống dòng, Delete để xoá.') +
      '</div></div>' +
      App.dauIn(st.che === 'kh' ? 'BẢNG CHẤM CÔNG' : st.che === 'ot' ? 'BẢNG CHẤM CÔNG LÀM THÊM GIỜ' : 'BẢNG THEO DÕI ĐI MUỘN / VỀ SỚM',
        'Tháng ' + m + ' năm ' + y + ' (từ ' + TL.hienNgay(ngay[0].iso) + ' đến ' + TL.hienNgay(ngay[ngay.length - 1].iso) + ')' + (st.pb ? ' – Bộ phận: ' + TL.tenPhongBan(db, st.pb) : '')) +
      '<div class="cuon cao" id="cc-cuon" style="position:relative"><table class="cc" id="cc-bang"></table></div>' +
      '<div class="chu-giai">' + (st.che === 'kh' ? db.kyHieu.map(function (k) { return '<span><b style="background:var(--k-' + k.nhom + ')">' + h(k.ma) + '</b>' + h(k.ten) + '</span>'; }).join('') : '') +
      '<span><b style="background:var(--ngay-nghi)">&nbsp;</b>Ngày nghỉ hằng tuần (theo lịch từng người)</span><span><b style="background:var(--ngay-le)">&nbsp;</b>Ngày lễ</span>' +
      '<span><b style="background:repeating-linear-gradient(45deg,#f5f6f8,#f5f6f8 4px,#eceef2 4px,#eceef2 8px)">&nbsp;</b>Chưa vào làm / đã nghỉ việc</span></div>' +
      App.kyIn();

    veBang();

    App.$('#cc-che').onclick = function (e) { var b = e.target.closest('[data-che]'); if (b) { huySua(); st.che = b.dataset.che; App.veLai(); } };
    App.$('#cc-pb').onchange = function () { st.pb = this.value; st.sel = st.act = null; App.veLai(); };
    App.$('#cc-tim').oninput = function () { st.tim = this.value; st.sel = st.act = null; var v = this.value; App.veLai(); var i = App.$('#cc-tim'); i.focus(); i.setSelectionRange(v.length, v.length); };
    var mau = App.$('#cc-mau');
    if (mau) mau.onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) ganChon(b.dataset.k); };
    App.$('#cc-du').onclick = chamDu;
    App.$('#cc-undo').onclick = hoanTac;
    App.$('#cc-xuat').onclick = xuatExcel;
    App.$('#cc-in').onclick = function () { App.inTrang(); };
    var mk = App.$('#cc-mokhoa');
    if (mk) mk.onclick = function () { App.moKhoa(); };
    var bang = App.$('#cc-bang');
    bang.addEventListener('mousedown', chuotXuong);
    bang.addEventListener('mouseover', chuotQua);
    bang.addEventListener('dblclick', function (e) { var td = e.target.closest('td.d'); if (td && !C.khoa) batDauSua(''); });
    App.$('#cc-cuon').addEventListener('scroll', function () { if (oSua) xongSua(true); });
  }

  /* ---------- Vẽ lưới ---------- */
  function giaTri(nv, i) { var x = C.ngay[i]; return TL.oNgay(App.db, CHE[st.che].kho, nv.id, x.y, x.m, x.d); }
  function lop(loai) { return loai === 'le' ? 'le' : loai === 'nghi' ? 'wk' : ''; }

  /** Nhóm các ngày của kỳ theo tháng dương lịch: [{ten, so}] */
  function bangThang() {
    var ds = [];
    C.ngay.forEach(function (x) {
      var t = 'Tháng ' + TL.pad(x.m) + '/' + x.y;
      if (!ds.length || ds[ds.length - 1].ten !== t) ds.push({ ten: t, so: 0 });
      ds[ds.length - 1].so++;
    });
    return ds;
  }

  function veBang() {
    var db = App.db, n = C.n, che = st.che;
    var tong = cotTong(che, C.coSP);
    var bt = bangThang(), coBang = bt.length > 1;
    var top1 = coBang ? 22 : 0, top2 = top1 + 24;
    var rs = coBang ? 3 : 2;
    var s = '<thead>';
    if (coBang) {
      s += '<tr><th class="i dinh1" rowspan="3" style="top:0">STT</th><th class="i dinh2" rowspan="3" style="top:0">Mã NV</th><th class="i dinh3" rowspan="3" style="top:0;text-align:left;padding-left:6px">Họ và tên</th>';
      bt.forEach(function (b, i) { s += '<th colspan="' + b.so + '" style="top:0;height:22px;background:' + (i % 2 ? '#fdf3d8' : '#fbe5dc') + '">' + b.ten + '</th>'; });
      tong.forEach(function (t) { s += '<th class="t" rowspan="3" style="top:0' + (t[2] ? ';color:var(--chinh-dam)' : '') + '">' + t[1] + '</th>'; });
      s += '</tr><tr>';
    } else {
      s += '<tr><th class="i dinh1" rowspan="2">STT</th><th class="i dinh2" rowspan="2">Mã NV</th><th class="i dinh3" rowspan="2" style="text-align:left;padding-left:6px">Họ và tên</th>';
    }
    C.ngay.forEach(function (x, i) {
      s += '<th class="d ' + lop(C.loaiChung[i]) + (x.iso === C.hn ? ' hn' : '') + '" style="top:' + top1 + 'px"' + (C.le[x.iso] ? ' title="' + h(C.le[x.iso]) + '"' : '') + '>' + TL.pad(x.d) + '</th>';
    });
    if (!coBang) tong.forEach(function (t) { s += '<th class="t" rowspan="2"' + (t[2] ? ' style="color:var(--chinh-dam)"' : '') + '>' + t[1] + '</th>'; });
    s += '</tr><tr>';
    C.ngay.forEach(function (x, i) { s += '<th class="d ' + lop(C.loaiChung[i]) + '" style="top:' + top2 + 'px">' + TL.TEN_THU[TL.thuTrongTuan(x.y, x.m, x.d)] + '</th>'; });
    s += '</tr></thead><tbody>';
    var chan = C.ngay.map(function () { return 0; });
    var ctx = { kh: C.kh, le: C.le, ngay: C.ngay };
    C.rows.forEach(function (nv, r) {
      var th = TL.tongHopCong(db, C.y, C.m, nv, ctx);
      s += '<tr><td class="i stt dinh1">' + (r + 1) + '</td><td class="i dinh2">' + h(nv.ma) + '</td><td class="i dinh3" title="' + h(nv.hoTen + (nv.chucVu ? ' – ' + nv.chucVu : '')) + '">' + h(nv.hoTen) + '</td>';
      C.ngay.forEach(function (x, i) {
        var lam = TL.nvLamNgay(nv, x.y, x.m, x.d);
        var v = giaTri(nv, i), cls = 'd ' + lop(TL.loaiNgay(db, x.y, x.m, x.d, C.le, nv)), txt = '';
        if (!lam) cls += ' ngoai';
        if (v != null && v !== '') {
          if (che === 'kh') {
            var k = C.kh[String(v).toUpperCase()];
            cls += k ? ' n-' + k.nhom : ' n-sai';
            txt = h(v);
            if (k && k.lam > 0) chan[i]++;
          } else { txt = App.so(v); cls += che === 'ot' ? ' so-ot' : ' so-muon'; chan[i] += +v || 0; }
        }
        s += '<td class="' + cls + '" data-r="' + r + '" data-i="' + i + '">' + txt + '</td>';
      });
      tong.forEach(function (t) { var val = giaTriTong(th, t[0]); s += '<td class="t' + (t[2] ? ' dam' : '') + '">' + (val ? App.so(val) : '') + '</td>'; });
      s += '</tr>';
    });
    if (!C.rows.length) s += '<tr><td colspan="' + (n + 3 + tong.length) + '" class="trong" style="height:80px">Không có nhân viên trong kỳ này. <a href="#nhanvien">Thêm nhân viên</a></td></tr>';
    s += '</tbody>';
    if (C.rows.length) {
      s += '<tfoot><tr><td class="i dinh1"></td><td class="i dinh2"></td><td class="i dinh3">' + (che === 'kh' ? 'Số người đi làm' : che === 'ot' ? 'Tổng giờ làm thêm' : 'Tổng phút') + '</td>';
      C.ngay.forEach(function (x, i) { s += '<td class="d ' + lop(C.loaiChung[i]) + '">' + (chan[i] ? App.so(chan[i]) : '') + '</td>'; });
      tong.forEach(function () { s += '<td class="t"></td>'; });
      s += '</tr></tfoot>';
    }
    var bang = App.$('#cc-bang');
    bang.innerHTML = s;
    C.o = [];
    App.$$('td.d[data-r]', bang).forEach(function (td) { var r = +td.dataset.r; (C.o[r] = C.o[r] || [])[+td.dataset.i] = td; });
    toChon();
    var u = App.$('#cc-undo'); if (u) u.disabled = !st.undo.length;
  }

  /* ---------- Chọn ô ---------- */
  function toChon() {
    App.$$('#cc-bang td.sel, #cc-bang td.act').forEach(function (td) { td.classList.remove('sel', 'act'); });
    if (!st.sel || !C.o) return;
    var s = st.sel;
    for (var r = s.r0; r <= s.r1; r++) for (var i = s.i0; i <= s.i1; i++) { var td = C.o[r] && C.o[r][i]; if (td) td.classList.add('sel'); }
    if (st.act && C.o[st.act.r] && C.o[st.act.r][st.act.i]) C.o[st.act.r][st.act.i].classList.add('act');
  }
  function vung(a, b) { return { r0: Math.min(a.r, b.r), r1: Math.max(a.r, b.r), i0: Math.min(a.i, b.i), i1: Math.max(a.i, b.i) }; }
  function chon(o, mo) {
    o = { r: Math.max(0, Math.min(C.rows.length - 1, o.r)), i: Math.max(0, Math.min(C.n - 1, o.i)) };
    st.act = o;
    if (!mo || !st.anc) st.anc = o;
    st.sel = vung(st.anc, o);
    toChon();
    var td = C.o[o.r] && C.o[o.r][o.i];
    if (td) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function chuotXuong(e) {
    var td = e.target.closest('td.d[data-r]');
    if (!td || e.button !== 0) return;
    if (oSua) xongSua(true);
    e.preventDefault();
    chon({ r: +td.dataset.r, i: +td.dataset.i }, e.shiftKey);
    st.keo = true;
  }
  function chuotQua(e) {
    if (!st.keo) return;
    var td = e.target.closest('td.d[data-r]');
    if (!td) return;
    st.act = { r: +td.dataset.r, i: +td.dataset.i };
    st.sel = vung(st.anc, st.act);
    toChon();
  }
  document.addEventListener('mouseup', function () { st.keo = false; });

  /* ---------- Ghi dữ liệu ---------- */
  function chuanKyHieu(s) {
    s = String(s == null ? '' : s).trim();
    if (!s) return '';
    var cd = App.db.caiDat;
    var up = s.toUpperCase();
    if (C.kh[up]) return C.kh[up].ma;
    var bd = App.boDau(s).toUpperCase().replace(/\s+/g, '');
    var ks = App.db.kyHieu;
    for (var i = 0; i < ks.length; i++) if (App.boDau(ks[i].ma).toUpperCase() === bd) return ks[i].ma;
    var diLam = cd.khDiLam || '+', nua = cd.khNuaNgay || '+/2';
    if (/^(X|V|1|\+|=)$/.test(bd) && C.kh[diLam.toUpperCase()]) return C.kh[diLam.toUpperCase()].ma;
    if (/^(X\/2|0[.,]5|1\/2|\/2|\+2|N2)$/.test(bd) && C.kh[nua.toUpperCase()]) return C.kh[nua.toUpperCase()].ma;
    return null;
  }
  function chuanGiaTri(raw) {
    if (st.che === 'kh') return chuanKyHieu(raw);
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    var n = App.docSo(s);
    if (isNaN(n) || n < 0) return null;
    return n || '';
  }
  /** ghi danh sách [{r, i, v}] – v đã chuẩn hoá ('' = xoá) */
  function ghi(ds, che) {
    if (C.khoa) { App.bao('Kỳ lương đã chốt, không sửa được.', 'loi'); return 0; }
    var kho = CHE[che || st.che].kho, doi = [];
    ds.forEach(function (z) {
      var nv = C.rows[z.r], x = C.ngay[z.i];
      if (!nv || !x || !TL.nvLamNgay(nv, x.y, x.m, x.d)) return;
      var T = TL.thang(App.db, x.y, x.m, true);
      var o = T[kho][nv.id] || (T[kho][nv.id] = {});
      var cu = o[x.d] == null ? '' : o[x.d];
      if (String(cu) === String(z.v)) return;
      doi.push({ id: nv.id, y: x.y, m: x.m, d: x.d, cu: cu, moi: z.v });
      if (z.v === '' || z.v == null) delete o[x.d]; else o[x.d] = z.v;
    });
    if (!doi.length) return 0;
    st.undo.push({ kho: kho, ds: doi });
    if (st.undo.length > 100) st.undo.shift();
    App.luu();
    veBang();
    return doi.length;
  }
  function ganChon(v) {
    if (!st.sel) { App.bao('Hãy chọn ô cần chấm trước (bấm hoặc kéo chuột trên lưới).'); return; }
    var ds = [], s = st.sel;
    for (var r = s.r0; r <= s.r1; r++) for (var i = s.i0; i <= s.i1; i++) ds.push({ r: r, i: i, v: v });
    ghi(ds);
  }
  function hoanTac() {
    var u = st.undo.pop();
    if (!u) return;
    u.ds.forEach(function (x) {
      var T = TL.thang(App.db, x.y, x.m, true);
      var o = T[u.kho][x.id] || (T[u.kho][x.id] = {});
      if (x.cu === '' || x.cu == null) delete o[x.d]; else o[x.d] = x.cu;
    });
    App.luu(); veBang();
  }

  /* ---------- Sửa trực tiếp ---------- */
  function batDauSua(kyTu) {
    if (!st.act || C.khoa) return;
    var td = C.o[st.act.r] && C.o[st.act.r][st.act.i];
    if (!td || td.classList.contains('ngoai')) return;
    huySua();
    var rc = td.getBoundingClientRect();
    var i = document.createElement('input');
    i.className = 'o-sua';
    i.style.position = 'fixed';
    i.style.left = rc.left + 'px'; i.style.top = rc.top + 'px'; i.style.width = Math.max(rc.width, 46) + 'px'; i.style.height = rc.height + 'px';
    var cu = giaTri(C.rows[st.act.r], st.act.i);
    i.value = kyTu !== '' ? kyTu : (cu == null ? '' : String(cu).replace('.', ','));
    document.body.appendChild(i);
    oSua = { el: i, r: st.act.r, i: st.act.i };
    i.focus();
    if (kyTu === '') i.select();
    i.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); xongSua(true, 1, 0); }
      else if (e.key === 'Tab') { e.preventDefault(); xongSua(true, 0, e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); huySua(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); xongSua(true, e.key === 'ArrowDown' ? 1 : -1, 0); }
      e.stopPropagation();
    });
    i.addEventListener('blur', function () { if (oSua && oSua.el === i) xongSua(true); });
  }
  function huySua() { if (oSua) { var e = oSua.el; oSua = null; e.remove(); } }
  function xongSua(luu, dr, di) {
    if (!oSua) return;
    var x = oSua; oSua = null;
    var raw = x.el.value;
    x.el.remove();
    if (luu) {
      var v = chuanGiaTri(raw);
      if (v === null) App.bao(st.che === 'kh' ? 'Ký hiệu “' + raw + '” chưa có trong danh mục (xem Danh mục → Ký hiệu chấm công).' : 'Giá trị không hợp lệ: ' + raw, 'loi');
      else ghi([{ r: x.r, i: x.i, v: v }]);
    }
    if (dr || di) chon({ r: x.r + (dr || 0), i: x.i + (di || 0) });
  }

  /* ---------- Bàn phím, sao chép, dán ---------- */
  function dangHoatDong() {
    return App.trangHienTai === 'chamcong' && C && !App.$('.mo-nen') && !oSua;
  }
  document.addEventListener('keydown', function (e) {
    if (!dangHoatDong() || !st.act) return;
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA')) return;
    var k = e.key, a = st.act;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); hoanTac(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === 'a' || k === 'A')) { e.preventDefault(); st.anc = { r: 0, i: 0 }; st.act = { r: C.rows.length - 1, i: C.n - 1 }; st.sel = vung(st.anc, st.act); toChon(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0], Tab: [0, e.shiftKey ? -1 : 1] }[k];
    if (mv) { e.preventDefault(); chon({ r: a.r + mv[0], i: a.i + mv[1] }, e.shiftKey && k !== 'Tab'); return; }
    if (k === 'Home') { e.preventDefault(); chon({ r: a.r, i: 0 }, e.shiftKey); return; }
    if (k === 'End') { e.preventDefault(); chon({ r: a.r, i: C.n - 1 }, e.shiftKey); return; }
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); ganChon(''); return; }
    if (k === 'Enter' || k === 'F2') { e.preventDefault(); batDauSua(''); return; }
    if (k.length === 1 && /\S/.test(k)) {
      e.preventDefault();
      // chọn nhiều ô + gõ 1 phím trùng ký hiệu => gán luôn cho cả vùng
      if (st.sel && (st.sel.r0 !== st.sel.r1 || st.sel.i0 !== st.sel.i1)) {
        var v = chuanGiaTri(k);
        if (v !== null && st.che === 'kh') { ganChon(v); return; }
      }
      batDauSua(k);
    }
  });
  document.addEventListener('copy', function (e) {
    if (!dangHoatDong() || !st.sel) return;
    var tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    var s = st.sel, lines = [];
    for (var r = s.r0; r <= s.r1; r++) {
      var l = [];
      for (var i = s.i0; i <= s.i1; i++) { var v = giaTri(C.rows[r], i); l.push(v == null ? '' : st.che === 'kh' ? v : String(v).replace('.', ',')); }
      lines.push(l.join('\t'));
    }
    e.clipboardData.setData('text/plain', lines.join('\r\n'));
    e.preventDefault();
    App.bao('Đã sao chép ' + ((s.r1 - s.r0 + 1) * (s.i1 - s.i0 + 1)) + ' ô');
  });
  document.addEventListener('paste', function (e) {
    if (!dangHoatDong() || !st.act) return;
    var tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    var txt = (e.clipboardData || window.clipboardData).getData('text');
    if (!txt) return;
    e.preventDefault();
    var lines = txt.replace(/\r/g, '').replace(/\n$/, '').split('\n');
    var s0 = st.sel || { r0: st.act.r, i0: st.act.i };
    var ds = [], sai = 0;
    if (lines.length === 1 && lines[0].indexOf('\t') < 0 && st.sel) {
      var v1 = chuanGiaTri(lines[0]);
      if (v1 === null) { App.bao('Giá trị không hợp lệ: ' + lines[0], 'loi'); return; }
      ganChon(v1); return;
    }
    lines.forEach(function (l, a) {
      l.split('\t').forEach(function (c, b) {
        var r = s0.r0 + a, i = s0.i0 + b;
        if (r >= C.rows.length || i >= C.n) return;
        var v = chuanGiaTri(c);
        if (v === null) { sai++; return; }
        ds.push({ r: r, i: i, v: v });
      });
    });
    ghi(ds);

<script>
/* ===== p-vaora.js ===== */
/* Trang Giờ vào / ra: nhập file từ máy chấm công (vân tay, thẻ, khuôn mặt), tính công – muộn – làm thêm */

  function docThoiDiem(v) { // -> {ngay:'yyyy-mm-dd'|'', gio:[phút,...]}
    var kq = { ngay: '', gio: [] };
    if (v == null || v === '') return kq;
    if (typeof v === 'number') {
      if (v >= 1) kq.ngay = App.chuanNgay(v);
      var p = Math.round((v - Math.floor(v)) * 1440);
      if (p > 0 || v < 1) kq.gio.push(p % 1440);
      return kq;
    }
    var s = String(v).trim(), m;
    if ((m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) kq.ngay = TL.iso(+m[1], +m[2], +m[3]);
    else if ((m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { var y = +m[3]; if (y < 100) y += 2000; kq.ngay = TL.iso(y, +m[2], +m[1]); }
    else if (/^\d{5}(\.\d+)?$/.test(s)) return docThoiDiem(+s);
    var re = /(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|SA|CH)?/gi, g;
    while ((g = re.exec(s))) {
      var hh = +g[1], mm = +g[2], ap = (g[3] || '').toUpperCase();
      if ((ap === 'PM' || ap === 'CH') && hh < 12) hh += 12;
      if ((ap === 'AM' || ap === 'SA') && hh === 12) hh = 0;
      if (hh < 24 && mm < 60) kq.gio.push(hh * 60 + mm);

    if (!kq.gio.length && /^0?\.\d+$/.test(s)) kq.gio.push(Math.round(+s * 1440));

  }
