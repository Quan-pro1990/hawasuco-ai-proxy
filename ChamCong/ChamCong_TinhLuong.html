      '</div>' +
      '<div class="the"><h3>Dữ liệu vào / ra kỳ tháng ' + m + '/' + y + '<span class="phai">' + TL.hienNgay(ngayK[0].iso) + ' – ' + TL.hienNgay(ngayK[ngayK.length - 1].iso) + '</span></h3>' +
      '<div class="hang khong-in" style="margin-bottom:10px">' +
      '<select id="vr-nv"><option value="">Tất cả nhân viên</option>' + dsNV.map(function (nv) { return '<option value="' + nv.id + '"' + (st.nv === nv.id ? ' selected' : '') + '>' + h(nv.ma + ' – ' + nv.hoTen) + '</option>'; }).join('') + '</select>' +
      '<select id="vr-loc"><option value="">Mọi ngày</option><option value="vande"' + (st.loc === 'vande' ? ' selected' : '') + '>Chỉ ngày đi muộn / về sớm / thiếu chấm</option><option value="ot"' + (st.loc === 'ot' ? ' selected' : '') + '>Chỉ ngày có làm thêm</option></select>' +
      '<span class="gian"></span>' +
      '<button class="nut" id="vr-them"' + (App.thangKhoa() ? ' disabled' : '') + '>' + App.icon('them') + 'Thêm giờ thủ công</button>' +
      '<button class="nut nguy" id="vr-xoa"' + (coDL && !App.thangKhoa() ? '' : ' disabled') + '>' + App.icon('xoa') + 'Xoá dữ liệu tháng</button>' +
      '<button class="nut chinh" id="vr-apdung"' + (coDL && !App.thangKhoa() ? '' : ' disabled') + '>' + App.icon('chamcong') + 'Áp dụng vào bảng chấm công…</button>' +
      '</div><div class="cuon cao"><table class="bang" id="vr-bang"></table></div>' +
      '<p class="mo nho">Sửa trực tiếp giờ vào / ra trong bảng nếu nhân viên quên chấm. Cột “Đang chấm” là ký hiệu hiện có trên bảng chấm công.</p></div>';

    veBang();
    App.$('#vr-file').onchange = function () {
      var f = this.files[0]; if (!f) return;
      XL.docFile(f).then(function (sheets) { st.file = { ten: f.name, sheets: sheets }; veGhep(); }).catch(function (e) { App.bao(e.message, 'loi'); });
    };
    App.$('#vr-mau').onclick = taiMau;
    App.$('#vr-nv').onchange = function () { st.nv = this.value; veBang(); };
    App.$('#vr-loc').onchange = function () { st.loc = this.value; veBang(); };
    App.$('#vr-apdung').onclick = apDung;
    App.$('#vr-them').onclick = themThuCong;
    App.$('#vr-xoa').onclick = function () {
      App.xacNhan('Xoá toàn bộ giờ vào / ra đã nhập của kỳ tháng ' + m + '/' + y + '? (Bảng chấm công không bị ảnh hưởng.)', { nut: 'Xoá', nguy: true }).then(function (ok) {
        if (!ok) return;
        ngayK.forEach(function (n) { var T = App.db.thang[TL.khoaKy(n.y, n.m)]; if (T && T.vr) Object.keys(T.vr).forEach(function (id) { delete T.vr[id][n.d]; }); });
        App.luu(); App.veLai();
      });
    };
    if (st.file) veGhep();
  }

  function veBang() {
    var db = App.db, y = App.ky.y, m = App.ky.m, cd = db.caiDat;
    var le = TL.bangNgayLe(db), kh = TL.bangKyHieu(db), ngay = TL.ngayKy(db, y, m);
    var khoa = App.thangKhoa();
    var ds = [];
    TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
      if (st.nv && nv.id !== st.nv) return;
      ngay.forEach(function (n) {
        var x = TL.oNgay(db, 'vr', nv.id, n.y, n.m, n.d);
        if (!x) return;
        var loai = TL.loaiNgay(db, n.y, n.m, n.d, le, nv);
        var kq = TL.tinhVaoRa(cd, loai, TL.phut(x.v), TL.phut(x.r));
        if (st.loc === 'vande' && !(kq.muon || kq.veSom || kq.ghiChu)) return;
        if (st.loc === 'ot' && !kq.ot) return;
        ds.push({ nv: nv, n: n, x: x, kq: kq, loai: loai, cc: TL.oNgay(db, 'cc', nv.id, n.y, n.m, n.d) || '' });
      });
    });
    var s = '<thead><tr><th>Ngày</th><th>Thứ</th><th>Mã NV</th><th style="min-width:160px">Họ và tên</th><th>Giờ vào</th><th>Giờ ra</th><th class="so">Giờ làm</th><th class="so">Đi muộn (phút)</th><th class="so">Về sớm (phút)</th><th class="so">Làm thêm (giờ)</th><th>Ký hiệu đề xuất</th><th>Đang chấm</th><th>Ghi chú</th></tr></thead><tbody>';
    if (!ds.length) s += '<tr><td colspan="13" class="trong">Chưa có dữ liệu vào / ra cho kỳ này' + (st.nv || st.loc ? ' (theo bộ lọc)' : '') + '. Hãy nhập file từ máy chấm công ở trên.</td></tr>';
    ds.forEach(function (r) {
      var lt = r.loai === 'le' ? ' <span class="the-tt do">Lễ</span>' : r.loai === 'nghi' ? ' <span class="the-tt">Nghỉ</span>' : '';
      var k = r.cc && kh[String(r.cc).toUpperCase()];
      s += '<tr data-id="' + r.nv.id + '" data-y="' + r.n.y + '" data-m="' + r.n.m + '" data-d="' + r.n.d + '"><td class="giua">' + TL.pad(r.n.d) + '/' + TL.pad(r.n.m) + '</td><td class="giua">' + TL.TEN_THU[TL.thuTrongTuan(r.n.y, r.n.m, r.n.d)] + lt + '</td>' +
        '<td>' + h(r.nv.ma) + '</td><td class="ten">' + h(r.nv.hoTen) + '</td>' +
        '<td><input type="time" class="o-gio" data-f="v" value="' + h(r.x.v || '') + '"' + (khoa ? ' disabled' : '') + '></td>' +
        '<td><input type="time" class="o-gio" data-f="r" value="' + h(r.x.r || '') + '"' + (khoa ? ' disabled' : '') + '></td>' +
        '<td class="so">' + App.soRong(r.kq.gioLam) + '</td><td class="so' + (r.kq.muon ? ' am' : '') + '">' + (r.kq.muon || '') + '</td><td class="so' + (r.kq.veSom ? ' am' : '') + '">' + (r.kq.veSom || '') + '</td>' +
        '<td class="so">' + App.soRong(r.kq.ot) + '</td><td class="giua"><b>' + h(r.kq.kyHieu) + '</b></td>' +
        '<td class="giua">' + (r.cc ? '<span class="the-tt" style="background:var(--k-' + (k ? k.nhom : 'khong') + ')">' + h(r.cc) + '</span>' : '') + '</td><td class="mo">' + h(r.kq.ghiChu) + '</td></tr>';
    });
    s += '</tbody>';
    var bang = App.$('#vr-bang');
    bang.innerHTML = s;
    bang.onchange = function (e) {
      var i = e.target.closest('.o-gio'); if (!i) return;
      var tr = i.closest('tr');
      var T2 = TL.thang(App.db, +tr.dataset.y, +tr.dataset.m, true);
      var o = (T2.vr[tr.dataset.id] = T2.vr[tr.dataset.id] || {});
      var x = o[tr.dataset.d] = o[tr.dataset.d] || { v: '', r: '' };
      x[i.dataset.f] = i.value;
      if (!x.v && !x.r) delete o[tr.dataset.d];
      App.luu(); veBang();
    };
  }

  /* ---------- Ghép cột file ---------- */
  function veGhep() {
    var el = App.$('#vr-ghep'); if (!el || !st.file) return;
    var sheets = st.file.sheets;
    var si = st.file.si || 0;
    var rows = sheets[si].dong;
    var maxC = rows.slice(0, 50).reduce(function (s, r) { return Math.max(s, (r || []).length); }, 0);
    var hdIdx = rows.findIndex(function (r) { return r && r.some(function (c) { return c != null && String(c).trim() !== ''; }); });
    var hd = rows[hdIdx] || [];
    var coTieuDe = hd.some(function (c) { return typeof c === 'string' && /[a-zA-ZÀ-ỹ]{2,}/.test(c) && !/^\d/.test(c); });
    function doan(re) { for (var i = 0; i < maxC; i++) if (coTieuDe && re.test(khop(hd[i] || ''))) return i; return -1; }
    var g = st.file.g || {
      ma: Math.max(0, doan(/^(ma|id|acno|no|userid|mancc|machamcong|manv|enno|maso|sothe|employeeid|personid)/)),
      ngay: doan(/(ngay|date|thoigian|time|datetime|checktime|giocham)/),
      g1: doan(/(giovao|vao|checkin|^in$|timein)/),
      g2: doan(/(giora|^ra$|checkout|^out$|timeout)/),
      tieuDe: coTieuDe
    };
    if (g.ngay < 0) g.ngay = Math.min(1, maxC - 1);
    if (g.g1 === g.ngay) g.g1 = -1;
    st.file.g = g;
    var opt = function (v, khong) {
      var s = khong ? '<option value="-1">(không có)</option>' : '';
      for (var i = 0; i < maxC; i++) s += '<option value="' + i + '"' + (v === i ? ' selected' : '') + '>Cột ' + XL.cotChu(i) + (coTieuDe && hd[i] != null ? ': ' + h(String(hd[i]).slice(0, 24)) : '') + '</option>';
      return s;
    };
    var xem = rows.slice(hdIdx, hdIdx + 7);
    el.innerHTML = '<div class="goi-y" style="margin-bottom:10px">File <b>' + h(st.file.ten) + '</b>: ' + rows.length + ' dòng. Kiểm tra các cột rồi bấm <b>Đọc dữ liệu</b>.</div>' +
      (sheets.length > 1 ? '<label class="o">Trang tính <select id="g-sheet">' + sheets.map(function (s, i) { return '<option value="' + i + '"' + (i === si ? ' selected' : '') + '>' + h(s.ten) + '</option>'; }).join('') + '</select></label>' : '') +
      '<div class="form ba" style="margin-bottom:10px">' +
      '<label class="o">Mã chấm công / Mã NV<select id="g-ma">' + opt(g.ma) + '</select></label>' +
      '<label class="o">Ngày (hoặc ngày giờ chấm)<select id="g-ngay">' + opt(g.ngay) + '</select></label>' +
      '<label class="o">Giờ vào / giờ chấm<select id="g-g1">' + opt(g.g1, true) + '</select></label>' +
      '<label class="o">Giờ ra<select id="g-g2">' + opt(g.g2, true) + '</select></label>' +
      '<label class="chk" style="align-self:end"><input type="checkbox" id="g-td"' + (g.tieuDe ? ' checked' : '') + '> Dòng đầu là tiêu đề</label>' +
      '</div><div class="cuon" style="max-height:200px"><table class="bang"><thead><tr>' +
      Array.from({ length: maxC }, function (_, i) { return '<th>' + XL.cotChu(i) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      xem.map(function (r) { return '<tr>' + Array.from({ length: maxC }, function (_, i) { return '<td>' + h(r && r[i] != null ? r[i] : '') + '</td>'; }).join('') + '</tr>'; }).join('') +
      '</tbody></table></div><div class="hang" style="margin-top:10px"><span class="gian"></span><button class="nut" id="g-huy">Bỏ qua</button><button class="nut chinh" id="g-doc">Đọc dữ liệu</button></div>';
    var gs = App.$('#g-sheet'); if (gs) gs.onchange = function () { st.file.si = +this.value; st.file.g = null; veGhep(); };
    App.$('#g-huy').onclick = function () { st.file = null; el.innerHTML = ''; App.$('#vr-file').value = ''; };
    App.$('#g-doc').onclick = function () {
      g = { ma: +App.$('#g-ma').value, ngay: +App.$('#g-ngay').value, g1: +App.$('#g-g1').value, g2: +App.$('#g-g2').value, tieuDe: App.$('#g-td').checked };
      st.file.g = g;
      docDuLieu(rows.slice(hdIdx + (g.tieuDe ? 1 : 0)), g);
    };
  }

  function docDuLieu(rows, g) {
    var db = App.db, ghepMa = {};
    db.nhanVien.forEach(function (nv) { if (nv.ma) ghepMa['n:' + khop(nv.ma)] = nv; });
    db.nhanVien.forEach(function (nv) { if (nv.maChamCong) ghepMa['c:' + khop(nv.maChamCong)] = nv; });
    var nhom = {}, khongKhop = {}, loiNgay = 0, soDong = 0;
    rows.forEach(function (r) {
      if (!r) return;
      var ma = r[g.ma];
      if (ma == null || String(ma).trim() === '') return;
      soDong++;
      var k = khop(typeof ma === 'number' ? String(Math.round(ma)) : ma);
      var nv = ghepMa['c:' + k] || ghepMa['n:' + k] || ghepMa['c:' + k.replace(/^0+/, '')] || ghepMa['n:' + k.replace(/^0+/, '')];
      if (!nv) { khongKhop[String(ma)] = (khongKhop[String(ma)] || 0) + 1; return; }
      var t = docThoiDiem(r[g.ngay]);
      if (!t.ngay) { loiNgay++; return; }
      var gio = t.gio.slice();
      [g.g1, g.g2].forEach(function (c) { if (c >= 0) gio = gio.concat(docThoiDiem(r[c]).gio); });
      var key = nv.id + '|' + t.ngay;
      (nhom[key] = nhom[key] || { nv: nv, ngay: t.ngay, gio: [] }).gio = nhom[key].gio.concat(gio);
    });
    var demThang = {}, soNgay = 0, khoa = [];
    Object.keys(nhom).forEach(function (k) {
      var x = nhom[k], n = TL.docNgay(x.ngay);
      var T = TL.thang(db, n.y, n.m, true), kyN = TL.kyCuaNgay(db, n.y, n.m, n.d), TK = TL.thang(db, kyN.y, kyN.m);
      if (TK.khoa) { if (khoa.indexOf(kyN.m + '/' + kyN.y) < 0) khoa.push(kyN.m + '/' + kyN.y); return; }
      var gio = x.gio.filter(function (p) { return p != null; }).sort(function (a, b) { return a - b; });
      var vao = gio.length ? gio[0] : null, ra = gio.length > 1 && gio[gio.length - 1] - gio[0] > 1 ? gio[gio.length - 1] : null;
      (T.vr[x.nv.id] = T.vr[x.nv.id] || {})[n.d] = { v: vao == null ? '' : TL.hhmm(vao), r: ra == null ? '' : TL.hhmm(ra) };
      var kk = TL.kyCuaNgay(db, n.y, n.m, n.d), tk = kk.m + '/' + kk.y; demThang[tk] = (demThang[tk] || 0) + 1; soNgay++;
    });
    App.luu();
    var kk = Object.keys(khongKhop);
    var msg = '<p>Đã đọc <b>' + soDong + '</b> dòng → <b>' + soNgay + '</b> ngày công' +
      (Object.keys(demThang).length ? ' (' + Object.keys(demThang).map(function (t) { return 'kỳ tháng ' + t + ': ' + demThang[t]; }).join(', ') + ')' : '') + '.</p>' +
      (kk.length ? '<p style="color:var(--do)">' + kk.length + ' mã chấm công không khớp nhân viên nào: ' + kk.slice(0, 12).map(h).join(', ') + (kk.length > 12 ? '…' : '') + '. Khai báo “Mã chấm công” trong hồ sơ nhân viên rồi nhập lại.</p>' : '') +
      (loiNgay ? '<p style="color:var(--do)">' + loiNgay + ' dòng không đọc được ngày.</p>' : '') +
      (khoa.length ? '<p style="color:var(--cam)">Bỏ qua kỳ đã chốt lương: ' + khoa.join(', ') + '.</p>' : '') +
      '<p class="mo">Bước tiếp theo: xem lại bảng bên dưới rồi bấm <b>Áp dụng vào bảng chấm công</b>.</p>';
    st.file = null;
    var ks = Object.keys(demThang);
    if (ks.length === 1) { var p = ks[0].split('/'); if (+p[0] !== App.ky.m || +p[1] !== App.ky.y) { App.ky = { y: +p[1], m: +p[0] }; } }
    App.veLai();
    App.hop({ tieuDe: 'Kết quả nhập dữ liệu chấm công', than: msg, nut: [{ ten: 'Đóng', loai: 'chinh' }] });
  }

  /* ---------- Áp dụng vào bảng chấm công ---------- */
  function apDung() {
    var y = App.ky.y, m = App.ky.m;
    App.hop({
      tieuDe: 'Áp dụng giờ vào / ra vào bảng chấm công ' + m + '/' + y, co: 'hep',
      than: '<form class="form" style="grid-template-columns:1fr" onsubmit="return false">' +
        '<label class="chk"><input type="checkbox" name="kh" checked> Cập nhật ký hiệu công (' + h(App.db.caiDat.khDiLam || '+') + ', ' + h(App.db.caiDat.khNuaNgay || '+/2') + ')</label>' +
        '<label class="chk" style="margin-left:24px"><input type="checkbox" name="de"> Ghi đè ô đã chấm (P, CT, …)</label>' +
        '<label class="chk"><input type="checkbox" name="muon" checked> Cập nhật số phút đi muộn / về sớm</label>' +
        '<label class="chk"><input type="checkbox" name="ot" checked> Cập nhật giờ làm thêm</label>' +
        '<p class="mo nho" style="margin:0">Chỉ áp dụng cho những ngày có dữ liệu vào / ra' + (st.nv ? ' của nhân viên đang chọn' : '') + '.</p></form>',
      nut: [{ ten: 'Huỷ' }, {
        ten: 'Áp dụng', loai: 'chinh', bam: function (el) {
          var f = App.$('form', el), db = App.db, cd = db.caiDat;
          var le = TL.bangNgayLe(db), n = 0, ngayK = TL.ngayKy(db, y, m);
          TL.dsNhanVienKy(db, y, m).forEach(function (nv) {
            if (st.nv && nv.id !== st.nv) return;
            ngayK.forEach(function (nn) {
              var x = TL.oNgay(db, 'vr', nv.id, nn.y, nn.m, nn.d), d = nn.d;
              if (!x || !TL.nvLamNgay(nv, nn.y, nn.m, d)) return;
              var T = TL.thang(db, nn.y, nn.m, true);
              var kq = TL.tinhVaoRa(cd, TL.loaiNgay(db, nn.y, nn.m, d, le, nv), TL.phut(x.v), TL.phut(x.r));
              var cc = T.cc[nv.id] = T.cc[nv.id] || {}, mu = T.muon[nv.id] = T.muon[nv.id] || {}, ot = T.ot[nv.id] = T.ot[nv.id] || {};
              if (f.kh.checked && kq.kyHieu && (!cc[d] || (f.de.checked && kq.kyHieu !== (cd.khLe || 'L')))) cc[d] = kq.kyHieu;
              if (f.muon.checked) { var p = kq.muon + kq.veSom; if (p) mu[d] = p; else delete mu[d]; }
              if (f.ot.checked) { if (kq.ot) ot[d] = kq.ot; else delete ot[d]; }
              n++;
            });
          });
          App.luu();
          App.bao('Đã áp dụng ' + n + ' ngày vào bảng chấm công.', 'tot');
          App.veLai();
        }
      }]
    });
  }

  function themThuCong() {
    var y = App.ky.y, m = App.ky.m, ds = TL.dsNhanVienKy(App.db, y, m);
    App.hop({
      tieuDe: 'Thêm giờ vào / ra', co: 'hep',
      than: '<form class="form" style="grid-template-columns:1fr 1fr" onsubmit="return false">' +
        '<label class="o ca">Nhân viên<select name="nv">' + ds.map(function (nv) { return '<option value="' + nv.id + '"' + (st.nv === nv.id ? ' selected' : '') + '>' + h(nv.ma + ' – ' + nv.hoTen) + '</option>'; }).join('') + '</select></label>' +
        '<label class="o ca">Ngày<input type="date" name="ngay" value="' + (App.homNay() >= TL.batDauKy(App.db, y, m) && App.homNay() <= TL.ketThucKy(App.db, y, m) ? App.homNay() : TL.batDauKy(App.db, y, m)) + '" min="' + TL.batDauKy(App.db, y, m) + '" max="' + TL.ketThucKy(App.db, y, m) + '"></label>' +
        '<label class="o">Giờ vào<input type="time" name="v" value="' + App.db.caiDat.gioVao + '"></label>' +
        '<label class="o">Giờ ra<input type="time" name="r" value="' + App.db.caiDat.gioRa + '"></label></form>',
      nut: [{ ten: 'Huỷ' }, {
        ten: 'Thêm', loai: 'chinh', bam: function (el) {
          var f = App.$('form', el), n = TL.docNgay(f.ngay.value);
          if (!n || f.ngay.value < TL.batDauKy(App.db, y, m) || f.ngay.value > TL.ketThucKy(App.db, y, m)) { App.bao('Ngày phải thuộc kỳ công tháng ' + m + '/' + y, 'loi'); return false; }
          var T = TL.thang(App.db, n.y, n.m, true);
          (T.vr[f.nv.value] = T.vr[f.nv.value] || {})[n.d] = { v: f.v.value, r: f.r.value };
          App.luu(); App.veLai();
        }
      }]
    });
  }

  function taiMau() {
    var th = App.KIEU.th, y = App.ky.y, m = App.ky.m;
    var dong = [[{ v: 'Mã chấm công', s: th }, { v: 'Họ tên', s: th }, { v: 'Ngày', s: th }, { v: 'Giờ vào', s: th }, { v: 'Giờ ra', s: th }]];
    App.db.nhanVien.slice(0, 3).forEach(function (nv) {
      for (var d = 1; d <= 3; d++) dong.push([nv.maChamCong || nv.ma, nv.hoTen, TL.pad(d) + '/' + TL.pad(m) + '/' + y, '07:5' + d, '17:0' + d]);
    });
    var dong2 = [[{ v: 'Mã chấm công', s: th }, { v: 'Thời gian chấm', s: th }]];
    App.db.nhanVien.slice(0, 2).forEach(function (nv) {
      dong2.push([nv.maChamCong || nv.ma, TL.pad(1) + '/' + TL.pad(m) + '/' + y + ' 07:55:12']);
      dong2.push([nv.maChamCong || nv.ma, TL.pad(1) + '/' + TL.pad(m) + '/' + y + ' 12:01:40']);
      dong2.push([nv.maChamCong || nv.ma, TL.pad(1) + '/' + TL.pad(m) + '/' + y + ' 17:06:03']);
    });
    App.xuatExcel('Mau_du_lieu_may_cham_cong', [
      { ten: 'Mỗi dòng 1 ngày', dong: dong, cot: [14, 22, 12, 10, 10], co: { r: 1 } },
      { ten: 'Mỗi dòng 1 lần chấm', dong: dong2, cot: [14, 22], co: { r: 1 } }
    ]);
  }

  App.trang.vaora = { ve: ve };
})();

</script>
<script>
/* ===== p-bangluong.js ===== */
/* Trang Bảng lương (bảng thanh toán tiền lương) & Phiếu lương */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  var st = { pb: '', tim: '', nhomPB: true, pl: '' };

  var NHAP = {
    slSP: 'Sản lượng trong kỳ (vd số hoá đơn đã ghi thu) – nhân với đơn giá để ra lương sản phẩm',
    thuong: 'Thưởng (chịu thuế TNCN)',
    congKhac: 'Khoản cộng khác (truy lĩnh, hỗ trợ…), chịu thuế; nhập số âm để truy thu',
    tamUng: 'Tạm ứng kỳ I',
    khauTru: 'Khấu trừ khác (bồi thường, …)'
  };

  /** Định nghĩa cột bảng lương – dùng chung cho màn hình, dòng tổng và Excel.
      f(r) đọc được cả 1 dòng nhân viên lẫn dòng tổng (TL.congTong). */
  function dsCot(bl) {
    var cd = App.db.caiDat, rows = bl.rows;
    var co = function (fn) { return rows.some(fn); };
    var c = [
      { t: 'STT', stt: true, kieu: 'giua', w: 5 },
      { t: 'Mã NV', k: 'ma', w: 8, chiManHinh: true },
      { t: 'Họ và tên', k: 'hoTen', w: 22, ten: true },
      { t: 'Chức danh', k: 'chucVu', w: 16 },
      { t: 'Mức lương/HĐ', k: 'luongCB', kieu: 'so', w: 12 }
    ];
    if (cd.luongSP || co(function (r) { return r.slSP || r.luongSP || r.cong.sp; })) {
      c.push({ t: cd.tenSP || 'Số lượng', nhom: 'Lương sản phẩm', k: 'slSP', kieu: 'so', w: 8, nhap: 'slSP' });
      c.push({ t: 'Số tiền', nhom: 'Lương sản phẩm', k: 'luongSP', kieu: 'so', w: 11 });
    }
    c.push({ t: 'Số công', nhom: 'Lương thời gian', kieu: 'cong', w: 6, f: function (r) { return r.cong.congTG; } });
    c.push({ t: 'Số tiền', nhom: 'Lương thời gian', k: 'luongTG', kieu: 'so', w: 12 });
    if (co(function (r) { return r.cong.ngung; })) {
      var nn = 'Nghỉ, ngừng việc hưởng ' + (cd.tiLeNgungViec == null ? 100 : cd.tiLeNgungViec) + '% lương';
      c.push({ t: 'Số công', nhom: nn, kieu: 'cong', w: 6, f: function (r) { return r.cong.ngung; } });
      c.push({ t: 'Số tiền', nhom: nn, k: 'luongNgung', kieu: 'so', w: 11 });
    }
    if (co(function (r) { return r.tienOT; })) {
      c.push({ t: 'Số giờ', nhom: 'Làm thêm giờ', kieu: 'cong', w: 6, f: function (r) { return r.cong.otTong; } });
      c.push({ t: 'Số tiền', nhom: 'Làm thêm giờ', k: 'tienOT', kieu: 'so', w: 11 });
    }
    (bl.phuCap || []).forEach(function (pc) {
      if (!co(function (r) { return (r.phuCap || {})[pc.ma]; })) return;
      var tien = function (r) { return (r.phuCap || {})[pc.ma] || 0; };
      if (pc.cachTinh === 'theo_ngay') {
        var nh = 'Phụ cấp ' + pc.ten.toLowerCase();
        c.push({ t: 'Số công', nhom: nh, kieu: 'cong', w: 6, f: function (r) { return (r.phuCapNgay || {})[pc.ma] || 0; } });
        c.push({ t: 'Số tiền', nhom: nh, kieu: 'so', w: 11, f: tien, pc: pc.ma });
      } else c.push({ t: pc.ten, nhom: 'Phụ cấp', kieu: 'so', w: 11, f: tien, pc: pc.ma });
    });
    c.push(
      { t: 'Thưởng', k: 'thuong', kieu: 'so', w: 11, nhap: 'thuong' },
      { t: 'Cộng khác', k: 'congKhac', kieu: 'so', w: 10, nhap: 'congKhac' },
      { t: 'Tổng thu nhập', k: 'tongThuNhap', kieu: 'so', w: 13, dam: true },
      { t: 'Tạm ứng kỳ I', k: 'tamUng', kieu: 'so', w: 11, nhap: 'tamUng' }
    );
    var KT = 'Các khoản phải khấu trừ vào lương';
    c.push(
      { t: 'BHXH ' + App.so(cd.bh.nv.bhxh) + '%', nhom: KT, k: 'bhxh', kieu: 'so', w: 10 },
      { t: 'BHYT ' + App.so(cd.bh.nv.bhyt) + '%', nhom: KT, k: 'bhyt', kieu: 'so', w: 9 },
      { t: 'BHTN ' + App.so(cd.bh.nv.bhtn) + '%', nhom: KT, k: 'bhtn', kieu: 'so', w: 9 }
    );
    if (co(function (r) { return r.doanPhi; })) c.push({ t: 'Công đoàn ' + App.so(cd.bh.doanPhi) + '%', nhom: KT, k: 'doanPhi', kieu: 'so', w: 9 });
    c.push({ t: 'Thuế TNCN phải nộp', nhom: KT, k: 'thue', kieu: 'so', w: 10 });
    if (co(function (r) { return r.phatMuon; })) c.push({ t: 'Phạt đi muộn', nhom: KT, k: 'phatMuon', kieu: 'so', w: 9 });
    c.push(
      { t: 'Khấu trừ khác', nhom: KT, k: 'khauTru', kieu: 'so', w: 10, nhap: 'khauTru' },
      { t: 'Cộng', nhom: KT, k: 'tongKhauTru', kieu: 'so', w: 11 },
      { t: 'Lãnh kỳ II', k: 'thucLinh', kieu: 'so', w: 13, dam: true }
    );
    return c;
  }
  function gt(c, r) { return c.f ? c.f(r) : r[c.k]; }
  function hien(c, v) {
    if (c.kieu === 'so') return v ? App.tien(v) : '';
    if (c.kieu === 'cong') return v ? App.so(v) : '';
    return h(v == null ? '' : v);
  }

  function locRows(rows) {
    return rows.filter(function (r) {
      if (st.pb && r.phongBan !== st.pb) return false;
      if (st.tim && !App.timKhop(r.ma + ' ' + r.hoTen, st.tim)) return false;
      return true;
    });
  }
  function nhomTheoPB(rows) {
    var thuTu = [], g = {};
    rows.forEach(function (r) { var k = r.phongBan || ''; if (!g[k]) { g[k] = []; thuTu.push(k); } g[k].push(r); });
    return thuTu.map(function (k) { return { ma: k, ten: (g[k][0].tenPhongBan || '(Chưa phân phòng)'), rows: g[k] }; });
  }

  /* ================= Bảng lương ================= */
  function veBL(noi) {
    var db = App.db, y = App.ky.y, m = App.ky.m;
    var bl = TL.tinhBangLuong(db, y, m);
    var khoa = bl.khoa, ngay = TL.ngayKy(db, y, m);
    noi.innerHTML =
      '<div class="the khong-in" style="padding:12px 14px"><div class="hang">' +
      '<select id="bl-pb"><option value="">Tất cả phòng ban</option>' + db.phongBan.map(function (p) { return '<option value="' + h(p.ma) + '"' + (st.pb === p.ma ? ' selected' : '') + '>' + h(p.ten) + '</option>'; }).join('') + '</select>' +
      '<input type="search" id="bl-tim" placeholder="Tìm nhân viên…" value="' + h(st.tim) + '" style="width:170px">' +
      '<label class="chk"><input type="checkbox" id="bl-nhom"' + (st.nhomPB ? ' checked' : '') + '> Nhóm theo phòng ban</label>' +
      '<span class="gian"></span>' +
      '<button class="nut" id="bl-xuat">' + App.icon('tai') + 'Xuất Excel</button>' +
      '<button class="nut" id="bl-ck">' + App.icon('ngan') + 'File chuyển khoản</button>' +
      '<button class="nut" id="bl-in">' + App.icon('in') + 'In</button>' +
      (khoa ? '<button class="nut" id="bl-mo">' + App.icon('mo') + 'Mở khoá</button>' : '<button class="nut xanh" id="bl-chot">' + App.icon('khoa') + 'Chốt lương tháng</button>') +
      '</div>' +
      (khoa ? '<div class="canh-bao" style="margin-top:10px">Bảng lương đã <b>chốt</b> lúc ' + new Date(bl.ngayChot).toLocaleString('vi-VN') + '. Số liệu được giữ cố định, không đổi khi sửa cài đặt hay hồ sơ nhân viên. Muốn sửa, bấm <b>Mở khoá</b>.</div>'
        : '<div class="mo nho" style="margin-top:8px">Kỳ công ' + TL.hienNgay(ngay[0].iso) + ' – ' + TL.hienNgay(ngay[ngay.length - 1].iso) + '. Ô nền vàng nhập trực tiếp: sản lượng, thưởng, khoản cộng khác, tạm ứng kỳ I, khấu trừ khác. Bấm tên nhân viên để xem chi tiết cách tính.</div>') +
      '</div>' +
      App.dauIn((db.congTy.tieuDeBangLuong || 'BẢNG THANH TOÁN TIỀN LƯƠNG').toUpperCase(), 'Tháng ' + m + ' năm ' + y) +
      '<div class="cuon cao"><table class="bang" id="bl-bang"></table></div>' +
      App.kyIn();
    veBangBL(bl);
    App.$('#bl-pb').onchange = function () { st.pb = this.value; veBangBL(TL.tinhBangLuong(App.db, y, m)); };
    App.$('#bl-tim').oninput = function () { st.tim = this.value; veBangBL(TL.tinhBangLuong(App.db, y, m)); };
    App.$('#bl-nhom').onchange = function () { st.nhomPB = this.checked; veBangBL(TL.tinhBangLuong(App.db, y, m)); };
    App.$('#bl-xuat').onclick = function () { xuatBL(TL.tinhBangLuong(App.db, y, m)); };
    App.$('#bl-ck').onclick = function () { xuatCK(TL.tinhBangLuong(App.db, y, m)); };
    App.$('#bl-in').onclick = function () { App.inTrang(); };
    var c = App.$('#bl-chot'); if (c) c.onclick = App.chotLuong;
    var mo = App.$('#bl-mo'); if (mo) mo.onclick = App.moKhoa;
  }

  function veBangBL(bl) {
    var cot = dsCot(bl), rows = locRows(bl.rows), khoa = bl.khoa;
    var coNhom = cot.some(function (c) { return c.nhom; });
    var s = '<thead><tr>', s2 = '';
    for (var i = 0; i < cot.length; i++) {
      var c = cot[i];
      if (c.nhom) {
        var j = i; while (j + 1 < cot.length && cot[j + 1].nhom === c.nhom) j++;
        s += '<th colspan="' + (j - i + 1) + '">' + h(c.nhom) + '</th>';
        for (var k = i; k <= j; k++) s2 += '<th class="so">' + h(cot[k].t) + '</th>';
        i = j;
      } else s += '<th' + (coNhom ? ' rowspan="2"' : '') + ' class="' + (c.kieu === 'so' ? 'so' : '') + (c.ten ? ' dinh' : '') + '"' + (c.ten ? ' style="min-width:170px"' : '') + '>' + h(c.t) + '</th>';
    }
    s += '<th rowspan="2" style="min-width:150px">Ghi chú</th></tr>' + (coNhom ? '<tr>' + s2 + '</tr>' : '') + '</thead><tbody>';
    var stt = 0;
    function dong(r) {
      stt++;
      var x = '<tr data-id="' + r.nvId + '">';
      cot.forEach(function (c, ci) {
        if (c.stt) { x += '<td class="giua">' + stt + '</td>'; return; }
        if (c.nhap && !khoa) { x += '<td><input class="o-nhap" data-f="' + c.nhap + '" value="' + (r[c.nhap] ? App.tien(r[c.nhap]) : '') + '" title="' + h(NHAP[c.nhap]) + '" inputmode="numeric"' + (c.nhap === 'slSP' ? ' style="min-width:70px"' : '') + '></td>'; return; }
        var v = gt(c, r);
        x += '<td data-c="' + ci + '" class="' + (c.kieu === 'so' ? 'so' : c.kieu === 'cong' ? 'giua' : '') + (c.ten ? ' ten dinh' : '') + (c.kieu === 'so' && v < 0 ? ' am' : '') + '"' + (c.dam ? ' style="font-weight:700"' : '') + '>' +
          (c.ten ? '<span class="lk" data-ct="' + r.nvId + '">' + h(v) + '</span>' + (r.canhBao && r.canhBao.length ? ' <span title="' + h(r.canhBao.join('\n')) + '" style="color:var(--cam);cursor:help">⚠</span>' : '') : hien(c, v)) + '</td>';
      });
      x += '<td>' + (khoa ? h(r.ghiChu) : '<input class="o-nhap chu" data-f="ghiChu" value="' + h(r.ghiChu) + '">') + '</td></tr>';
      return x;
    }
    function dongTong(t, nhan, cls) {
      var x = '<tr class="' + cls + '">';
      cot.forEach(function (c) {
        if (c.stt) { x += '<td></td>'; return; }
        if (c.ten) { x += '<td class="dinh">' + h(nhan) + '</td>'; return; }
        if (!c.kieu || c.kieu === 'chu' || c.kieu === 'giua') { x += '<td></td>'; return; }
        x += '<td class="' + (c.kieu === 'so' ? 'so' : 'giua') + '">' + hien(c, gt(c, t)) + '</td>';
      });
      return x + '<td></td></tr>';
    }
    if (!rows.length) s += '<tr><td colspan="' + (cot.length + 1) + '" class="trong">Không có nhân viên trong kỳ này.</td></tr>';
    else if (st.nhomPB) {
      nhomTheoPB(rows).forEach(function (g) {
        s += '<tr class="nhom"><td colspan="' + (cot.length + 1) + '">' + h(g.ten) + ' (' + g.rows.length + ' người)</td></tr>';
        g.rows.forEach(function (r) { s += dong(r); });
        s += dongTong(TL.congTong(g.rows, bl.phuCap), 'Cộng ' + g.ten, 'nhom-tong');
      });
    } else rows.forEach(function (r) { s += dong(r); });
    s += '</tbody><tfoot>' + (rows.length ? dongTong(TL.congTong(rows, bl.phuCap), 'TỔNG CỘNG (' + rows.length + ' người)', 'tong') : '') + '</tfoot>';
    var bang = App.$('#bl-bang');
    bang.innerHTML = s;
    var tr1 = App.$('thead tr', bang); if (tr1) bang.style.setProperty('--h1', tr1.offsetHeight + 'px');
    App.$$('input.o-nhap:not(.chu)', bang).forEach(App.ganOTien);
    bang.onchange = function (e) {
      var i = e.target.closest('.o-nhap'); if (!i) return;
      var id = i.closest('tr').dataset.id, f = i.dataset.f;
      var T = TL.thang(App.db, App.ky.y, App.ky.m, true);
      var dc = T.dc[id] = T.dc[id] || {};
      var v = f === 'ghiChu' ? i.value.trim() : App.docSo(i.value);
      if (!v) delete dc[f]; else dc[f] = v;
      if (!Object.keys(dc).length) delete T.dc[id];
      App.luu();
      capNhatSo();
    };
    bang.onclick = function (e) { var a = e.target.closest('[data-ct]'); if (a) App.chiTietLuong(a.dataset.ct); };
  }

  /** Cập nhật các ô tính toán mà không vẽ lại ô nhập (giữ con trỏ khi Tab sang ô khác) */
  function capNhatSo() {
    var bl = TL.tinhBangLuong(App.db, App.ky.y, App.ky.m), cot = dsCot(bl);
    var bang = App.$('#bl-bang');
    // cột hiển thị thay đổi (vd vừa nhập sản lượng đầu tiên) thì vẽ lại cả bảng
    var soCot = App.$$('thead tr:last-child th', bang).length;
    var map = {}; bl.rows.forEach(function (r) { map[r.nvId] = r; });
    App.$$('tr[data-id]', bang).forEach(function (tr) {
      var r = map[tr.dataset.id]; if (!r) return;
      App.$$('td[data-c]', tr).forEach(function (td) {
        var c = cot[+td.dataset.c]; if (!c || c.ten) return;
        var v = gt(c, r); td.innerHTML = hien(c, v); td.classList.toggle('am', c.kieu === 'so' && v < 0);
      });
    });
    var rows = locRows(bl.rows);
    var nhom = st.nhomPB ? nhomTheoPB(rows) : [];
    App.$$('tr.nhom-tong, tr.tong', bang).forEach(function (tr) {
      var t;
      if (tr.classList.contains('tong')) t = TL.congTong(rows, bl.phuCap);
      else { var g = nhom.shift(); if (!g) return; t = TL.congTong(g.rows, bl.phuCap); }
      var tds = tr.children;
      cot.forEach(function (c, ci) {
        if (c.stt || c.ten || !c.kieu || c.kieu === 'chu' || c.kieu === 'giua') return;
        if (tds[ci]) tds[ci].innerHTML = hien(c, gt(c, t));
      });
    });
    void soCot;
  }

  App.chotLuong = function () {
    var y = App.ky.y, m = App.ky.m;
    App.xacNhan('Chốt bảng lương <b>tháng ' + m + '/' + y + '</b>?<br><br>Sau khi chốt, bảng chấm công và bảng lương kỳ này bị khoá; số liệu được lưu cố định để không bị thay đổi khi sau này sửa mức lương, tỷ lệ bảo hiểm, biểu thuế… Có thể mở khoá lại khi cần.', { nut: 'Chốt lương' }).then(function (ok) {
      if (!ok) return;
      TL.chotThang(App.db, y, m); App.luu(); App.bao('Đã chốt lương tháng ' + m + '/' + y, 'tot'); App.veLai();
    });
  };
  App.moKhoa = function () {
    var y = App.ky.y, m = App.ky.m;
    App.xacNhan('Mở khoá tháng ' + m + '/' + y + '? Bảng lương sẽ được tính lại theo dữ liệu và cài đặt hiện tại.', { nut: 'Mở khoá' }).then(function (ok) {
      if (!ok) return;
      TL.moKhoaThang(App.db, y, m); App.luu(); App.bao('Đã mở khoá tháng ' + m + '/' + y); App.veLai();
    });
  };

  /* ---------- Chi tiết cách tính ---------- */
  App.chiTietLuong = function (nvId) {
    var db = App.db, y = App.ky.y, m = App.ky.m, cd = db.caiDat;
    var bl = TL.tinhBangLuong(db, y, m);
    var r = bl.rows.filter(function (x) { return x.nvId === nvId; })[0];
    if (!r) return;
    var c = r.cong, t = App.tien;
    var L = [];
    function m_(a) { L.push('<tr class="m"><td colspan="3">' + a + '</td></tr>'); }
    function d_(a, b, v) { L.push('<tr><td>' + a + '</td><td>' + (b || '') + '</td><td>' + v + '</td></tr>'); }
    m_('1. Ngày công');
    d_('Công chuẩn của kỳ', r.congChuan === bl.congChuan ? '' : 'Theo lịch làm việc riêng', App.so(r.congChuan));
    if (c.sp) d_('Công hưởng lương sản phẩm (SP)', 'Không tính vào lương thời gian', App.so(c.sp));
    d_('Ngày đi làm hưởng lương thời gian', '', App.so(c.lamTG));
    d_('Nghỉ có hưởng lương', 'Phép ' + App.so(c.phep) + ', lễ ' + App.so(c.le) + ', khác ' + App.so(c.huongKhac), App.so(c.huong - c.ngung));
    if (c.ngung) d_('Nghỉ, ngừng việc hưởng ' + (cd.tiLeNgungViec == null ? 100 : cd.tiLeNgungViec) + '% lương', '', App.so(c.ngung));
    if (c.bhxh || c.khong || c.kp) d_('Nghỉ không hưởng lương', 'Ốm/TS ' + App.so(c.bhxh) + ', không lương ' + App.so(c.khong) + ', không phép ' + App.so(c.kp), '');
    d_('<b>Số công lương thời gian</b>', '', '<b>' + App.so(c.congTG) + '</b>');
    d_('Ngày làm thực tế (tính cơm)', 'Gồm cả ngày SP', App.so(c.ngayLamThucTe));
    m_('2. Thu nhập');
    if (r.luongSP) d_('Lương sản phẩm', App.tien(r.slSP) + ' × ' + t(r.donGiaSP) + ' đ', t(r.luongSP));
    var ht = r.hinhThuc;
    var cachLuong = ht === 'thang' ? t(r.luongCB) + (r.tiLeHuong !== 100 ? ' × ' + App.so(r.tiLeHuong) + '%' : '') + ' ÷ ' + App.so(r.congChuan) + ' × ' + App.so(c.congTG)
      : ht === 'ngay' ? t(r.luongCB) + '/ngày' + (r.tiLeHuong !== 100 ? ' × ' + App.so(r.tiLeHuong) + '%' : '') + ' × ' + App.so(c.congTG)
        : ht === 'gio' ? t(r.luongCB) + '/giờ × ' + cd.gioLamNgay + ' giờ × ' + App.so(c.congTG) + ' công'
          : 'Lương khoán';
    d_('Lương thời gian', cachLuong, t(r.luongTG));
    if (r.luongNgung) d_('Lương nghỉ, ngừng việc', 'Lương ngày ' + t(r.luongNgay) + ' × ' + App.so(c.ngung) + ' × ' + (cd.tiLeNgungViec == null ? 100 : cd.tiLeNgungViec) + '%', t(r.luongNgung));
    if (c.otTong) {
      var hs = cd.heSoOT, parts = [];
      if (c.otThuong) parts.push(App.so(c.otThuong) + 'h × ' + hs.thuong + '%');
      if (c.otNghi) parts.push(App.so(c.otNghi) + 'h × ' + hs.nghi + '%');
      if (c.otLe) parts.push(App.so(c.otLe) + 'h × ' + hs.le + '%');
      d_('Tiền làm thêm giờ', 'Lương giờ ' + t(r.luongGio) + ' × (' + parts.join(' + ') + ')', t(r.tienOT));
    }
    (bl.phuCap || []).forEach(function (pc) {
      var v = r.phuCap[pc.ma]; if (!v) return;
      var gc = pc.cachTinh === 'theo_ngay' ? App.so((r.phuCapNgay || {})[pc.ma]) + ' ngày × ' + t(v / ((r.phuCapNgay || {})[pc.ma] || 1)) : App.CACH_PC[pc.cachTinh];
      d_('Phụ cấp ' + h(pc.ten.toLowerCase()), gc + (pc.chiuThue ? '' : ' · không chịu thuế'), t(v));
    });
    if (r.thuong) d_('Thưởng', '', t(r.thuong));
    if (r.congKhac) d_('Khoản cộng khác', '', t(r.congKhac));
    d_('<b>Tổng thu nhập</b>', '', '<b>' + t(r.tongThuNhap) + '</b>');
    m_('3. Bảo hiểm, công đoàn (người lao động đóng)');
    if (!r.dongBH) d_('Không đóng bảo hiểm kỳ này', r.luongBH ? 'Nghỉ không lương từ ' + cd.nguongNghiKhongDongBH + ' ngày' : 'Không tham gia / chưa có lương đóng BH', '0');
    else {
      d_('Lương đóng bảo hiểm', 'Trần BHXH, BHYT: ' + t(20 * cd.luongCoSo) + ' · trần BHTN: ' + t(20 * cd.luongToiThieuVung), t(r.luongBH));
      d_('BHXH', App.so(cd.bh.nv.bhxh) + '%', t(r.bhxh));
      d_('BHYT', App.so(cd.bh.nv.bhyt) + '%', t(r.bhyt));
      d_('BHTN', App.so(cd.bh.nv.bhtn) + '%', t(r.bhtn));
    }
    if (r.doanPhi) d_('Đoàn phí công đoàn', App.so(cd.bh.doanPhi) + '% (tối đa 10% lương cơ sở)', t(r.doanPhi));
    m_('4. Thuế thu nhập cá nhân');
    if (r.cachTinhThue === 'khong') d_('Không tính thuế', '', '0');
    else {
      d_('Thu nhập chịu thuế', 'Tổng thu nhập − phụ cấp không chịu thuế (' + t(r.pcKhongThue) + ') − phần làm thêm được miễn (' + t(r.otMienThue) + ')', t(r.tnct));
      if (r.cachTinhThue === 'luy_tien') {
        d_('Giảm trừ bản thân', '', t(r.giamTruBT));
        if (r.soNPT) d_('Giảm trừ người phụ thuộc', r.soNPT + ' × ' + t(cd.giamTruNPT), t(r.giamTruNPT));
        d_('Bảo hiểm bắt buộc', '', t(r.tongBH));
        d_('Thu nhập tính thuế', '', t(r.tntt));
        var duoi = 0;
        cd.bieuThue.forEach(function (b, i) {
          var tren = b.den == null || b.den === '' ? Infinity : +b.den;
          if (r.tntt > duoi) d_('Bậc ' + (i + 1) + ' (' + b.ts + '%)', t(duoi) + ' – ' + (tren === Infinity ? '…' : t(tren)), t(Math.round((Math.min(r.tntt, tren) - duoi) * b.ts / 100)));
          duoi = tren;
        });
      } else d_('Khấu trừ ' + cd.thueKhauTru + '%', 'Áp dụng khi thu nhập từ ' + t(cd.nguongKhauTru), '');
      d_('<b>Thuế TNCN phải nộp</b>', '', '<b>' + t(r.thue) + '</b>');
    }
    m_('5. Lãnh kỳ II');
    if (r.phatMuon) d_('Phạt đi muộn / về sớm', c.muonLan + ' lần, ' + c.muonPhut + ' phút', '−' + t(r.phatMuon));
    if (r.khauTru) d_('Khấu trừ khác', h(r.ghiChu), '−' + t(r.khauTru));
    d_('Cộng các khoản khấu trừ', 'BH + công đoàn + thuế + khấu trừ khác', '−' + t(r.tongKhauTru));
    if (r.tamUng) d_('Tạm ứng kỳ I', '', '−' + t(r.tamUng));
    d_('<b>Lãnh kỳ II</b>', 'Tổng thu nhập − tạm ứng − các khoản khấu trừ', '<b style="color:var(--chinh-dam);font-size:15px">' + t(r.thucLinh) + '</b>');
    d_('', '<i>' + TL.docSo(r.thucLinh) + '</i>', '');
    m_('6. Doanh nghiệp đóng thêm');
    d_('BHXH / BHYT / BHTN / KPCĐ', App.so(cd.bh.dn.bhxh) + '% / ' + App.so(cd.bh.dn.bhyt) + '% / ' + App.so(cd.bh.dn.bhtn) + '% / ' + App.so(cd.bh.dn.kpcd) + '%', t(r.dn.tong));
    d_('<b>Tổng chi phí lương của doanh nghiệp</b>', '', '<b>' + t(r.chiPhiDN) + '</b>');
    App.hop({
      tieuDe: r.hoTen + ' – lương ' + App.tenKy(y, m).toLowerCase(),
      than: (r.canhBao && r.canhBao.length ? '<div class="canh-bao" style="margin-bottom:10px">' + r.canhBao.map(h).join('<br>') + '</div>' : '') + '<table class="ct-tinh">' + L.join('') + '</table>',
      nut: [{ ten: 'Xem phiếu lương', bam: function () { st.pl = r.nvId; location.hash = '#phieuluong'; } }, { ten: 'Đóng', loai: 'chinh' }]
    });
  };

  /* ---------- Xuất Excel ---------- */
  function xuatBL(bl) {
    var y = App.ky.y, m = App.ky.m, db = App.db;
    var cot = dsCot(bl).filter(function (c) { return !c.chiManHinh; }).map(function (c) {
      var x = Object.assign({}, c);
      if (!c.k && !c.f && !c.stt) x.f = function () { return ''; };
      return x;
    });
    cot.push({ t: 'Ký nhận', w: 11, f: function () { return ''; }, khongTong: true });
    var rows = locRows(bl.rows), dong = [];
    if (st.nhomPB) {
      nhomTheoPB(rows).forEach(function (g) {
        dong.push({ _kieu: 'nhom', _nhan: g.ten });
        g.rows.forEach(function (r) { dong.push(r); });
        dong.push(Object.assign(TL.congTong(g.rows, bl.phuCap), { _kieu: 'tong', _nhan: 'Cộng ' + g.ten }));
      });
    } else dong = rows;
    var tong = Object.assign(TL.congTong(rows, bl.phuCap), { _kieu: 'tong', _nhan: 'TỔNG CỘNG' });
    var tieuDe = (db.congTy.tieuDeBangLuong || 'BẢNG THANH TOÁN TIỀN LƯƠNG').toUpperCase();
    var sh = App.sheetBang({
      ten: 'Bảng lương T' + m, tieuDe: tieuDe, phuDe: 'Tháng ' + m + ' năm ' + y, quocHieu: true,
      cot: cot, dong: dong, tong: tong, cotNhanTong: 1, coCot: 2,
      dongCuoi: 'Tổng số tiền lãnh kỳ II (viết bằng chữ): ' + TL.docSo(tong.thucLinh)
    });
    App.xuatExcel('Bang_luong_T' + TL.pad(m) + '_' + y, [sh, sheetBH(bl)]);
  }

  function sheetBH(bl) {
    var cd = App.db.caiDat, y = App.ky.y, m = App.ky.m;
    var rows = locRows(bl.rows).filter(function (r) { return r.dongBH; });
    var cot = [
      { t: 'STT', stt: true, kieu: 'giua', w: 5 }, { t: 'Mã NV', k: 'ma', w: 8 }, { t: 'Họ và tên', k: 'hoTen', w: 22 },
      { t: 'Lương đóng BH', k: 'luongBH', kieu: 'so', w: 13 },
      { t: 'BHXH ' + App.so(cd.bh.nv.bhxh) + '%', nhom: 'Người lao động đóng', k: 'bhxh', kieu: 'so', w: 11 },
      { t: 'BHYT ' + App.so(cd.bh.nv.bhyt) + '%', nhom: 'Người lao động đóng', k: 'bhyt', kieu: 'so', w: 10 },
      { t: 'BHTN ' + App.so(cd.bh.nv.bhtn) + '%', nhom: 'Người lao động đóng', k: 'bhtn', kieu: 'so', w: 10 },
      { t: 'Cộng', nhom: 'Người lao động đóng', k: 'tongBH', kieu: 'so', w: 11 },
      { t: 'BHXH ' + App.so(cd.bh.dn.bhxh) + '%', nhom: 'Doanh nghiệp đóng', kieu: 'so', w: 11, f: function (r) { return r.dn.bhxh; } },
      { t: 'BHYT ' + App.so(cd.bh.dn.bhyt) + '%', nhom: 'Doanh nghiệp đóng', kieu: 'so', w: 10, f: function (r) { return r.dn.bhyt; } },
      { t: 'BHTN ' + App.so(cd.bh.dn.bhtn) + '%', nhom: 'Doanh nghiệp đóng', kieu: 'so', w: 10, f: function (r) { return r.dn.bhtn; } },
      { t: 'KPCĐ ' + App.so(cd.bh.dn.kpcd) + '%', nhom: 'Doanh nghiệp đóng', kieu: 'so', w: 10, f: function (r) { return r.dn.kpcd; } },
      { t: 'Cộng', nhom: 'Doanh nghiệp đóng', kieu: 'so', w: 11, f: function (r) { return r.dn.tong; } },
      { t: 'Tổng cộng', kieu: 'so', w: 13, f: function (r) { return r.tongBH + r.dn.tong; } }
    ];
    return App.sheetBang({ ten: 'Bảo hiểm T' + m, tieuDe: 'BẢNG TRÍCH NỘP BẢO HIỂM BẮT BUỘC VÀ KINH PHÍ CÔNG ĐOÀN', phuDe: 'Tháng ' + m + ' năm ' + y, cot: cot, dong: rows, tong: Object.assign(TL.congTong(rows), { _nhan: 'TỔNG CỘNG' }), cotNhanTong: 2 });
  }
  App.sheetBH = sheetBH;

  function xuatCK(bl) {
    var y = App.ky.y, m = App.ky.m;
    var rows = locRows(bl.rows).filter(function (r) { return r.thucLinh > 0; });
    var thieu = rows.filter(function (r) { return !r.soTK; }).length;
    var cot = [
      { t: 'STT', stt: true, kieu: 'giua', w: 5 }, { t: 'Họ và tên', k: 'hoTen', w: 24 }, { t: 'Số tài khoản', k: 'soTK', w: 18 },
      { t: 'Ngân hàng', k: 'nganHang', w: 16 }, { t: 'Số tiền', k: 'thucLinh', kieu: 'so', w: 14 },
      { t: 'Nội dung chuyển khoản', w: 40, f: function (r) { return App.boDau('Luong thang ' + m + '/' + y + ' ' + r.hoTen).toUpperCase(); }, khongTong: true }
    ];
    App.xuatExcel('Chuyen_khoan_luong_T' + TL.pad(m) + '_' + y, [App.sheetBang({
      ten: 'Chuyển khoản', tieuDe: 'DANH SÁCH CHUYỂN KHOẢN LƯƠNG KỲ II', phuDe: 'Tháng ' + m + ' năm ' + y, cot: cot, dong: rows,
      tong: { thucLinh: rows.reduce(function (s, r) { return s + r.thucLinh; }, 0), _nhan: 'TỔNG CỘNG' }, cotNhanTong: 1
    })]);
    if (thieu) App.bao(thieu + ' nhân viên chưa có số tài khoản.', 'loi');
  }

  /* ================= Phiếu lương ================= */
  function vePL(noi) {
    var db = App.db, y = App.ky.y, m = App.ky.m;
    var bl = TL.tinhBangLuong(db, y, m);
    var chon = st.pl;
    var opts = '<option value="">Tất cả nhân viên (' + bl.rows.length + ')</option>' +
      db.phongBan.map(function (p) { return '<option value="pb:' + h(p.ma) + '"' + (chon === 'pb:' + p.ma ? ' selected' : '') + '>' + h(p.ten) + '</option>'; }).join('') +
      '<optgroup label="Từng người">' + bl.rows.map(function (r) { return '<option value="' + r.nvId + '"' + (chon === r.nvId ? ' selected' : '') + '>' + h(r.ma + ' – ' + r.hoTen) + '</option>'; }).join('') + '</optgroup>';
    noi.innerHTML = '<div class="the khong-in" style="padding:12px 14px"><div class="hang"><select id="pl-chon">' + opts + '</select><span class="gian"></span>' +
      '<button class="nut" id="pl-xuat">' + App.icon('tai') + 'Xuất Excel</button><button class="nut chinh" id="pl-in">' + App.icon('in') + 'In phiếu lương</button></div>' +
      '<div class="mo nho" style="margin-top:8px">In ra giấy A4 dọc, mỗi trang 2 phiếu. Có thể chọn “Lưu thành PDF” trong hộp thoại in để gửi qua Zalo / email.</div></div>' +
      '<div class="ds-phieu" id="pl-ds"></div>';
    var ds = dsPhieu(bl, chon);
    App.$('#pl-ds').innerHTML = ds.length ? ds.map(function (r) { return phieu(r, bl); }).join('') : '<div class="trong">Không có nhân viên.</div>';
    App.$('#pl-chon').onchange = function () { st.pl = this.value; App.veLai(); };
    App.$('#pl-in').onclick = function () { App.inTrang(true); };
    App.$('#pl-xuat').onclick = function () { xuatPL(dsPhieu(bl, st.pl), bl); };
  }
  function dsPhieu(bl, chon) {
    return bl.rows.filter(function (r) { return !chon || (chon.indexOf('pb:') === 0 ? r.phongBan === chon.slice(3) : r.nvId === chon); });
  }
  function dongPhieu(r, bl) {
    var cd = App.db.caiDat, c = r.cong, L = [];
    L.push(['m', 'I. THU NHẬP', '']);
    if (r.luongSP) L.push(['c', 'Lương sản phẩm (' + App.tien(r.slSP) + ' × ' + App.tien(r.donGiaSP) + ' đ)', r.luongSP]);
    L.push(['c', 'Lương thời gian (' + App.so(c.congTG) + ' công)', r.luongTG]);
    if (r.luongNgung) L.push(['c', 'Nghỉ, ngừng việc hưởng lương (' + App.so(c.ngung) + ' công)', r.luongNgung]);
    if (r.tienOT) L.push(['c', 'Làm thêm giờ (' + App.so(c.otTong) + ' giờ)', r.tienOT]);
    (bl.phuCap || []).forEach(function (pc) {
      if (!r.phuCap[pc.ma]) return;
      L.push(['c', 'Phụ cấp ' + pc.ten.toLowerCase() + (pc.cachTinh === 'theo_ngay' ? ' (' + App.so((r.phuCapNgay || {})[pc.ma]) + ' ngày)' : ''), r.phuCap[pc.ma]]);
    });
    if (r.thuong) L.push(['c', 'Thưởng', r.thuong]);
    if (r.congKhac) L.push(['c', 'Khoản cộng khác', r.congKhac]);
    L.push(['m', 'Tổng thu nhập', r.tongThuNhap]);
    L.push(['m', 'II. CÁC KHOẢN KHẤU TRỪ', '']);
    if (r.bhxh) L.push(['c', 'BHXH (' + App.so(cd.bh.nv.bhxh) + '%)', r.bhxh]);
    if (r.bhyt) L.push(['c', 'BHYT (' + App.so(cd.bh.nv.bhyt) + '%)', r.bhyt]);
    if (r.bhtn) L.push(['c', 'BHTN (' + App.so(cd.bh.nv.bhtn) + '%)', r.bhtn]);
    if (r.doanPhi) L.push(['c', 'Công đoàn (' + App.so(cd.bh.doanPhi) + '%)', r.doanPhi]);
    L.push(['c', 'Thuế TNCN', r.thue]);
    if (r.phatMuon) L.push(['c', 'Phạt đi muộn / về sớm', r.phatMuon]);
    if (r.khauTru) L.push(['c', 'Khấu trừ khác' + (r.ghiChu ? ' (' + r.ghiChu + ')' : ''), r.khauTru]);
    L.push(['m', 'Cộng các khoản khấu trừ', r.tongKhauTru]);
    if (r.tamUng) L.push(['m', 'III. ĐÃ TẠM ỨNG KỲ I', r.tamUng]);
    L.push(['tl', 'LÃNH KỲ II', r.thucLinh]);
    return L;
  }
  function phieu(r, bl) {
    var db = App.db, y = App.ky.y, m = App.ky.m;
    var nv = db.nhanVien.filter(function (x) { return x.id === r.nvId; })[0];
    var pn = nv ? TL.phepNam(db, nv, y) : null;
    return '<div class="phieu"><div class="p-dau"><span><b>' + h(db.congTy.ten) + '</b></span><span>Kỳ lương: ' + TL.pad(m) + '/' + y + '</span></div>' +
      '<h3>PHIẾU LƯƠNG</h3><div class="p-ky">Tháng ' + m + ' năm ' + y + '</div>' +
      '<div class="p-tt"><div>Họ tên: <b>' + h(r.hoTen) + '</b></div><div>Mã NV: <b>' + h(r.ma) + '</b></div>' +
      '<div>Phòng ban: ' + h(r.tenPhongBan) + '</div><div>Chức danh: ' + h(r.chucVu) + '</div>' +
      '<div>Mức lương: <b>' + App.tien(r.luongCB) + '</b>' + (r.hinhThuc !== 'thang' ? ' ' + App.DV_LUONG[r.hinhThuc] : '') + '</div><div>Ngày công: <b>' + App.so(r.cong.congTG) + '</b> / ' + App.so(r.congChuan) + (r.cong.sp ? ' · SP: ' + App.so(r.cong.sp) : '') + '</div>' +
      (pn ? '<div>Phép năm còn lại: <b>' + App.so(pn.conLai) + '</b> ngày</div>' : '') + (r.cong.muonLan ? '<div>Đi muộn / về sớm: ' + r.cong.muonLan + ' lần</div>' : '') + '</div>' +
      '<table>' + dongPhieu(r, bl).map(function (x) { return '<tr class="' + x[0] + '"><td>' + h(x[1]) + '</td><td>' + (x[2] === '' ? '' : App.tien(x[2])) + '</td></tr>'; }).join('') + '</table>' +
      '<div class="bang-chu">Bằng chữ: ' + TL.docSo(r.thucLinh) + '</div>' +
      '<div class="ky-ten"><div>Người lập phiếu<span>(Ký, họ tên)</span>' + h(db.congTy.nguoiLap) + '</div><div>Người nhận<span>(Ký, họ tên)</span>' + h(r.hoTen) + '</div></div></div>';
  }
  function xuatPL(ds, bl) {
    var y = App.ky.y, m = App.ky.m, db = App.db, K = App.KIEU;
    var dong = [], gop = [], cao = {};
    ds.forEach(function (r) {
      var r0 = dong.length;
      dong.push([{ v: db.congTy.ten, s: { b: true } }, { v: 'Kỳ lương: ' + TL.pad(m) + '/' + y, s: { i: true, ngang: 'right' } }]);
      dong.push([{ v: 'PHIẾU LƯƠNG THÁNG ' + m + '/' + y, s: { b: true, sz: 14, ngang: 'center' } }]); gop.push('A' + (r0 + 2) + ':B' + (r0 + 2)); cao[r0 + 1] = 22;
      dong.push(['Họ tên: ' + r.hoTen + ' – Mã NV: ' + r.ma]);
      dong.push(['Phòng ban: ' + r.tenPhongBan + (r.chucVu ? ' – Chức danh: ' + r.chucVu : '')]);
      dong.push(['Mức lương: ' + App.tien(r.luongCB) + ' – Ngày công: ' + App.so(r.cong.congTG) + '/' + App.so(r.congChuan) + (r.cong.sp ? ' – SP: ' + App.so(r.cong.sp) : '')]);
      dongPhieu(r, bl).forEach(function (x) {
        var s1 = x[0] === 'c' ? K.chu : K.tong, s2 = x[0] === 'c' ? K.so : K.tongSo;
        dong.push([{ v: (x[0] === 'c' ? '   ' : '') + x[1], s: s1 }, { v: x[2] === '' ? '' : x[2], s: s2 }]);
      });
      dong.push([{ v: 'Bằng chữ: ' + TL.docSo(r.thucLinh), s: { i: true } }]);
      dong.push([{ v: 'Người lập phiếu', s: K.kyTen }, { v: 'Người nhận', s: K.kyTen }]);
      dong.push([], [], [], [{ v: db.congTy.nguoiLap || '', s: K.kyTen }, { v: r.hoTen, s: K.kyTen }], []);
    });
    App.xuatExcel('Phieu_luong_T' + TL.pad(m) + '_' + y, [{ ten: 'Phiếu lương', dong: dong, gop: gop, cao: cao, cot: [50, 20], ngang: false }]);
  }

  App.trang.bangluong = { ve: veBL };
  App.trang.phieuluong = { ve: vePL };
})();

</script>
<script>
/* ===== p-baocao.js ===== */
/* Trang Báo cáo: tổng hợp phòng ban, bảo hiểm, thuế TNCN năm, quỹ lương năm, phép năm, đi muộn – nghỉ */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  var st = { tab: 'pb' };
  var TABS = [
    ['pb', 'Tổng hợp theo phòng ban'],
    ['bh', 'Bảo hiểm & công đoàn'],
    ['thue', 'Thuế TNCN cả năm'],
    ['nam', 'Quỹ lương 12 tháng'],
    ['phep', 'Theo dõi phép năm'],
    ['cong', 'Đi muộn, nghỉ việc']
  ];

  function veBangChung(cot, rows, tong) {

          '</div><p class="mo nho">Theo Bộ luật Lao động 2019: làm thêm ngày thường ít nhất 150%, ngày nghỉ hằng tuần 200%, ngày lễ 300% (chưa kể lương ngày lễ). Phần chênh lệch so với lương giờ bình thường không chịu thuế TNCN.</p></div>' +
          '<div class="the"><h3>Khác</h3><div class="form ba">' +
          o('Làm tròn số tiền lãnh', 'caiDat.lamTron', [[1, 'Không làm tròn'], [100, 'Đến 100 đ'], [1000, 'Đến 1.000 đ']]) +
          o('Phạt đi muộn / về sớm mỗi lần (đ)', 'caiDat.phatMuonMoiLan', 'tien') + o('Phạt mỗi phút (đ)', 'caiDat.phatMuonMoiPhut', 'tien') +
          '</div></div>';
        break;
      case 'bh':
        html = '<div class="the"><h3>Tỷ lệ đóng (%)</h3><div class="form ba">' +
          '<h4>Người lao động</h4>' + o('BHXH', 'caiDat.bh.nv.bhxh', 'so') + o('BHYT', 'caiDat.bh.nv.bhyt', 'so') + o('BHTN', 'caiDat.bh.nv.bhtn', 'so') +
          o('Đoàn phí công đoàn (đoàn viên)', 'caiDat.bh.doanPhi', 'so', 'Tính trên lương đóng BHXH, tối đa 10% lương cơ sở') + '<span></span><span></span>' +
          '<h4>Doanh nghiệp</h4>' + o('BHXH (gồm ốm đau – thai sản, TNLĐ-BNN)', 'caiDat.bh.dn.bhxh', 'so') + o('BHYT', 'caiDat.bh.dn.bhyt', 'so') + o('BHTN', 'caiDat.bh.dn.bhtn', 'so') +
          o('Kinh phí công đoàn', 'caiDat.bh.dn.kpcd', 'so') +
          '</div></div><div class="the"><h3>Mức lương làm căn cứ</h3><div class="form ba">' +
          o('Lương cơ sở (đ/tháng)', 'caiDat.luongCoSo', 'tien', 'Trần đóng BHXH, BHYT = 20 × lương cơ sở = ' + App.tien(20 * cd.luongCoSo)) +
          o('Vùng lương tối thiểu', 'caiDat.vung', [['I', 'Vùng I'], ['II', 'Vùng II'], ['III', 'Vùng III'], ['IV', 'Vùng IV']], 'Chọn vùng sẽ điền mức lương tối thiểu năm 2026') +
          o('Lương tối thiểu vùng (đ/tháng)', 'caiDat.luongToiThieuVung', 'tien', 'Trần đóng BHTN = 20 × lương tối thiểu vùng = ' + App.tien(20 * cd.luongToiThieuVung)) +
          o('Không đóng BH khi nghỉ không lương từ (ngày)', 'caiDat.nguongNghiKhongDongBH', 'so') +
          '</div><p class="mo nho">Mặc định: lương cơ sở 2.530.000 đ (từ 01/7/2026), lương tối thiểu vùng theo Nghị định 293/2025/NĐ-CP (vùng I 5.310.000 đ). Khi Nhà nước điều chỉnh, sửa lại ở đây rồi tính lại các kỳ chưa chốt.</p></div>';
        break;
      case 'thue':
        html = '<div class="the"><h3>Giảm trừ gia cảnh</h3><div class="form">' +
          o('Giảm trừ bản thân (đ/tháng)', 'caiDat.giamTruBanThan', 'tien') + o('Giảm trừ mỗi người phụ thuộc (đ/tháng)', 'caiDat.giamTruNPT', 'tien') +
          o('Thuế suất khấu trừ (HĐ dưới 3 tháng) (%)', 'caiDat.thueKhauTru', 'so') + o('Khấu trừ khi thu nhập từ (đ)', 'caiDat.nguongKhauTru', 'tien') +
          '</div></div><div class="the"><h3>Biểu thuế lũy tiến từng phần (thu nhập tính thuế / tháng)</h3><div class="cuon" style="max-width:520px"><table class="bang" id="bieu-thue"><thead><tr><th>Bậc</th><th class="so">Đến (đ)</th><th class="so">Thuế suất (%)</th><th></th></tr></thead><tbody>' +
          cd.bieuThue.map(function (b, i) {
            return '<tr data-i="' + i + '"><td class="giua">' + (i + 1) + '</td><td><input class="o-nhap" data-b="den" value="' + (b.den ? App.tien(b.den) : '') + '" placeholder="trở lên"></td><td><input class="o-nhap" data-b="ts" value="' + App.so(b.ts) + '"></td><td><button class="nut nho nguy" data-a="xoa">' + App.icon('xoa') + '</button></td></tr>';
          }).join('') + '</tbody></table></div><div class="hang" style="margin-top:10px"><button class="nut" id="bt-them">' + App.icon('them') + 'Thêm bậc</button><button class="nut" id="bt-goc">Khôi phục biểu 5 bậc (Luật Thuế TNCN 2025)</button></div>' +
          '<p class="mo nho">Mặc định theo Luật Thuế TNCN số 109/2025/QH15, áp dụng cho thu nhập từ tiền lương, tiền công từ kỳ tính thuế 2026: đến 10 triệu 5%, 10–30 triệu 10%, 30–60 triệu 20%, 60–100 triệu 30%, trên 100 triệu 35%; giảm trừ bản thân 15,5 triệu, người phụ thuộc 6,2 triệu. Bậc cuối để trống ô “Đến”.</p></div>';
        break;
      case 'dl':
        var kb = Math.round(JSON.stringify(db).length / 1024);
        html = '<div class="the"><h3>Sao lưu & khôi phục</h3><p style="margin-top:0">Dữ liệu được lưu tự động trong trình duyệt của máy này (' + App.so(kb) + ' KB). Nếu xoá lịch sử trình duyệt hoặc đổi máy sẽ mất, nên <b>sao lưu ra file mỗi tuần</b> (chép vào USB, Google Drive…). ' +
          (db.lanSaoLuu ? 'Lần sao lưu gần nhất: <b>' + new Date(db.lanSaoLuu).toLocaleString('vi-VN') + '</b>.' : '<b style="color:var(--do)">Chưa sao lưu lần nào.</b>') + '</p>' +
          '<div class="hang"><button class="nut chinh" id="dl-luu">' + App.icon('tai') + 'Sao lưu ra file</button><label class="nut">' + App.icon('nhap') + 'Khôi phục từ file…<input type="file" id="dl-mo" accept=".json" class="an"></label></div>' +
          '<p class="mo nho">Khôi phục sẽ thay toàn bộ dữ liệu hiện tại bằng dữ liệu trong file sao lưu. Muốn dùng trên máy khác: sao lưu ở máy này rồi khôi phục ở máy kia.</p></div>' +
          '<div class="the"><h3>Làm lại từ đầu</h3><div class="hang"><button class="nut" id="dl-mau">Nạp lại dữ liệu mẫu</button><button class="nut nguy" id="dl-xoa">' + App.icon('xoa') + 'Xoá toàn bộ dữ liệu</button></div>' +
          '<p class="mo nho">Cả hai thao tác đều xoá dữ liệu hiện tại – hãy sao lưu trước.</p></div>';
        break;
    }
    el.innerHTML = html;
    App.$$('input.tien', el).forEach(App.ganOTien);
    el.onchange = function (e) {
      var i = e.target;
      if (i.dataset.nghi != null) {
        var t = +i.dataset.nghi, ds = cd.nghiTuan.filter(function (x) { return x !== t; });
        if (i.checked) ds.push(t);
        cd.nghiTuan = ds.sort(); App.luu(); App.bao('Đã lưu'); return;
      }
      if (i.dataset.b) {
        var b = cd.bieuThue[+i.closest('tr').dataset.i];
        if (i.dataset.b === 'den') b.den = App.docSo(i.value) || null; else b.ts = App.docSo(i.value);
        App.luu(); App.bao('Đã lưu'); return;
      }
      if (i.id === 'dl-mo') { khoiPhuc(i.files[0]); return; }
      var p = i.dataset.p; if (!p) return;
      var v = i.dataset.k === 'bool' ? i.checked : i.dataset.k === 'so' ? App.docSo(i.value) : i.value;
      datPath(App.db, p, v);
      if (p === 'caiDat.vung' && LTTV[v]) { cd.luongToiThieuVung = LTTV[v]; }
      App.luu(); App.bao('Đã lưu');
      if (p === 'caiDat.ngayDauKy') { try { sessionStorage.removeItem('ChamCong_ky'); } catch (er) { /* bỏ qua */ } App.ky = App.kyMacDinh(); }
      if (/^caiDat\.(vung|ngayDauKy|congChuan|luongCoSo|luongToiThieuVung)/.test(p) || p === 'congTy.ten') App.veLai();
    };
    el.onclick = function (e) {
      if (e.target.closest('[data-a="xoa"]') && e.target.closest('#bieu-thue')) { cd.bieuThue.splice(+e.target.closest('tr').dataset.i, 1); App.luu(); App.veLai(); return; }
      if (e.target.closest('#bt-them')) { cd.bieuThue.push({ den: null, ts: 35 }); App.luu(); App.veLai(); return; }
      if (e.target.closest('#bt-goc')) { cd.bieuThue = TL.caiDatMacDinh().bieuThue; App.luu(); App.veLai(); return; }
      if (e.target.closest('#dl-luu')) { saoLuu(); return; }
      if (e.target.closest('#dl-mau')) {
        App.xacNhan('Xoá dữ liệu hiện tại và nạp lại dữ liệu mẫu?', { nut: 'Nạp dữ liệu mẫu', nguy: true }).then(function (ok) {
          if (!ok) return; App.db = App.taoMau(); App.luuNgay(); App.ky = App.kyMacDinh(); App.veLai(); App.bao('Đã nạp dữ liệu mẫu', 'tot');
        });
        return;
      }
      if (e.target.closest('#dl-xoa')) {
        App.xacNhan('<b>Xoá toàn bộ dữ liệu</b> (nhân viên, chấm công, bảng lương, cài đặt)? Không thể hoàn tác nếu chưa sao lưu.', { nut: 'Xoá hết', nguy: true }).then(function (ok) {
          if (!ok) return; App.db = TL.duLieuMoi(); App.luuNgay(); App.veLai(); App.bao('Đã xoá toàn bộ dữ liệu');
        });
      }
    };
  }

  function saoLuu() {
    App.db.lanSaoLuu = new Date().toISOString();
    App.luuNgay();
    var d = new Date(), ten = 'SaoLuu_ChamCong_' + d.getFullYear() + TL.pad(d.getMonth() + 1) + TL.pad(d.getDate()) + '_' + TL.pad(d.getHours()) + TL.pad(d.getMinutes()) + '.json';
    App.XL.taiXuong(ten, new Blob([JSON.stringify(App.db)], { type: 'application/json' }));
    App.bao('Đã sao lưu: ' + ten, 'tot');
    App.veLai();
  }

  function khoiPhuc(f) {
    if (!f) return;
    f.text().then(function (s) {
      var d = JSON.parse(s);
      if (!d || !Array.isArray(d.nhanVien) || !d.caiDat) throw new Error('File không phải bản sao lưu của phần mềm này.');
      return App.xacNhan('Khôi phục từ file <b>' + h(f.name) + '</b> (' + d.nhanVien.length + ' nhân viên, ' + Object.keys(d.thang || {}).length + ' tháng dữ liệu)? Dữ liệu hiện tại sẽ bị thay thế.', { nut: 'Khôi phục', nguy: true }).then(function (ok) {
        if (!ok) return;
        App.db = TL.chuanHoa(d); App.luuNgay(); App.ky = App.kyMacDinh(); App.veLai(); App.bao('Đã khôi phục dữ liệu', 'tot');
      });
    }).catch(function (e) { App.bao('Không đọc được file: ' + e.message, 'loi'); });
  }

  App.trang.danhmuc = { ve: veDM, khongKy: true };
  App.trang.caidat = { ve: veCD, khongKy: true };
})();

</script>
</body>
</html>
