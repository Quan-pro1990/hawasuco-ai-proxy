  /* ================= Ô chọn bảng / chức danh / bậc (dùng chung: trang xếp lương, hồ sơ) ================= */

  /** HTML 3 ô chọn; x = nv.xepLuong (có thể null) */
  App.oChonBac = function (x, attr) {
    var db = App.db, b = x && TL.timBangLuong(db, x.bang), g = b && TL.timNgach(b, x.ngach);
    attr = attr || '';
    var s = '<select data-xl="bang" ' + attr + '><option value="">(Chưa xếp)</option>' + db.thangLuong.map(function (t) { return '<option value="' + h(t.ma) + '"' + (b === t ? ' selected' : '') + '>' + h(t.ten) + '</option>'; }).join('') + '</select>';
    s += '<select data-xl="ngach" ' + attr + (b ? '' : ' disabled') + '>' + (b ? b.ngach.map(function (n) { return '<option value="' + h(n.ma) + '"' + (g === n ? ' selected' : '') + '>' + h(n.ten) + '</option>'; }).join('') : '') + '</select>';
    var sb = g ? TL.soBacNgach(g, db, b) : 0, bac = x ? +x.bac || 1 : 1, ob = '';
    for (var k = 1; k <= Math.max(sb, g ? bac : 0); k++) ob += '<option value="' + k + '"' + (k === bac ? ' selected' : '') + '>' + h(App.moTaBac(b, g, k)) + '</option>';
    s += '<select data-xl="bac" ' + attr + (g ? '' : ' disabled') + '>' + ob + '</select>';
    return s;
  };
  /** Đọc thay đổi từ ô chọn → xepLuong mới (null = bỏ xếp) */
  App.docChonBac = function (cu, truong, giaTri) {
    var db = App.db, x = cu ? Object.assign({}, cu) : null;
    if (truong === 'bang') {
      if (!giaTri) return null;
      var b = TL.timBangLuong(db, giaTri);
      if (!b || !b.ngach.length) { App.bao('Bảng lương này chưa có chức danh (Danh mục → Thang, bảng lương).', 'loi'); return cu; }
      return { bang: b.ma, ngach: b.ngach[0].ma, bac: 1, ngayHuong: (x && x.ngayHuong) || App.homNay() };
    }
    if (!x) return x;
    if (truong === 'ngach') { x.ngach = giaTri; var g = TL.timNgach(TL.timBangLuong(db, x.bang), giaTri); x.bac = Math.min(+x.bac || 1, Math.max(1, TL.soBacNgach(g, db, TL.timBangLuong(db, x.bang)))); }
    if (truong === 'bac') x.bac = +giaTri;
    if (truong === 'ngayHuong') x.ngayHuong = giaTri;
    return x;
  };

  /* ================= Trang Xếp lương, nâng bậc ================= */

  var TABS = [['xep', 'Xếp lương nhân viên'], ['han', 'Đến hạn nâng bậc']];

  function ve(noi) {
    noi.innerHTML = '<div class="tabs khong-in">' + TABS.map(function (t) { return '<button data-t="' + t[0] + '"' + (st.tab === t[0] ? ' class="chon"' : '') + '>' + t[1] + '</button>'; }).join('') + '</div><div id="nb-noi"></div>';
    App.$('.tabs', noi).onclick = function (e) { var b = e.target.closest('[data-t]'); if (b) { st.tab = b.dataset.t; App.veLai(); } };
    if (!App.db.thangLuong.length) {
      App.$('#nb-noi').innerHTML = '<div class="the canh-bao">Chưa có thang, bảng lương. Vào <a href="#danhmuc" id="nb-dm">Danh mục → Thang, bảng lương</a> để khai báo các bảng, chức danh và bậc lương.</div>';
      App.$('#nb-dm').onclick = function () { App.moDanhMuc && App.moDanhMuc('bl'); };
      return;
    }
    (st.tab === 'han' ? veHan : veXep)(App.$('#nb-noi'));
  }

  function dsNV() {
    return App.db.nhanVien.filter(function (nv) {
      if (nv.trangThai === 'nghi_viec') return false;
      if (st.pb && nv.phongBan !== st.pb) return false;
      if (st.chuaXep && TL.xepLuongNV(App.db, nv)) return false;
      if (st.tim && !App.timKhop(nv.ma + ' ' + nv.hoTen + ' ' + (nv.chucVu || ''), st.tim)) return false;
      return true;
    }).sort(function (a, b) { return String(a.ma).localeCompare(String(b.ma), 'vi', { numeric: true }); });
  }

  function veXep(el) {
    var db = App.db, ds = dsNV(), hn = App.homNay();
    var lech = 0;
    var rows = ds.map(function (nv, i) {
      var xl = TL.xepLuongNV(db, nv), ht = nv.hinhThuc || 'thang';
      var apCB = xl && (xl.apDung === 'cb' || xl.apDung === 'ca_hai'), apBH = xl && (xl.apDung === 'bh' || xl.apDung === 'ca_hai');
      var lechCB = apCB && (ht === 'thang' || ht === 'khoan') && +nv.luongCB !== xl.tien, lechBH = apBH && +nv.luongBH !== xl.tien;
      if (lechCB || lechBH) lech++;
      var hanTxt = !xl ? '' : xl.bacCuoi ? '<span class="mo">Bậc cuối</span>' : xl.ngayNang ? TL.hienNgay(xl.ngayNang) + (xl.ngayNang <= hn ? ' <span class="the-tt do">Đến hạn</span>' : '') : '<span class="mo">Nhập ngày hưởng</span>';
      return '<tr data-id="' + nv.id + '"><td class="giua">' + (i + 1) + '</td><td>' + h(nv.ma) + '</td><td class="ten"><span class="lk" data-hs="' + nv.id + '">' + h(nv.hoTen) + '</span></td>' +
        '<td>' + h(TL.tenPhongBan(db, nv.phongBan)) + '</td><td>' + h(nv.chucVu || '') + '</td>' +
        '<td><div class="chon-bac">' + App.oChonBac(nv.xepLuong) + '</div></td>' +
        '<td class="so">' + (xl && xl.heSo != null ? App.soHS(xl.heSo) : '') + '</td><td class="so"><b>' + (xl && xl.tien ? App.tien(xl.tien) : '') + '</b></td>' +
        '<td><input type="date" data-xl="ngayHuong" value="' + h(xl ? xl.ngayHuong : '') + '"' + (xl ? '' : ' disabled') + '></td>' +
        '<td class="so">' + App.tien(nv.luongCB) + (ht !== 'thang' && ht !== 'khoan' ? ' <span class="mo nho">' + App.DV_LUONG[ht] + '</span>' : '') + (lechCB ? ' <span class="the-tt cam" title="Khác mức theo bảng">≠</span>' : '') + '</td>' +
        '<td class="so">' + (+nv.luongBH ? App.tien(nv.luongBH) : '<span class="mo">theo lương</span>') + (lechBH ? ' <span class="the-tt cam" title="Khác mức theo bảng">≠</span>' : '') + '</td>' +
        '<td class="giua">' + hanTxt + '</td>' +
        '<td class="khong-in">' + (xl && !xl.bacCuoi ? '<button class="nut nho" data-a="nang">' + App.icon('bac') + 'Nâng bậc…</button>' : '') + '</td></tr>';
    }).join('');
    el.innerHTML = '<div class="the khong-in"><div class="hang">' +
      '<input type="search" id="nb-tim" placeholder="Tìm mã, tên, chức vụ…" value="' + h(st.tim) + '" style="width:220px">' +
      '<select id="nb-pb">' + App.optDonVi(st.pb, { tatCa: 'Tất cả phòng / đội' }) + '</select>' +
      '<label class="chk"><input type="checkbox" id="nb-chua"' + (st.chuaXep ? ' checked' : '') + '> Chỉ người chưa xếp</label><span class="gian"></span>' +
      (lech ? '<button class="nut" id="nb-ap" title="Ghi mức theo bảng vào mức lương / lương đóng BH của những người đang lệch">Áp lương theo bảng (' + lech + ')</button>' : '') +
      '<button class="nut" id="nb-xuat">' + App.icon('tai') + 'Xuất Excel</button></div>' +
      '<p class="mo nho" style="margin:8px 0 0">Chọn bảng – chức danh – bậc để <b>xếp lương ban đầu</b> hoặc sửa sai: mức theo bảng ghi ngay vào mức lương / lương đóng BH (tuỳ “Dùng cho” của bảng), áp dụng cho các kỳ chưa chốt. ' +
      '<b>Nâng bậc</b> có hiệu lực từ một ngày thì bấm “Nâng bậc…” để lập quyết định: các kỳ trước ngày hiệu lực vẫn tính lương cũ.</p></div>' +
      App.dauIn('DANH SÁCH XẾP LƯƠNG', 'Ngày ' + new Date().toLocaleDateString('vi-VN')) +
      '<div class="cuon cao"><table class="bang" id="nb-bang"><thead><tr><th>STT</th><th>Mã NV</th><th style="min-width:150px">Họ và tên</th><th>Phòng / đội</th><th>Chức vụ</th>' +
      '<th>Bảng lương · chức danh · bậc</th><th>Hệ số</th><th class="so">Mức theo bảng</th><th>Hưởng bậc từ</th><th class="so">Mức lương</th><th class="so">Lương đóng BH</th><th>Nâng bậc tiếp</th><th class="khong-in"></th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="13" class="trong">Không có nhân viên phù hợp.</td></tr>') + '</tbody></table></div>';

    App.$('#nb-tim').oninput = function () { st.tim = this.value; var p = this.selectionStart; App.veLai(); var t = App.$('#nb-tim'); t.focus(); t.setSelectionRange(p, p); };
    App.$('#nb-pb').onchange = function () { st.pb = this.value; App.veLai(); };
    App.$('#nb-chua').onchange = function () { st.chuaXep = this.checked; App.veLai(); };

    App.$('#nb-xuat').onclick = function () { xuatXep(ds); };
    var bang = App.$('#nb-bang');
    bang.onchange = function (e) {
      var i = e.target, tr = i.closest('tr[data-id]'); if (!tr || !i.dataset.xl) return;

      if (d.luongCB) tb.push('mức lương ' + App.tien(d.luongCB[0]) + ' → ' + App.tien(d.luongCB[1]));
      if (d.luongBH) tb.push('lương đóng BH ' + App.tien(d.luongBH[0]) + ' → ' + App.tien(d.luongBH[1]));
      App.bao(nv.hoTen + ': ' + (moi ? App.moTaXepLuong(nv) : 'bỏ xếp bảng lương (giữ mức lương hiện tại)') + (tb.length ? '; ' + tb.join(', ') : ''), 'tot');

    };

      var a = e.target.closest('[data-a="nang"]'); if (!a) return;
      App.nangBac(App.timNV(a.closest('tr').dataset.id));
    };
  }

  /** Mở quyết định nâng lương điền sẵn bậc kế tiếp */
  App.nangBac = function (nv, hieuLuc) {
    var xl = TL.xepLuongNV(App.db, nv);
    if (!xl || xl.bacCuoi) { App.bao('Nhân viên đã ở bậc cuối hoặc chưa xếp bảng lương.', 'loi'); return; }
    App.formQuyetDinh(nv, null, 'nang_luong', function () { App.veLai(); }, {
      hieuLuc: hieuLuc || (xl.ngayNang && xl.ngayNang > App.homNay() ? xl.ngayNang : App.homNay()), bacMoi: xl.bac + 1,
      noiDung: 'Nâng bậc lương thường xuyên: ' + xl.ngach.ten + ' bậc ' + xl.bac + ' lên bậc ' + (xl.bac + 1)
    });
  };

  function dongHan() {
    var db = App.db, hn = App.homNay(), den;
    if (st.han === 'qua') den = hn;
    else den = TL.themThangISO(hn, +st.han);
    var rows = [];
    db.nhanVien.forEach(function (nv) {
      if (nv.trangThai === 'nghi_viec') return;
      if (st.pb && nv.phongBan !== st.pb) return;
      var xl = TL.xepLuongNV(db, nv);
      if (!xl || !xl.ngayNang || xl.ngayNang > den) return;
      rows.push({ nv: nv, xl: xl, qua: xl.ngayNang <= hn ? Math.round((new Date(hn) - new Date(xl.ngayNang)) / 864e5) : -1 });
    });
    return rows.sort(function (a, b) { return a.xl.ngayNang < b.xl.ngayNang ? -1 : 1; });
  }

  var COT_HAN = [
    { t: 'STT', stt: true, w: 5, kieu: 'giua' }, { t: 'Mã NV', w: 8, f: function (r) { return r.nv.ma; } }, { t: 'Họ và tên', w: 22, f: function (r) { return r.nv.hoTen; } },
    { t: 'Phòng / đội', w: 22, f: function (r) { return TL.tenPhongBan(App.db, r.nv.phongBan); } },
    { t: 'Bảng lương', w: 24, f: function (r) { return r.xl.bang.ten; } }, { t: 'Chức danh', w: 22, f: function (r) { return r.xl.ngach.ten; } },
    { t: 'Bậc hiện tại', w: 8, kieu: 'giua', f: function (r) { return r.xl.bac + '/' + r.xl.soBac; } },
    { t: 'Hệ số / mức hiện tại', w: 14, kieu: 'so', f: function (r) { return r.xl.heSo != null ? App.soHS(r.xl.heSo) : r.xl.tien; } },
    { t: 'Hưởng từ', w: 11, kieu: 'giua', f: function (r) { return TL.hienNgay(r.xl.ngayHuong); } },
    { t: 'Đến hạn nâng', w: 11, kieu: 'giua', f: function (r) { return TL.hienNgay(r.xl.ngayNang); } },
    { t: 'Bậc mới', w: 8, kieu: 'giua', f: function (r) { return r.xl.bac + 1; } },
    { t: 'Hệ số / mức mới', w: 14, kieu: 'so', f: function (r) { return r.xl.bacSau ? (r.xl.bacSau.heSo != null ? App.soHS(r.xl.bacSau.heSo) : r.xl.bacSau.tien) : ''; } },
    { t: 'Ghi chú', w: 30, f: function (r) { return [r.xl.keoDai ? 'Kéo dài ' + r.xl.keoDai + ' tháng do kỷ luật' : '', r.qua > 0 ? 'Đã quá hạn ' + r.qua + ' ngày' : r.qua === 0 ? 'Đến hạn hôm nay' : ''].filter(Boolean).join('; '); } }
  ];

  function veHan(el) {
    var rows = dongHan(), nhan = { qua: 'Đã đến hạn (tính đến hôm nay)', 1: 'Đến hạn trong 1 tháng tới', 3: 'Đến hạn trong 3 tháng tới', 6: 'Đến hạn trong 6 tháng tới', 12: 'Đến hạn trong 12 tháng tới' };
    var tieuDe = 'DANH SÁCH NHÂN VIÊN ĐẾN HẠN NÂNG BẬC LƯƠNG', phuDe = nhan[st.han] + ' – ngày ' + new Date().toLocaleDateString('vi-VN');
    el.innerHTML = '<div class="the khong-in"><div class="hang"><select id="nb-han">' + opts(nhan, st.han) + '</select>' +
      '<select id="nb-pb">' + App.optDonVi(st.pb, { tatCa: 'Tất cả phòng / đội' }) + '</select><span class="gian mo nho">' + rows.length + ' người. Thời gian nâng bậc theo chức danh / bảng lương; kỷ luật “kéo dài thời hạn nâng lương” cộng thêm 6 tháng.</span>' +
      '<button class="nut" id="nb-xuat">' + App.icon('tai') + 'Xuất Excel</button><button class="nut" id="nb-in">' + App.icon('in') + 'In</button></div></div>' +
      App.dauIn(tieuDe, phuDe) +
      '<div class="cuon cao"><table class="bang" id="nb-bang"><thead><tr>' + COT_HAN.map(function (c) { return '<th' + (c.kieu === 'so' ? ' class="so"' : '') + '>' + c.t + '</th>'; }).join('') + '<th class="khong-in"></th></tr></thead><tbody>' +
      (rows.length ? rows.map(function (r, i) {
        return '<tr data-id="' + r.nv.id + '">' + COT_HAN.map(function (c) {
          var v = c.stt ? i + 1 : c.f(r);
          if (c.t === 'Họ và tên') v = '<span class="lk" data-hs="' + r.nv.id + '">' + h(v) + '</span>';
          else if (c.kieu === 'so' && typeof v === 'number') v = App.tien(v);
          else if (c.t === 'Đến hạn nâng') v = h(v) + (r.qua >= 0 ? ' <span class="the-tt do">Đến hạn</span>' : '');
          else v = h(v);
          return '<td' + (c.kieu === 'so' ? ' class="so"' : c.kieu === 'giua' ? ' class="giua"' : '') + '>' + v + '</td>';
        }).join('') + '<td class="khong-in"><button class="nut nho chinh" data-a="nang">' + App.icon('bac') + 'Nâng bậc…</button></td></tr>';
      }).join('') : '<tr><td colspan="' + (COT_HAN.length + 1) + '" class="trong">Không có nhân viên đến hạn nâng bậc trong khoảng này.</td></tr>') +
      '</tbody></table></div>';
    App.$('#nb-han').onchange = function () { st.han = this.value; App.veLai(); };
    App.$('#nb-pb').onchange = function () { st.pb = this.value; App.veLai(); };
    App.$('#nb-in').onclick = function () { App.inTrang(false); };
    App.$('#nb-xuat').onclick = function () {
      App.xuatExcel('Den_han_nang_bac_luong', [App.sheetBang({ ten: 'Đến hạn nâng bậc', tieuDe: tieuDe, phuDe: phuDe, cot: COT_HAN, dong: rows, chuKy: true })]);
    };
    App.$('#nb-bang').onclick = function (e) {
      var s = e.target.closest('[data-hs]'); if (s) { App.moHoSo(s.dataset.hs, 'congviec'); return; }
      var a = e.target.closest('[data-a="nang"]'); if (!a) return;
      var nv = App.timNV(a.closest('tr').dataset.id), xl = TL.xepLuongNV(App.db, nv);
      App.nangBac(nv, xl.ngayNang);
    };
  }

  function xuatXep(ds) {
    var db = App.db;
    var dong = ds.map(function (nv) { return { nv: nv, xl: TL.xepLuongNV(db, nv) }; });
    App.xuatExcel('Xep_luong_nhan_vien', [App.sheetBang({
      ten: 'Xếp lương', tieuDe: 'DANH SÁCH XẾP LƯƠNG NHÂN VIÊN', phuDe: 'Ngày ' + new Date().toLocaleDateString('vi-VN'), chuKy: true,
      cot: [{ t: 'STT', stt: true, w: 5, kieu: 'giua' }, { t: 'Mã NV', w: 8, f: function (r) { return r.nv.ma; } }, { t: 'Họ và tên', w: 22, f: function (r) { return r.nv.hoTen; } },
        { t: 'Phòng / đội', w: 22, f: function (r) { return TL.tenPhongBan(db, r.nv.phongBan); } }, { t: 'Chức vụ', w: 16, f: function (r) { return r.nv.chucVu || ''; } },
        { t: 'Bảng lương', w: 24, f: function (r) { return r.xl ? r.xl.bang.ten : ''; } }, { t: 'Chức danh', w: 22, f: function (r) { return r.xl ? r.xl.ngach.ten : ''; } },
        { t: 'Bậc', w: 6, kieu: 'giua', f: function (r) { return r.xl ? r.xl.bac + '/' + r.xl.soBac : ''; } },
        { t: 'Hệ số', w: 8, f: function (r) { return r.xl && r.xl.heSo != null ? App.soHS(r.xl.heSo) : ''; } },
        { t: 'Mức theo bảng', w: 13, kieu: 'so', f: function (r) { return r.xl ? r.xl.tien : ''; } },
        { t: 'Hưởng từ', w: 11, kieu: 'giua', f: function (r) { return r.xl ? TL.hienNgay(r.xl.ngayHuong) : ''; } },
        { t: 'Nâng bậc tiếp', w: 11, kieu: 'giua', f: function (r) { return r.xl ? (r.xl.bacCuoi ? 'Bậc cuối' : TL.hienNgay(r.xl.ngayNang)) : ''; } },
        { t: 'Mức lương', w: 13, kieu: 'so', f: function (r) { return +r.nv.luongCB || 0; } }, { t: 'Lương đóng BH', w: 13, kieu: 'so', f: function (r) { return +r.nv.luongBH || ''; } }],
      dong: dong
    })]);
  }

  App.trang.nangbac = { ve: ve, khongKy: true };
})();

</script>
<script>
/* ===== p-mucluong.js ===== */
/* Trang "Mức lương theo kỳ": nhập các mức thay đổi theo thời gian, mỗi lần thay đổi là 1 "mức áp dụng từ kỳ":
   giá trị từng bậc của thang bảng lương, lương cơ sở, tiền cơm (phụ cấp mức chung), tạm ứng kỳ I theo chức vụ.
   Kỳ trước mức đầu tiên dùng "mức ban đầu" (danh mục, cài đặt). Bảng lương mỗi kỳ tự lấy đúng mức của kỳ đó. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  var NF_HS = new Intl.NumberFormat('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 3 });
  var st = { chon: null };

  function docHS(s) { var n = parseFloat(String(s == null ? '' : s).trim().replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? 0 : n; }
  function kyHien(k) { return k ? k.slice(5, 7) + '/' + k.slice(0, 4) : ''; }
  function kySau(k, n) { var y = +k.slice(0, 4), m = +k.slice(5, 7) + (n || 1); while (m > 12) { m -= 12; y++; } return TL.khoaKy(y, m); }

  /* ================= Mức đang chọn (dùng chung với Danh mục → Thang, bảng lương) ================= */
  var ML = App.ML = {
    /** id mức đang chọn: 'goc' = mức ban đầu, hoặc id đợt */
    chon: function () {
      var db = App.db;
      if (st.chon && (st.chon === 'goc' || db.dotLuong.some(function (d) { return d.id === st.chon; }))) return st.chon;
      var d = TL.dotTaiKy(db, TL.kyHienHanh(db));
      return d ? d.id : 'goc';
    },
    datChon: function (id) { st.chon = id; },
    dot: function () { var id = ML.chon(); return id === 'goc' ? null : App.db.dotLuong.filter(function (d) { return d.id === id; })[0] || null; },
    /** Kỳ đại diện của mức đang chọn (để đọc giá trị đã áp dụng) */
    ky: function () { var d = ML.dot(); return d ? d.tuKy : '0000-00'; },
    ten: function (d) { return d ? 'Từ kỳ ' + kyHien(d.tuKy) : 'Mức ban đầu'; },
    /** Giá trị bậc (số gốc: tiền hoặc hệ số) của mức đang chọn */
    docBac: function (b, g, k) {
      var d = ML.dot();
      if (!d) return (g.bac || [])[k];
      var x = d.bang && d.bang[b.ma] && d.bang[b.ma].ngach && d.bang[b.ma].ngach[g.ma];
      if (Array.isArray(x)) return x[k];
      return TL.bacNgach(App.db, b, g, d.tuKy)[k];
    },
    ghiBac: function (b, g, k, v) {
      var d = ML.dot();
      if (!d) { while (g.bac.length <= k) g.bac.push(''); g.bac[k] = v; return; }
      d.bang = d.bang || {};
      var x = d.bang[b.ma] = d.bang[b.ma] || { mucCoSo: '', ngach: {} };
      x.ngach = x.ngach || {};
      if (!Array.isArray(x.ngach[g.ma])) x.ngach[g.ma] = TL.bacNgach(App.db, b, g, d.tuKy).slice();
      while (x.ngach[g.ma].length <= k) x.ngach[g.ma].push('');
      x.ngach[g.ma][k] = v;
    },
    docMucCoSo: function (b) { var d = ML.dot(); return d ? (d.bang && d.bang[b.ma] && d.bang[b.ma].mucCoSo) || '' : b.mucCoSo || ''; },
    ghiMucCoSo: function (b, v) {
      var d = ML.dot();
      if (!d) { b.mucCoSo = v; return; }
      d.bang = d.bang || {};
      (d.bang[b.ma] = d.bang[b.ma] || { mucCoSo: '', ngach: {} }).mucCoSo = v;
    },
    /** Dọn dữ liệu các mức khi đổi cấu trúc danh mục */
    botBac: function (b) { App.db.dotLuong.forEach(function (d) { var x = d.bang && d.bang[b.ma]; if (x && x.ngach) Object.keys(x.ngach).forEach(function (m) { if (x.ngach[m].length > b.soBac) x.ngach[m].length = b.soBac; }); }); },
    xoaNgach: function (b, g) { App.db.dotLuong.forEach(function (d) { var x = d.bang && d.bang[b.ma]; if (x && x.ngach) delete x.ngach[g.ma]; }); },
    xoaBang: function (b) { App.db.dotLuong.forEach(function (d) { if (d.bang) delete d.bang[b.ma]; }); },
    xoaGiaTri: function (b) { App.db.dotLuong.forEach(function (d) { var x = d.bang && d.bang[b.ma]; if (x) x.ngach = {}; }); },
    /** Thanh chọn mức (chip) */
    thanh: function (coThem) {
      var db = App.db, hien = TL.dotTaiKy(db, TL.kyHienHanh(db)), id = ML.chon(), hn = TL.kyHienHanh(db);
      var chip = function (d) {
        var ma = d ? d.id : 'goc', dang = (d || null) === (hien || null);
        var sap = d && d.tuKy > hn;
        return '<button class="chip-muc' + (ma === id ? ' chon' : '') + '" data-muc="' + h(ma) + '">' + h(ML.ten(d)) +
          (dang ? ' <span class="the-tt xanh">đang áp dụng</span>' : sap ? ' <span class="the-tt cam">sắp áp dụng</span>' : '') + '</button>';
      };
      return '<div class="hang muc-thanh">' + chip(null) + TL.dsDotLuong(db).map(chip).join('') +
        (coThem ? '<button class="nut chinh" id="ml-moi">' + App.icon('them') + 'Mức mới áp dụng từ tháng…</button>' : '') + '</div>';
    }
  };

  /** Sau khi đổi giá trị: lưu, cập nhật mức lương hiện hành của nhân viên đang xếp bậc */
  function daDoi() { App.luu(); if (App.apDungBangLuong) App.apDungBangLuong(null, true); }

  /* ================= Trang ================= */

  function ve(noi) {
    var db = App.db, d = ML.dot(), goc = !d, kyD = ML.ky();
    db.thangLuong.forEach(TL.chuanBangLuong);
    var hn = TL.kyHienHanh(db);
    var pcs = db.phuCap.filter(function (p) { return p.ma === 'AN' || p.mucChung || (d && d.phuCap && d.phuCap[p.ma] != null); });
    var lcs = goc ? db.caiDat.luongCoSo : d.luongCoSo;
    var tu = goc ? db.caiDat.tamUng : (d.tamUng || (d.tamUng = TL.chupMucKy(db, d.tuKy).tamUng));
    var demCV = {}, tenCV = {};
    db.nhanVien.forEach(function (nv) { if (nv.trangThai === 'nghi_viec' || !nv.chucVu) return; var k = TL.chuanCV(nv.chucVu); demCV[k] = (demCV[k] || 0) + 1; tenCV[k] = tenCV[k] || nv.chucVu; });
    var daCo = {}; (tu.theoChucVu || []).forEach(function (x) { daCo[TL.chuanCV(x.chucVu)] = 1; });
    var conLai = Object.keys(tenCV).filter(function (k) { return !daCo[k]; });
    var dsKhoa = Object.keys(db.thang).filter(function (k) { return db.thang[k].khoa && (!d || k >= d.tuKy); }).sort();

    noi.innerHTML =
      '<div class="the"><h3>Mức lương áp dụng theo kỳ<span class="phai">Kỳ hiện hành: ' + kyHien(hn) + '</span></h3>' +
      '<p class="mo" style="margin-top:0">Khi Nhà nước hoặc công ty thay đổi bảng lương, bậc lương, lương cơ sở, tiền cơm hay mức tạm ứng: bấm <b>Mức mới áp dụng từ tháng…</b>, ' +
      'chọn kỳ lương bắt đầu áp dụng, sửa các số thay đổi rồi thôi. Bảng lương mỗi kỳ tự lấy đúng mức của kỳ đó – các kỳ trước vẫn giữ mức cũ, kỳ đã chốt không đổi.</p>' +
      ML.thanh(true) + '</div>' +

      // thông tin mức
      '<div class="the"><h3>' + h(ML.ten(d)) + (d && d.soQD ? ' – ' + h(d.soQD) : '') + '<span class="phai">' +
      (goc ? '' : '<button class="nut nho" id="ml-xuat">' + App.icon('tai') + 'Xuất Excel</button> <button class="nut nho nguy" id="ml-xoa">' + App.icon('xoa') + 'Xoá mức này</button>') +
      (goc ? '<button class="nut nho" id="ml-xuat">' + App.icon('tai') + 'Xuất Excel</button>' : '') + '</span></h3>' +
      (goc ? '<p class="mo" style="margin:0">Áp dụng cho các kỳ <b>trước</b> mọi mức điều chỉnh' + (db.dotLuong.length ? ' (trước kỳ ' + kyHien(TL.dsDotLuong(db)[0].tuKy) + ')' : ' (hiện là mức duy nhất)') + '.</p>'
        : '<div class="form ba" id="ml-tt">' +
          App.F.o('Áp dụng từ kỳ lương *', '<input type="month" data-tt="tuKy" value="' + h(d.tuKy) + '">', 'Kỳ lương tháng này trở đi (tới mức sau)') +
          App.F.o('Số quyết định / căn cứ', '<input data-tt="soQD" value="' + h(d.soQD || '') + '" placeholder="vd 15/QĐ-CT ngày 20/12/2026">') +
          App.F.o('Ghi chú', '<input data-tt="ghiChu" value="' + h(d.ghiChu || '') + '">') + '</div>' +
          (dsKhoa.length ? '<p class="mo nho" style="margin:8px 0 0">Các kỳ đã chốt lương từ kỳ này trở đi (' + dsKhoa.map(kyHien).join(', ') + ') giữ nguyên số đã chốt; mở khoá kỳ đó nếu muốn tính lại theo mức này.</p>' : '')) +
      '</div>' +

      '<div class="cot2">' +
      // lương cơ sở, phụ cấp mức chung
      '<div class="the"><h3>Lương cơ sở, tiền cơm</h3><div class="form" style="grid-template-columns:1fr 1fr">' +
      App.F.o('Lương cơ sở (đ/tháng)', '<input class="so tien" data-ml="luongCoSo" value="' + (lcs ? App.tien(lcs) : '') + '" placeholder="' + App.tien(TL.luongCoSoKy(db, kyD)) + '">',
        'Dùng cho bảng lương hệ số và trần đóng BHXH, BHYT (20 × lương cơ sở)') +
      App.F.o('Tiền ăn giữa ca miễn thuế tối đa (đ/tháng)', '<input class="so tien" data-ml="mienThueAnCa" value="' + ((goc ? db.caiDat.mienThueAnCa : d.mienThueAnCa) ? App.tien(goc ? db.caiDat.mienThueAnCa : d.mienThueAnCa) : '') + '" placeholder="' + App.tien(TL.mienThueAnCaKy(db, kyD)) + '">',
        'Phần tiền cơm vượt mức này tính thuế TNCN. NĐ 253/2026: 1.200.000 từ 01/7/2026 (trước đó 730.000)') +
      pcs.map(function (p) {
        var v = goc ? p.mucChung : (d.phuCap || {})[p.ma];
        var nhan = p.ma === 'AN' ? 'Tiền cơm (đ/ngày)' : p.ten + (p.cachTinh === 'theo_ngay' ? ' (đ/ngày)' : ' (đ/tháng)');
        return App.F.o(h(nhan), '<input class="so tien" data-pc="' + h(p.ma) + '" value="' + (v != null && v !== '' ? App.tien(v) : '') + '" placeholder="' + App.tien(TL.mucChungPC(db, p, kyD)) + '">',
          p.ma === 'AN' ? 'Mức chung cho mọi nhân viên × ngày đi làm (người có mức riêng trong hồ sơ thì theo mức riêng)' : 'Mức chung');
      }).join('') +
      '</div></div>' +
      // tạm ứng kỳ I
      '<div class="the"><h3>Tạm ứng kỳ I theo chức vụ<span class="phai">Kỳ II = lương còn lại</span></h3>' +
      '<p class="mo nho" style="margin-top:0">Mỗi tháng trả lương 2 lần: <b>kỳ I</b> (giữa tháng) tạm ứng theo chức vụ, <b>kỳ II</b> (cuối tháng) là số còn lại = tổng thu nhập − kỳ I − các khoản khấu trừ. ' +
      'Người có mức riêng (hồ sơ) hoặc nhập tay trong bảng lương thì theo số đó.</p>' +
      '<div class="cuon"><table class="bang" id="ml-tu"><thead><tr><th style="min-width:180px">Chức vụ</th><th class="so">Tạm ứng kỳ I (đ)</th><th>Nhân viên</th><th></th></tr></thead><tbody>' +
      (tu.theoChucVu || []).map(function (x, i) {
        return '<tr data-i="' + i + '"><td><input class="o-nhap chu" data-tu="chucVu" value="' + h(x.chucVu) + '" style="width:100%"></td>' +
          '<td><input class="o-nhap so tien" data-tu="muc" value="' + (x.muc || x.muc === 0 ? App.tien(x.muc) : '') + '"></td>' +
          '<td class="giua">' + (demCV[TL.chuanCV(x.chucVu)] || '<span class="mo">0</span>') + '</td><td><button class="nut nho nguy" data-a="xoatu">' + App.icon('xoa') + '</button></td></tr>';
      }).join('') +
      '<tr class="dong-tong"><td><b>Chức vụ khác</b> (mức chung)</td><td><input class="o-nhap so tien" data-tu="macDinh" value="' + App.tien(tu.macDinh || 0) + '"></td><td class="giua mo">' +
      conLai.reduce(function (s, k) { return s + demCV[k]; }, 0) + '</td><td></td></tr></tbody></table></div>' +
      '<div class="hang" style="margin-top:10px"><input id="tu-cv" list="ds-cv" placeholder="Chức vụ (vd Trưởng phòng)" style="width:200px"><datalist id="ds-cv">' +
      Object.keys(tenCV).map(function (k) { return '<option value="' + h(tenCV[k]) + '">'; }).join('') + '</datalist>' +
      '<input id="tu-muc" class="so tien" placeholder="Mức (đ)" style="width:120px"><button class="nut" id="tu-them">' + App.icon('them') + 'Thêm</button>' +
      (conLai.length ? '<button class="nut" id="tu-tatca" title="' + h(conLai.map(function (k) { return tenCV[k]; }).join(', ')) + '">Thêm ' + conLai.length + ' chức vụ đang có</button>' : '') + '</div></div>' +
      '</div>' +

      // thang bảng lương
      (db.thangLuong.length ? db.thangLuong.map(theBang).join('') :
        '<div class="the mo">Chưa có thang, bảng lương. Khai báo bảng, chức danh, số bậc ở <a href="#danhmuc" id="ml-dm">Danh mục → Thang, bảng lương</a>.</div>');

    App.$$('input.tien', noi).forEach(App.ganOTien);
    var dm = App.$('#ml-dm', noi); if (dm) dm.onclick = function () { App.moDanhMuc && App.moDanhMuc('bl'); };

    noi.onchange = function (e) {
      var i = e.target;
      if (i.dataset.tt) { doiThongTin(d, i); return; }
      if (i.dataset.ml) {
        var f = i.dataset.ml, v = App.docSo(i.value);
        if (goc) { if (!v) { App.bao('Mức ban đầu không được để trống.', 'loi'); App.veLai(); return; } db.caiDat[f] = v; } else d[f] = v || '';
        daDoi(); App.bao('Đã lưu ' + (f === 'luongCoSo' ? 'lương cơ sở' : 'mức miễn thuế tiền ăn giữa ca') + ' – ' + ML.ten(d).toLowerCase()); App.veLai(); return;
      }
      if (i.dataset.pc) {
        var p = db.phuCap.filter(function (x) { return x.ma === i.dataset.pc; })[0], raw = i.value.trim(), v2 = App.docSo(raw);
        if (goc) p.mucChung = raw === '' ? '' : v2; else { d.phuCap = d.phuCap || {}; if (raw === '') delete d.phuCap[p.ma]; else d.phuCap[p.ma] = v2; }
        daDoi(); App.bao('Đã lưu ' + (p.ma === 'AN' ? 'tiền cơm' : p.ten.toLowerCase())); return;
      }
      if (i.dataset.tu) {
        var tr = i.closest('tr[data-i]');
        if (i.dataset.tu === 'macDinh') tu.macDinh = App.docSo(i.value);
        else if (tr) {
          var x = tu.theoChucVu[+tr.dataset.i];
          if (i.dataset.tu === 'chucVu') { if (!i.value.trim()) { App.veLai(); return; } x.chucVu = i.value.trim(); } else x.muc = App.docSo(i.value);
        }
        daDoi(); App.bao('Đã lưu mức tạm ứng'); if (i.dataset.tu === 'chucVu') App.veLai(); return;
      }
      var cell = i.closest('[data-bac]');
      if (cell || i.dataset.mcs != null) {
        var card = i.closest('[data-b]'), b = db.thangLuong[+card.dataset.b];
        if (i.dataset.mcs != null) { ML.ghiMucCoSo(b, App.docSo(i.value) || ''); daDoi(); App.veLai(); return; }
        var g = b.ngach[+i.closest('tr').dataset.g], k = +i.dataset.bac;
        var val = b.kieu === 'he_so' ? docHS(i.value) : App.docSo(i.value);
        ML.ghiBac(b, g, k, val || '');
        daDoi(); App.veLai();
      }
    };
    noi.onclick = function (e) {
      var c = e.target.closest('[data-muc]');
      if (c) { st.chon = c.dataset.muc; App.veLai(); return; }
      if (e.target.closest('#ml-moi')) { mucMoi(); return; }
      if (e.target.closest('#ml-xoa')) {
        App.xacNhan('Xoá <b>' + h(ML.ten(d)) + '</b>? Các kỳ từ ' + kyHien(d.tuKy) + ' sẽ dùng lại mức trước đó (trừ kỳ đã chốt).', { nut: 'Xoá', nguy: true }).then(function (ok) {
          if (!ok) return;
          db.dotLuong.splice(db.dotLuong.indexOf(d), 1); st.chon = null; daDoi(); App.veLai(); App.bao('Đã xoá mức áp dụng.', 'tot');
        });
        return;
      }
      if (e.target.closest('#ml-xuat')) { xuatExcel(d); return; }
      if (e.target.closest('#tu-them')) {
        var cv = App.$('#tu-cv').value.trim(), muc = App.docSo(App.$('#tu-muc').value);
        if (!cv) { App.bao('Nhập chức vụ.', 'loi'); return; }
        if ((tu.theoChucVu || []).some(function (x) { return TL.chuanCV(x.chucVu) === TL.chuanCV(cv); })) { App.bao('Chức vụ này đã có trong bảng.', 'loi'); return; }
        tu.theoChucVu.push({ chucVu: cv, muc: muc }); daDoi(); App.veLai(); return;
      }
      if (e.target.closest('#tu-tatca')) { conLai.forEach(function (k) { tu.theoChucVu.push({ chucVu: tenCV[k], muc: +tu.macDinh || 0 }); }); daDoi(); App.veLai(); return; }
      var a = e.target.closest('[data-a="xoatu"]');
      if (a) { tu.theoChucVu.splice(+a.closest('tr').dataset.i, 1); daDoi(); App.veLai(); }
    };
  }

  function doiThongTin(d, i) {
    var db = App.db, f = i.dataset.tt;
    if (f === 'tuKy') {
      var k = i.value;
      if (!/^\d{4}-\d{2}$/.test(k)) { App.bao('Chọn tháng áp dụng.', 'loi'); App.veLai(); return; }
      if (db.dotLuong.some(function (x) { return x !== d && x.tuKy === k; })) { App.bao('Đã có mức áp dụng từ kỳ ' + kyHien(k) + '.', 'loi'); App.veLai(); return; }
      d.tuKy = k;
    } else d[f] = i.value.trim();
    daDoi(); App.bao('Đã lưu'); if (f !== 'ghiChu') App.veLai();
  }

  function theBang(b, bi) {
    var db = App.db, hs = b.kieu === 'he_so', d = ML.dot(), kyD = ML.ky(), cot = '';
    for (var k = 1; k <= b.soBac; k++) cot += '<th class="so" style="min-width:' + (hs ? 70 : 110) + 'px">Bậc ' + k + '</th>';
    var mcs = ML.docMucCoSo(b);
    return '<div class="the" data-b="' + bi + '"><h3>' + h(b.ten) + '<span class="phai">' + h(TL.KIEU_BL[b.kieu]) + ' · dùng cho ' + h(TL.AP_DUNG_BL[b.apDung]).toLowerCase() + '</span></h3>' +
      (hs ? '<div class="hang" style="margin-bottom:8px"><label class="nho">Mức lương cơ sở của bảng <input class="o-nhap so tien" data-mcs value="' + (mcs ? App.tien(mcs) : '') + '" placeholder="' + App.tien(TL.luongCoSoKy(db, kyD)) + ' (lương cơ sở)" style="width:170px"></label></div>' : '') +
      '<div class="cuon"><table class="bang bang-bac"><thead><tr><th>Mã</th><th style="min-width:220px">Chức danh / nhóm công việc</th>' + cot + '</tr></thead><tbody>' +
      (b.ngach.length ? b.ngach.map(function (g, gi) {
        var cu = d ? TL.bacNgach(db, b, g, kySau(d.tuKy, -1)) : null;
        return '<tr data-g="' + gi + '"><td>' + h(g.ma) + '</td><td>' + h(g.ten) + '</td>' +
          Array.apply(null, Array(b.soBac)).map(function (_, k2) {
            var v = ML.docBac(b, g, k2), gt = +v > 0 ? (hs ? { tien: Math.round(v * TL.mucCoSoBL(db, b, kyD)) } : null) : null;
            var vc = cu ? +cu[k2] : 0, doi = d && +v > 0 && vc > 0 && +v !== vc;
            return '<td class="so"><input class="o-nhap so" data-bac="' + k2 + '" value="' + (+v > 0 ? (hs ? NF_HS.format(v) : App.tien(v)) : '') + '" style="width:100%' + (doi ? ';font-weight:700;color:var(--chinh-dam)' : '') + '"' +
              (doi ? ' title="Trước đó: ' + (hs ? NF_HS.format(vc) : App.tien(vc)) + '"' : '') + '>' +
              (gt ? '<div class="mo nho">' + App.tien(gt.tien) + '</div>' : '') +
              (doi ? '<div class="nho" style="color:var(--chinh)">' + (vc ? (+v > vc ? '+' : '') + (Math.round((+v / vc - 1) * 1000) / 10) + '%' : '') + '</div>' : '') + '</td>';
          }).join('') + '</tr>';
      }).join('') : '<tr><td colspan="' + (b.soBac + 2) + '" class="trong">Chưa có chức danh (thêm ở Danh mục → Thang, bảng lương).</td></tr>') +
      '</tbody></table></div></div>';
  }

  /** Hộp tạo mức mới: chép toàn bộ mức đang áp dụng tại kỳ đó, có thể tăng đồng loạt % các bậc */
  function mucMoi() {
    var db = App.db, ds = TL.dsDotLuong(db), hn = TL.kyHienHanh(db);
    var macDinh = kySau(ds.length && ds[ds.length - 1].tuKy >= hn ? ds[ds.length - 1].tuKy : hn, 1);
    var an = db.phuCap.filter(function (p) { return p.ma === 'AN'; })[0];
    App.hop({
      tieuDe: 'Mức lương mới áp dụng từ tháng…', co: 'hep',
      than: '<form class="form" style="grid-template-columns:1fr" onsubmit="return false">' +
        App.F.o('Áp dụng từ kỳ lương *', '<input type="month" name="tuKy" value="' + macDinh + '">', 'Vd kỳ lương tháng 01/2027. Các kỳ trước giữ nguyên mức cũ.') +
        App.F.o('Số quyết định / căn cứ', '<input name="soQD" placeholder="vd 15/QĐ-CT ngày 20/12/2026">') +
        App.F.o('Ghi chú', '<input name="ghiChu" placeholder="vd Điều chỉnh lương năm 2027">') +
        '<p class="mo nho" style="margin:0">Mức mới được chép từ mức đang áp dụng tại kỳ đó; sửa tiếp ở trang này. Có thể đổi nhanh:</p>' +
        App.F.o('Tăng đồng loạt các bậc lương (bảng mức tiền) thêm (%)', '<input name="phanTram" type="number" step="0.1" placeholder="vd 5 (để trống = giữ nguyên)">', 'Làm tròn tới 1.000 đ') +
        App.F.o('Lương cơ sở mới (đ/tháng)', '<input name="luongCoSo" class="so tien" placeholder="để trống = giữ nguyên">') +
        (an ? App.F.o('Tiền cơm mới (đ/ngày)', '<input name="com" class="so tien" placeholder="để trống = giữ nguyên">') : '') + '</form>',
      moRa: function (el) { App.$$('input.tien', el).forEach(App.ganOTien); },
      nut: [{ ten: 'Huỷ' }, {
        ten: 'Tạo mức mới', loai: 'chinh', bam: function (el) {
          var v = App.F.doc(el);
          if (!/^\d{4}-\d{2}$/.test(v.tuKy)) { App.bao('Chọn tháng áp dụng.', 'loi'); return false; }
          if (db.dotLuong.some(function (x) { return x.tuKy === v.tuKy; })) { App.bao('Đã có mức áp dụng từ kỳ ' + kyHien(v.tuKy) + ' – chọn mức đó để sửa.', 'loi'); return false; }
          var moi = Object.assign({ id: App.uid(), tuKy: v.tuKy, soQD: v.soQD.trim(), ghiChu: v.ghiChu.trim() }, TL.chupMucKy(db, v.tuKy));
          var pt = parseFloat(String(v.phanTram || '').replace(',', '.'));
          if (pt) db.thangLuong.forEach(function (b) {
            if (b.kieu !== 'tien' || !moi.bang[b.ma]) return;
            Object.keys(moi.bang[b.ma].ngach).forEach(function (m) { moi.bang[b.ma].ngach[m] = moi.bang[b.ma].ngach[m].map(function (x) { return +x > 0 ? Math.round(x * (1 + pt / 100) / 1000) * 1000 : x; }); });
          });
          if (App.docSo(v.luongCoSo)) moi.luongCoSo = App.docSo(v.luongCoSo);
          if (an && App.docSo(v.com)) moi.phuCap.AN = App.docSo(v.com);
          db.dotLuong.push(moi);
          st.chon = moi.id; daDoi(); App.veLai();
          App.bao('Đã tạo mức áp dụng từ kỳ ' + kyHien(v.tuKy) + (pt ? ', các bậc tăng ' + pt + '%' : '') + '. Sửa tiếp các số thay đổi nếu cần.', 'tot');
        }
      }]
    });
  }

  function xuatExcel(d) {
    var db = App.db, kyD = ML.ky(), ten = ML.ten(d), shs = [];
    var phu = (d ? ten : 'Mức ban đầu') + (d && d.soQD ? ' – ' + d.soQD : '');
    db.thangLuong.forEach(function (b) {
      var hs = b.kieu === 'he_so', cot = [{ t: 'STT', stt: true, w: 5, kieu: 'giua' }, { t: 'Mã', w: 7, f: function (g) { return g.ma; } }, { t: 'Chức danh / nhóm công việc', w: 34, f: function (g) { return g.ten; } }];
      for (var k = 0; k < b.soBac; k++) (function (k2) {
        cot.push({ t: 'Bậc ' + (k2 + 1), w: hs ? 9 : 13, kieu: hs ? null : 'so', nhom: hs ? 'Hệ số' : 'Mức lương (đ/tháng)', khongTong: true,
          f: function (g) { var v = ML.docBac(b, g, k2); return +v > 0 ? (hs ? NF_HS.format(v) : +v) : ''; } });
      })(k);
      shs.push(App.sheetBang({ ten: b.ten.slice(0, 28), tieuDe: b.ten.toUpperCase(), phuDe: phu, cot: cot, dong: b.ngach, chuKy: true }));
    });
    var tu = d ? d.tamUng || TL.cauHinhTamUng(db, kyD) : db.caiDat.tamUng;
    var dong = (tu.theoChucVu || []).map(function (x) { return { cv: x.chucVu, muc: +x.muc || 0 }; }).concat([{ cv: 'Chức vụ khác', muc: +tu.macDinh || 0 }]);
    shs.push(App.sheetBang({ ten: 'Tạm ứng kỳ I', tieuDe: 'MỨC TẠM ỨNG LƯƠNG KỲ I THEO CHỨC VỤ', phuDe: phu,
      cot: [{ t: 'STT', stt: true, w: 5, kieu: 'giua' }, { t: 'Chức vụ', w: 30, k: 'cv' }, { t: 'Tạm ứng kỳ I (đ)', w: 16, k: 'muc', kieu: 'so', khongTong: true }], dong: dong, chuKy: true }));
    var pcs = db.phuCap.filter(function (p) { return TL.mucChungPC(db, p, kyD); });
    shs.push(App.sheetBang({ ten: 'Lương cơ sở, phụ cấp', tieuDe: 'LƯƠNG CƠ SỞ VÀ PHỤ CẤP MỨC CHUNG', phuDe: phu,
      cot: [{ t: 'STT', stt: true, w: 5, kieu: 'giua' }, { t: 'Khoản', w: 34, k: 'ten' }, { t: 'Mức (đ)', w: 16, k: 'muc', kieu: 'so', khongTong: true }, { t: 'Đơn vị', w: 12, k: 'dv' }],
      dong: [{ ten: 'Lương cơ sở', muc: TL.luongCoSoKy(db, kyD), dv: 'đ/tháng' }, { ten: 'Tiền ăn giữa ca miễn thuế tối đa', muc: TL.mienThueAnCaKy(db, kyD), dv: 'đ/tháng' }].concat(pcs.map(function (p) { return { ten: p.ma === 'AN' ? 'Tiền cơm' : p.ten, muc: TL.mucChungPC(db, p, kyD), dv: p.cachTinh === 'theo_ngay' ? 'đ/ngày' : 'đ/tháng' }; })) }));
    App.xuatExcel(App.tenFile('Muc_luong_' + (d ? 'tu_ky_' + d.tuKy : 'ban_dau')), shs);
  }

  App.trang.mucluong = { ve: ve, khongKy: true };
})();

</script>
<script>
/* ===== p-chamcong.js ===== */
/* Trang Bảng chấm công: lưới nhân viên × ngày của kỳ công, chấm bằng chuột / bàn phím, dán từ Excel,
   xuất Excel theo mẫu 01a-LĐTL. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;

  var CHE = {
    kh: { ten: 'Ký hiệu công', kho: 'cc' },
    ot: { ten: 'Làm thêm (giờ)', kho: 'ot' },
    muon: { ten: 'Đi muộn / về sớm (phút)', kho: 'muon' }
  };
  var st = { che: 'kh', pb: '', ld: '', tim: '', anc: null, act: null, sel: null, keo: false, undo: [], kyUndo: '' };
  var C = null; // ngữ cảnh đang hiển thị
  var oSua = null;

  /** Các cột tổng hợp ("quy ra công") theo chế độ xem */
  function cotTong(che, coSP) {
    if (che === 'ot') return [['otThuong', 'Ngày thường'], ['otNghi', 'Ngày nghỉ'], ['otLe', 'Ngày lễ'], ['otTong', 'Tổng giờ', 1]];
    if (che === 'muon') return [['muonLan', 'Số lần'], ['muonPhut', 'Số phút', 1]];
    var c = [['congChuan', 'Công chuẩn']];
    if (coSP) c.push(['sp', 'Công lương SP']);
    c.push(['congTG', 'Công lương thời gian', 1], ['ngayCom', 'Ngày cơm'], ['ngung', 'Nghỉ hưởng 100% lương'], ['khongHL', 'Nghỉ không lương'], ['bhxh', 'Hưởng BHXH']);
    return c;
  }
  function giaTriTong(th, k) { return k === 'khongHL' ? Math.round((th.khong + th.kp) * 100) / 100 : th[k]; }

  function ve(noi) {
    var db = App.db, y = App.ky.y, m = App.ky.m, key = TL.khoaKy(y, m);
    if (st.kyUndo !== key) { st.undo = []; st.kyUndo = key; st.sel = st.act = st.anc = null; }
    var khoa = App.thangKhoa();
    var ngay = TL.ngayKy(db, y, m), le = TL.bangNgayLe(db);
    var dvc = App.dvChamCong();
    var rows = TL.dsNhanVienKy(db, y, m).filter(function (nv) {
      var dvk = (st.pb || dvc) ? TL.donViTheoKy(db, nv, y, m).phongBan : '';
      if (st.pb && dvk !== st.pb) return false;
      if (dvc && dvc.indexOf(dvk) < 0) return false;
      if (st.ld && (nv.loaiLD || '') !== (st.ld === '-' ? '' : st.ld)) return false;
      if (st.tim && !App.timKhop(nv.ma + ' ' + nv.hoTen, st.tim)) return false;
      return true;
    });
    C = {
      y: y, m: m, ngay: ngay, n: ngay.length, le: le, rows: rows, kh: TL.bangKyHieu(db), khoa: khoa, hn: App.homNay(),
      cc: TL.congChuan(db, y, m), coSP: db.kyHieu.some(function (k) { return k.sp; }), loaiLe: TL.bangLoaiLe(db),
      loaiChung: ngay.map(function (x) { return TL.loaiNgay(db, x.y, x.m, x.d, le); })
    };
    var cd = db.caiDat;

    var kyHieuNut = db.kyHieu.map(function (k) {
      return '<button data-k="' + h(k.ma) + '" title="' + h(k.ten) + '" style="background:var(--k-' + k.nhom + ')"' + (k.nhom === 'kp' ? ' class="n-kp"' : '') + '>' + h(k.ma) + '</button>';
    }).join('') + '<button class="xoa" data-k="" title="Xoá ô đang chọn (phím Delete)">Xoá</button>';

    noi.innerHTML =
      (khoa ? '<div class="canh-bao khong-in" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1">Kỳ lương tháng ' + m + '/' + y + ' đã <b>chốt</b> nên không sửa được chấm công.</span><button class="nut" id="cc-mokhoa">' + App.icon('mo') + 'Mở khoá để sửa</button></div>' : '') +
      '<div class="the khong-in" style="padding:12px 14px"><div class="cc-cong">' +

        ? 'Chọn ô (kéo chuột để chọn nhiều ô, nhiều người) rồi bấm ký hiệu ở trên. Hoặc gõ ký hiệu trên bàn phím (vd <b>+</b> hoặc <b>x</b>, <b>sp</b>, <b>p</b>, <b>o</b> = Ô) rồi Enter. Dán được vùng ký hiệu từ Excel (Ctrl+V).'
        : 'Chọn ô rồi gõ số ' + (st.che === 'ot' ? 'giờ làm thêm (vd 2 hoặc 1,5). Hệ số theo loại ngày: thường ' + cd.heSoOT.thuong + '%, nghỉ tuần ' + cd.heSoOT.nghi + '%, lễ ' + cd.heSoOT.le + '%.' : 'phút đi muộn / về sớm của ngày đó.') + ' Enter để xuống dòng, Delete để xoá.') +

        'Tháng ' + m + ' năm ' + y + ' (từ ' + TL.hienNgay(ngay[0].iso) + ' đến ' + TL.hienNgay(ngay[ngay.length - 1].iso) + ')' + (st.pb ? ' – Bộ phận: ' + TL.tenPhongBan(db, st.pb) : '')) +

      '<span><b style="background:var(--ngay-nghi)">&nbsp;</b>Ngày nghỉ hằng tuần (theo loại lao động)</span><span><b style="background:var(--ngay-le)">&nbsp;</b>Ngày lễ, Tết: nghỉ (L) = 1 công; đi làm (+) = ×' + App.so(cd.heSoCongLe) + ' công ngày lễ, ×' + App.so(cd.heSoCongTet) + ' công ngày Tết; SP không nhân (cơm 1 ngày)</span>' +
      '<span><b style="background:repeating-linear-gradient(45deg,#f5f6f8,#f5f6f8 4px,#eceef2 4px,#eceef2 8px)">&nbsp;</b>Chưa vào làm / đã nghỉ việc</span></div>' +
      App.kyIn();

    veBang();

    App.$('#cc-che').onclick = function (e) { var b = e.target.closest('[data-che]'); if (b) { huySua(); st.che = b.dataset.che; App.veLai(); } };
    App.$('#cc-pb').onchange = function () { st.pb = this.value; st.sel = st.act = null; App.veLai(); };
    var ld = App.$('#cc-ld'); if (ld) ld.onchange = function () { st.ld = this.value; st.sel = st.act = null; App.veLai(); };
    App.$('#cc-tim').oninput = function () { st.tim = this.value; st.sel = st.act = null; var v = this.value; App.veLai(); var i = App.$('#cc-tim'); i.focus(); i.setSelectionRange(v.length, v.length); };
    var mau = App.$('#cc-mau');
    if (mau) mau.onclick = function (e) { var b = e.target.closest('[data-k]'); if (b) ganChon(b.dataset.k); };

    App.$('#cc-undo').onclick = hoanTac;
    App.$('#cc-xuat').onclick = xuatExcel;

    var bang = App.$('#cc-bang');
    bang.addEventListener('mousedown', chuotXuong);
    bang.addEventListener('mouseover', chuotQua);
    bang.addEventListener('dblclick', function (e) { var td = e.target.closest('td.d'); if (td && !C.khoa) batDauSua(''); });
    App.$('#cc-cuon').addEventListener('scroll', function () { if (oSua) xongSua(true); });
  }

  /* ---------- Vẽ lưới ---------- */
  function giaTri(nv, i) { var x = C.ngay[i]; return TL.oNgay(App.db, CHE[st.che].kho, nv.id, x.y, x.m, x.d); }
  function lop(loai) { return loai === 'le' ? 'le' : loai === 'nghi' ? 'wk' : ''; }

  /** Nhóm các ngày của kỳ theo tháng dương lịch: [{ten, so}] */
  function bangThang() {
    var ds = [];
    C.ngay.forEach(function (x) {
      var t = 'Tháng ' + TL.pad(x.m) + '/' + x.y;
      if (!ds.length || ds[ds.length - 1].ten !== t) ds.push({ ten: t, so: 0 });
      ds[ds.length - 1].so++;
    });
    return ds;
  }

  function veBang() {
    var db = App.db, n = C.n, che = st.che;
    var tong = cotTong(che, C.coSP);
    var bt = bangThang(), coBang = bt.length > 1;
    var top1 = coBang ? 22 : 0, top2 = top1 + 24;
    var rs = coBang ? 3 : 2;
    var s = '<thead>';
    if (coBang) {
      s += '<tr><th class="i dinh1" rowspan="3" style="top:0">STT</th><th class="i dinh2" rowspan="3" style="top:0">Mã NV</th><th class="i dinh3" rowspan="3" style="top:0;text-align:left;padding-left:6px">Họ và tên</th>';
      bt.forEach(function (b, i) { s += '<th colspan="' + b.so + '" style="top:0;height:22px;background:' + (i % 2 ? '#fdf3d8' : '#fbe5dc') + '">' + b.ten + '</th>'; });
      tong.forEach(function (t) { s += '<th class="t" rowspan="3" style="top:0' + (t[2] ? ';color:var(--chinh-dam)' : '') + '">' + t[1] + '</th>'; });
      s += '</tr><tr>';
    } else {
      s += '<tr><th class="i dinh1" rowspan="2">STT</th><th class="i dinh2" rowspan="2">Mã NV</th><th class="i dinh3" rowspan="2" style="text-align:left;padding-left:6px">Họ và tên</th>';
    }
    C.ngay.forEach(function (x, i) {
      s += '<th class="d ' + lop(C.loaiChung[i]) + (x.iso === C.hn ? ' hn' : '') + '" style="top:' + top1 + 'px"' + (C.le[x.iso] ? ' title="' + h(C.le[x.iso]) + '"' : '') + '>' + TL.pad(x.d) + '</th>';
    });
    if (!coBang) tong.forEach(function (t) { s += '<th class="t" rowspan="2"' + (t[2] ? ' style="color:var(--chinh-dam)"' : '') + '>' + t[1] + '</th>'; });
    s += '</tr><tr>';
    C.ngay.forEach(function (x, i) { s += '<th class="d ' + lop(C.loaiChung[i]) + '" style="top:' + top2 + 'px">' + TL.TEN_THU[TL.thuTrongTuan(x.y, x.m, x.d)] + '</th>'; });
    s += '</tr></thead><tbody>';
    var chan = C.ngay.map(function () { return 0; });
    var ctx = { kh: C.kh, le: C.le, ngay: C.ngay };
    C.rows.forEach(function (nv, r) {
      var th = TL.tongHopCong(db, C.y, C.m, nv, ctx);
      s += '<tr><td class="i stt dinh1">' + (r + 1) + '</td><td class="i dinh2">' + h(nv.ma) + '</td><td class="i dinh3" title="' + h(nv.hoTen + (nv.chucVu ? ' – ' + nv.chucVu : '')) + '">' + h(nv.hoTen) + '</td>';
      C.ngay.forEach(function (x, i) {
        var lam = TL.nvLamNgay(nv, x.y, x.m, x.d);
        var v = giaTri(nv, i), cls = 'd ' + lop(TL.loaiNgay(db, x.y, x.m, x.d, C.le, nv)), txt = '', tip = '';
        if (!lam) cls += ' ngoai';
        if (v != null && v !== '') {
          if (che === 'kh') {
            var k = C.kh[String(v).toUpperCase()];
            cls += k ? ' n-' + k.nhom : ' n-sai';
            txt = h(v);
            if (k && k.lam > 0 && !k.sp && C.le[x.iso]) { var hsl = TL.heSoCongNgay(db, x.iso, C.loaiLe); if (hsl !== 1) { cls += ' nhan'; tip = 'Đi làm ' + (C.loaiLe[x.iso] === 'tet' ? 'ngày Tết' : 'ngày lễ') + ': ×' + App.so(hsl) + ' công, cơm 1 ngày'; txt += '<sup>×' + App.so(hsl) + '</sup>'; } }
            if (k && k.lam > 0) chan[i]++;
          } else { txt = App.so(v); cls += che === 'ot' ? ' so-ot' : ' so-muon'; chan[i] += +v || 0; }
        }
        s += '<td class="' + cls + '" data-r="' + r + '" data-i="' + i + '"' + (tip ? ' title="' + tip + '"' : '') + '>' + txt + '</td>';
      });
      tong.forEach(function (t) { var val = giaTriTong(th, t[0]); s += '<td class="t' + (t[2] ? ' dam' : '') + '">' + (val ? App.so(val) : '') + '</td>'; });
      s += '</tr>';
    });
    if (!C.rows.length) s += '<tr><td colspan="' + (n + 3 + tong.length) + '" class="trong" style="height:80px">Không có nhân viên trong kỳ này. <a href="#nhanvien">Thêm nhân viên</a></td></tr>';
    s += '</tbody>';
    if (C.rows.length) {
      s += '<tfoot><tr><td class="i dinh1"></td><td class="i dinh2"></td><td class="i dinh3">' + (che === 'kh' ? 'Số người đi làm' : che === 'ot' ? 'Tổng giờ làm thêm' : 'Tổng phút') + '</td>';
      C.ngay.forEach(function (x, i) { s += '<td class="d ' + lop(C.loaiChung[i]) + '">' + (chan[i] ? App.so(chan[i]) : '') + '</td>'; });
      tong.forEach(function () { s += '<td class="t"></td>'; });
      s += '</tr></tfoot>';
    }
    var bang = App.$('#cc-bang');
    bang.innerHTML = s;
    C.o = [];
    App.$$('td.d[data-r]', bang).forEach(function (td) { var r = +td.dataset.r; (C.o[r] = C.o[r] || [])[+td.dataset.i] = td; });
    toChon();
    var u = App.$('#cc-undo'); if (u) u.disabled = !st.undo.length;
  }

  /* ---------- Chọn ô ---------- */
  function toChon() {
    App.$$('#cc-bang td.sel, #cc-bang td.act').forEach(function (td) { td.classList.remove('sel', 'act'); });
    if (!st.sel || !C.o) return;
    var s = st.sel;
    for (var r = s.r0; r <= s.r1; r++) for (var i = s.i0; i <= s.i1; i++) { var td = C.o[r] && C.o[r][i]; if (td) td.classList.add('sel'); }
    if (st.act && C.o[st.act.r] && C.o[st.act.r][st.act.i]) C.o[st.act.r][st.act.i].classList.add('act');
  }
  function vung(a, b) { return { r0: Math.min(a.r, b.r), r1: Math.max(a.r, b.r), i0: Math.min(a.i, b.i), i1: Math.max(a.i, b.i) }; }
  function chon(o, mo) {
    o = { r: Math.max(0, Math.min(C.rows.length - 1, o.r)), i: Math.max(0, Math.min(C.n - 1, o.i)) };
    st.act = o;
    if (!mo || !st.anc) st.anc = o;
    st.sel = vung(st.anc, o);
    toChon();
    var td = C.o[o.r] && C.o[o.r][o.i];
    if (td) td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  function chuotXuong(e) {
    var td = e.target.closest('td.d[data-r]');
    if (!td || e.button !== 0) return;
    if (oSua) xongSua(true);
    e.preventDefault();
    chon({ r: +td.dataset.r, i: +td.dataset.i }, e.shiftKey);
    st.keo = true;
  }
  function chuotQua(e) {
    if (!st.keo) return;
    var td = e.target.closest('td.d[data-r]');
    if (!td) return;
    st.act = { r: +td.dataset.r, i: +td.dataset.i };
    st.sel = vung(st.anc, st.act);
    toChon();
  }
  document.addEventListener('mouseup', function () { st.keo = false; });

  /* ---------- Ghi dữ liệu ---------- */
  function chuanKyHieu(s) {
    s = String(s == null ? '' : s).trim();
    if (!s) return '';
    var cd = App.db.caiDat;
    var up = s.toUpperCase();
    if (C.kh[up]) return C.kh[up].ma;
    var bd = App.boDau(s).toUpperCase().replace(/\s+/g, '');
    var ks = App.db.kyHieu;
    for (var i = 0; i < ks.length; i++) if (App.boDau(ks[i].ma).toUpperCase() === bd) return ks[i].ma;
    var diLam = cd.khDiLam || '+', nua = cd.khNuaNgay || '+/2';
    if (/^(X|V|1|\+|=)$/.test(bd) && C.kh[diLam.toUpperCase()]) return C.kh[diLam.toUpperCase()].ma;
    if (/^(X\/2|0[.,]5|1\/2|\/2|\+2|N2)$/.test(bd) && C.kh[nua.toUpperCase()]) return C.kh[nua.toUpperCase()].ma;
    return null;
  }
  function chuanGiaTri(raw) {
    if (st.che === 'kh') return chuanKyHieu(raw);
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return '';
    var n = App.docSo(s);
    if (isNaN(n) || n < 0) return null;
    return n || '';
  }
  /** ghi danh sách [{r, i, v}] – v đã chuẩn hoá ('' = xoá) */
  function ghi(ds, che) {
    if (C.khoa) { App.bao('Kỳ lương đã chốt, không sửa được.', 'loi'); return 0; }
    var kho = CHE[che || st.che].kho, doi = [];
    ds.forEach(function (z) {
      var nv = C.rows[z.r], x = C.ngay[z.i];
      if (!nv || !x || !TL.nvLamNgay(nv, x.y, x.m, x.d)) return;
      var T = TL.thang(App.db, x.y, x.m, true);
      var o = T[kho][nv.id] || (T[kho][nv.id] = {});
      var cu = o[x.d] == null ? '' : o[x.d];
      if (String(cu) === String(z.v)) return;
      doi.push({ id: nv.id, y: x.y, m: x.m, d: x.d, cu: cu, moi: z.v });
      if (z.v === '' || z.v == null) delete o[x.d]; else o[x.d] = z.v;
    });
    if (!doi.length) return 0;
    st.undo.push({ kho: kho, ds: doi });
    if (st.undo.length > 100) st.undo.shift();
    App.luu();
    veBang();
    return doi.length;
  }
  function ganChon(v) {
    if (!st.sel) { App.bao('Hãy chọn ô cần chấm trước (bấm hoặc kéo chuột trên lưới).'); return; }
    var ds = [], s = st.sel;
    for (var r = s.r0; r <= s.r1; r++) for (var i = s.i0; i <= s.i1; i++) ds.push({ r: r, i: i, v: v });
    ghi(ds);
  }
  function hoanTac() {
    var u = st.undo.pop();
    if (!u) return;
    u.ds.forEach(function (x) {
      var T = TL.thang(App.db, x.y, x.m, true);
      var o = T[u.kho][x.id] || (T[u.kho][x.id] = {});
      if (x.cu === '' || x.cu == null) delete o[x.d]; else o[x.d] = x.cu;
    });
    App.luu(); veBang();
  }

  /* ---------- Sửa trực tiếp ---------- */
  function batDauSua(kyTu) {
    if (!st.act || C.khoa) return;
    var td = C.o[st.act.r] && C.o[st.act.r][st.act.i];
    if (!td || td.classList.contains('ngoai')) return;
    huySua();
    var rc = td.getBoundingClientRect();
    var i = document.createElement('input');
    i.className = 'o-sua';
    i.style.position = 'fixed';
    i.style.left = rc.left + 'px'; i.style.top = rc.top + 'px'; i.style.width = Math.max(rc.width, 46) + 'px'; i.style.height = rc.height + 'px';
    var cu = giaTri(C.rows[st.act.r], st.act.i);
    i.value = kyTu !== '' ? kyTu : (cu == null ? '' : String(cu).replace('.', ','));
    document.body.appendChild(i);
    oSua = { el: i, r: st.act.r, i: st.act.i };
    i.focus();
    if (kyTu === '') i.select();
    i.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); xongSua(true, 1, 0); }
      else if (e.key === 'Tab') { e.preventDefault(); xongSua(true, 0, e.shiftKey ? -1 : 1); }
      else if (e.key === 'Escape') { e.preventDefault(); huySua(); }
      else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); xongSua(true, e.key === 'ArrowDown' ? 1 : -1, 0); }
      e.stopPropagation();
    });
    i.addEventListener('blur', function () { if (oSua && oSua.el === i) xongSua(true); });
  }
  function huySua() { if (oSua) { var e = oSua.el; oSua = null; e.remove(); } }
  function xongSua(luu, dr, di) {
    if (!oSua) return;
    var x = oSua; oSua = null;
    var raw = x.el.value;
    x.el.remove();
    if (luu) {
      var v = chuanGiaTri(raw);
      if (v === null) App.bao(st.che === 'kh' ? 'Ký hiệu “' + raw + '” chưa có trong danh mục (xem Danh mục → Ký hiệu chấm công).' : 'Giá trị không hợp lệ: ' + raw, 'loi');
      else ghi([{ r: x.r, i: x.i, v: v }]);
    }
    if (dr || di) chon({ r: x.r + (dr || 0), i: x.i + (di || 0) });
  }

  /* ---------- Bàn phím, sao chép, dán ---------- */
  function dangHoatDong() {
    return App.trangHienTai === 'chamcong' && C && !App.$('.mo-nen') && !oSua;
  }
  document.addEventListener('keydown', function (e) {
    if (!dangHoatDong() || !st.act) return;
    var tg = e.target;
    if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'SELECT' || tg.tagName === 'TEXTAREA')) return;
    var k = e.key, a = st.act;
    if ((e.ctrlKey || e.metaKey) && (k === 'z' || k === 'Z')) { e.preventDefault(); hoanTac(); return; }
    if ((e.ctrlKey || e.metaKey) && (k === 'a' || k === 'A')) { e.preventDefault(); st.anc = { r: 0, i: 0 }; st.act = { r: C.rows.length - 1, i: C.n - 1 }; st.sel = vung(st.anc, st.act); toChon(); return; }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var mv = { ArrowLeft: [0, -1], ArrowRight: [0, 1], ArrowUp: [-1, 0], ArrowDown: [1, 0], Tab: [0, e.shiftKey ? -1 : 1] }[k];
    if (mv) { e.preventDefault(); chon({ r: a.r + mv[0], i: a.i + mv[1] }, e.shiftKey && k !== 'Tab'); return; }
    if (k === 'Home') { e.preventDefault(); chon({ r: a.r, i: 0 }, e.shiftKey); return; }
    if (k === 'End') { e.preventDefault(); chon({ r: a.r, i: C.n - 1 }, e.shiftKey); return; }
    if (k === 'Delete' || k === 'Backspace') { e.preventDefault(); ganChon(''); return; }
    if (k === 'Enter' || k === 'F2') { e.preventDefault(); batDauSua(''); return; }
    if (k.length === 1 && /\S/.test(k)) {
      e.preventDefault();
      // chọn nhiều ô + gõ 1 phím trùng ký hiệu => gán luôn cho cả vùng
      if (st.sel && (st.sel.r0 !== st.sel.r1 || st.sel.i0 !== st.sel.i1)) {
        var v = chuanGiaTri(k);
        if (v !== null && st.che === 'kh') { ganChon(v); return; }
      }
      batDauSua(k);
    }
  });
  document.addEventListener('copy', function (e) {
    if (!dangHoatDong() || !st.sel) return;
    var tg = e.target; if (tg && (tg.tagName === 'INPUT' || tg.tagName === 'TEXTAREA')) return;
    var s = st.sel, lines = [];
    for (var r = s.r0; r <= s.r1; r++) {
      var l = [];
      for (var i = s.i0; i <= s.i1; i++) { var v = giaTri(C.rows[r], i); l.push(v == null ? '' : st.che === 'kh' ? v : String(v).replace('.', ',')); }
      lines.push(l.join('\t'));
    }

<script>
/* ===== p-vaora.js ===== */
/* Trang Giờ vào / ra: nhập file từ máy chấm công (vân tay, thẻ, khuôn mặt), tính công – muộn – làm thêm */
(function () {

  function docThoiDiem(v) { // -> {ngay:'yyyy-mm-dd'|'', gio:[phút,...]}
    var kq = { ngay: '', gio: [] };
    if (v == null || v === '') return kq;
    if (typeof v === 'number') {
      if (v >= 1) kq.ngay = App.chuanNgay(v);
      var p = Math.round((v - Math.floor(v)) * 1440);
      if (p > 0 || v < 1) kq.gio.push(p % 1440);
      return kq;
    }
    var s = String(v).trim(), m;
    if ((m = s.match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) kq.ngay = TL.iso(+m[1], +m[2], +m[3]);
    else if ((m = s.match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { var y = +m[3]; if (y < 100) y += 2000; kq.ngay = TL.iso(y, +m[2], +m[1]); }
    else if (/^\d{5}(\.\d+)?$/.test(s)) return docThoiDiem(+s);
    var re = /(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|SA|CH)?/gi, g;
    while ((g = re.exec(s))) {
      var hh = +g[1], mm = +g[2], ap = (g[3] || '').toUpperCase();
      if ((ap === 'PM' || ap === 'CH') && hh < 12) hh += 12;
      if ((ap === 'AM' || ap === 'SA') && hh === 12) hh = 0;
      if (hh < 24 && mm < 60) kq.gio.push(hh * 60 + mm);
    }
    if (!kq.gio.length && /^0?\.\d+$/.test(s)) kq.gio.push(Math.round(+s * 1440));
    return kq;
  }

    veBang();
    App.$('#vr-file').onchange = function () {
      var f = this.files[0]; if (!f) return;
