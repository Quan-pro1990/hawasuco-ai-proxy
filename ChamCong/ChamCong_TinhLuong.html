<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#15324d">
<title>Nhân sự – Chấm công – Tiền lương</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%232a78d6'/%3E%3Cpath d='M6 8h12v10H6zM6 11h12M9 6v3M15 6v3' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
:root {
  --chinh: #1d5f95;
  --chinh-dam: #174e7b;
  --chinh-nhat: #e8f0f8;
  --nen: #f3f5f8;
  --mat: #ffffff;
  --vien: #d9dee5;
  --vien-dam: #b9c1cc;
  --chu: #1f2937;
  --mo: #5f6875;
  --do: #c02626;
  --xanh: #1e7b34;
  --cam: #b45a00;
  --nhap: #fffbe6;
  --sb: #15324d;
  --sb-chu: #c9d6e3;
  /* màu nhóm ký hiệu chấm công */
  --k-lam: #ffffff;
  --k-phep: #dbeafe;
  --k-le: #fde2e2;
  --k-huong: #ede7fb;
  --k-bhxh: #fdecd3;
  --k-khong: #e9ebee;
  --k-kp: #fbd5d5;
  --ngay-nghi: #f4f1e8;
  --ngay-le: #fff0f0;
  /* biểu đồ */
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --s4: #eda100;
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
  font-size: 14px; line-height: 1.45;
  color: var(--chu); background: var(--nen);
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--chinh); }
h1, h2, h3, h4 { margin: 0; font-weight: 600; }
.an { display: none !important; }
.chi-in { display: none; }

/* ============ Khung ============ */
.app { display: grid; grid-template-columns: 228px 1fr; min-height: 100vh; }
.sb {
  background: var(--sb); color: var(--sb-chu);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column;
}
.sb .logo { padding: 16px 16px 12px; display: flex; gap: 10px; align-items: center; color: #fff; border-bottom: 1px solid rgba(255,255,255,.08); }
.sb .logo .bieu { width: 36px; height: 36px; border-radius: 9px; background: #2a78d6; display: grid; place-items: center; flex: none; }
.sb .logo .bieu svg { width: 22px; height: 22px; }
.sb .logo b { display: block; font-size: 15px; line-height: 1.2; }
.sb .logo span { font-size: 12px; opacity: .7; }
.sb nav { padding: 8px; flex: 1; }
.sb nav a {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px;
  color: var(--sb-chu); text-decoration: none; margin-bottom: 2px;
}
.sb nav a svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.sb nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.sb nav a.chon { background: #2a78d6; color: #fff; font-weight: 600; }
.sb nav .nhom-nav { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; opacity: .5; padding: 14px 12px 4px; }
.sb .chan { padding: 12px 16px; font-size: 12px; opacity: .65; border-top: 1px solid rgba(255,255,255,.08); }

.chinh-khung { min-width: 0; display: flex; flex-direction: column; }
.tb {
  position: sticky; top: 0; z-index: 20; background: var(--mat); border-bottom: 1px solid var(--vien);
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; min-height: 58px;
}
.tb h1 { font-size: 18px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .menu { display: none; border: 1px solid var(--vien); background: #fff; border-radius: 8px; width: 38px; height: 38px; }
.ky { display: flex; align-items: center; border: 1px solid var(--vien); border-radius: 9px; overflow: hidden; background: #fff; }
.ky button { border: 0; background: transparent; width: 34px; height: 36px; cursor: pointer; color: var(--mo); font-size: 16px; }
.ky button:hover { background: var(--chinh-nhat); color: var(--chinh); }
.ky select { border: 0; height: 36px; padding: 0 4px; background: transparent; font-weight: 600; cursor: pointer; }
.ky .khoa { padding: 0 8px; color: var(--cam); font-size: 13px; }
.noi { padding: 18px 20px 40px; min-width: 0; }

/* ============ Thành phần ============ */
.the { background: var(--mat); border: 1px solid var(--vien); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.the > h3 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.the > h3 .phai { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--mo); }
.mo { color: var(--mo); }
.nho { font-size: 12.5px; }
.hang { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hang .gian { flex: 1; }
.cot2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cot3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cot-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }

input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], input:not([type]), select, textarea {
  border: 1px solid var(--vien-dam); border-radius: 7px; padding: 6px 9px; background: #fff; min-height: 34px; max-width: 100%;
}
textarea { min-height: 60px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(42,120,214,.3); border-color: var(--chinh); }
input[readonly] { background: #f6f7f9; }
input.so { text-align: right; }
label.chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }

.nut {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--vien-dam); background: #fff; border-radius: 8px; padding: 6px 12px; min-height: 34px;
  cursor: pointer; white-space: nowrap; text-decoration: none; color: var(--chu);
}
.nut:hover { border-color: var(--chinh); color: var(--chinh); }
.nut svg { width: 16px; height: 16px; }
.nut.chinh { background: var(--chinh); border-color: var(--chinh); color: #fff; font-weight: 600; }
.nut.chinh:hover { background: var(--chinh-dam); color: #fff; }
.nut.xanh { background: var(--xanh); border-color: var(--xanh); color: #fff; }
.nut.nguy { color: var(--do); }
.nut.nguy:hover { border-color: var(--do); }
.nut.nho { padding: 3px 8px; min-height: 28px; font-size: 13px; }
.nut:disabled { opacity: .5; cursor: not-allowed; }
.nut-nhom { display: inline-flex; }
.nut-nhom .nut { border-radius: 0; margin-left: -1px; }
.nut-nhom .nut:first-child { border-radius: 8px 0 0 8px; margin-left: 0; }
.nut-nhom .nut:last-child { border-radius: 0 8px 8px 0; }
.nut-nhom .nut.chon { background: var(--chinh-nhat); color: var(--chinh); border-color: var(--chinh); position: relative; z-index: 1; font-weight: 600; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--vien); margin-bottom: 16px; overflow-x: auto; }
.tabs button { border: 0; background: transparent; padding: 9px 14px; cursor: pointer; color: var(--mo); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.chon { color: var(--chinh); border-bottom-color: var(--chinh); font-weight: 600; }

.the-tt { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; background: #eef1f5; color: var(--mo); white-space: nowrap; }
.the-tt.xanh { background: #e3f4e8; color: var(--xanh); }
.the-tt.cam { background: #fff0dc; color: var(--cam); }
.the-tt.do { background: #fde8e8; color: var(--do); }
.the-tt.lam { background: var(--chinh-nhat); color: var(--chinh); }

.goi-y { background: #f4f8fd; border: 1px solid #d6e4f5; border-radius: 10px; padding: 10px 14px; color: #33506d; font-size: 13px; }
.canh-bao { background: #fff7e6; border: 1px solid #f3d9a4; border-radius: 10px; padding: 10px 14px; color: #7a4b00; font-size: 13px; }
.trong { text-align: center; color: var(--mo); padding: 36px 12px; }

/* ============ Bảng ============ */
.cuon { overflow: auto; border: 1px solid var(--vien); border-radius: 10px; background: #fff; max-width: 100%; }
.cuon.cao { max-height: calc(100vh - 230px); }
table.bang { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }
table.bang th, table.bang td { padding: 6px 8px; border-bottom: 1px solid #eceff3; border-right: 1px solid #f1f3f6; white-space: nowrap; }
table.bang thead th {
  position: sticky; top: 0; z-index: 2; background: #f2f5f9; font-weight: 600; text-align: center; color: #34404f;
  border-bottom: 1px solid var(--vien); vertical-align: middle; white-space: normal; min-width: 60px;
}
table.bang thead tr:nth-child(2) th { top: var(--h1, 33px); }
table.bang td.so, table.bang th.so { text-align: right; font-variant-numeric: tabular-nums; }
table.bang td.giua { text-align: center; }
table.bang tbody tr:hover td { background: #f7faff; }
table.bang tr.tong td { background: #eef3f9; font-weight: 700; position: sticky; bottom: 0; z-index: 1; border-top: 1px solid var(--vien); }
table.bang tr.nhom td { background: #f6f8fb; font-weight: 600; color: var(--chinh-dam); }
table.bang tr.nhom-tong td { background: #fafbfd; font-weight: 600; }
table.bang td.ten { font-weight: 500; }
table.bang td .lk { cursor: pointer; color: var(--chinh); }
table.bang td .lk:hover { text-decoration: underline; }
table.bang td.dinh, table.bang th.dinh { position: sticky; left: 0; z-index: 1; background: #fff; }
table.bang thead th.dinh { z-index: 3; background: #f2f5f9; }
table.bang tr.tong td.dinh { background: #eef3f9; z-index: 2; }
table.bang input.o-nhap {
  width: 100%; min-width: 92px; border: 1px solid transparent; background: var(--nhap); border-radius: 5px; padding: 3px 6px;
  text-align: right; min-height: 26px; font-variant-numeric: tabular-nums;
}
table.bang input.o-nhap:hover { border-color: var(--vien-dam); }
table.bang input.o-nhap:focus { border-color: var(--chinh); background: #fff; }
table.bang input.o-nhap[disabled] { background: transparent; color: var(--chu); }
table.bang input.o-nhap.chu { text-align: left; min-width: 140px; }
td.am { color: var(--do); }

/* ============ Bảng chấm công ============ */
.cc-cong { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.bang-mau { display: flex; flex-wrap: wrap; gap: 4px; }
.bang-mau button {
  min-width: 38px; height: 30px; border: 1px solid var(--vien-dam); border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12.5px; padding: 0 6px;
}
.bang-mau button:hover { border-color: var(--chinh); box-shadow: 0 0 0 2px rgba(42,120,214,.2); }
.bang-mau .xoa { color: var(--do); background: #fff; }
table.cc { border-collapse: separate; border-spacing: 0; font-size: 12.5px; user-select: none; }
table.cc th, table.cc td { border-right: 1px solid #e5e8ed; border-bottom: 1px solid #e5e8ed; padding: 0; height: 30px; }
table.cc thead th { position: sticky; top: 0; z-index: 3; background: #f2f5f9; font-weight: 600; font-size: 12px; color: #34404f; }
table.cc thead tr:nth-child(2) th { top: 24px; font-weight: 400; color: var(--mo); font-size: 11px; height: 22px; }
table.cc thead tr:first-child th { height: 24px; }
table.cc th.d, table.cc td.d { width: 34px; min-width: 34px; max-width: 34px; text-align: center; }
table.cc td.d { cursor: cell; font-weight: 600; }
table.cc th.wk, table.cc td.wk { background: var(--ngay-nghi); }
table.cc th.le, table.cc td.le { background: var(--ngay-le); }
table.cc thead th.le { color: var(--do); }
table.cc thead th.hn { box-shadow: inset 0 -3px 0 #2a78d6; color: var(--chinh); }
table.cc td.ngoai { background: repeating-linear-gradient(45deg, #f5f6f8, #f5f6f8 4px, #eceef2 4px, #eceef2 8px); cursor: not-allowed; }
table.cc td.n-phep { background: var(--k-phep); }
table.cc td.n-le { background: var(--k-le); }
table.cc td.n-huong { background: var(--k-huong); }
table.cc td.n-bhxh { background: var(--k-bhxh); }
table.cc td.n-khong { background: var(--k-khong); }
table.cc td.n-kp { background: var(--k-kp); color: var(--do); }
table.cc td.n-lam { color: #1b5e34; }
table.cc td.n-sai { color: var(--do); text-decoration: underline wavy; }
table.cc td.so-ot { color: #8a4b00; }
table.cc td.so-muon { color: var(--do); }
table.cc td.sel { box-shadow: inset 0 0 0 999px rgba(42,120,214,.16); }
table.cc td.act { outline: 2px solid #2a78d6; outline-offset: -2px; }
table.cc td.i { padding: 0 6px; white-space: nowrap; background: #fff; }
table.cc td.i.stt { text-align: center; color: var(--mo); width: 34px; }
table.cc .dinh1, table.cc .dinh2, table.cc .dinh3 { position: sticky; z-index: 2; }
table.cc thead .dinh1, table.cc thead .dinh2, table.cc thead .dinh3 { z-index: 4; }
table.cc .dinh1 { left: 0; min-width: 34px; }
table.cc .dinh2 { left: 34px; min-width: 66px; }
table.cc .dinh3 { left: 100px; min-width: 170px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; box-shadow: 1px 0 0 var(--vien-dam); }
table.cc td.t { text-align: right; padding: 0 6px; font-variant-numeric: tabular-nums; background: #fafbfc; min-width: 46px; }
table.cc td.t.dam { font-weight: 700; color: var(--chinh-dam); background: #f0f5fb; }
table.cc th.t { min-width: 46px; padding: 0 4px; white-space: normal; line-height: 1.15; }
table.cc tfoot td { position: sticky; bottom: 0; background: #eef3f9; font-weight: 600; z-index: 2; text-align: center; font-size: 11.5px; color: var(--mo); }
table.cc tfoot td.dinh3 { z-index: 3; text-align: left; padding: 0 6px; }
.o-sua { position: absolute; z-index: 30; border: 2px solid #2a78d6; text-align: center; font-weight: 600; padding: 0; border-radius: 0; min-height: 0; font-size: 13px; }
.chu-giai { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--mo); }
.chu-giai span b { display: inline-block; min-width: 30px; text-align: center; border: 1px solid var(--vien); border-radius: 4px; padding: 0 4px; margin-right: 4px; color: var(--chu); }

/* ============ Tổng quan ============ */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: #fff; border: 1px solid var(--vien); border-radius: 12px; padding: 14px 16px; }
.kpi .nhan { color: var(--mo); font-size: 12.5px; }
.kpi .gt { font-size: 22px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.kpi .phu { font-size: 12px; color: var(--mo); }
.kpi .phu .tang { color: var(--xanh); }
.kpi .phu .giam { color: var(--do); }
.bd { position: relative; width: 100%; }
.bd svg { display: block; width: 100%; height: auto; overflow: visible; }
.bd text { font-family: inherit; }
.chu-thich { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--mo); margin-top: 8px; }
.chu-thich i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chu-thich b { color: var(--chu); font-weight: 600; }
.tip {
  position: fixed; z-index: 100; pointer-events: none; background: #fff; color: var(--chu); border: 1px solid var(--vien);
  border-radius: 8px; padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 20px rgba(15, 30, 50, .14); max-width: 280px;
}
.tip b { display: block; margin-bottom: 4px; }
.tip .d { display: flex; justify-content: space-between; gap: 14px; }
.tip .d span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
.ds-gon { list-style: none; margin: 0; padding: 0; }
.ds-gon li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eef0f3; }
.ds-gon li:last-child { border-bottom: 0; }
.thanh-nho { height: 8px; border-radius: 4px; background: #eef1f5; overflow: hidden; margin-top: 4px; }
.thanh-nho div { height: 100%; background: var(--s1); border-radius: 4px; }

/* ============ Hộp thoại ============ */
.mo-nen { position: fixed; inset: 0; background: rgba(15, 25, 40, .45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.mo-hop { background: #fff; border-radius: 14px; width: 640px; max-width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.25); display: flex; flex-direction: column; max-height: calc(100vh - 80px); }
.mo-hop.rong { width: 920px; }
.mo-hop.hep { width: 440px; }
.mo-dau { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--vien); }
.mo-dau h3 { flex: 1; font-size: 16px; }
.mo-dau .dong { border: 0; background: transparent; font-size: 22px; line-height: 1; cursor: pointer; color: var(--mo); }
.mo-than { padding: 16px 18px; overflow-y: auto; }
.mo-chan { padding: 12px 18px; border-top: 1px solid var(--vien); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 14px; }
.form.ba { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form .ca { grid-column: 1 / -1; }
.form label.o { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mo); }
.form label.o > input, .form label.o > select, .form label.o > textarea { color: var(--chu); width: 100%; }
.form .gc { font-size: 12px; color: var(--mo); }
.form h4 { grid-column: 1 / -1; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--chinh); margin-top: 6px; }

.thongbao { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.thongbao div { background: #1f2937; color: #fff; padding: 9px 16px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.2); font-size: 13.5px; max-width: 90vw; }
.thongbao div.loi { background: var(--do); }
.thongbao div.tot { background: var(--xanh); }

/* ============ Phiếu lương ============ */
.ds-phieu { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; }
.phieu { background: #fff; border: 1px solid var(--vien); border-radius: 10px; padding: 16px 18px; font-size: 13px; break-inside: avoid; }
.phieu .p-dau { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--mo); }
.phieu h3 { text-align: center; font-size: 16px; margin: 8px 0 2px; letter-spacing: .02em; }
.phieu .p-ky { text-align: center; color: var(--mo); margin-bottom: 10px; }
.phieu .p-tt { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin-bottom: 10px; }
.phieu table { width: 100%; border-collapse: collapse; }
.phieu td { padding: 4px 6px; border-bottom: 1px dotted #d5dae1; }
.phieu td:last-child { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.phieu tr.m td { font-weight: 700; background: #f3f6fa; }
.phieu tr.c td:first-child { padding-left: 18px; color: #444; }
.phieu tr.tl td { font-size: 15px; font-weight: 700; color: var(--chinh-dam); border-bottom: 0; border-top: 2px solid var(--chinh); }
.phieu .bang-chu { font-style: italic; margin-top: 4px; }
.phieu .ky-ten { display: grid; grid-template-columns: 1fr 1fr; text-align: center; margin-top: 14px; font-weight: 600; }
.phieu .ky-ten span { display: block; font-weight: 400; font-style: italic; color: var(--mo); font-size: 12px; margin-bottom: 44px; }

/* ============ Chi tiết cách tính ============ */
.ct-tinh { width: 100%; border-collapse: collapse; font-size: 13px; }
.ct-tinh td { padding: 5px 6px; border-bottom: 1px solid #eef0f3; vertical-align: top; }
.ct-tinh td:nth-child(2) { color: var(--mo); font-size: 12px; }
.ct-tinh td:last-child { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 600; }
.ct-tinh tr.m td { background: #f3f6fa; font-weight: 700; color: var(--chinh-dam); }

/* ============ Đầu trang in ============ */
.dau-in { margin-bottom: 10px; }
.dau-in .cty { font-weight: 700; text-transform: uppercase; }
.dau-in h2 { text-align: center; font-size: 18px; margin: 8px 0 2px; }
.dau-in .ky-in { text-align: center; font-style: italic; }
.ky-in-cuoi { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; margin-top: 18px; font-weight: 600; }
.ky-in-cuoi span { display: block; font-weight: 400; font-style: italic; font-size: 12px; margin-bottom: 60px; }

/* ============ Responsive ============ */
@media (max-width: 1100px) {
  .cot3 { grid-template-columns: 1fr 1fr; }
  .cot-2-1 { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; }
  .sb { position: fixed; left: 0; top: 0; bottom: 0; width: 248px; z-index: 60; transform: translateX(-100%); transition: transform .2s; }
  .app.mo-menu .sb { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.3); }
  .tb .menu { display: inline-grid; place-items: center; }
  .tb { padding: 8px 12px; flex-wrap: wrap; }
  .noi { padding: 12px; }
  .cot2, .cot3 { grid-template-columns: 1fr; }
  .form, .form.ba { grid-template-columns: 1fr; }
  .ds-phieu { grid-template-columns: 1fr; }
}

/* ============ In ============ */
@media print {
  @page { size: A4 landscape; margin: 10mm; }
  body { background: #fff; font-size: 11.5px; }
  .sb, .tb, .khong-in, .thongbao, .tip, .tabs { display: none !important; }
  .app { display: block; }
  .noi { padding: 0; }
  .chi-in { display: block; }
  .the { border: 0; padding: 0; margin: 0; }
  .cuon, .cuon.cao { overflow: visible; max-height: none; border: 0; }
  table.bang th, table.bang td { border: 1px solid #999 !important; padding: 3px 4px; position: static !important; }
  table.bang thead th { background: #eee !important; }
  table.bang input.o-nhap { background: transparent; border: 0; padding: 0; }
  table.cc th, table.cc td { border: 1px solid #999 !important; position: static !important; height: 20px; }
  table.cc td.sel { box-shadow: none; }
  table.cc td.act { outline: 0; }
  table.cc th.d, table.cc td.d { width: 22px; min-width: 22px; max-width: 22px; font-size: 10px; }
  .ds-phieu { display: block; }
  .phieu { border: 1px solid #999; margin-bottom: 8mm; page-break-inside: avoid; }
  body.in-doc { }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
body.in-doc { }
@media print { body.in-doc { } }
.nut.chinh.nguy-hop { background: var(--do); border-color: var(--do); }
.nut.chinh.nguy-hop:hover { background: #a11f1f; }
.bang-mau .n-kp { color: var(--do); }
.ct-tinh tr.m td { text-align: left !important; }
table.cc td.nhan { box-shadow: inset 0 0 0 2px #e0a33a; }
table.cc td.nhan sup { font-size: 8.5px; color: #a15c00; margin-left: 1px; font-weight: 700; }
table.cc td.nhan.sel { box-shadow: inset 0 0 0 2px #e0a33a, inset 0 0 0 999px rgba(42,120,214,.16); }
table.cc tfoot td.dinh1, table.cc tfoot td.dinh2 { z-index: 3; }

/* ============ Nhân sự ============ */
.anh-nv { width: 72px; height: 96px; border-radius: 8px; background: #e3ebf4; color: var(--chinh); display: grid; place-items: center; font-weight: 700; font-size: 24px; overflow: hidden; flex: none; }
.anh-nv img { width: 100%; height: 100%; object-fit: cover; }
.anh-nv.lon { width: 90px; height: 120px; }
.tabs button:disabled { opacity: .45; cursor: not-allowed; }
.in-rieng { display: none; }
.vb { font-family: "Times New Roman", serif; font-size: 13.5pt; line-height: 1.5; color: #000; }
.vb h1 { font-size: 16pt; text-align: center; margin: 14px 0 2px; }
.vb .qh { display: grid; grid-template-columns: 1fr 1.3fr; text-align: center; font-weight: 700; font-size: 12.5pt; }
.vb .qh span { display: block; font-weight: 400; font-style: italic; }
.vb .qh u { text-decoration: none; border-bottom: 1px solid #000; padding-bottom: 1px; }
.vb .giua { text-align: center; }
.vb p { margin: 4px 0; text-align: justify; }
.vb .dieu { font-weight: 700; margin-top: 8px; }
.vb table.tt { width: 100%; border-collapse: collapse; margin: 4px 0; }
.vb table.tt td { padding: 2px 4px; vertical-align: top; }
.vb table.kb { width: 100%; border-collapse: collapse; font-size: 12pt; margin: 4px 0 8px; }
.vb table.kb th, .vb table.kb td { border: 1px solid #000; padding: 3px 5px; vertical-align: top; }
.vb .ky2 { display: grid; grid-template-columns: 1fr 1fr; text-align: center; font-weight: 700; margin-top: 18px; }
.vb .ky2 span { display: block; font-weight: 400; font-style: italic; margin-bottom: 70px; }
.vb .anh34 { width: 3cm; height: 4cm; border: 1px solid #000; float: right; margin: 0 0 8px 12px; display: grid; place-items: center; font-size: 10pt; overflow: hidden; }
.vb .anh34 img { width: 100%; height: 100%; object-fit: cover; }
@media print {
  body.dang-in-rieng > *:not(.in-rieng) { display: none !important; }
  body.dang-in-rieng .in-rieng { display: block; }
  .in-rieng .trang { page-break-after: always; }
  .in-rieng .trang:last-child { page-break-after: auto; }
}

/* ============ Logo, tên công ty (như phần mềm Thất thoát nước) ============ */
.thuong-hieu { padding: 18px 14px 14px; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08); }
.thuong-hieu .logo-cty { width: 84px; height: 84px; object-fit: contain; display: block; margin: 0 auto 10px; border-radius: 50%; background: #fff; }
.thuong-hieu .ten-cty { color: #fff; font-weight: 700; font-size: 13.5px; line-height: 1.35; letter-spacing: .01em; }
.thuong-hieu .ten-pm { color: #a9bcd3; font-size: 12px; margin-top: 6px; }
.tt-mc { padding: 10px 16px; font-size: 12px; color: var(--sb-chu); border-top: 1px solid rgba(255,255,255,.08); }
.tt-mc:empty { display: none; }
.tt-mc .mo { color: #8a9bb0; margin-top: 2px; }
.tt-mc a { color: #cfe0f3; }
.tt-cham { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
.tt-cham.xanh { background: #2fbf71; } .tt-cham.cam { background: #f0a73a; } .tt-cham.do { background: #e35d5d; }
/* màn hình đăng nhập */
.dn-nen { min-height: 100vh; display: grid; place-items: center; background: linear-gradient(160deg, #15324d 0%, #1d5f95 100%); padding: 20px; }
.dn-hop { background: #fff; border-radius: 16px; padding: 28px 28px 22px; width: 380px; max-width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.3); display: grid; gap: 12px; }
.dn-hop .logo-cty { width: 96px; height: 96px; display: block; margin: 0 auto; }
.dn-hop .ten-cty { text-align: center; font-weight: 700; color: var(--chinh-dam); font-size: 15px; line-height: 1.35; }
.dn-hop .ten-pm { text-align: center; color: var(--mo); font-size: 13px; margin-top: -6px; margin-bottom: 4px; }
.dn-hop label.o { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mo); }
.dn-hop input { width: 100%; }
.dn-loi { color: var(--do); font-size: 13px; min-height: 18px; }
@media print { .thuong-hieu, .tt-mc { display: none; } }
.thuong-hieu.xem-truoc { background: var(--sb); border-radius: 12px; width: 240px; border-bottom: 0; }

/* Thang, bảng lương */
.form div.o { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--mo); }
.chon-bac { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chon-bac select { color: var(--chu); max-width: 100%; }
.chon-bac select[data-xl="bang"] { min-width: 180px; }
.chon-bac select[data-xl="ngach"] { min-width: 170px; }
.chon-bac select[data-xl="bac"] { min-width: 200px; }
td > .chon-bac { flex-wrap: nowrap; }
td > .chon-bac select { font-size: 12.5px; padding: 4px 6px; min-width: 0; }
td > .chon-bac select[data-xl="bang"] { width: 170px; }
td > .chon-bac select[data-xl="ngach"] { width: 170px; }
td > .chon-bac select[data-xl="bac"] { width: 165px; }
.bang-bac input.o-nhap.so { text-align: right; }
@media print { .chon-bac select { border: 0; appearance: none; -webkit-appearance: none; padding: 0; background: none; } }
.tk-dv { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; color: var(--chu); max-height: 220px; overflow: auto; border: 1px solid var(--vien); border-radius: 8px; padding: 8px 10px; }

/* Mức lương theo kỳ */
.muc-thanh { gap: 6px; flex-wrap: wrap; }
.chip-muc { border: 1px solid var(--vien); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; color: var(--chu); display: inline-flex; gap: 6px; align-items: center; }
.chip-muc:hover { border-color: var(--chinh); }
.chip-muc.chon { background: var(--chinh); border-color: var(--chinh); color: #fff; font-weight: 600; }
.chip-muc.chon .the-tt { background: rgba(255,255,255,.2); color: #fff; }
input.tu-dong { color: var(--chinh); font-style: italic; }

</style>

<script>

        var row = [{ v: r._nhan, s: K.nhom }];
        for (var x = 1; x < n; x++) row.push({ v: '', s: K.nhom });
        gop.push(XL.oRef(dong.length, 0) + ':' + XL.oRef(dong.length, n - 1));
        dong.push(row); return;
      }
      var laTong = r._kieu === 'tong';
      if (!laTong) stt++;
      dong.push(cot.map(function (c, ci) {
        var kieu0 = c.kieu || 'chu', laSo = kieu0 === 'so' || kieu0 === 'cong';
        var v = c.stt ? (laTong ? '' : stt) : (laTong && ci === (o.cotNhanTong || 1) ? r._nhan : (laTong && (!laSo || c.khongTong) ? '' : giaTri(c, r, stt)));
        var kieu = c.kieu || 'chu';
        var s = laTong ? (kieu === 'so' ? K.nhomSo : kieu === 'cong' ? K.tongCong : K.nhom) : (K[kieu] || K.chu);
        if (c.nen && !laTong) { s = Object.assign({}, s, { nen: typeof c.nen === 'function' ? c.nen(r) : c.nen }); if (!s.nen) delete s.nen; }
        return { v: v === 0 && (kieu === 'so' || kieu === 'cong') ? '' : v, s: s };
      }));
    });
    if (o.tong) {
      var t = o.tong;
      dong.push(cot.map(function (c, ci) {
        var kieu = c.kieu || 'chu';
        var v = ci === (o.cotNhanTong || 1) ? (t._nhan || 'TỔNG CỘNG') : (c.khongTong || c.stt || !(kieu === 'so' || kieu === 'cong') ? '' : giaTri(c, t));
        return { v: v === 0 ? '' : v, s: kieu === 'so' ? K.tongSo : kieu === 'cong' ? K.tongCong : K.tong };
      }));
    }
    if (o.dongCuoi) { dong.push([], [{ v: o.dongCuoi, s: { i: true, b: true } }]); }
    if (o.chuKy !== false) {
      var ct = App.db.congTy, hn = new Date();
      dong.push([]);
      var r = dong.length, ba = [0, Math.floor(n / 2) - 1, Math.max(n - 4, 2)];
      if (n < 6) ba = [0, 2, 4];
      var rowNgay = []; rowNgay[ba[2]] = { v: (ct.diaDanh || '.......') + ', ngày ' + hn.getDate() + ' tháng ' + (hn.getMonth() + 1) + ' năm ' + hn.getFullYear(), s: K.kyGhi };
      dong.push(rowNgay);
      var tieu = [], ghi = [], ten = [];
      [['NGƯỜI LẬP BIỂU', ct.nguoiLap], ['KẾ TOÁN TRƯỞNG', ct.keToan], ['GIÁM ĐỐC', ct.giamDoc]].forEach(function (x, i) {
        tieu[ba[i]] = { v: x[0], s: K.kyTen }; ghi[ba[i]] = { v: i === 2 ? '(Ký, họ tên, đóng dấu)' : '(Ký, họ tên)', s: K.kyGhi }; ten[ba[i]] = { v: x[1] || '', s: K.kyTen };
      });
      dong.push(tieu, ghi, [], [], [], ten);
      [r + 1, r + 2, r + 6].forEach(function (rr) {
        ba.forEach(function (c0, i) {
          var c1 = i < 2 ? Math.max(c0, ba[i + 1] - 1) : Math.min(n - 1, c0 + 3);
          if (c1 > c0) gop.push(XL.oRef(rr, c0) + ':' + XL.oRef(rr, c1));
        });
      });
      gop.push(XL.oRef(r, ba[2]) + ':' + XL.oRef(r, Math.min(n - 1, ba[2] + 3)));
    }
    return {
      ten: o.ten || 'Sheet1', dong: dong, gop: gop, cao: cao, ngang: o.ngang !== false,
      cot: cot.map(function (c) { return c.w || 12; }), co: { r: batDau, c: o.coCot || 0 }
    };
  };
  App.xuatExcel = function (tenFile, sheets) {

  /** Tham số trên địa chỉ trang: #hoso?id=nv1 */

  /** In một nội dung riêng (hợp đồng, sơ yếu lý lịch…) mà không in cả trang */

  /** Ô chọn loại lao động để lọc */

  /* ================= Kỳ (tháng) đang chọn ================= */
  /** Kỳ mặc định: kỳ công đang chạy; nếu kỳ mới bắt đầu chưa quá 20 ngày thì lấy kỳ vừa kết thúc (đang làm lương). */
  App.kyMacDinh = function () {

    var chamHangNgay = App.laTaiKhoanChamCong && App.laTaiKhoanChamCong();
    if (!chamHangNgay && (d - new Date(bd.y, bd.m - 1, bd.d)) / 864e5 < 20) { k.m--; if (k.m < 1) { k.m = 12; k.y--; } }

  App.thangKhoa = function () { var T = App.db.thang[TL.khoaKy(App.ky.y, App.ky.m)]; return !!(T && T.khoa); };

  /* ================= Khung & điều hướng ================= */

    { id: 'quyetdinh', ten: 'Quyết định', icon: 'quyetdinh' },
    { id: 'nangbac', ten: 'Xếp lương, nâng bậc', icon: 'bac' },
    { id: 'nghiphep', ten: 'Đơn nghỉ phép', icon: 'nghiphep' },
    { id: 'bcnhansu', ten: 'Báo cáo nhân sự', icon: 'cocau' },
    { nhom: 'Chấm công – tiền lương' },
    { id: 'chamcong', ten: 'Bảng chấm công', icon: 'chamcong' },
    { id: 'vaora', ten: 'Giờ vào / ra', icon: 'vaora' },
    { id: 'bangluong', ten: 'Bảng lương', icon: 'bangluong' },
    { id: 'phieuluong', ten: 'Phiếu lương', icon: 'phieuluong' },
    { id: 'baocao', ten: 'Báo cáo lương', icon: 'baocao' },
    { nhom: 'Thiết lập' },
    { id: 'mucluong', ten: 'Mức lương theo kỳ', icon: 'bac' },
    { id: 'danhmuc', ten: 'Danh mục', icon: 'danhmuc' },
    { id: 'caidat', ten: 'Cài đặt & dữ liệu', icon: 'caidat' }
  ];
  App.MENU = MENU;
  /** Phân quyền trang (chế độ máy chủ ghi đè cho tài khoản chấm công) */
  App.duocXem = function () { return true; };
  App.trangDau = function () { return 'dashboard'; };
  /** Mã các phòng / đội tài khoản được chấm công (null = tất cả) */
  App.dvChamCong = function () { return null; };

  function dungKhung() {
    var root = document.getElementById('app');
    root.className = 'app';
    root.innerHTML =
      '<aside class="sb"><div class="thuong-hieu" id="thuong-hieu"></div><nav>' +
      MENU.filter(function (x, i) {
        if (!x.nhom) return App.duocXem(x.id);
        for (var j = i + 1; j < MENU.length && !MENU[j].nhom; j++) if (App.duocXem(MENU[j].id)) return true;
        return false;
      }).map(function (x) {
        if (x.nhom) return '<div class="nhom-nav">' + x.nhom + '</div>';
        return '<a href="#' + x.id + '" data-id="' + x.id + '">' + App.icon(x.icon) + '<span>' + x.ten + '</span></a>';
      }).join('') +
      '</nav><div class="tt-mc" id="tt-maychu"></div><div class="chan" id="chan-sb"></div></aside>' +
      '<div class="chinh-khung"><header class="tb"><button class="menu" aria-label="Menu">' + App.icon('menu') + '</button><h1 id="tieu-de"></h1>' +
      '<div class="ky" id="chon-ky"></div></header><main class="noi" id="noi"></main></div>';
    App.$('.menu', root).onclick = function () { root.classList.toggle('mo-menu'); };
    App.$('nav', root).addEventListener('click', function () { root.classList.remove('mo-menu'); });
  }

  function veKy() {
    var el = App.$('#chon-ky'), y = App.ky.y, m = App.ky.m;
    var nams = {}, hn = new Date().getFullYear();
    for (var i = hn - 2; i <= hn + 1; i++) nams[i] = 1;
    nams[y] = 1;
    Object.keys(App.db.thang).forEach(function (k) { nams[+k.slice(0, 4)] = 1; });
    var optT = '', optN = '';
    for (var t = 1; t <= 12; t++) optT += '<option value="' + t + '"' + (t === m ? ' selected' : '') + '>Tháng ' + t + '</option>';
    Object.keys(nams).sort().forEach(function (n) { optN += '<option' + (+n === y ? ' selected' : '') + '>' + n + '</option>'; });
    el.innerHTML = '<button data-b="-1" title="Tháng trước" aria-label="Tháng trước">‹</button><select id="ky-t" aria-label="Tháng">' + optT + '</select>' +
      '<select id="ky-n" aria-label="Năm">' + optN + '</select><button data-b="1" title="Tháng sau" aria-label="Tháng sau">›</button>' +
      (App.thangKhoa() ? '<span class="khoa" title="Tháng đã chốt lương">' + '🔒 Đã chốt' + '</span>' : '');
    el.onclick = function (e) { var b = e.target.closest('button'); if (b) App.datKy(App.ky.y, App.ky.m + (+b.dataset.b)); };
    App.$('#ky-t').onchange = function () { App.datKy(App.ky.y, +this.value); };
    App.$('#ky-n').onchange = function () { App.datKy(+this.value, App.ky.m); };
  }

  App.trangHienTai = 'dashboard';
  App.veLai = function () {
    var id = (location.hash || '#dashboard').slice(1).split('?')[0];
    if (!App.trang[id] || !App.duocXem(id)) id = App.trangDau();

    App.trangHienTai = id;
    var tg = App.trang[id], idMenu = tg.menu || id;

    App.$$('.sb nav a').forEach(function (a) { a.classList.toggle('chon', a.dataset.id === idMenu); });
    App.$('#tieu-de').textContent = muc ? muc.ten : '';
    document.title = (muc ? muc.ten + ' – ' : '') + 'Nhân sự – Chấm công – Tiền lương';
    App.$('#chon-ky').style.display = tg.khongKy ? 'none' : '';
    veKy();

    catch (e) { console.error(e); noi.innerHTML = '<div class="the canh-bao">Có lỗi khi hiển thị trang: ' + App.h(e.message) + '</div>'; }
    var chan = App.$('#chan-sb');
    if (chan) chan.innerHTML = App.db.nhanVien.filter(function (n) { return n.trangThai !== 'nghi_viec'; }).length + ' nhân viên đang làm việc';
    var th = App.$('#thuong-hieu');
    if (th) th.innerHTML = App.khoiThuongHieu(App.db.congTy, false);
    App.datFavicon();
    if (App.veTrangThaiMayChu) App.veTrangThaiMayChu();
  };

  /* ================= Logo, tên công ty ================= */
  App.TEN_PHAN_MEM = 'Nhân sự – Chấm công – Tiền lương';
  /** Logo đang dùng: logo tải lên trong Cài đặt, logo mặc định, hoặc null nếu đã chọn "không dùng logo" */
  App.logoCongTy = function (ct) {
    ct = ct || App.db.congTy;
    if (ct.logo === '') return null;
    return ct.logo || window.LOGO_MAC_DINH || null;

  /** Tên công ty chia 2 dòng như phần mềm Thất thoát nước: "CÔNG TY TNHH MTV" / "CẤP NƯỚC HẬU GIANG" */
  App.tenHaiDong = function (ten) {
    var s = String(ten || '').trim().toUpperCase();
    var m = s.match(/^(CÔNG TY (?:TNHH(?: MTV| MỘT THÀNH VIÊN| HAI THÀNH VIÊN TRỞ LÊN)?|CỔ PHẦN|CP))\s+(.+)$/);
    return m ? [m[1], m[2]] : [s];
  };
  App.khoiThuongHieu = function (ct, lon) {
    var logo = App.logoCongTy(ct), dong = App.tenHaiDong(ct.ten);
    return (logo ? '<img class="logo-cty" src="' + logo + '" alt="Logo">' : '') +
      '<div class="ten-cty">' + dong.map(App.h).join('<br>') + '</div><div class="ten-pm">' + App.TEN_PHAN_MEM + '</div>' + (lon ? '' : '');
  };
  App.datFavicon = function () {
    var logo = App.logoCongTy();
    var l = document.querySelector('link[rel="icon"]');
    if (logo && l && l.getAttribute('href') !== logo) l.setAttribute('href', logo);
  };

  var daGanHash = false;
  /** Dựng giao diện sau khi đã có dữ liệu (App.db) */
  App.batDauGiaoDien = function () {
    App.ky = App.kyMacDinh();
    dungKhung();
    if (!daGanHash) { window.addEventListener('hashchange', App.veLai); daGanHash = true; }
    App.veLai();
  };
  App.khoiDong = function () {
    App.taiDuLieu();
    App.batDauGiaoDien();
  };
  document.addEventListener('DOMContentLoaded', function () { App.khoiDong(); });
})();

<script>
/* ===== maychu.js ===== */
/* Chế độ máy chủ: khi phần mềm được mở qua máy chủ IIS (ChamCongMayChu.exe), dữ liệu dùng chung nằm trên máy chủ.
   - Đăng nhập bằng tài khoản trên máy chủ.
   - Mọi thay đổi tự lưu lên máy chủ (nén gzip), có số phiên bản để không ghi đè lên thay đổi của người khác.
   - Cứ 15 giây hỏi máy chủ: có ai vừa lưu thì tự tải bản mới (khi mình không có thay đổi chưa lưu).
   Mở trực tiếp file .html (không có máy chủ) thì phần mềm chạy như cũ, lưu trong trình duyệt. */
(function () {
  'use strict';
  var App = window.App, TL = window.TL, h = App.h;
  var MC = App.mayChu = { bat: false, phienBan: 0, nguoi: '', capNhat: '', toi: null, canLuu: false, dangLuu: false, loi: '', luuLuc: null };
  var hen = null, henHoi = null;
  var KHO_CONG = ['cc', 'ot', 'muon', 'vr'];
  var VAI_TRO = { quan_tri: 'Quản trị', nhap_lieu: 'Nhập liệu (toàn bộ dữ liệu)', cham_cong: 'Chấm công theo phòng / đội' };

  /* ---------------- phân quyền: tài khoản chấm công chỉ thấy bảng chấm công, giờ vào / ra của phòng / đội mình ---------------- */
  function laCC() { return !!(MC.bat && MC.toi && MC.toi.vaiTro === 'cham_cong'); }
  App.laTaiKhoanChamCong = laCC;
  App.duocXem = function (id) { return !laCC() || id === 'chamcong' || id === 'vaora'; };
  App.trangDau = function () { return laCC() ? 'chamcong' : 'dashboard'; };
  App.dvChamCong = function () { return laCC() ? (MC.toi.donVi || []) : null; };

  /** Phần chấm công của dữ liệu (để so ô nào vừa sửa) */
  function phanCong(thang) {
    var kq = {};
    Object.keys(thang || {}).forEach(function (k) { var T = thang[k], x = {}; KHO_CONG.forEach(function (l) { x[l] = T[l] || {}; }); kq[k] = x; });
    return JSON.parse(JSON.stringify(kq));
  }
  /** Dữ liệu bỏ phần ô chấm công (để biết người khác có sửa gì ngoài chấm công không) */
  function boCong(db) {
    var x = Object.assign({}, db), th = {};
    Object.keys(db.thang || {}).sort().forEach(function (k) {
      var T = db.thang[k], t = {};
      Object.keys(T).forEach(function (f) {
        if (KHO_CONG.indexOf(f) >= 0) return;
        var v = T[f];
        if (v == null || v === false || (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length)) return;
        t[f] = v;
      });
      if (Object.keys(t).length) th[k] = t;
    });
    x.thang = th;
    return JSON.stringify(x);
  }
  /** Ghi nhớ bản gốc (lúc tải / lưu gần nhất) để chỉ gửi ô đã sửa, hoặc tự ghép khi người khác vừa chấm công */
  function chupGoc(db) {
    db = db || App.db;
    MC.goc = phanCong(db.thang);
    MC.gocKhac = laCC() ? null : boCong(db);
  }
  /** Áp các ô người khác vừa sửa (máy chủ khác bản gốc) vào dữ liệu đang có; ô mình cũng sửa thì giữ của mình */
  function gopO(sv) {
    var n = 0, goc = MC.goc || {}, ks = {}, rong = function (v) { return v == null || v === '' ? null : v; };
    Object.keys(sv).concat(Object.keys(goc)).forEach(function (k) { ks[k] = 1; });
    Object.keys(ks).forEach(function (k) {
      KHO_CONG.forEach(function (l) {
        var s = (sv[k] && sv[k][l]) || {}, g = (goc[k] && goc[k][l]) || {}, ids = {};
        Object.keys(s).concat(Object.keys(g)).forEach(function (i) { ids[i] = 1; });
        Object.keys(ids).forEach(function (id) {
          var a = g[id] || {}, b = s[id] || {}, ngay = {};
          Object.keys(a).concat(Object.keys(b)).forEach(function (d) { ngay[d] = 1; });
          Object.keys(ngay).forEach(function (d) {
            var vg = rong(a[d]), vs = rong(b[d]);
            if (JSON.stringify(vg) === JSON.stringify(vs)) return;
            var T = TL.thang(App.db, +k.slice(0, 4), +k.slice(5, 7), true), m = T[l][id], vl = rong(m && m[d]);
            if (JSON.stringify(vl) !== JSON.stringify(vg)) return; // máy này cũng sửa ô đó: giữ của mình
            if (vs == null) { if (m) { delete m[d]; if (!Object.keys(m).length) delete T[l][id]; } }
            else (T[l][id] = m || {})[d] = vs;
            n++;
          });
        });
      });
    });
    return n;
  }
  /** Bị trùng phiên bản khi lưu: nếu người khác chỉ chấm công thì tự ghép rồi lưu lại, ngược lại hỏi người dùng */
  function tuGop(tt) {
    var pbCu = MC.phienBan;
    if (!MC.gocKhac) { xungDot(tt); return; }
    taiDuLieu().then(function (dl) {
      var sv = dl && TL.chuanHoa(dl);
      if (!sv || boCong(sv) !== MC.gocKhac) { MC.phienBan = pbCu; xungDot(tt); return; }
      var n = gopO(sv.thang);
      MC.goc = phanCong(sv.thang);
      MC.canLuu = true; guiLuu();
      var dangSua = App.$('.mo-nen') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName));
      if (n && !dangSua) App.veLai();
      if (n) App.bao('Đã tự ghép ' + n + ' ô chấm công do ' + (MC.nguoi || 'người khác') + ' vừa lưu.');
    }).catch(function () { MC.phienBan = pbCu; xungDot(tt); });
  }
  /** Các ô chấm công đã đổi so với lần tải / lưu trước: { 'yyyy-mm': { cc: { nvId: { ngày: giá trị | null } } } } */
  function taoVa() {
    var thay = {}, n = 0, goc = MC.goc || {}, th = App.db.thang, ks = {};
    var rong = function (v) { return v == null || v === '' ? null : v; };
    Object.keys(th).concat(Object.keys(goc)).forEach(function (k) { ks[k] = 1; });
    Object.keys(ks).forEach(function (k) {
      KHO_CONG.forEach(function (l) {
        var moi = (th[k] && th[k][l]) || {}, cu = (goc[k] && goc[k][l]) || {}, ids = {};
        Object.keys(moi).concat(Object.keys(cu)).forEach(function (i) { ids[i] = 1; });
        Object.keys(ids).forEach(function (id) {
          var a = cu[id] || {}, b = moi[id] || {}, ngay = {};
          Object.keys(a).concat(Object.keys(b)).forEach(function (d) { ngay[d] = 1; });
          Object.keys(ngay).forEach(function (d) {
            var va = rong(a[d]), vb = rong(b[d]);
            if (JSON.stringify(va) === JSON.stringify(vb)) return;
            var t = thay[k] || (thay[k] = {}), x = t[l] || (t[l] = {}), o = x[id] || (x[id] = {});
            o[d] = vb; n++;
          });
        });
      });
    });
    return { thay: thay, n: n };
  }

  function api(duong, o) {
    o = o || {};
    var hd = { 'X-Yeu-Cau': 'ChamCong' };
    Object.keys(o.headers || {}).forEach(function (k) { hd[k] = o.headers[k]; });
    if (o.json !== undefined) { hd['Content-Type'] = 'application/json'; o.body = JSON.stringify(o.json); }
    return fetch('api/' + duong, { method: o.method || 'GET', headers: hd, body: o.body, credentials: 'same-origin', cache: 'no-store' })
      .then(function (r) {
        var ct = r.headers.get('Content-Type') || '';
        var p = ct.indexOf('json') >= 0 ? r.json() : r.text();
        return p.then(function (d) { return { status: r.status, ok: r.ok, data: d }; });
      });
  }
  MC.api = api;

  function nen(text) {
    if (typeof CompressionStream === 'undefined') return Promise.resolve({ body: text, gzip: false });
    try {
      var s = new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'));
      return new Response(s).arrayBuffer().then(function (b) { return { body: b, gzip: true }; });
    } catch (e) { return Promise.resolve({ body: text, gzip: false }); }
  }

  /* ---------------- khởi động ---------------- */
  var khoiDongCu = App.khoiDong;
  App.khoiDong = function () {
    if (location.protocol === 'file:') { khoiDongCu(); return; }
    api('ping').then(function (r) {
      if (!r.ok || !r.data || r.data.ungDung !== 'ChamCong') { khoiDongCu(); return; }
      MC.bat = true;
      return api('toi').then(function (t) {
        if (t.status === 200) { MC.toi = t.data; taiVaBatDau(); } else manHinhDangNhap();
      });
    }).catch(function () { if (!MC.bat) khoiDongCu(); else manHinhDangNhap('Không kết nối được máy chủ.'); });
  };

  function taiDuLieu() {
    return api('dulieu').then(function (r) {
      if (r.status === 401) throw { dangNhap: true };
      if (!r.ok) throw new Error((r.data && r.data.loi) || 'Lỗi ' + r.status);
      MC.phienBan = r.data.phienBan; MC.nguoi = r.data.nguoi; MC.capNhat = r.data.capNhat;
      return r.data.duLieu;
    });
  }

  function taiVaBatDau() {
    App.$('#app').innerHTML = '<div style="padding:40px;text-align:center;color:#5f6875">Đang tải dữ liệu từ máy chủ…</div>';
    taiDuLieu().then(function (dl) {
      if (dl) { App.db = TL.chuanHoa(dl); chupGoc(); App.batDauGiaoDien(); hoiDinhKy(); return; }
      if (laCC()) { App.$('#app').innerHTML = '<div class="the canh-bao" style="margin:40px">Máy chủ chưa có dữ liệu. Liên hệ quản trị phần mềm để nhập danh sách nhân viên trước. <a href="#" onclick="App.dangXuat();return false">Đăng xuất</a></div>'; return; }
      App.db = TL.duLieuMoi();
      App.batDauGiaoDien();
      hoiDinhKy();
      lanDau();
    }).catch(function (e) {
      if (e && e.dangNhap) manHinhDangNhap();
      else App.$('#app').innerHTML = '<div class="the canh-bao" style="margin:40px">Không tải được dữ liệu từ máy chủ: ' + h(e.message || e) + '. <a href="">Thử lại</a></div>';
    });
  }

  /** Máy chủ chưa có dữ liệu: chọn đưa dữ liệu lên */
  function lanDau() {
    var coCucBo = null;
    try { var s = localStorage.getItem('ChamCongTinhLuong_v1'); if (s) { var d = JSON.parse(s); if (d && d.nhanVien && !d.laMau) coCucBo = d; } } catch (e) { /* bỏ qua */ }
    App.hop({
      tieuDe: 'Máy chủ chưa có dữ liệu', co: 'hep', giu: true, khongFocus: true,
      than: '<p style="margin-top:0">Đây là lần đầu dùng phần mềm trên máy chủ. Chọn dữ liệu ban đầu (mọi người dùng chung):</p>' +
        '<div style="display:grid;gap:8px">' +
        (coCucBo ? '<button class="nut chinh" data-c="cucbo">Đưa dữ liệu đang có trên máy này lên (' + coCucBo.nhanVien.length + ' nhân viên)</button>' : '') +
        '<label class="nut">Nhập từ file sao lưu (.json)…<input type="file" accept=".json" class="an" id="ld-tep"></label>' +
        '<button class="nut" data-c="trong">Bắt đầu với dữ liệu trống</button>' +
        '<button class="nut" data-c="mau">Dùng dữ liệu mẫu để xem thử</button></div>',
      moRa: function (el, dong) {
        el.onclick = function (e) {
          var b = e.target.closest('[data-c]'); if (!b) return;
          var c = b.dataset.c;
          App.db = c === 'cucbo' ? TL.chuanHoa(coCucBo) : c === 'mau' ? App.taoMau() : TL.duLieuMoi();
          dong(); App.luuNgay(); App.ky = App.kyMacDinh(); App.veLai();
        };
        App.$('#ld-tep', el).onchange = function () {
          var f = this.files[0]; if (!f) return;
          f.text().then(function (s) {
            var d = JSON.parse(s);
            if (!d || !Array.isArray(d.nhanVien) || !d.caiDat) throw new Error('File không phải bản sao lưu của phần mềm này.');
            App.db = TL.chuanHoa(d); dong(); App.luuNgay(); App.ky = App.kyMacDinh(); App.veLai();
          }).catch(function (e) { App.bao(e.message, 'loi'); });
        };
      }
    });
  }

  /* ---------------- đăng nhập ---------------- */
  function manHinhDangNhap(loi) {
    var ct = App.db && App.db.congTy ? App.db.congTy : TL.duLieuMoi().congTy;
    App.$('#app').className = '';
    App.$('#app').innerHTML = '<div class="dn-nen"><form class="dn-hop" autocomplete="on" onsubmit="return false">' +
      App.khoiThuongHieu(ct, true) +
      '<label class="o">Tên đăng nhập<input name="ten" autocomplete="username" required></label>' +
      '<label class="o">Mật khẩu<input name="matKhau" type="password" autocomplete="current-password" required></label>' +
      '<div class="dn-loi">' + h(loi || '') + '</div><button class="nut chinh" style="width:100%">Đăng nhập</button>' +
      '<div class="mo nho" style="text-align:center;margin-top:10px">Dữ liệu lưu trên máy chủ, dùng chung cho các phòng.</div></form></div>';
    var f = App.$('.dn-hop');
    f.ten.focus();
    f.onsubmit = function () {
      var nut = App.$('button', f); nut.disabled = true;
      api('dangnhap', { method: 'POST', json: { ten: f.ten.value.trim(), matKhau: f.matKhau.value } }).then(function (r) {
        nut.disabled = false;
        if (r.status === 200) { MC.toi = r.data; taiVaBatDau(); return; }
        App.$('.dn-loi', f).textContent = (r.data && r.data.loi) || 'Đăng nhập không được.';
        f.matKhau.value = ''; f.matKhau.focus();
      }).catch(function () { nut.disabled = false; App.$('.dn-loi', f).textContent = 'Không kết nối được máy chủ.'; });
      return false;
    };
  }

  /** Phiên hết hạn giữa chừng: đăng nhập lại trong hộp thoại, không mất thay đổi đang chờ lưu */
  var dangHoiLai = false;
  function dangNhapLai() {
    if (dangHoiLai) return;
    dangHoiLai = true;
    App.hop({
      tieuDe: 'Phiên đăng nhập đã hết hạn', co: 'hep', giu: true,
      than: '<form class="form" style="grid-template-columns:1fr" onsubmit="return false"><p class="mo" style="margin:0">Đăng nhập lại để tiếp tục lưu dữ liệu (thay đổi chưa lưu vẫn được giữ).</p>' +
        '<label class="o">Tên đăng nhập<input name="ten" value="' + h(MC.toi ? MC.toi.ten : '') + '"></label><label class="o">Mật khẩu<input name="matKhau" type="password"></label></form>',
      khiDong: function () { dangHoiLai = false; },
      nut: [{
        ten: 'Đăng nhập', loai: 'chinh', bam: function (el) {
          var f = App.$('form', el);
          api('dangnhap', { method: 'POST', json: { ten: f.ten.value.trim(), matKhau: f.matKhau.value } }).then(function (r) {
            if (r.status === 200) { MC.toi = r.data; App.$('.mo-nen .dong').click(); App.luuNgay(); veTrangThai(); }
            else App.bao((r.data && r.data.loi) || 'Đăng nhập không được.', 'loi');
          });
          return false;
        }
      }]
    });
  }

  App.dangXuat = function () {
    var xong = function () { location.reload(); };
    if (MC.canLuu || MC.dangLuu) { App.luuNgay(); setTimeout(function () { api('dangxuat', { method: 'POST' }).then(xong, xong); }, 1500); }
    else api('dangxuat', { method: 'POST' }).then(xong, xong);
  };

  /* ---------------- lưu ---------------- */
  var luuCucBo = App.luuNgay, henCucBo = App.luu;
  App.luu = function () {
    if (!MC.bat) return henCucBo();
    MC.canLuu = true; veTrangThai();
    clearTimeout(hen); hen = setTimeout(guiLuu, 1200);
  };
  App.luuNgay = function () {
    if (!MC.bat) return luuCucBo();
    MC.canLuu = true;
    clearTimeout(hen); guiLuu();
  };

  function guiLuu(ghiDe) {
    if (MC.dangLuu) { MC.lai = true; return; }
    if (!MC.canLuu && !ghiDe) return;
    // tài khoản chấm công: chỉ gửi các ô vừa sửa, máy chủ ghép theo từng ô (không ghi đè ô người khác)
    var cc = laCC(), va = cc ? taoVa() : null, chup = cc ? phanCong(App.db.thang) : null;
    MC.canLuu = false;
    if (cc && !va.n) { veTrangThai(); return; }
    MC.dangLuu = true; MC.loi = ''; veTrangThai();
    var guiDi = cc ? null : JSON.stringify(App.db);
    var yc = cc ? api('chamcong', { method: 'PUT', json: { thang: va.thay } }) : nen(guiDi).then(function (n) {
      var hd = { 'X-Phien-Ban': String(ghiDe ? ghiDe : MC.phienBan), 'Content-Type': 'application/json' };
      if (n.gzip) hd['Content-Encoding'] = 'gzip';
      return api('dulieu', { method: 'PUT', headers: hd, body: n.body });
    });
    yc.then(function (r) {
      MC.dangLuu = false;
      if (r.status === 200) {
        if (cc) {
          // có người khác lưu xen giữa thì để lần hỏi định kỳ tải lại bản mới
          MC.goc = chup; MC.phienBan = r.data.phienBan === MC.phienBan + 1 ? r.data.phienBan : r.data.phienBan - 1;
        } else { MC.phienBan = r.data.phienBan; try { chupGoc(TL.chuanHoa(JSON.parse(guiDi))); } catch (e) { MC.gocKhac = null; } }
        MC.nguoi = r.data.nguoi; MC.capNhat = r.data.capNhat; MC.luuLuc = new Date();
      }
      else if (cc && (r.status === 400 || r.status === 403 || r.status === 409 || r.status === 423)) {
        App.bao('Không lưu được chấm công: ' + ((r.data && r.data.loi) || 'lỗi ' + r.status) + ' Đã tải lại dữ liệu trên máy chủ.', 'loi');
        taiLai(false);
      }
      else if (r.status === 409) { MC.canLuu = true; tuGop(r.data); }
      else if (r.status === 401) { MC.canLuu = true; MC.loi = 'Hết phiên đăng nhập'; dangNhapLai(); }
      else { MC.canLuu = true; MC.loi = (r.data && r.data.loi) || 'Lỗi ' + r.status; App.bao('Không lưu được lên máy chủ: ' + MC.loi, 'loi'); }
    }).catch(function () {
      MC.dangLuu = false; MC.canLuu = true; MC.loi = 'Mất kết nối máy chủ';
    }).then(function () {
      veTrangThai();
      if (MC.lai) { MC.lai = false; clearTimeout(hen); hen = setTimeout(guiLuu, 300); }
      else if (MC.canLuu && MC.loi && !dangHoiLai) { clearTimeout(hen); hen = setTimeout(guiLuu, 10000); }
    });
  }

  var dangHoiXungDot = false;
  function xungDot(tt) {
    if (dangHoiXungDot) return;
    dangHoiXungDot = true;
    var luc = tt && tt.capNhat ? new Date(tt.capNhat).toLocaleTimeString('vi-VN') : '';
    App.hop({
      tieuDe: 'Có người vừa lưu dữ liệu', co: 'hep', giu: true,
      than: '<p style="margin-top:0"><b>' + h(tt && tt.nguoi || 'Người khác') + '</b> vừa lưu dữ liệu lên máy chủ' + (luc ? ' lúc ' + luc : '') + ', trong khi máy này còn thay đổi chưa lưu.</p>' +
        '<p><b>Tải bản mới nhất</b>: lấy dữ liệu của người kia, bỏ thay đổi vừa làm trên máy này (làm lại thao tác nếu cần).<br>' +
        '<b>Ghi đè</b>: lưu dữ liệu trên máy này, thay đổi của người kia sẽ mất.</p>',
      khiDong: function () { dangHoiXungDot = false; },
      nut: [
        { ten: 'Ghi đè bằng dữ liệu của tôi', loai: 'nguy', bam: function () { MC.phienBan = tt.phienBan; guiLuu(String(tt.phienBan)); } },
        { ten: 'Tải bản mới nhất', loai: 'chinh', bam: function () { MC.canLuu = false; taiLai(true); } }
      ]
    });
  }

  function taiLai(bao) {
    return taiDuLieu().then(function (dl) {
      if (!dl) return;
      App.db = TL.chuanHoa(dl);
      MC.canLuu = false; chupGoc();
      App.veLai(); veTrangThai();
      if (bao) App.bao('Đã tải dữ liệu mới nhất' + (MC.nguoi ? ' (' + MC.nguoi + ' lưu lúc ' + new Date(MC.capNhat).toLocaleTimeString('vi-VN') + ')' : '') + '.', 'tot');
    }).catch(function (e) { if (e && e.dangNhap) dangNhapLai(); });
  }

  /** Hỏi máy chủ định kỳ: có người khác lưu thì tải bản mới (khi máy này đang rảnh, không có thay đổi chưa lưu) */
  function hoiDinhKy() {
    clearInterval(henHoi);
    henHoi = setInterval(function () {
      if (document.hidden || MC.dangLuu) return;
      api('trangthai').then(function (r) {
        if (r.status === 401) { dangNhapLai(); return; }
        if (!r.ok) return;
        if (MC.loi === 'Mất kết nối máy chủ') { MC.loi = ''; veTrangThai(); if (MC.canLuu) guiLuu(); }
        if (r.data.phienBan > MC.phienBan && !MC.canLuu) {
          var dangSua = App.$('.mo-nen') || (document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName) && App.$('#noi').contains(document.activeElement));
          if (dangSua) return; // đợi người dùng sửa xong
          taiLai(false).then(function () { App.bao('Đã cập nhật dữ liệu mới do ' + (r.data.nguoi || 'người khác') + ' vừa lưu.'); });
        }
      }).catch(function () { MC.loi = 'Mất kết nối máy chủ'; veTrangThai(); });
    }, 15000);
  }

  window.addEventListener('beforeunload', function (e) {
    if (MC.bat && (MC.canLuu || MC.dangLuu)) { guiLuu(); e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------------- trạng thái ở thanh bên ---------------- */
  function veTrangThai() {
    var el = App.$('#tt-maychu'); if (!el || !MC.bat) return;
    var tt = MC.loi ? '<span class="tt-cham do"></span>' + h(MC.loi) + (MC.canLuu ? ' – chưa lưu' : '')
      : MC.dangLuu ? '<span class="tt-cham cam"></span>Đang lưu lên máy chủ…'
        : MC.canLuu ? '<span class="tt-cham cam"></span>Có thay đổi chưa lưu'
          : '<span class="tt-cham xanh"></span>Đã lưu trên máy chủ' + (MC.luuLuc ? ' ' + MC.luuLuc.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '');
    var vt = !MC.toi ? '' : MC.toi.vaiTro === 'quan_tri' ? ' (quản trị)' : laCC() ? ' (chấm công: ' + (MC.toi.donVi || []).map(function (m) { return TL.tenPhongBan(App.db, m) || m; }).join(', ') + ')' : '';
    el.innerHTML = '<div>' + tt + '</div><div class="mo">' + h((MC.toi ? MC.toi.ten : '') + vt) +
      ' · <a href="#" id="doi-mk">Đổi mật khẩu</a> · <a href="#" id="dang-xuat">Đăng xuất</a></div>';
    App.$('#dang-xuat', el).onclick = function (e) { e.preventDefault(); App.dangXuat(); };
    App.$('#doi-mk', el).onclick = function (e) { e.preventDefault(); doiMatKhau(); };
  }
  App.veTrangThaiMayChu = veTrangThai;

  /* ---------------- Cài đặt → máy chủ: sao lưu, tài khoản, nhật ký ---------------- */
  App.veMayChuCaiDat = function (el) {
    var qt = MC.toi && MC.toi.vaiTro === 'quan_tri';
    el.innerHTML = '<div class="the"><h3>Dữ liệu trên máy chủ</h3>' +
      '<p style="margin-top:0">Dữ liệu dùng chung nằm trên máy chủ, tự lưu sau mỗi thay đổi. Phiên bản hiện tại: <b>' + MC.phienBan + '</b>' +
      (MC.nguoi ? ', lưu gần nhất bởi <b>' + h(MC.nguoi) + '</b> lúc ' + new Date(MC.capNhat).toLocaleString('vi-VN') : '') + '.</p>' +
      '<p class="mo nho">Máy chủ tự sao lưu mỗi ngày (giữ 120 ngày gần nhất). Bạn cũng có thể tải 1 bản về máy để cất riêng.</p>' +
      '<div class="hang"><button class="nut" id="mc-tai">' + App.icon('tai') + 'Tải bản sao lưu về máy</button>' +
      '<label class="nut">' + App.icon('nhap') + 'Khôi phục từ file…<input type="file" id="dl-mo" accept=".json" class="an"></label>' +
      '<button class="nut" id="mc-doimk">Đổi mật khẩu của tôi</button><button class="nut" id="mc-dx">Đăng xuất</button></div></div>' +
      (qt ? '<div class="the"><h3>Bản sao lưu hằng ngày trên máy chủ<span class="phai" id="mc-thumuc"></span></h3><div class="cuon" style="max-height:300px"><table class="bang" id="mc-sl"><tbody><tr><td class="trong">Đang tải…</td></tr></tbody></table></div></div>' +

  var dsTK = [];
  function matKhauNgauNhien() {
    var bo = 'abcdefghjkmnpqrstuvwxyz23456789', a = new Uint32Array(8), s = '';
    crypto.getRandomValues(a);
    for (var i = 0; i < a.length; i++) s += bo[a[i] % bo.length];
    return s;
  }

  /** Tạo nhanh mỗi phòng / đội một tài khoản chấm công, mật khẩu ngẫu nhiên, in danh sách để phát cho các đơn vị */
  function taoNhanh(elCha) {
    var daCo = {};
    dsTK.forEach(function (t) { if (t.vaiTro === 'cham_cong') (t.donVi || []).forEach(function (m) { daCo[m] = t.ten; }); });
    var tenDung = {}; dsTK.forEach(function (t) { tenDung[t.ten.toLowerCase()] = 1; });

      var goc = 'cc.' + App.boDau(p.ma).toLowerCase().replace(/[^a-z0-9]/g, ''), ten = goc, n = 2;

      return { p: p, ten: ten, co: daCo[p.ma], nv: dem[p.ma] || 0 };
    });

      tieuDe: 'Tạo tài khoản chấm công cho từng phòng / đội', co: 'rong',

        '<div class="cuon"><table class="bang"><thead><tr><th></th><th>Phòng / đội</th><th>Nhân viên</th><th>Tên đăng nhập</th><th>Ghi chú</th></tr></thead><tbody>' +
        ds.map(function (x, i) {
          return '<tr data-i="' + i + '"><td class="giua"><input type="checkbox" data-chon' + (!x.co && x.nv ? ' checked' : '') + '></td><td>' + h(x.p.ten) + '</td><td class="giua">' + x.nv + '</td>' +
            '<td><input data-ten value="' + h(x.ten) + '" style="width:150px"></td><td class="mo">' + (x.co ? 'Đã có tài khoản: ' + h(x.co) : '') + '</td></tr>';
        }).join('') + '</tbody></table></div>',
      nut: [{ ten: 'Huỷ' }, {
        ten: 'Tạo tài khoản', loai: 'chinh', bam: function (el) {
          var chon = App.$$('tr[data-i]', el).filter(function (tr) { return App.$('[data-chon]', tr).checked; }).map(function (tr) {
            return { p: ds[+tr.dataset.i].p, ten: App.$('[data-ten]', tr).value.trim(), mk: matKhauNgauNhien() };
          });
          if (!chon.length) { App.bao('Chọn ít nhất 1 phòng / đội.', 'loi'); return false; }
          var kq = [], i = 0;
          (function tiep() {
            if (i >= chon.length) { ketQua(kq); veTaiKhoan(elCha); return; }
            var x = chon[i++];
            api('taikhoan', { method: 'POST', json: { ten: x.ten, matKhau: x.mk, vaiTro: 'cham_cong', donVi: [x.p.ma] } }).then(function (r) {
              x.loi = r.ok ? '' : (r.data && r.data.loi) || 'Lỗi ' + r.status; kq.push(x); tiep();
            }, function () { x.loi = 'Mất kết nối'; kq.push(x); tiep(); });
          })();
        }
      }]
    });
  }

  function ketQua(kq) {
    var ct = App.db.congTy, dc = location.origin + location.pathname;
    var bang = '<table class="bang"><thead><tr><th>STT</th><th>Phòng / đội</th><th>Tên đăng nhập</th><th>Mật khẩu</th><th>Kết quả</th></tr></thead><tbody>' +

        return '<tr><td class="giua">' + (i + 1) + '</td><td>' + h(x.p.ten) + '</td><td><b>' + h(x.ten) + '</b></td><td><code style="font-size:15px">' + (x.loi ? '' : h(x.mk)) + '</code></td><td>' + (x.loi ? '<span style="color:var(--do)">' + h(x.loi) + '</span>' : 'Đã tạo') + '</td></tr>';
      }).join('') + '</tbody></table>';
    App.hop({
      tieuDe: 'Tài khoản chấm công đã tạo', co: 'rong',
      than: '<div class="canh-bao" style="margin-bottom:10px">Mật khẩu chỉ hiện <b>một lần</b>. Hãy in hoặc ghi lại ngay.</div>' + bang +
        '<p class="mo nho">Địa chỉ đăng nhập: <b>' + h(dc) + '</b></p>',
      nut: [{ ten: 'In danh sách', bam: function () {
        App.inNoiDung('<div class="vb"><p style="text-align:center"><b>' + h(ct.ten || '') + '</b></p><h2 style="text-align:center">TÀI KHOẢN CHẤM CÔNG CÁC PHÒNG, ĐỘI</h2>' +
          '<p>Địa chỉ phần mềm: <b>' + h(dc) + '</b>. Đăng nhập rồi đổi mật khẩu (thanh bên → Đổi mật khẩu). Mỗi tài khoản chỉ chấm công nhân viên thuộc đơn vị mình.</p>' + bang + '</div>');
        return false;
      } }, { ten: 'Đóng', loai: 'chinh' }]

  function doiMatKhau() {
    App.hop({
      tieuDe: 'Đổi mật khẩu', co: 'hep',
      than: '<form class="form" style="grid-template-columns:1fr" onsubmit="return false">' +
        '<label class="o">Mật khẩu hiện tại<input name="cu" type="password" autocomplete="current-password"></label>' +
        '<label class="o">Mật khẩu mới (ít nhất 6 ký tự)<input name="moi" type="password" autocomplete="new-password"></label>' +

          if (v.moi !== v.moi2) { App.bao('Hai lần nhập mật khẩu mới không giống nhau.', 'loi'); return false; }
          api('doimatkhau', { method: 'POST', json: { cu: v.cu, moi: v.moi } }).then(function (r) {
            if (!r.ok) { App.bao((r.data && r.data.loi) || 'Không đổi được.', 'loi'); return; }
            App.bao('Đã đổi mật khẩu.', 'tot'); App.$('.mo-nen .dong').click();
          });
          return false;
        }
      }]
    });
  }
})();

<script>

(function () {

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;

    };
  }

          if (nv.hinhThuc === 'gio') { kh = r < 0.45 ? '+/2' : r < 0.75 ? '+' : ''; }
          else if (r < 0.022) kh = 'P';
          else if (r < 0.03) kh = 'Ô';
          else if (r < 0.034) kh = 'KL';
          else if (r < 0.036) kh = 'KP';
          else if (r < 0.042) kh = 'P/2';
          else if (nv.phongBan === 'KDVT' && !ghiThu(nv) && r < 0.08) kh = 'CT';
          if (!kh) continue;
          cc[d] = kh;
          if (kh === '+' || kh === '+/2' || kh === 'P/2') {
            var muon = R() < 0.06 ? 6 + Math.floor(R() * 35) : 0;
            var gioOT = kyThuat(nv) && kh === '+' && R() < 0.14 ? 1 + Math.floor(R() * 5) * 0.5 : 0;
            if (muon) mu[d] = muon;
            if (gioOT) ot[d] = gioOT;
            if (coVaoRa) {
              var v = 7 * 60 + 25 - Math.floor(R() * 20) + (muon ? muon + 35 : 0);
              var ra = kh === '+' ? 17 * 60 + Math.floor(R() * 14) + gioOT * 60 : 11 * 60 + 30 + Math.floor(R() * 10);
              if (kh === 'P/2') { v = 13 * 60 - Math.floor(R() * 10); ra = 17 * 60 + Math.floor(R() * 10); }
              vr[d] = { v: TL.hhmm(v), r: TL.hhmm(ra) };
            }
          }
        }
        if (Object.keys(cc).length) T.cc[nv.id] = cc;
        if (Object.keys(ot).length) T.ot[nv.id] = ot;
        if (Object.keys(mu).length) T.muon[nv.id] = mu;
        if (coVaoRa && Object.keys(vr).length) T.vr[nv.id] = vr;
      });
    }

    // 2) Thưởng, tạm ứng, sản lượng theo kỳ lương; chốt các kỳ cũ
    var tet = TL.taoNgayLe(Y, db.caiDat).filter(function (x) { return /mùng 1/.test(x.ten); })[0];
    var kyTet = tet ? TL.kyCuaNgay(db, +tet.ngay.slice(0, 4), +tet.ngay.slice(5, 7), +tet.ngay.slice(8, 10)) : null;
    var kyNay = TL.kyCuaNgay(db, Y, M, D);
    for (var lk = 12; lk >= 0; lk--) {
      var t = new Date(kyNay.y, kyNay.m - 1 - lk, 1), ky = t.getFullYear(), km = t.getMonth() + 1;
      var TK = TL.thang(db, ky, km, true);
      TL.dsNhanVienKy(db, ky, km).forEach(function (nv, idx) {
        var dc = {};
        if (kyTet && kyTet.y === ky && kyTet.m === km && nv.hinhThuc === 'thang') dc.thuong = Math.round(nv.luongCB / 100000) * 100000;
        if (ghiThu(nv)) dc.sp = { HD: 1500 + Math.floor(R() * 1100) };
        if (congNhanSC(nv)) dc.sp = { DH: 6 + Math.floor(R() * 15) };
        if (nv.id === 'nv7' && R() < 0.5) dc.sp = Object.assign(dc.sp || {}, { DH: 2 + Math.floor(R() * 4) });
        if (R() < 0.04 && idx > 3) { dc.khauTru = 150000; dc.ghiChu = 'Bồi thường làm hỏng dụng cụ'; }
        if (Object.keys(dc).length) TK.dc[nv.id] = dc;
      });
      if (lk >= 3) TL.chotThang(db, ky, km);
    }

    // ---- Đơn nghỉ phép: 1 đơn đã duyệt (tự chấm P vào những ngày tới), 1 đơn chờ duyệt, 1 đơn bị từ chối ----
    var timNgay = function (tu) { var s = TL.congNgay(Y, M, D, tu); var n = TL.docNgay(s); while ([0, 6].indexOf(TL.thuTrongTuan(n.y, n.m, n.d)) >= 0) { s = TL.congNgay(n.y, n.m, n.d, 1); n = TL.docNgay(s); } return s; };
    var a1 = timNgay(3), a2 = timNgay(6), a3 = timNgay(9);
    var don1 = { id: 'dn1', nvId: 'nv8', kyHieu: 'P', tuNgay: a1, denNgay: a1, lyDo: 'Việc gia đình', trangThai: 'cho', ngayTao: TL.congNgay(Y, M, D, -1) };
    TL.apDungDonNghi(db, don1); don1.trangThai = 'duyet'; don1.ngayDuyet = TL.congNgay(Y, M, D, -1);
    db.donNghi = [don1,
      { id: 'dn2', nvId: 'nv4', kyHieu: 'P', tuNgay: a2, denNgay: TL.congNgay(+a2.slice(0, 4), +a2.slice(5, 7), +a2.slice(8), 1), lyDo: 'Về quê', trangThai: 'cho', ngayTao: TL.congNgay(Y, M, D, 0) },
      { id: 'dn3', nvId: 'nv12', kyHieu: 'KL', tuNgay: a3, denNgay: a3, lyDo: 'Việc riêng', trangThai: 'tuchoi', ngayTao: TL.congNgay(Y, M, D, -2) }];
    return db;
  };
})();
