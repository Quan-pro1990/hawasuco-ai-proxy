<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vị trí trực tiếp</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root { --primary: #0288D1; --green: #2E7D32; --bg: #ffffff; --text: #212121; --muted: #6e6e6e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1a1a1a; --text: #eeeeee; --muted: #a8a8a8; } }
  html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
  #map { position: absolute; inset: 0 0 112px 0; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; box-sizing: border-box; padding: 14px 16px;
           background: var(--primary); color: #fff; border-radius: 20px 20px 0 0; }
  #title { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { margin-top: 4px; font-size: 14px; opacity: .95; }
  #badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; font-weight: 700; background: var(--green); margin-right: 6px; }
  #badge.off { background: #616161; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  .row a { flex: 1; text-align: center; background: #fff; color: var(--primary); text-decoration: none; font-weight: 700;
           padding: 8px 0; border-radius: 18px; font-size: 14px; }
  #msg { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 16px; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: #1E88E5; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(30,136,229,.25); }
</style>
</head>
<body>
<div id="map"></div>
<div id="msg">…</div>
<div id="panel">
  <div id="title"></div>
  <div id="status"><span id="badge"></span><span id="info"></span></div>
  <div class="row">
    <a id="gmaps" target="_blank" rel="noopener">Google Maps</a>
    <a id="center" href="#">⌖</a>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(function () {
  'use strict';
  var vi = (navigator.language || 'vi').toLowerCase().indexOf('vi') === 0;
  var T = vi ? {
    title: 'Vị trí trực tiếp', live: 'ĐANG CHIA SẺ', ended: 'ĐÃ KẾT THÚC', updated: 'Cập nhật', until: 'đến',
    ago: ' trước', sec: ' giây', min: ' phút', wait: 'Đang chờ vị trí đầu tiên…', notfound: 'Link không tồn tại hoặc đã hết hạn.',
    acc: 'Chính xác', share: 'của'
  } : {
    title: 'Live location', live: 'LIVE', ended: 'ENDED', updated: 'Updated', until: 'until',
    ago: ' ago', sec: ' s', min: ' min', wait: 'Waiting for the first location…', notfound: 'This link does not exist or has expired.',
    acc: 'Accuracy', share: 'of'
  };
  var id = location.pathname.split('/').filter(Boolean)[1];
  var api = location.pathname.replace(/\/l\/[^/]+\/?$/, '') + '/api/live/' + encodeURIComponent(id);
  var map = L.map('map', { zoomControl: true }).setView([16, 106], 5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  var marker = null, circle = null, trail = null, first = true, last = null;
  var $ = function (x) { return document.getElementById(x); };

  function fmtTime(ms) { var d = new Date(ms); return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }); }
  function ago(ms) {
    var s = Math.max(0, Math.round((Date.now() - ms) / 1000));
    return s < 90 ? s + T.sec + T.ago : Math.round(s / 60) + T.min + T.ago;
  }

  function render(d) {
    var name = d.name ? (vi ? T.title + ' ' + T.share + ' ' + d.name : d.name + ' – ' + T.title) : T.title;
    document.title = name;
    $('title').textContent = name;
    $('badge').textContent = d.active ? T.live : T.ended;
    $('badge').className = d.active ? '' : 'off';
    var info = [];
    if (d.last) info.push(T.updated + ' ' + ago(d.last.ts));
    if (d.active) info.push(T.until + ' ' + fmtTime(d.expiresAt));
    if (d.last && d.last.acc) info.push(T.acc + ' ±' + d.last.acc + ' m');
    $('info').textContent = info.join(' • ');
    if (!d.last) { $('msg').textContent = T.wait; return; }
    $('msg').textContent = '';
    last = d.last;
    var p = [d.last.lat, d.last.lng];
    $('gmaps').href = 'https://maps.google.com/maps?q=' + p[0] + ',' + p[1];
    if (!marker) {
      marker = L.marker(p, { icon: L.divIcon({ className: '', html: '<div class="dot"></div>', iconSize: [24, 24], iconAnchor: [12, 12] }) }).addTo(map);
      circle = L.circle(p, { radius: d.last.acc || 0, weight: 1, color: '#1E88E5', fillOpacity: .12 }).addTo(map);
      trail = L.polyline(d.trail || [], { color: '#0288D1', weight: 4, opacity: .6 }).addTo(map);
    } else {
      marker.setLatLng(p); circle.setLatLng(p); circle.setRadius(d.last.acc || 0); trail.setLatLngs(d.trail || []);
    }
    if (first) { map.setView(p, 16); first = false; }
  }

  function poll() {
    fetch(api, { cache: 'no-store' }).then(function (r) {
      if (r.status === 404) { $('msg').textContent = T.notfound; $('title').textContent = T.title; return null; }
      return r.json();
    }).then(function (d) {
      if (d) { render(d); if (d.active) setTimeout(poll, 5000); }
    }).catch(function () { setTimeout(poll, 10000); });
  }
  $('center').addEventListener('click', function (e) { e.preventDefault(); if (last) map.setView([last.lat, last.lng], Math.max(map.getZoom(), 16)); });
  setInterval(function () { if (last) $('info').textContent = $('info').textContent.replace(/^[^•]+/, T.updated + ' ' + ago(last.ts) + ' '); }, 15000);
  poll();
})();
</script>
</body>
</html>
