# Build phần mềm Quản lý thất thoát nước (thư mục 2) và cài thử website trên IIS thật:
#   apk  : app Android (Gradle)                         → artifact ThatThoatNuoc-DienThoai
#   exe  : ThatThoatNuoc.exe bằng build.ps1 (csc .NET Framework 4, C# 5) + gói cài IIS → artifact ThatThoatNuoc-MayChu-IIS
#   iis  : bật IIS + ASP.NET Core Hosting Bundle 9.0, cài bản cũ HTTPS 8080 (thư mục 1) rồi nâng cấp bằng gói mới
#          → kiểm tra website HTTP cổng 80 (ứng dụng con /thatthoat, rồi site riêng -ThaySiteMacDinh), -KiemTra, -GoBo
name: Build exe + APK, cài thử IIS

on:
  push:
    paths: ['1/**', '2/**', '.github/workflows/build.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Khoá ký từ secret (nếu có)
        env:
          KY: ${{ secrets.ANDROID_KY_BASE64 }}
        run: |
          if [ -n "$KY" ]; then mkdir -p 2/android/ky-app && echo "$KY" | base64 -d > 2/android/ky-app/thatthoat.jks; echo "Ký bằng khoá trong secret"; else echo "Không có secret ANDROID_KY_BASE64: ký bằng khoá debug"; fi
      - name: Build APK
        env:
          KY_MATKHAU: ${{ secrets.KY_MATKHAU }}
        run: |
          gradle -p 2/android :app:assembleRelease --no-daemon
          cp 2/android/app/build/outputs/apk/release/*.apk ThatThoatNuoc-DienThoai.apk
          ls -la ThatThoatNuoc-DienThoai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ThatThoatNuoc-DienThoai
          path: ThatThoatNuoc-DienThoai.apk

  exe:
    runs-on: windows-latest
    needs: apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ThatThoatNuoc-DienThoai
          path: ${{ runner.temp }}\ra
      - name: Biên dịch ThatThoatNuoc.exe
        shell: powershell
        run: |
          & .\2\build.ps1 -Out "$env:RUNNER_TEMP\ra\ThatThoatNuoc.exe"
      - name: Tạo gói cài IIS (kèm APK)
        shell: powershell
        run: |
          $goi = "$env:RUNNER_TEMP\ThatThoatNuoc-MayChu-IIS"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\ra\ThatThoatNuoc.exe" -ArgumentList '--tao-goi-iis', $goi -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$goi-loi.txt" -ErrorAction SilentlyContinue; throw "Tạo gói lỗi $($p.ExitCode)" }
          Get-ChildItem -Recurse $goi | Select-Object FullName, Length | Format-Table -AutoSize
          if (-not (Test-Path "$goi\web\ThatThoatNuoc-DienThoai.apk")) { throw 'Gói thiếu APK' }
      - name: Chạy thử chế độ máy chủ (không IIS)
        shell: powershell
        run: |
          $dl = "$env:RUNNER_TEMP\dl"
          New-Item -ItemType Directory -Force $dl | Out-Null
          Copy-Item 2\DuLieu\thatthoat.xml $dl
          $env:THATTHOAT_DULIEU = $dl
          $env:THATTHOAT_MATKHAU = 'matkhau123'
          $exe = "$env:RUNNER_TEMP\ra\ThatThoatNuoc.exe"
          $p = Start-Process $exe -ArgumentList '--dat-quan-tri', 'admin' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dat-quan-tri: $($p.ExitCode)" }
          $sv = Start-Process $exe -ArgumentList '--may-chu', '--cong', '18080' -PassThru
          Start-Sleep -Seconds 3
          $ping = Invoke-RestMethod http://127.0.0.1:18080/api/ping
          $ping | ConvertTo-Json
          if ($ping.ungDung -ne 'ThatThoatNuoc' -or $ping.phienBanPhanMem -ne '2.0.0') { throw 'ping sai' }
          $dn = Invoke-RestMethod http://127.0.0.1:18080/api/dangnhap -Method Post -Body '{"ten":"admin","matKhau":"matkhau123"}' -ContentType 'application/json'
          $h = @{ Authorization = "Bearer $($dn.token)" }
          $tq = Invoke-RestMethod http://127.0.0.1:18080/api/tongquan -Headers $h
          "Tháng: $($tq.chon.ten), $($tq.donVi.Count) đơn vị"
          if (-not $tq.chon) { throw 'tongquan rỗng' }
          $lk = Invoke-RestMethod http://127.0.0.1:18080/api/baocao/lienket -Method Post -Headers $h -ContentType 'application/json' -Body '{"loai":"thang","nam":2026,"thang":9,"dinhDang":"pdf"}'
          "PDF: $($lk.ten) $($lk.kichThuoc) byte"
          Stop-Process $sv
      - uses: actions/upload-artifact@v4
        with:
          name: ThatThoatNuoc-MayChu-IIS
          path: ${{ runner.temp }}\ThatThoatNuoc-MayChu-IIS

  iis:
    runs-on: windows-latest
    needs: exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ThatThoatNuoc-MayChu-IIS
          path: ${{ runner.temp }}\goi
      - name: Bật IIS + ASP.NET Core Hosting Bundle 9.0
        shell: powershell
        run: |
          Install-WindowsFeature -Name Web-Server -IncludeManagementTools | Out-Null
          $f = "$env:RUNNER_TEMP\dotnet-hosting-9.0-win.exe"
          Invoke-WebRequest https://aka.ms/dotnet/9.0/dotnet-hosting-win.exe -OutFile $f -UseBasicParsing
          $p = Start-Process $f -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          "Hosting Bundle: $($p.ExitCode)"
          iisreset | Out-Null
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          (Get-Item "$env:ProgramFiles\IIS\Asp.Net Core Module\V2\aspnetcorev2.dll").VersionInfo.ProductVersion
          exit 0
      - name: Cài bản cũ (thư mục 1, HTTPS cổng 8080) có sẵn dữ liệu
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force C:\ThatThoatNuocData | Out-Null
          Copy-Item 2\DuLieu\thatthoat.xml C:\ThatThoatNuocData
          $env:THATTHOAT_DULIEU = 'C:\ThatThoatNuocData'
          $env:THATTHOAT_MATKHAU = 'matkhau123'
          $p = Start-Process 1\web\ThatThoatNuoc.exe -ArgumentList '--dat-quan-tri', 'admin' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "dat-quan-tri: $($p.ExitCode)" }
          Remove-Item Env:\THATTHOAT_MATKHAU
          powershell -NoProfile -ExecutionPolicy Bypass -File 1\CaiDat-IIS.ps1
          if ($LASTEXITCODE -ne 0) { throw "Cài bản cũ lỗi $LASTEXITCODE" }
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          if (-not (Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq 'That thoat nuoc (IIS)' })) { throw 'bản cũ chưa tạo chứng chỉ' }
          # chỉ để ghi nhận: HTTPS tự ký của bản cũ có thể không bắt tay TLS được trên Windows Server mới
          [Net.ServicePointManager]::SecurityProtocol = 'Tls12'
          [Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }
          try { $r = Invoke-WebRequest https://127.0.0.1:8080/api/ping -UseBasicParsing; "Bản cũ HTTPS 8080: $($r.StatusCode) $($r.Content)" }
          catch { "Bản cũ HTTPS 8080 không trả lời: $($_.Exception.Message)" }
          exit 0
      - name: Nâng cấp bằng gói mới → HTTP cổng 80 (ứng dụng con của Default Web Site)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\goi\CaiDat-IIS.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Cài lỗi $LASTEXITCODE" }
          Get-Content C:\inetpub\ThatThoatNuoc\caidat.txt
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          & "$env:windir\system32\inetsrv\appcmd.exe" list app
          $ping = Invoke-RestMethod http://localhost/thatthoat/api/ping
          $ping | ConvertTo-Json
          if ($ping.ungDung -ne 'ThatThoatNuoc' -or $ping.phienBanPhanMem -ne '2.0.0' -or -not $ping.coApp) { throw 'ping sai' }
          $dn = Invoke-RestMethod http://localhost/thatthoat/api/dangnhap -Method Post -Body '{"ten":"admin","matKhau":"matkhau123"}' -ContentType 'application/json'
          $tq = Invoke-RestMethod http://localhost/thatthoat/api/tongquan -Headers @{ Authorization = "Bearer $($dn.token)" }
          "Dữ liệu giữ nguyên: $($tq.chon.ten), $($tq.donVi.Count) đơn vị"
          if (-not $tq.chon) { throw 'mất dữ liệu' }
          $r = Invoke-WebRequest http://localhost/thatthoat -UseBasicParsing -MaximumRedirection 0 -ErrorAction SilentlyContinue
          "Chuyển hướng /thatthoat → $($r.Headers.Location)"
          if ($r -and $r.Headers.Location -cne '/thatthoat/') { throw "chuyển hướng sai: $($r.Headers.Location)" }
          $html = (Invoke-WebRequest http://localhost/thatthoat/ -UseBasicParsing).Content
          if ($html -notmatch 'app.js') { throw 'không có trang web' }
          $apk = Invoke-WebRequest http://localhost/thatthoat/tai-app -UseBasicParsing
          "APK: $($apk.RawContentLength) byte, $($apk.Headers['Content-Type'])"
          if (Get-ChildItem Cert:\LocalMachine\My | Where-Object { $_.FriendlyName -eq 'That thoat nuoc (IIS)' }) { throw 'chưa gỡ chứng chỉ cũ' }
          if ((netsh http show sslcert ipport=0.0.0.0:8080) -match 'Certificate Hash') { throw 'chưa gỡ sslcert 8080' }
          $con8080 = $true
          try { Invoke-WebRequest https://127.0.0.1:8080/api/ping -UseBasicParsing -TimeoutSec 10 | Out-Null } catch { $con8080 = $false; "Cổng 8080 đã bỏ: $($_.Exception.Message)" }
          if ($con8080) { throw 'cổng 8080 vẫn chạy bản cũ' }
          exit 0
      - name: Chạy lại với -ThaySiteMacDinh → http://localhost/
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\goi\CaiDat-IIS.ps1" -ThaySiteMacDinh
          if ($LASTEXITCODE -ne 0) { throw "Cài lỗi $LASTEXITCODE" }
          Get-Content C:\inetpub\ThatThoatNuoc\caidat.txt
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          & "$env:windir\system32\inetsrv\appcmd.exe" list app
          $ping = Invoke-RestMethod http://localhost/api/ping
          if ($ping.ungDung -ne 'ThatThoatNuoc') { throw 'ping gốc sai' }
          "OK http://localhost/api/ping"
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\goi\CaiDat-IIS.ps1" -KiemTra
          if ($LASTEXITCODE -ne 0) { throw "-KiemTra lỗi $LASTEXITCODE" }
          # chạy lại không tham số: nhớ lựa chọn cũ (site riêng ở cổng 80)
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\goi\CaiDat-IIS.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Cài lại lỗi $LASTEXITCODE" }
          $ping = Invoke-RestMethod http://localhost/api/ping
          if ($ping.ungDung -ne 'ThatThoatNuoc') { throw 'ping sau khi cài lại sai' }
          "OK cài lại"
          exit 0
      - name: Gỡ (-GoBo) → Default Web Site chạy lại, dữ liệu còn
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\goi\CaiDat-IIS.ps1" -GoBo
          if ($LASTEXITCODE -ne 0) { throw "-GoBo lỗi $LASTEXITCODE" }
          & "$env:windir\system32\inetsrv\appcmd.exe" list site
          $r = Invoke-WebRequest http://localhost/ -UseBasicParsing
          "Default Web Site: $($r.StatusCode)"
          if (-not (Test-Path C:\ThatThoatNuocData\thatthoat.xml)) { throw 'mất dữ liệu khi gỡ' }
          exit 0
