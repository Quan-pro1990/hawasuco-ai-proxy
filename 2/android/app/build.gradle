// App Android "Thất thoát nước" — WebView mở website trên máy chủ IIS (HTTP cổng 80).
// Build: Android Studio → Build → Build APK(s), hoặc  gradle :app:assembleRelease
// (không có Android Studio: ./build-apk.sh trên Linux). Không dùng thư viện ngoài.
plugins {
    id 'com.android.application'
}

def kyApp = rootProject.file('ky-app/thatthoat.jks')
def matKhauKy = System.getenv('KY_MATKHAU') ?: 'thatthoat-hawasuco'

android {
    namespace 'vn.com.hawasuco.thatthoat'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.com.hawasuco.thatthoat'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0.0'
    }

    signingConfigs {
        ky {
            storeFile kyApp
            storePassword matKhauKy
            keyAlias 'thatthoat'
            keyPassword matKhauKy
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // có khoá ky-app/thatthoat.jks thì ký bằng khoá đó (cài đè được bản trước), không thì khoá debug
            signingConfig kyApp.exists() ? signingConfigs.ky : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
